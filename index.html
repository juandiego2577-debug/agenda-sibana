    background:linear-gradient(180deg,#000 0%,#0a0908 100%);
    border-bottom:1px solid rgba(201,162,39,0.22);
    box-shadow:0 1px 16px rgba(0,0,0,0.4);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header.topbar .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  header.topbar .brand img{
    height:44px;
    width:auto;
    display:block;
  }
  header.topbar .brand .tagline{
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:var(--gold-soft);
    font-weight:500;
    letter-spacing:.2px;
    border-left:1px solid var(--line);
    padding-left:12px;
  }
  .mode-toggle{
    background:none;border:1px solid var(--line);border-radius:999px;
    color:var(--ink-soft);font-size:11px;padding:5px 12px;cursor:pointer;
    font-family:'Inter',sans-serif;flex-shrink:0;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:12px 24px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .datenav{display:flex;align-items:center;gap:8px;}
  .datenav button.arrow{
    background:none;border:1px solid var(--line);border-radius:8px;
    width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--wine);
    display:flex;align-items:center;justify-content:center;
  }
  .datenav button.arrow:hover{background:var(--bg);}
  .datenav .curdate{
    font-family:'Fraunces',serif;
    font-size:18px;
    font-weight:600;
    min-width:220px;
    text-align:center;
    text-transform:capitalize;
  }
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;
    font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
    transition:filter .12s ease, transform .12s ease;min-height:38px;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:linear-gradient(180deg,var(--gold) 0%,var(--wine) 100%);color:#1B1710;box-shadow:0 2px 10px rgba(201,162,39,0.25);}
  .btn-ghost{background:transparent;color:var(--gold-soft);border:1px solid var(--line);}
  .btn-today{background:var(--gold-soft);color:#1B1710;}
  .spacer{flex:1;}
  .viewtoggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .viewtoggle button{
    background:var(--panel);border:none;padding:8px 14px;font-size:13px;
    cursor:pointer;color:var(--ink-soft);font-weight:600;font-family:'Inter',sans-serif;
    transition:background .12s ease,color .12s ease;
  }
  .viewtoggle button.active{background:var(--wine);color:#1B1710;box-shadow:inset 0 0 0 1px rgba(240,216,137,0.4);}

  /* ---------- Specialist filter ---------- */
  .specfilter{display:flex;gap:6px;flex-wrap:wrap;}
  .specfilter button{
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);
    border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;
  }
  .specfilter button.active{background:var(--wine);color:#1B1710;border-color:var(--wine);box-shadow:0 2px 8px rgba(201,162,39,0.3);}
  .specfilter .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;border:1px solid rgba(0,0,0,.35);}

  /* ---------- Más menu ---------- */
  .morewrap{position:relative;}
  .moremenu{
    position:absolute;top:110%;right:0;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:210px;z-index:40;
    max-height:min(480px, 70vh);overflow-y:auto;
  }
  .moremenu button{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:11px 14px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;
  }
  .moremenu button:hover{background:var(--panel);}
  .moremenu hr{border:none;border-top:1px solid var(--line);margin:4px 0;}
  .moremenu-label{
    padding:8px 14px 4px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-soft);font-family:'Inter',sans-serif;
  }

  /* ---------- Main layout ---------- */
  main{flex:1;display:flex;overflow:hidden;}
  .calendar-wrap{flex:1;overflow-y:auto;padding:18px 24px;}

  /* ---------- Day view grid ---------- */
  .dayrow{display:flex;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,0.25);}
  .timecol{width:64px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel-2);}
  .timecol .slot{height:56px;position:relative;font-size:11px;color:var(--ink-soft);text-align:right;padding-right:8px;}
  .timecol .slot span{position:absolute;top:-7px;right:8px;}
  .gridcol{flex:1;position:relative;}
  .gridcol .hourline{position:absolute;left:0;right:0;border-top:1px solid var(--line);}
  .gridcol .hourline.half{border-top:1px dashed rgba(201,162,39,0.18);}
  .gridcol .emptyclick{position:absolute;left:0;right:0;height:56px;cursor:pointer;}
  .gridcol .emptyclick:hover{background:rgba(201,162,39,0.07);}
  .gridcol .blocked{
    position:absolute;left:0;right:0;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0 8px, rgba(255,255,255,0.005) 8px 16px);
    pointer-events:none;
  }
  .day-closed-msg{text-align:center;color:var(--ink-soft);font-size:13px;padding:14px 8px 0;line-height:1.5;}

  .appt{
    position:absolute;left:6px;right:6px;border-radius:9px;
    padding:6px 9px;overflow:hidden;cursor:pointer;
    border-left:7px solid var(--wine);
    box-shadow:0 3px 10px rgba(0,0,0,0.28);
    transition:transform .1s ease,box-shadow .1s ease;
    color:#fff;
  }
  .appt .t-time{font-size:10.5px;opacity:.85;font-weight:600;display:flex;align-items:center;gap:6px;}
  .appt .spec-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,0.75);box-shadow:0 0 0 1px rgba(0,0,0,.35);}
  .appt .t-name{font-size:13px;font-weight:700;line-height:1.15;margin-top:1px;}
  .appt .t-service{font-size:11.5px;opacity:.9;margin-top:1px;}
  .appt.compact{display:flex;align-items:center;gap:6px;padding:2px 9px;overflow:hidden;}
  .appt.compact .t-time{font-size:9px;flex-shrink:0;white-space:nowrap;}
  .appt.compact .t-name-compact{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .appt.st-Pendiente{background:var(--pending);border-color:#6459A8;}
  .appt.st-Confirmada{background:var(--wine);border-color:var(--wine-dark);color:#1B1710;}
  .appt.st-Realizada{background:var(--ok);border-color:#295C42;}
  .appt.st-Cancelada{background:#5A5348;border-color:#403A30;color:#E7DFCE;}
  .appt.st-NoShow{background:var(--danger);border-color:#8A3A3A;}
  .status-legend{display:flex;flex-wrap:wrap;gap:14px;padding:6px 16px 12px;font-size:12px;opacity:.85;}
  .legend-item{display:inline-flex;align-items:center;gap:6px;}
  .legend-dot{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.25);}
  .legend-dot.st-Pendiente{background:var(--pending);}
  .legend-dot.st-Confirmada{background:var(--wine);}
  .legend-dot.st-Realizada{background:var(--ok);}
  .legend-dot.st-Cancelada{background:#5A5348;}
  .legend-dot.st-NoShow{background:var(--danger);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .reminders-table{width:100%;border-collapse:collapse;margin:10px 0;}
  .reminders-table th,.reminders-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;}
  .reminders-table td .btn{padding:4px 10px;font-size:12px;margin-right:6px;}
  .appt:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,0.38);}

  /* ---------- Week view ---------- */
  .weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .weekday{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px;cursor:pointer;min-height:120px;display:flex;flex-direction:column;gap:6px;
    transition:border-color .12s ease,transform .12s ease,box-shadow .12s ease;
  }
  .weekday:hover{border-color:var(--wine);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.3);}
  .weekday.today{outline:2px solid var(--gold);}
  .weekday .wd-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .weekday .wd-num{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
  .weekday .wd-count{font-size:12px;color:var(--wine);font-weight:600;margin-top:auto;}
  .weekday .wd-rev{font-size:11.5px;color:var(--ink-soft);}

  /* ---------- Month view ---------- */
  .monthgrid{display:flex;flex-direction:column;gap:6px;}
  .month-headerrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:2px;}
  .month-headerrow div{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding-bottom:4px;}
  .month-weekrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .month-cell{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:6px 7px;min-height:92px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
    transition:border-color .12s ease, transform .12s ease;
  }
  .month-cell:hover{border-color:var(--wine);transform:translateY(-1px);}
  .month-cell.other-month{opacity:.35;}
  .month-cell.today{outline:2px solid var(--gold);}
  .month-cell .mc-num{font-family:'Fraunces',serif;font-size:14px;font-weight:600;}
  .month-cell .mc-count{display:none;font-size:10px;color:var(--wine);font-weight:600;}
  .month-cell .mc-event{
    font-size:10px;line-height:1.35;padding:2px 5px;border-radius:5px;
    background:rgba(201,162,39,0.16);color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:4px;
  }
  .month-cell .mc-event .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .month-cell .mc-more{font-size:10px;color:var(--ink-soft);padding-left:5px;}
  .month-cell .mc-rev{font-size:9.5px;color:var(--wine);margin-top:auto;font-weight:600;}
  @media (max-width:720px){
    .month-cell{min-height:52px;padding:4px 5px;}
    .month-cell .mc-event, .month-cell .mc-more, .month-cell .mc-rev{display:none;}
    .month-cell .mc-count{display:block;}
  }

  /* ---------- Finanzas (reportes / gastos) ---------- */
  .section-tabs{display:flex;gap:0;background:var(--panel);border-bottom:1px solid var(--line);padding:0 20px;}
  .section-tabs button{
    background:none;border:none;color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:13.5px;
    padding:13px 18px;cursor:pointer;border-bottom:2px solid transparent;transition:color .12s, border-color .12s;
  }
  .section-tabs button:hover{color:var(--ink);}
  .section-tabs button.active{color:var(--gold);border-bottom-color:var(--wine);font-weight:600;}
  .fin-main{flex:1;overflow-y:auto;padding:20px 24px 60px;}
  .fin-page{max-width:820px;margin:0 auto;}
  .fin-subtabs{display:flex;gap:8px;margin-bottom:20px;}
  .fin-subtabs button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink-soft);border-radius:20px;
    padding:7px 16px;font-size:12.5px;cursor:pointer;transition:background .12s, color .12s;
  }
  .fin-subtabs button.active{background:rgba(201,162,39,0.16);border-color:var(--wine);color:var(--gold);font-weight:600;}
  .fin-monthnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;}
  .fin-monthnav .curdate{font-family:'Fraunces',serif;font-size:16px;min-width:160px;text-align:center;}
  .fin-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .fin-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .fin-card.highlight{border-color:var(--wine);background:rgba(201,162,39,0.1);}
  .fin-card .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .fin-card .val{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--gold-soft);}
  .fin-sub{font-size:13px;color:var(--gold);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
  .fin-table{width:100%;border-collapse:collapse;font-size:13px;}
  .fin-table th,.fin-table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;}
  .fin-table th{color:var(--ink-soft);font-size:11px;text-transform:uppercase;font-weight:600;}
  .fin-table td:last-child, .fin-table th:last-child{text-align:right;}
  .exp-row{display:grid;grid-template-columns:1.3fr 1.6fr 1fr .9fr 1.1fr auto;gap:6px;align-items:center;margin-bottom:8px;}
  .exp-row.rec-row{grid-template-columns:1.4fr 1fr .8fr 1.1fr auto;}
  .exp-row select,.exp-row input{
    background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;
    color:var(--ink);font-size:12.5px;font-family:'Inter',sans-serif;width:100%;
  }
  .stock-row{display:grid;grid-template-columns:1.6fr 1fr .9fr auto auto;gap:6px;align-items:center;margin-bottom:8px;}
  .stock-row.staff-row{grid-template-columns:1.6fr 1fr auto;}
  .stock-row select,.stock-row input{
    background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;
    color:var(--ink);font-size:12.5px;font-family:'Inter',sans-serif;width:100%;
  }
  .stock-row-name{font-size:13px;color:var(--ink);}
  .stock-row-head{
    margin-bottom:4px;color:var(--ink-soft);font-size:10.5px;letter-spacing:.03em;
    text-transform:uppercase;font-family:'Inter',sans-serif;
  }
  .stock-low{
    background:rgba(217,106,106,0.18);color:var(--danger);font-weight:700;font-size:11px;
    padding:4px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0;
  }
  .chart-box{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 10px;margin-bottom:6px;overflow-x:auto;}
  @media (max-width:600px){
    .fin-cards{grid-template-columns:1fr;}
    .fin-main{padding:14px 12px 60px;}
    .exp-row{display:flex;flex-wrap:wrap;}
    .exp-row > *{flex:1 1 45%;}
    .exp-row .iconbtn{flex:0 0 32px;}
    .stock-row{display:flex;flex-wrap:wrap;}
    .stock-row > *{flex:1 1 45%;}
    .stock-row .iconbtn{flex:0 0 32px;}
    .reminders-table{min-width:480px;}
    .svc-row{flex-wrap:wrap;}
    .svc-row input:not(.price):not(.dur){flex:1 1 100%;}
    .moremenu{left:0;right:auto;}
  }

  /* ---------- Footer summary ---------- */
  footer.summary{
    background:var(--panel);border-top:1px solid var(--line);
    padding:12px 24px;display:flex;gap:28px;flex-wrap:wrap;align-items:center;
  }
  footer.summary .stat{display:flex;flex-direction:column;}
  footer.summary .stat .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  footer.summary .stat .val{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--gold-soft);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.65);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:var(--panel);border:1px solid rgba(201,162,39,0.15);border-radius:16px;width:100%;max-width:460px;
    max-height:90vh;overflow-y:auto;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,0.55);
  }
  .modal h2{margin:0 0 14px 0;font-size:19px;color:var(--gold-soft);}
  .field{margin-bottom:12px;position:relative;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select,.field textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;font-family:'Inter',sans-serif;background:var(--panel-2);color:var(--ink);
  }
  .field input::placeholder,.field textarea::placeholder{color:#6B6152;}
  .field select option{background:var(--panel-2);color:var(--ink);}
  .split-fields input,.split-fields select{
    padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;font-family:'Inter',sans-serif;background:var(--panel-2);color:var(--ink);
  }
  .split-fields select option{background:var(--panel-2);color:var(--ink);}
  .split-fields input::placeholder{color:#6B6152;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;}
  .modal-actions .right{display:flex;gap:8px;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:-6px;margin-bottom:10px;}

  /* selector de varios servicios (combos) */
  .svc-picker{
    display:flex;flex-direction:column;max-height:220px;overflow-y:auto;
    border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
    box-shadow:inset 0 1px 5px rgba(0,0,0,.25);
  }
  .svc-picker::-webkit-scrollbar{width:8px;}
  .svc-picker::-webkit-scrollbar-track{background:transparent;}
  .svc-picker::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  .svc-picker::-webkit-scrollbar-thumb:hover{background:var(--wine);}
  .svc-picker-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;
    border-left:3px solid transparent;border-bottom:1px solid rgba(255,255,255,.05);
    transition:background .12s, border-color .12s;
  }
  .svc-picker-row:last-child{border-bottom:none;}
  .svc-picker-row:hover{background:rgba(201,162,39,0.07);}
  .svc-picker-row.checked{background:rgba(201,162,39,0.13);border-left-color:var(--wine);}
  .svc-picker-row input{accent-color:var(--wine);flex-shrink:0;width:17px;height:17px;cursor:pointer;}
  .svc-picker-info{display:flex;flex-direction:column;flex:1;min-width:0;gap:1px;}
  .svc-picker-name{font-size:13.5px;color:var(--ink);line-height:1.3;}
  .svc-picker-row.checked .svc-picker-name{color:var(--gold);font-weight:600;}
  .svc-picker-duration{font-size:10.5px;color:var(--ink-soft);}
  .svc-picker-price{
    font-size:12px;color:var(--ink-soft);flex-shrink:0;background:rgba(255,255,255,.04);
    padding:3px 9px;border-radius:20px;font-variant-numeric:tabular-nums;
  }
  .svc-picker-row.checked .svc-picker-price{color:var(--gold-soft);background:rgba(201,162,39,.14);}
  .svc-qty{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .svc-qty-btn{
    width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;transition:background .12s, border-color .12s;
  }
  .svc-qty-btn:hover:not(:disabled){background:rgba(201,162,39,0.18);border-color:var(--wine);}
  .svc-qty-btn:disabled{opacity:.35;cursor:not-allowed;}
  .svc-qty-num{min-width:14px;text-align:center;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .svc-picker-row.checked .svc-qty-num{color:var(--gold);font-weight:700;}
  .svc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:20px;}
  .svc-chips-empty{font-size:11.5px;color:var(--ink-soft);font-style:italic;}
  .svc-chip-tag{
    display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--wine);
    color:var(--gold-soft);border-radius:8px;padding:5px 6px 5px 11px;font-size:12px;font-weight:600;
    cursor:pointer;transition:background .12s;
  }
  .svc-chip-tag:hover{background:rgba(201,162,39,.12);}
  .svc-chip-tag .x{
    opacity:.65;font-size:10px;width:16px;height:16px;display:inline-flex;align-items:center;
    justify-content:center;border-radius:50%;background:rgba(255,255,255,.06);
  }
  .svc-chip-tag:hover .x{opacity:1;background:var(--wine);color:#1B1710;}
  .svc-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
  .svc-summary-empty{font-size:11.5px;color:var(--ink-soft);font-style:italic;}
  .svc-summary-badge{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--ink);}
  .svc-summary-price{color:var(--gold);border-color:var(--wine);font-weight:700;}

  /* services / specialists modal rows */
  .svc-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .svc-row input{flex:1;}
  .svc-row input.price{max-width:100px;}
  .svc-row input.dur{max-width:66px;}
  .spec-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .spec-row input[type=text]{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--panel-2);color:var(--ink);font-family:'Inter',sans-serif;}
  .spec-row input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);cursor:pointer;flex-shrink:0;}
  .iconbtn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:4px 6px;flex-shrink:0;}
  .addbtn{background:none;border:1px solid var(--line);color:var(--gold);cursor:pointer;font-size:16px;line-height:1;padding:4px 10px;border-radius:8px;flex-shrink:0;}
  .addbtn:hover{border-color:var(--wine);background:rgba(201,162,39,0.1);}
  .linklike{background:none;border:none;color:var(--ink-soft);cursor:pointer;text-decoration:underline;padding:0;flex-shrink:0;}
  .linklike:hover{color:var(--gold);}

  /* schedule modal */
  .sched-day-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .sched-day-row .daytoggle{
    min-width:62px;text-align:center;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink);border-radius:8px;padding:7px 8px;font-size:12.5px;font-weight:600;
    cursor:pointer;font-family:'Inter',sans-serif;flex-shrink:0;
  }
  .sched-day-row .daytoggle.closed{background:rgba(217,106,106,0.15);color:var(--danger);border-color:rgba(217,106,106,0.4);}
  .sched-day-row select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);font-size:13px;font-family:'Inter',sans-serif;}
  .sched-day-row .sched-dash{color:var(--ink-soft);}
  .sched-closed-label{color:var(--ink-soft);font-size:12.5px;font-style:italic;}

  /* no-shows modal */
  .ns-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .ns-item:last-child{border-bottom:none;}
  .ns-name{font-weight:600;font-size:13.5px;}
  .ns-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .ns-count{background:rgba(217,106,106,0.18);color:var(--danger);font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px;flex-shrink:0;}

  /* lista de clientes */
  .client-search-input{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel-2);color:var(--ink);font-size:13.5px;font-family:'Inter',sans-serif;
    margin-bottom:10px;
  }
  .pw-field{position:relative;}
  .pw-field .client-search-input{padding-right:38px;}
  .pw-toggle{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;font-size:16px;line-height:1;
    color:var(--ink-soft);padding:7px 8px;
  }
  .client-row{border-bottom:1px solid var(--line);}
  .client-row:last-child{border-bottom:none;}
  .client-row-main{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;cursor:pointer;gap:10px;}
  .client-name{font-weight:600;font-size:13.5px;}
  .client-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .client-chevron{color:var(--ink-soft);font-size:11px;flex-shrink:0;}
  .client-history{padding:0 2px 10px 2px;}
  .client-history-row{
    display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-soft);
    padding:5px 0 5px 12px;border-left:2px solid var(--line);
  }
  .client-delete-btn{
    background:none;border:none;color:var(--danger);font-size:11px;cursor:pointer;
    padding:0 2px 8px 2px;font-family:'Inter',sans-serif;
  }

  /* client autocomplete */
  .ac-list{
    position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;max-height:220px;overflow-y:auto;z-index:60;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
  }
  .ac-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover{background:var(--panel);}
  .ac-item .ac-name{font-size:13px;font-weight:600;color:var(--ink);}
  .ac-item .ac-meta{font-size:11px;color:var(--ink-soft);margin-top:1px;}

  /* custom confirm / alert dialog (replaces native confirm/alert, which
     are unreliable inside sandboxed / embedded views) */
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.72);display:flex;
    align-items:center;justify-content:center;z-index:90;padding:16px;
  }
  .confirm-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:360px;width:100%;padding:20px;}
  .confirm-box p{margin:0 0 18px 0;font-size:14px;line-height:1.45;color:var(--ink);}
  .confirm-box .confirm-actions{display:flex;justify-content:flex-end;gap:8px;}

  .empty-msg{text-align:center;color:var(--ink-soft);font-size:13px;padding:40px 0;}
  .loading{padding:60px;text-align:center;color:var(--ink-soft);font-family:'Fraunces',serif;font-size:16px;}

  .login-gate{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .login-gate-logo{height:56px;margin-bottom:18px;}
  .login-gate h1{font-size:22px;margin:0 0 6px;}
  .login-gate .hint{margin-bottom:18px;}
  .login-gate-box{width:100%;max-width:320px;}
  .login-gate-error{color:var(--danger);font-size:12.5px;min-height:16px;margin:-4px 0 8px;}

  @media (max-width:720px){
    header.topbar{padding:10px 14px;}
    header.topbar .brand img{height:34px;}
    header.topbar .brand .tagline{display:none;}
    .toolbar{padding:10px 14px;gap:8px;}
    .toolbar .spacer{display:none;}
    .datenav{order:1;width:100%;justify-content:space-between;}
    .datenav .curdate{min-width:0;font-size:14.5px;flex:1;}
    .btn[data-act="today"]{order:2;}
    .viewtoggle{order:3;flex:1;}
    .viewtoggle button{flex:1;}
    .btn[data-act="open-search"]{order:4;width:100%;}
    .morewrap{order:5;}
    .specfilter{order:6;width:100%;}
    .btn[data-act="new-block"]{order:7;}
    button.btn-primary[data-act="new-appt"]{order:8;width:100%;}
    .calendar-wrap{padding:12px 10px;}
    .timecol{width:46px;}
    .timecol .slot{font-size:9.5px;}
    .timecol .slot span{right:6px;}
    .weekgrid{grid-template-columns:repeat(7,minmax(90px,1fr));overflow-x:auto;}
    .row2{grid-template-columns:1fr;}
    footer.summary{gap:16px;padding:10px 14px;}
    footer.summary .stat .val{font-size:16px;}
    .modal{padding:18px 16px;}
    .field input,.field select,.field textarea{font-size:16px;} /* evita zoom automático en iOS */
    .modal-actions{flex-direction:column-reverse;align-items:stretch;}
    .modal-actions .right{flex-direction:column-reverse;}
    .modal-actions button{width:100%;}
  }
</style>
</head>

// Pega aquí la URL que te dio Google al "Implementar" el script de respaldo /
// sincronización con Calendar (paso a paso más abajo). Mientras diga
// PEGA_AQUI, la agenda funciona igual pero no manda nada a ese respaldo.
const BACKUP_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwyqBvf-NPV06Mc1eiIUM86ySn-NKxtuoJ-YBimjDwP7XwflMcaVp7P2E3mNT7c1gw6XA/exec';

function syncToBackupWebhook(action, appt){
  if(!BACKUP_WEBHOOK_URL || BACKUP_WEBHOOK_URL.indexOf('PEGA_AQUI') === 0) return;
  try{
    fetch(BACKUP_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors', // los Apps Script publicados como "cualquiera" se llaman así desde el navegador
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, appointment: appt }),
    });
  }catch(e){
    console.error('No se pudo avisar al respaldo/Calendar (la cita igual quedó guardada en Firebase)', e);
  }
}

// Reenvía TODAS las citas actuales a la Hoja/Calendar conectados, una por una
// con una pequeña pausa entre cada una (para no saturar el script de Google).
// Se puede usar las veces que quieras — como ya identifica cada cita por su
// ID, nunca duplica filas ni eventos, solo los actualiza si ya existían.
function runFullBackupSync(){
  if(!BACKUP_WEBHOOK_URL || BACKUP_WEBHOOK_URL.indexOf('PEGA_AQUI') === 0){
    showAlert('Todavía no has conectado ninguna Hoja/Calendar (falta pegar la URL del script). Pídele a Claude que te ayude con ese paso primero.');
    return;
  }
  const total = state.appointments.length;
  if(!total){ showAlert('No hay ninguna cita guardada para sincronizar.'); return; }
  showConfirmDialog(`Esto va a mandar las ${total} citas guardadas (incluidas las de meses anteriores) a tu Hoja de Google y a crear/actualizar su evento en Calendar. Puede tardar un par de minutos. ¿Continuar?`, ()=>{
    let i = 0;
    const sendNext = ()=>{
      if(i >= state.appointments.length){
        showAlert(`Listo — se mandaron ${state.appointments.length} citas a la Hoja y al Calendar.`);
        return;
      }
      syncToBackupWebhook('save', state.appointments[i]);
      i++;
      setTimeout(sendNext, 350);
    };
    sendNext();
  });
}

function fmtCLP(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-CL');
}
function fmtCLPShort(n){
  n = Number(n)||0;
  if(Math.abs(n)>=1000000) return '$'+(n/1000000).toLocaleString('es-CL',{maximumFractionDigits:1})+'M';
  if(Math.abs(n)>=1000) return '$'+Math.round(n/1000)+'K';
  return '$'+n;
}
function pad(n){return n.toString().padStart(2,'0');}
function toKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function sameDay(a,b){return toKey(a)===toKey(b);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function addMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}
function daysInMonth(year,month){return new Date(year,month+1,0).getDate();}
function startOfWeek(d){const r=new Date(d);const day=(r.getDay()+6)%7;r.setDate(r.getDate()-day);return r;}

function minutesFromMidnight(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function addMinutesToHHMM(hhmm, minsToAdd){
  const total = minutesFromMidnight(hhmm) + minsToAdd;
  const clamped = Math.max(0, Math.min(total, 23*60+59));
  return pad(Math.floor(clamped/60)) + ':' + pad(clamped%60);
}
function timeLabel(hhmm){return hhmm;}
function normalizeName(s){return (s||'').trim().toLowerCase();}

// ---------------- Consentimiento firmado (colección "sibana-consentimientos") ----------------
function consentMatchScore(query, entry){
  const q = normalizeName(query);
  if(!q) return 1; // sin texto de búsqueda: se muestran todas por igual
  const n = entry.nombre_buscar || normalizeName(entry.nombre||'');
  const rut = (entry.rut||'').toLowerCase();
  const tel = (entry.telefono||'').toLowerCase();
  if(n === q) return 100;
  if(n.includes(q) || q.includes(n)) return 50;
  if((rut && rut.includes(q)) || (tel && tel.includes(q))) return 40;
  const qWords = q.split(/\s+/).filter(w=>w.length>=3);
  const nWords = n.split(/\s+/).filter(w=>w.length>=3);
  // A propósito "contiene" en vez de coincidencia exacta: así encuentra
  // aunque escriban un diminutivo ("Rosa" por "Rosario") o parte del nombre.
  let shared = 0;
  qWords.forEach(w=>{ if(nWords.some(nw=>nw.includes(w)||w.includes(nw))) shared++; });
  return shared>0 ? 10*shared : 0;
}

function renderConsentSearch(box, allDocs, initialQuery, close, apptId){
  const fmt = iso=>{ if(!iso) return ''; const dt=new Date(iso); return dt.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' · ' + dt.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); };
  const yn = v=> v===true?'Sí':(v===false?'No':'—');

  function entryHtml(e){
    const linkBtn = apptId ? `<button type="button" class="btn btn-ghost" data-consent-link="${escapeHtml(e._id)}" data-consent-name="${escapeHtml(e.nombre||'')}" style="font-size:11.5px;margin-top:8px;">Vincular esta ficha a esta cita</button>` : '';
    const deleteBtn = `<button type="button" class="btn btn-ghost" data-consent-delete="${escapeHtml(e._id)}" style="font-size:11.5px;margin-top:8px;margin-left:6px;color:var(--danger);">Eliminar esta ficha</button>`;
    return `
      <div style="border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <b style="font-size:13.5px;">${escapeHtml(e.nombre||'—')}</b>
          <span style="font-size:11.5px;color:#a89a83;white-space:nowrap;">${fmt(e.submittedAtClient)}</span>
        </div>
        <div style="font-size:12.5px;line-height:1.6;margin-top:6px;">
          <div><b>RUT:</b> ${escapeHtml(e.rut||'—')}</div>
          <div><b>Teléfono:</b> ${escapeHtml(e.telefono||'—')}</div>
          <div><b>Técnica:</b> ${escapeHtml(e.tecnica||'—')}</div>
          <div><b>Diseño aprobado por la clienta:</b> ${yn(e.diseno_aprobado)}</div>
          <div><b>Alergias:</b> ${yn(e.alergias)}${e.alergias_detalle?' — '+escapeHtml(e.alergias_detalle):''}</div>
          <div><b>Condiciones de piel:</b> ${yn(e.cond_piel)}${e.cond_piel_detalle?' — '+escapeHtml(e.cond_piel_detalle):''}</div>
        </div>
        ${e.firmaDataUrl?`<div style="background:#fdfaf3;border-radius:4px;margin-top:8px;padding:4px;"><img src="${e.firmaDataUrl}" style="max-width:200px;display:block;"></div>`:''}
        ${linkBtn}${deleteBtn}
      </div>`;
  }

  function renderList(query){
    const scored = allDocs
      .map(e=>({e, score: consentMatchScore(query, e)}))
      .filter(x=> query.trim()==='' ? true : x.score>0)
      .sort((a,b)=> b.score-a.score || (b.e.submittedAtClient||'').localeCompare(a.e.submittedAtClient||''));
    if(scored.length===0){
      return `<p class="hint" style="margin-top:10px">No hay coincidencias. Prueba con otra parte del nombre, o borra el texto para ver todas las fichas firmadas.</p>`;
    }
    return scored.slice(0,30).map(({e})=>entryHtml(e)).join('');
  }

  box.innerHTML = `
    <p style="margin-top:0">Buscar en las ${allDocs.length} ficha${allDocs.length===1?'':'s'} firmada${allDocs.length===1?'':'s'}:</p>
    <input type="text" id="consent-search-input" class="client-search-input" style="margin-bottom:10px" value="${escapeHtml(initialQuery||'')}" placeholder="Nombre, RUT o teléfono">
    <div id="consent-search-results">${renderList(initialQuery||'')}</div>
    <div class="confirm-actions"><button class="btn btn-primary" id="dlg-ok2">Cerrar</button></div>
  `;
  box.querySelector('#dlg-ok2').addEventListener('click', close);
  const input = box.querySelector('#consent-search-input');
  const wireLinkButtons = ()=>{
    box.querySelectorAll('[data-consent-link]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        linkConsentToAppt(apptId, btn.dataset.consentLink, btn.dataset.consentName);
        close();
      });
    });
  };
  const wireDeleteButtons = ()=>{
    box.querySelectorAll('[data-consent-delete]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.confirming){
          const id = btn.dataset.consentDelete;
          btn.disabled = true;
          btn.textContent = 'Eliminando…';
          db.collection('sibana-consentimientos').doc(id).delete()
            .then(()=>{
              const idx = allDocs.findIndex(d=>d._id===id);
              if(idx>=0) allDocs.splice(idx,1);
              if(box.isConnected){
                box.querySelector('#consent-search-results').innerHTML = renderList(input.value);
                wireLinkButtons();
                wireDeleteButtons();
              }
            })
            .catch(err=>{
              console.error(err);
              showAlert('No se pudo eliminar la ficha. Revisa tu conexión e inténtalo de nuevo.');
              btn.disabled = false;
              btn.textContent = 'Eliminar esta ficha';
              delete btn.dataset.confirming;
            });
        } else {
          btn.dataset.confirming = '1';
          btn.textContent = '¿Seguro? Confirmar';
          setTimeout(()=>{
            if(btn.isConnected && btn.dataset.confirming){
              delete btn.dataset.confirming;
              btn.textContent = 'Eliminar esta ficha';
            }
          }, 4000); // si no confirma en unos segundos, el botón vuelve solo a su estado normal
        }
      });
    });
  };
  input.addEventListener('input', ()=>{
    box.querySelector('#consent-search-results').innerHTML = renderList(input.value);
    wireLinkButtons();
    wireDeleteButtons();
  });
  wireLinkButtons();
  wireDeleteButtons();
  input.focus();
  input.selectionStart = input.selectionEnd = input.value.length;
}

function linkConsentToAppt(apptId, consentId, consentName){
  if(!apptId){ showAlert('No se pudo vincular: falta identificar la cita. Cierra este diálogo, guarda la cita primero y vuelve a intentarlo.'); return; }
  const appt = state.appointments.find(a=>a.id===apptId);
  if(!appt){ showAlert('No se encontró la cita para vincular.'); return; }
  appt.consentId = consentId;

  showAlert(`Ficha de ${consentName||'la clienta'} vinculada a esta cita. La próxima vez que abras "Ver consentimiento firmado" aquí, se mostrará directo, sin buscar.`);
  if(!ui.modal) return;

function loadFullSearch(box, clientName, apptId, close){
  box.innerHTML = `<p style="margin-top:0">Cargando fichas de consentimiento…</p>`;
  db.collection('sibana-consentimientos').orderBy('submittedAtClient','desc').limit(500).get()
    .then(snap=>{
      if(!box.isConnected) return; // el diálogo ya se cerró
      const allDocs = snap.docs.map(d=> Object.assign({_id:d.id}, d.data()));
      renderConsentSearch(box, allDocs, clientName, close, apptId);
    })
    .catch(err=>{
      console.error(err);
      if(!box.isConnected) return;
      box.innerHTML = `<p>No se pudieron cargar las fichas. Revisa tu conexión.</p><div class="confirm-actions"><button class="btn btn-primary" id="dlg-ok2">Cerrar</button></div>`;
      box.querySelector('#dlg-ok2').addEventListener('click', close);
    });
}

// ---------------- Horario / bloqueos ----------------
function dayHoursFor(date){
  const h = state.settings.hours || {};
  return h[date.getDay()] || null; // null = cerrado ese día
}
function isClosedWeekday(date){
  return !dayHoursFor(date);
}
function hourIsBlocked(hour, date){
  const dh = dayHoursFor(date);
  if(!dh) return true;
  const slotStart = hour*60, slotEnd = (hour+1)*60;
  const openStart = (Number(dh.open)||0)*60;
  const openEnd = (Number(dh.close)||24)*60;
  if(slotStart < openStart || slotEnd > openEnd) return true;
  const s = state.settings;
  if(s.lunchStart && s.lunchEnd){
    const lunchS = minutesFromMidnight(s.lunchStart), lunchE = minutesFromMidnight(s.lunchEnd);
    if(slotStart < lunchE && slotEnd > lunchS) return true;
  }
  return false;
}
function apptFallsInBlockedTime(date, start, end){
  const dh = dayHoursFor(date);
  if(!dh) return true;
  const s = state.settings;
  const startMin = minutesFromMidnight(start), endMin = minutesFromMidnight(end);
  const openStart = (Number(dh.open)||0)*60, openEnd = (Number(dh.close)||24)*60;
  if(startMin < openStart || endMin > openEnd) return true;
  if(s.lunchStart && s.lunchEnd){
    const lunchS = minutesFromMidnight(s.lunchStart), lunchE = minutesFromMidnight(s.lunchEnd);
    if(startMin < lunchE && endMin > lunchS) return true;
  }
  return false;
}

// Solo hay un box: dos citas no pueden ocupar el mismo horario, sin importar
// qué especialista las atienda (una NoShow o Cancelada libera el horario).
function apptsOverlap(a, b){
  if(a.date !== b.date) return false;
  const aStart = minutesFromMidnight(a.start), aEnd = minutesFromMidnight(a.end);
  const bStart = minutesFromMidnight(b.start), bEnd = minutesFromMidnight(b.end);
  return aStart < bEnd && bStart < aEnd;
}
function findOverlappingAppt(candidate){
  return state.appointments.find(a=>
    a.id !== candidate.id &&
    a.estado !== 'Cancelada' && a.estado !== 'NoShow' &&
    apptsOverlap(a, candidate)
  );
}

// ---------------- Bloqueos de hora (especialistas) ----------------
const ALL_SPECIALISTS_VALUE = '__TODAS__'; // bloqueo general del estudio (ej: corte de luz), no depende de una especialista
function blockSpecialistLabel(specialist){
  return specialist===ALL_SPECIALISTS_VALUE ? 'Todo el estudio' : (specialist||'');
}
function allBlocksForDate(dateKey){
  return (state.blocks||[]).filter(b=>b.date===dateKey).sort((a,b)=>minutesFromMidnight(a.start)-minutesFromMidnight(b.start));
}
function blocksForDate(dateKey){
  const list = allBlocksForDate(dateKey);
  if(ui.specialistFilter==='all') return list;
  return list.filter(b=>b.specialist===ALL_SPECIALISTS_VALUE || normalizeName(b.specialist)===normalizeName(ui.specialistFilter));
}
function blockCoversHour(hour, date){
  const dateKey = toKey(date);
  const slotStart = hour*60, slotEnd = (hour+1)*60;
  return allBlocksForDate(dateKey).find(b=>{
    const bs = minutesFromMidnight(b.start), be = minutesFromMidnight(b.end);
    return slotStart < be && bs < slotEnd;
  });
}
function findCoveringBlock(date, start, end, specialist){
  const dateKey = toKey(date);
  const startMin = minutesFromMidnight(start), endMin = minutesFromMidnight(end);
  return allBlocksForDate(dateKey).find(b=>{
    if(b.specialist!==ALL_SPECIALISTS_VALUE && specialist!==undefined && normalizeName(b.specialist)!==normalizeName(specialist)) return false;
    const bs = minutesFromMidnight(b.start), be = minutesFromMidnight(b.end);
    return startMin < be && bs < endMin;
  });
}

function specialistColor(name){
  if(name===ALL_SPECIALISTS_VALUE) return '#B23A2E';
  const sp = state.specialists.find(s=>normalizeName(s.name)===normalizeName(name));
  return sp ? sp.color : '#6B6152';
}
function filterBySpecialist(list){
  if(ui.specialistFilter==='all') return list;
  return list.filter(a=>normalizeName(a.specialist)===normalizeName(ui.specialistFilter));
}

function deriveClientsFromAppointments(){
  const map = new Map();
  state.appointments.slice()
    .sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))
    .forEach(a=>{
      if(!a.client) return;
      map.set(normalizeName(a.client), {id:uid(), name:a.client, phone:a.phone||'', lastService:summarizeServices(a.services||[]), lastDate:a.date});
    });
  return Array.from(map.values());
}
function upsertClient(name, phone, service){
  if(!name) return;
  const key = normalizeName(name);
  let c = state.clients.find(c=>normalizeName(c.name)===key);
  if(c){
    if(phone) c.phone = phone;
    c.lastService = service;
    c.lastDate = toKey(new Date());
  } else {
    state.clients.push({id:uid(), name, phone, lastService:service, lastDate:toKey(new Date())});
  }
}
function findClientMatches(query){
  const q = normalizeName(query);
  if(!q) return [];
  return state.clients
    .filter(c=>normalizeName(c.name).includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name))
    .slice(0,6);
}
function getClientStats(){
  const map = new Map();
  state.clients.forEach(c=>{
    map.set(normalizeName(c.name), {name: c.name, phone: c.phone||'', appts: []});
  });
  state.appointments.forEach(a=>{
    if(!a.client) return;
    const key = normalizeName(a.client);
    if(!map.has(key)) map.set(key, {name: a.client, phone: a.phone||'', appts: []});
    const entry = map.get(key);
    entry.appts.push(a);
    if(a.phone && !entry.phone) entry.phone = a.phone;
  });
  return Array.from(map.values()).map(c=>{
    const sorted = c.appts.slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
    // Mismo criterio que en el resumen del día: si la cita se canceló o no llegó,
    // solo cuenta el abono (que no se devuelve) como plata gastada, no el precio
    // completo del servicio que nunca se hizo.
    const totalSpent = c.appts.reduce((s,a)=>{
      if(a.estado==='Cancelada' || a.estado==='NoShow') return s + (Number(a.abono)||0);
      return s + (Number(a.price)||0);
    }, 0);
    return {
      name: c.name, phone: c.phone, count: c.appts.length, totalSpent,
      lastDate: sorted[0] ? sorted[0].date : null,
      appts: sorted,
    };
  }).sort((a,b)=>(b.lastDate||'').localeCompare(a.lastDate||''));
}
function renderClientSuggestions(query){
  const box = document.getElementById('client-ac');
  if(!box) return;
  const matches = findClientMatches(query);
  if(!matches.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = matches.map(c=>`
    <div class="ac-item" data-name="${escapeHtml(c.name)}" data-phone="${escapeHtml(c.phone||'')}">
      <div class="ac-name">${escapeHtml(c.name)}</div>
      <div class="ac-meta">${escapeHtml(c.phone||'Sin teléfono')}${c.lastService?' · Última: '+escapeHtml(c.lastService):''}</div>
    </div>`).join('');
  box.style.display='block';
}

// ---------------- Selección de varios servicios (combos) ----------------
function renderServiceChipsMarkup(entries){
  if(!entries.length) return '<span class="svc-chips-empty">Ningún servicio elegido todavía</span>';
  return entries.map(({idx, qty})=>{
    const svc = state.services[idx];
    if(!svc) return '';
    return `<span class="svc-chip-tag" data-svc-remove="${idx}">${escapeHtml(svc.name)}${qty>1?` ×${qty}`:''} <span class="x">✕</span></span>`;
  }).join('');
}
function serviceSummaryHtml(count, totalDuration, totalPrice){
  if(!count) return '<span class="svc-summary-empty">Elige uno o más servicios de la lista</span>';
  return `
    <span class="svc-summary-badge">${count} tratamiento${count===1?'':'s'}</span>
    <span class="svc-summary-badge">⏱ ${totalDuration} min</span>
    <span class="svc-summary-badge svc-summary-price">${fmtCLP(totalPrice)}</span>
  `;
}
function getServiceQuantities(){
  return Array.from(document.querySelectorAll('[data-svc-row]')).map(row=>({
    idx: Number(row.dataset.svcRow),
    qty: Number(row.dataset.qty)||0
  })).filter(x=>x.qty>0);
}
function getTotalDuration(){
  const q = getServiceQuantities();
  const total = q.reduce((sum,{idx,qty})=> sum + (state.services[idx] ? (Number(state.services[idx].duration)||0)*qty : 0), 0);
  return total || 60;
}
function setServiceQty(idx, qty){
  const row = document.querySelector(`[data-svc-row="${idx}"]`);
  if(!row) return;
  const clamped = Math.max(0, Math.min(9, qty));
  row.dataset.qty = clamped;
  row.classList.toggle('checked', clamped>0);
  const num = row.querySelector('.svc-qty-num');
  if(num) num.textContent = clamped;
  const decBtn = row.querySelector('[data-svc-dec]');
  if(decBtn) decBtn.disabled = clamped<=0;
  recomputeServiceFields();
}
function recomputeServiceFields(){
  const q = getServiceQuantities();
  const totalCount = q.reduce((s,x)=>s+x.qty,0);
  const totalPrice = q.reduce((s,{idx,qty})=> s + (state.services[idx] ? (Number(state.services[idx].price)||0)*qty : 0), 0);
  const totalDuration = getTotalDuration();
  const cremaEl = document.getElementById('f-crema');
  const cremaExtra = (cremaEl && cremaEl.checked) ? CREMA_PRICE : 0;
  const finalPrice = totalPrice + cremaExtra;

  const chipsBox = document.getElementById('svc-chips');
  if(chipsBox){
    chipsBox.innerHTML = renderServiceChipsMarkup(q);
  }
  const summary = document.getElementById('svc-summary');
  if(summary){
    summary.innerHTML = serviceSummaryHtml(totalCount, totalDuration, totalPrice);
  }

  const priceInput = document.getElementById('f-price');
  const abonoInput = document.getElementById('f-abono');
  const saldoInput = document.getElementById('f-saldo');
  const startInput = document.getElementById('f-start');
  const endInput = document.getElementById('f-end');
  if(priceInput) priceInput.value = finalPrice;
  // El abono por defecto ($5.000 por tratamiento) solo tiene sentido sugerirlo
  // en una cita NUEVA. En una cita que ya existe, cambiar la cantidad de un
  // servicio (por cualquier motivo, incluso uno que no tenga que ver con el
  // pago) NUNCA debe borrar el abono que ya quedó registrado/cobrado.
  const isNew = ui.modal && ui.modal.mode === 'new';
  if(isNew && abonoInput){
    abonoInput.value = 5000 * totalCount;
  }
  if(abonoInput && saldoInput){
    // Si el saldo está dividido entre dos métodos de pago, su valor ya lo
    // controla esa suma (ver listeners de f-montoSaldo1/2) — no lo pisamos aquí.
    const splitSaldoBox = document.getElementById('split-saldo');
    const saldoIsSplit = splitSaldoBox && splitSaldoBox.style.display !== 'none';
    if(!saldoIsSplit){
      saldoInput.value = Math.max(finalPrice - (Number(abonoInput.value)||0), 0);
    }
  }
  if(startInput && endInput && startInput.value){
    endInput.value = addMinutesToHHMM(startInput.value, totalDuration);
  }
}

// ---------------- Carga / guardado (Firestore, en tiempo real) ----------------
function applyRemoteData(data){
  state.appointments = (data.appointments || []).map(a=>{
    if(!Array.isArray(a.services)) a.services = a.service ? [a.service] : [];
    return a;
  });
  if(state.appointments.length > lastKnownGoodCount) lastKnownGoodCount = state.appointments.length;
  state.services = (data.services && data.services.length) ? data.services : DEFAULT_SERVICES.slice();
  state.services.forEach(s=>{ if(s.duration==null) s.duration = 60; });
  state.services.sort((a,b)=>(a.name||'').localeCompare(b.name||'', 'es', {sensitivity:'base'}));
  state.specialists = (data.specialists && data.specialists.length) ? data.specialists : DEFAULT_SPECIALISTS.map(s=>Object.assign({}, s));
  state.clients = (data.clients && data.clients.length) ? data.clients : deriveClientsFromAppointments();
  state.blocks = data.blocks || [];
  state.expenses = data.expenses || [];
  state.recurringExpenses = data.recurringExpenses || [];
  state.recurringIncomes = data.recurringIncomes || [];
  state.stockItems = data.stockItems || [];
  state.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
}

function startFirestoreSync(){
  DOC_REF.onSnapshot(snap=>{
    if(snap.exists){
      applyRemoteData(snap.data());
      const imported = runHistoricalImportIfNeeded();
      const sabado12 = runSabado12ImportIfNeeded();
      const sept5a11 = runSept5a11ImportIfNeeded();
      const julio2026 = runJulio2026ImportIfNeeded();
      const gastosFijos = runRecurringExpensesImportIfNeeded();
      const ingresoBox = runRecurringIncomeImportIfNeeded();
      const corrected = runCorrectionsIfNeeded();
      const priceFixed = runPriceCorrectionsIfNeeded();
      const passwordInit = runPasswordInitIfNeeded();
      const specialistAgosto = runSpecialistAgostoIfNeeded();
      const mairelynFix = runMairelynFixIfNeeded();
      const saldoFix = runSaldoFixIfNeeded();
      const paymentNormalize = runPaymentMethodNormalizeIfNeeded();
      const noLunch = runNoLunchIfNeeded();
      const stockSeed = runStockSeedIfNeeded();
      ui.loaded = true;
      // Si hay un modal abierto (alguien escribiendo), no lo interrumpimos con un
      // re-render completo — los datos ya quedaron actualizados por dentro y se
      // van a ver apenas cierre ese modal.
      if(!ui.modal) render();
      if(imported || sabado12 || sept5a11 || julio2026 || gastosFijos || ingresoBox || corrected || priceFixed || passwordInit || specialistAgosto || mairelynFix || saldoFix || paymentNormalize || noLunch || stockSeed) saveData();
    } else {
      // No existe ningún documento en la base de datos. Después de la primera
      // vez que se configuró Firebase, esto NUNCA debería volver a pasar — si
      // aparece ahora, es señal de un problema de lectura/conexión, no de una
      // base de datos nueva. Por seguridad, jamás se guarda nada automáticamente
      // en este caso: así un error pasajero de lectura no puede borrar datos
      // reales que sí existen del otro lado.
      ui.loaded = true;
      document.getElementById('root').innerHTML = '<div class="loading">⚠️ No se pudo leer la base de datos (o aparenta estar vacía). Por seguridad, la agenda no va a guardar ni sobrescribir nada mientras esto pase — no agendes nada aquí y avísale a Juan Diego antes de seguir. Prueba recargando la página o revisando tu conexión a internet.</div>';
    }
  }, err=>{
    console.error('Error de sincronización', err);
    ui.loaded = true;
    render();
    showAlert('No se pudo conectar con la base de datos compartida (Firebase). Revisa tu conexión a internet o la configuración del proyecto.');
  });
}

let lastKnownGoodCount = 0; // la mayor cantidad de citas que se ha visto realmente cargada esta sesión

async function saveData(){
  // Red de seguridad: si en algún momento de esta sesión llegamos a ver, por
  // ejemplo, 80 citas reales, y de repente se intenta guardar con 0 (o casi
  // 0), eso es casi siempre síntoma de un error (no de que alguien borró
  // realmente 80 citas de una sola vez) — se bloquea el guardado y se avisa,
  // en vez de sobrescribir en silencio la base de datos real.
  if(state.appointments.length === 0 && lastKnownGoodCount > 5){
    console.error('Guardado bloqueado por seguridad: se intentó guardar con 0 citas habiendo visto', lastKnownGoodCount, 'antes.');
    showAlert('Por seguridad, no se guardó un cambio que hubiera dejado la agenda vacía (antes había '+lastKnownGoodCount+' citas). Si esto fue intencional, avísale a Juan Diego. Si no lo fue, no toques nada más y avísale también.');
    return;
  }
  ui.saving = true;
  try{
    await DOC_REF.set({
      appointments: state.appointments,
      services: state.services,
      specialists: state.specialists,
      clients: state.clients,
      blocks: state.blocks,
      expenses: state.expenses,
      recurringExpenses: state.recurringExpenses,
      recurringIncomes: state.recurringIncomes,
      stockItems: state.stockItems,
      settings: state.settings,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  }catch(e){
    console.error('Error guardando', e);
    showAlert('No se pudo guardar el cambio. Revisa tu conexión e inténtalo de nuevo.');
  }
  ui.saving = false;
}

function dayViewHtml(){
  const dateKey = toKey(ui.currentDate);
  const appts = filterBySpecialist(apptsForDate(dateKey));
  const dayBlocks = blocksForDate(dateKey);
  const closed = isClosedWeekday(ui.currentDate);

  // Por defecto el grid muestra HOUR_START–HOUR_END, pero si hay una cita o un
  // bloqueo cargado a una hora fuera de ese rango (por ejemplo, por error de
  // tipeo), se amplía automáticamente para que quede visible y se pueda
  // editar, en vez de quedar cortada por el overflow:hidden del contenedor.
  let rangeStart = HOUR_START, rangeEnd = HOUR_END;
  [...appts, ...dayBlocks].forEach(item=>{
    const sH = Math.floor(minutesFromMidnight(item.start)/60);
    const eH = Math.ceil(minutesFromMidnight(item.end)/60);
    if(sH < rangeStart) rangeStart = Math.max(0, sH);
    if(eH > rangeEnd) rangeEnd = Math.min(24, eH);
  });

  const totalHours = rangeEnd - rangeStart;
  const gridHeight = totalHours * SLOT_PX;

  let timeCol = '';
  let hourLines = '';
  for(let h=rangeStart; h<=rangeEnd; h++){
    const top = (h-rangeStart)*SLOT_PX;
    timeCol += `<div class="slot" style="height:${SLOT_PX}px"><span>${pad(h)}:00</span></div>`;
    hourLines += `<div class="hourline" style="top:${top}px"></div>`;
    if(h<rangeEnd) hourLines += `<div class="hourline half" style="top:${top+SLOT_PX/2}px"></div>`;
  }
  let emptyClicks = '';
  let blockedOverlay = '';
  for(let h=rangeStart; h<rangeEnd; h++){
    const top=(h-rangeStart)*SLOT_PX;
    const blocked = closed || hourIsBlocked(h, ui.currentDate);
    if(blocked){
      blockedOverlay += `<div class="blocked" style="top:${top}px;height:${SLOT_PX}px"></div>`;
    } else if(ui.mode==='admin') {
      emptyClicks += `<div class="emptyclick" style="top:${top}px" data-act="new-appt-at" data-hour="${h}"></div>`;
    } else if(!blockCoversHour(h, ui.currentDate)) {
      emptyClicks += `<div class="emptyclick" style="top:${top}px" data-act="new-block-at" data-hour="${h}" title="Bloquear esta hora"></div>`;
    }
  }

  let specialistBlocks = '';
  dayBlocks.forEach(b=>{
    const startMin = minutesFromMidnight(b.start) - rangeStart*60;
    const endMin = minutesFromMidnight(b.end) - rangeStart*60;
    const top = (startMin/60)*SLOT_PX;
    const height = Math.max(((endMin-startMin)/60)*SLOT_PX, 26);
    const col = specialistColor(b.specialist);
    specialistBlocks += `
      <div class="appt st-Cancelada" style="top:${top}px;height:${height}px;border-left-color:${col};background:repeating-linear-gradient(45deg, rgba(0,0,0,.05), rgba(0,0,0,.05) 6px, transparent 6px, transparent 12px)" data-act="edit-block" data-id="${b.id}">
        <div class="t-time">${b.start}–${b.end}<span class="spec-dot" style="background:${col}"></span></div>
        <div class="t-name">🚫 ${escapeHtml(blockSpecialistLabel(b.specialist))} no disponible</div>
        ${b.reason ? `<div class="t-service">${escapeHtml(b.reason)}</div>` : ''}
      </div>`;
  });

  let apptBlocks = '';
  appts.forEach(a=>{
    const startMin = minutesFromMidnight(a.start) - rangeStart*60;
    const endMin = minutesFromMidnight(a.end) - rangeStart*60;
    const top = (startMin/60)*SLOT_PX;
    const height = Math.max(((endMin-startMin)/60)*SLOT_PX, 26);
    const stClass = 'st-' + (a.estado||'Pendiente').replace(/\s/g,'');
    const dotColor = specialistColor(a.specialist);
    const specBorder = a.specialist ? `border-left-color:${dotColor};` : '';
    // Citas cortas (menos de 40min) no alcanzan a mostrar 3 líneas apiladas
    // sin cortar el texto — en ese caso, todo va en una sola línea con
    // puntos suspensivos si no alcanza el ancho, en vez de perder info.
    const isCompact = height < 40;
    const nameServiceHtml = isCompact
      ? `<div class="t-name-compact">${escapeHtml(a.client||'Sin nombre')}${(a.services&&a.services.length)?' · '+escapeHtml(summarizeServices(a.services||[])):''}</div>`
      : `<div class="t-name">${escapeHtml(a.client||'Sin nombre')}</div>
        <div class="t-service">${escapeHtml(summarizeServices(a.services||[]))}</div>`;
    apptBlocks += `
      <div class="appt ${stClass}${isCompact?' compact':''}" style="top:${top}px;height:${height}px;${specBorder}" data-act="edit-appt" data-id="${a.id}">
        <div class="t-time">${a.start}–${a.end}${a.specialist?`<span class="spec-dot" style="background:${dotColor}"></span>`:''}</div>
        ${nameServiceHtml}
      </div>`;
  });

  return `
    <div class="dayrow" style="height:${gridHeight}px">
      <div class="timecol">${timeCol}</div>
      <div class="gridcol" style="height:${gridHeight}px">
        ${hourLines}
        ${blockedOverlay}
        ${emptyClicks}
        ${specialistBlocks}
        ${apptBlocks}
      </div>
    </div>
    ${closed ? `<div class="day-closed-msg">El salón no atiende este día.${ui.mode==='admin' ? ' Si necesitas agendar una excepción, usa "+ Nueva cita".' : ''}</div>` : (appts.length===0 ? `<div class="empty-msg">Sin citas este día.${ui.mode==='admin' ? ' Haz clic en un horario para agendar.' : ' Toca un horario libre para bloquearlo si no vas a trabajar.'}</div>` : '')}
  `;
}

function weekViewHtml(){
  const start = startOfWeek(ui.currentDate);
  const today = new Date();
  let cells = '';
  for(let i=0;i<7;i++){
    const d = addDays(start,i);
    const key = toKey(d);
    const appts = filterBySpecialist(apptsForDate(key));
    const revenue = appts.reduce((s,a)=> s + apptRevenue(a), 0);
    cells += `
      <div class="weekday ${sameDay(d,today)?'today':''}" data-act="goto-day" data-date="${key}">
        <div class="wd-label">${DAY_NAMES[d.getDay()]}</div>
        <div class="wd-num">${d.getDate()}</div>
        <div class="wd-count">${appts.length} cita${appts.length===1?'':'s'}</div>
        ${(ui.mode==='admin' && revenue>0) ? `<div class="wd-rev">${fmtCLP(revenue)}</div>` : ''}
      </div>`;
  }
  return `<div class="weekgrid">${cells}</div>`;
}

function monthViewHtml(){
  const cur = ui.currentDate;
  const year = cur.getFullYear(), month = cur.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = startOfWeek(firstOfMonth); // lunes de la semana que contiene el día 1
  const today = new Date();

  let cells = [];
  for(let i=0;i<42;i++) cells.push(addDays(gridStart, i));
  // si el mes completo cabe en 5 semanas, no mostramos una 6ta fila que sería
  // puros días del mes siguiente
  while(cells.length>35 && cells.slice(-7).every(d=>d.getMonth()!==month)){
    cells = cells.slice(0,-7);
  }

  const headerNames = DAY_NAMES.slice(1).concat(DAY_NAMES[0]); // empieza en lunes
  const headerRow = `<div class="month-headerrow">${headerNames.map(n=>`<div>${n}</div>`).join('')}</div>`;

  let rows = '';
  for(let w=0; w<cells.length/7; w++){
    let rowHtml = '';
    for(let i=0;i<7;i++){
      const d = cells[w*7+i];
      const key = toKey(d);
      const appts = filterBySpecialist(apptsForDate(key));
      const revenue = appts.reduce((s,a)=>s+apptRevenue(a),0);
      const isOther = d.getMonth()!==month;
      const shown = appts.slice(0,3);
      const extra = appts.length - shown.length;
      rowHtml += `
        <div class="month-cell ${isOther?'other-month':''} ${sameDay(d,today)?'today':''}" data-act="goto-day" data-date="${key}">
          <div class="mc-num">${d.getDate()}</div>
          <div class="mc-count">${appts.length?`${appts.length} cita${appts.length===1?'':'s'}`:''}</div>
          ${shown.map(a=>`<div class="mc-event"><span class="dot" style="background:${specialistColor(a.specialist)}"></span>${a.start} ${escapeHtml(a.client||'')}</div>`).join('')}
          ${extra>0?`<div class="mc-more">+${extra} más</div>`:''}
          ${(ui.mode==='admin' && revenue>0) ? `<div class="mc-rev">${fmtCLP(revenue)}</div>` : ''}
        </div>`;
    }
    rows += `<div class="month-weekrow">${rowHtml}</div>`;
  }
  return `<div class="monthgrid">${headerRow}${rows}</div>`;
}

// Suma cuánto entró por cada método de pago (Efectivo, Transferencia, etc.),
// separando abonos que quedaron divididos en dos métodos. Se usa tanto en el
// resumen de arriba como en Finanzas.
function normalizePaymentMethod(m){
  // Junta variaciones como "Transferencia " (con espacio de más) o "transferencia"
  // (minúscula) con el método real, para que no aparezcan como si fueran dos
  // métodos de pago distintos en los reportes.
  const clean = (m||'').trim();
  if(!clean) return '';
  const found = PAYMENT_METHODS.find(pm=>pm.toLowerCase()===clean.toLowerCase());
  return found || clean;
}
function paymentBreakdown(appts){
  const porMetodo = {};
  const addMetodo = (m, monto)=>{ if(monto<=0) return; const k=normalizePaymentMethod(m)||'Sin especificar'; porMetodo[k]=(porMetodo[k]||0)+monto; };
  const addSplitAmount = (metodo1, totalMonto, metodo2, monto2)=>{
    const m2 = Number(monto2)||0;
    if(m2>0 && metodo2){
      const m1 = totalMonto - m2;
      if(m1>0) addMetodo(metodo1, m1);
      addMetodo(metodo2, m2);
    } else {
      addMetodo(metodo1, totalMonto);
    }
  };
  appts.forEach(a=>{
    // Si el abono ya se había pagado en una cita anterior (reagendada), no es
    // plata nueva entrando por ningún método: no se suma acá de nuevo.
    if(a.abonoPrevio) {
      if(a.estado!=='Cancelada' && a.estado!=='NoShow'){
        addSplitAmount(a.metodoSaldo, Number(a.saldo)||0, a.metodoSaldo2, a.montoSaldo2);
      }
      return;
    }
    if(a.estado==='Cancelada' || a.estado==='NoShow'){
      addSplitAmount(a.metodoAbono, Number(a.abono)||0, a.metodoAbono2, a.montoAbono2);
    } else {
      addSplitAmount(a.metodoAbono, Number(a.abono)||0, a.metodoAbono2, a.montoAbono2);
      addSplitAmount(a.metodoSaldo, Number(a.saldo)||0, a.metodoSaldo2, a.montoSaldo2);
    }
  });
  return porMetodo;
}

function summaryHtml(){
  const dateKey = toKey(ui.currentDate);
  const appts = filterBySpecialist(
    ui.view==='day' ? apptsForDate(dateKey) :
    ui.view==='week' ? (()=>{
      const start = startOfWeek(ui.currentDate);
      let all = [];
      for(let i=0;i<7;i++) all = all.concat(apptsForDate(toKey(addDays(start,i))));
      return all;
    })() :
    (()=>{
      const year = ui.currentDate.getFullYear(), month = ui.currentDate.getMonth();
      const n = daysInMonth(year, month);
      let all = [];
      for(let day=1; day<=n; day++) all = all.concat(apptsForDate(toKey(new Date(year,month,day))));
      return all;
    })()
  );
  const total = appts.length;
  // El abono se lo quedan aunque la cita se cancele o la clienta no llegue, así que
  // siempre cuenta como plata recibida — excepto si ya se contó antes en la cita
  // original que se reagendó (abonoPrevio), porque ahí no entró plata nueva.
  const abonos = appts.reduce((s,a)=>s+(a.abonoPrevio ? 0 : (Number(a.abono)||0)),0);
  // Si la cita se canceló o no llegó, ya no queda nada pendiente de cobrar por ella
  // (si la clienta reagenda, ese abono se descuenta del nuevo precio, pero eso es
  // otra cita nueva, no esta).
  const saldos = appts.reduce((s,a)=>{
    if(a.estado==='Cancelada' || a.estado==='NoShow') return s;
    return s + (Number(a.saldo)||0);
  }, 0);
  // El ingreso real de una cita cancelada o sin show es solo el abono (el servicio
  // nunca se hizo, así que el resto del precio no debe contarse como ingreso).
  const ingreso = appts.reduce((s,a)=>{
    if(a.estado==='Cancelada' || a.estado==='NoShow') return s + (Number(a.abono)||0);
    return s + (Number(a.price)||0);
  }, 0);
  const isAdmin = ui.mode==='admin';
  const breakdown = paymentBreakdown(appts);
  const breakdownEntries = Object.keys(breakdown).sort((a,b)=>breakdown[b]-breakdown[a]);
  return `
    <footer class="summary">
      <div class="stat"><div class="lbl">Citas (${ui.view==='day'?'día':ui.view==='week'?'semana':'mes'})</div><div class="val">${total}</div></div>
      ${isAdmin ? `
      <div class="stat"><div class="lbl">Abonos recibidos</div><div class="val">${fmtCLP(abonos)}</div></div>
      <div class="stat"><div class="lbl">Falta por cobrar</div><div class="val">${fmtCLP(saldos)}</div></div>
      <div class="stat"><div class="lbl">Ingreso total</div><div class="val">${fmtCLP(ingreso)}</div></div>
      ${breakdownEntries.length ? `<div class="stat"><div class="lbl">Por método de pago</div><div class="val" style="font-size:13px;line-height:1.4;">${breakdownEntries.map(m=>`${escapeHtml(m)}: ${fmtCLP(breakdown[m])}`).join('<br>')}</div></div>` : ''}` : ''}
      ${ui.saving ? '<div class="stat"><div class="lbl">&nbsp;</div><div class="val" style="font-size:12px;color:var(--ink-soft)">Guardando…</div></div>' : ''}
    </footer>
  `;
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Junta servicios repetidos (ej. dos personas que se hacen Microblading juntas)
// en "Microblading (MB) ×2" en vez de repetir el nombre dos veces.
function summarizeServices(names){
  if(!names || !names.length) return '';
  const counts = {}, order = [];
  names.forEach(n=>{
    if(!(n in counts)){ counts[n]=0; order.push(n); }
    counts[n]++;
  });
  return order.map(n=> counts[n]>1 ? `${n} ×${counts[n]}` : n).join(' + ');
}
// Describe un pago que puede estar dividido entre 2 métodos, ej:
// "Efectivo $30.000 + Transferencia $20.000". Si no está dividido, muestra
// solo el método normal (compatible con todas las citas antiguas).
function paymentMethodSummary(metodo1, monto1Total, metodo2, monto2){
  const m2 = Number(monto2)||0;
  if(m2>0 && metodo2){
    const m1 = monto1Total - m2;
    const parts = [];
    if(m1>0) parts.push(`${metodo1||'Sin especificar'} ${fmtCLP(m1)}`);
    parts.push(`${metodo2} ${fmtCLP(m2)}`);
    return parts.join(' + ');
  }
  return metodo1 || '';
}

// ---------------- Buscador rápido de citas (por nombre o teléfono, en todas las fechas) ----------------
function apptSearchScore(query, appt){
  const q = normalizeName(query);
  if(!q) return 0;
  const n = normalizeName(appt.client||'');
  const tel = (appt.phone||'').replace(/\D/g,'');
  const qDigits = q.replace(/\D/g,'');
  if(!n && !tel) return 0;
  if(n === q) return 100;
  if(n.includes(q) || (q.length>=3 && q.includes(n))) return 50;
  if(qDigits.length>=4 && tel.includes(qDigits)) return 40;
  const qWords = q.split(/\s+/).filter(w=>w.length>=3);
  const nWords = n.split(/\s+/).filter(w=>w.length>=3);
  // A propósito "contiene" en vez de coincidencia exacta: así encuentra
  // aunque escriban un diminutivo ("Rosa" por "Rosario") o parte del nombre.
  let shared = 0;
  qWords.forEach(w=>{ if(nWords.some(nw=>nw.includes(w)||w.includes(nw))) shared++; });
  return shared>0 ? 10*shared : 0;
}

function renderApptSearchResults(query){
  const q = (query||'').trim();
  if(!q){
    return `<p class="hint" style="margin-top:10px">Escribe el nombre o teléfono de la clienta para buscar entre todas las citas guardadas (no solo las del mes actual).</p>`;
  }
  const estadoLabels = {Pendiente:'Pendiente',Confirmada:'Confirmada',Realizada:'Realizada',Cancelada:'Cancelada',NoShow:'No se presentó'};
  const scored = state.appointments
    .map(a=>({a, score: apptSearchScore(q, a)}))
    .filter(x=>x.score>0)
    .sort((x,y)=> y.score-x.score || y.a.date.localeCompare(x.a.date) || y.a.start.localeCompare(x.a.start));
  if(scored.length===0){
    return `<p class="hint" style="margin-top:10px">No se encontraron citas con ese nombre o teléfono.</p>`;
  }
  const rows = scored.slice(0,40).map(({a})=>{
    const d = parseKey(a.date);
    const dateLabel = `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
    return `
      <div class="client-row">
        <div class="client-row-main" data-goto-appt="${a.id}">
          <div>
            <div class="client-name">${escapeHtml(a.client||'(sin nombre)')}</div>
            <div class="client-meta">${dateLabel} · ${a.start} · ${escapeHtml(summarizeServices(a.services||[])) || '—'} · ${estadoLabels[a.estado]||a.estado}</div>
          </div>
        </div>
      </div>`;
  }).join('');
  const moreHint = scored.length>40 ? `<p class="hint">Mostrando los primeros 40 resultados — escribe más letras para acotar la búsqueda.</p>` : '';
  return rows + moreHint;
}

// ---------------- Finanzas: ingresos, gastos y comisiones ----------------
// Ingreso real de una cita: si se realizó, el precio completo; si se canceló o
// no se presentó, solo el abono (no se devuelve). Mismo criterio que ya usa el
// resto de la agenda en el resumen de arriba.
function apptRevenue(a){
  if(a.estado==='Cancelada' || a.estado==='NoShow') return Number(a.abono)||0;
  return Number(a.price)||0;
}
function apptsInMonth(year, month){
  return state.appointments.filter(a=>{
    const dt = parseKey(a.date);
    return dt.getFullYear()===year && dt.getMonth()===month;
  });
}
function expensesInMonth(year, month){
  return (state.expenses||[]).filter(g=>{
    const dt = parseKey(g.date);
    return dt.getFullYear()===year && dt.getMonth()===month;
  });
}
function recurringIncomeTotal(){
  return (state.recurringIncomes||[]).reduce((s,r)=>s+(Number(r.monto)||0),0);
}
function monthFinancials(year, month){
  const appts = apptsInMonth(year, month);
  const gastos = expensesInMonth(year, month);
  const ingresosCitas = appts.reduce((s,a)=>s+apptRevenue(a),0);
  // El ingreso pasivo (ej. arriendo de un box) llega una vez por cada semana
  // que cae dentro del mes — la misma cantidad de semanas que se ven en el
  // desglose semanal de abajo, para que ambos números siempre cuadren.
  const ingresosPasivos = recurringIncomeTotal() * weekRangesForMonth(year, month).length;
  const ingresos = ingresosCitas + ingresosPasivos;
  const cremasVendidas = appts.filter(a=>a.cremaComprada && a.estado!=='Cancelada' && a.estado!=='NoShow').length;
  const recurringTotal = (state.recurringExpenses||[]).reduce((s,r)=>s+(Number(r.monto)||0),0);
  const gastosFijos = recurringTotal + gastos.filter(g=>g.tipo==='Fijo').reduce((s,g)=>s+(Number(g.monto)||0),0);
  const gastosVariables = gastos.filter(g=>g.tipo==='Variable').reduce((s,g)=>s+(Number(g.monto)||0),0);
  const comisionPct = state.settings.comisionPct!=null ? Number(state.settings.comisionPct) : 0.5;
  // La comisión de las especialistas se calcula solo sobre lo que generan las
  // citas, no sobre el ingreso pasivo del box (ellas no hacen nada por eso).
  const comisiones = ingresosCitas * comisionPct;
  const gastosTotal = gastosFijos + gastosVariables + comisiones;
  const beneficio = ingresos - gastosTotal;

  const porMetodo = paymentBreakdown(appts);

  const porEspecialista = {};
  appts.forEach(a=>{
    const name = a.specialist || 'Sin asignar';
    if(!porEspecialista[name]) porEspecialista[name] = {ingresos:0, citas:0};
    porEspecialista[name].ingresos += apptRevenue(a);
    porEspecialista[name].citas += 1;
  });
  Object.keys(porEspecialista).forEach(name=>{ porEspecialista[name].comision = porEspecialista[name].ingresos * comisionPct; });

  return {ingresos, ingresosCitas, ingresosPasivos, gastosFijos, gastosVariables, comisiones, gastosTotal, beneficio, porMetodo, porEspecialista, comisionPct, appts, gastos, cremasVendidas};
}
function weekRangesForMonth(year, month){
  // Semanas de lunes a domingo, recortadas a los límites del mes — igual que
  // el "Corte Semanal" del Excel.
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  const ranges = [];
  let cursor = new Date(first);
  while(cursor <= last){
    let weekEnd = addDays(startOfWeek(cursor), 6);
    if(weekEnd > last) weekEnd = new Date(last);
    ranges.push({start:new Date(cursor), end:new Date(weekEnd)});
    cursor = addDays(weekEnd, 1);
  }
  return ranges;
}
function rangeFinancials(start, end){
  const startKey = toKey(start), endKey = toKey(end);
  const appts = state.appointments.filter(a=> a.date>=startKey && a.date<=endKey);
  const gastosVar = (state.expenses||[]).filter(g=> g.date>=startKey && g.date<=endKey && g.tipo==='Variable').reduce((s,g)=>s+(Number(g.monto)||0),0);
  // Cada llamada a esta función representa una semana (ver weekRangesForMonth),
  // así que el ingreso pasivo se suma una vez por llamada.
  const ingresos = appts.reduce((s,a)=>s+apptRevenue(a),0) + recurringIncomeTotal();
  return {ingresos, gastosVar, ganancia: ingresos - gastosVar};
}

// ---------------- Gráficos (SVG livianos, sin librerías externas) ----------------
function svgHBarChart(data, opts={}){
  const w = opts.width || 620, barH = 24, gap = 10, labelW = opts.labelW || 170, padding = 8;
  const maxVal = Math.max(1, ...data.map(d=>d.value));
  const chartW = w - labelW - 74;
  const h = data.length*(barH+gap) - gap + padding*2;
  const bars = data.map((d,i)=>{
    const y = padding + i*(barH+gap);
    const barW = Math.max(2, (d.value/maxVal)*chartW);
    const valTxt = opts.formatValue ? opts.formatValue(d.value) : d.value;
    return `
      <text x="${labelW-8}" y="${y+barH/2+4}" text-anchor="end" font-size="11.5" fill="#F1E8D6" font-family="Inter,sans-serif">${escapeHtml(d.label)}</text>
      <rect x="${labelW}" y="${y}" width="${barW}" height="${barH}" rx="5" fill="#C9A227"></rect>
      <text x="${labelW+barW+8}" y="${y+barH/2+4}" font-size="11.5" fill="#D9BB6E" font-weight="600" font-family="Inter,sans-serif">${valTxt}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:${w}px;display:block;">${bars}</svg>`;
}
function svgVBarChart(data, opts={}){
  const w = opts.width || 620, h = opts.height || 210, gap = 14;
  const padding = 16;
  const chartH = h - 46;
  const maxVal = Math.max(1, ...data.map(d=>d.value));
  const barW = (w - padding*2 - gap*(data.length-1)) / data.length;
  const bars = data.map((d,i)=>{
    const barH = Math.max(2, (d.value/maxVal)*chartH);
    const x = padding + i*(barW+gap);
    const y = chartH - barH + 12;
    const valTxt = opts.formatValue ? opts.formatValue(d.value) : d.value;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="5" fill="#C9A227"></rect>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="10.5" fill="#D9BB6E" font-weight="600" font-family="Inter,sans-serif">${valTxt}</text>
      <text x="${x+barW/2}" y="${chartH+30}" text-anchor="middle" font-size="11" fill="#B3A688" font-family="Inter,sans-serif">${escapeHtml(d.label)}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:${w}px;display:block;">${bars}</svg>`;
}

function finanzasGraficosHtml(year, month){
  const trend = [];
  for(let i=5;i>=0;i--){
    const d = addMonths(new Date(year,month,1), -i);
    const fin = monthFinancials(d.getFullYear(), d.getMonth());
    trend.push({label: MONTHS[d.getMonth()].slice(0,3), value: fin.ingresos});
  }

  const appts = apptsInMonth(year, month);
  const svcCounts = {};
  appts.forEach(a=>(a.services||[]).forEach(s=>{ svcCounts[s]=(svcCounts[s]||0)+1; }));
  const topServices = Object.keys(svcCounts).map(k=>({label:k, value:svcCounts[k]})).sort((a,b)=>b.value-a.value).slice(0,6);

  const f = monthFinancials(year, month);
  const espByRevenue = Object.keys(f.porEspecialista).map(k=>({label:k, value:f.porEspecialista[k].ingresos})).sort((a,b)=>b.value-a.value);
  const espByCitas = Object.keys(f.porEspecialista).map(k=>({label:k, value:f.porEspecialista[k].citas})).sort((a,b)=>b.value-a.value);

  return `
    <h3 class="fin-sub">Ingresos — últimos 6 meses</h3>
    <div class="chart-box">${svgVBarChart(trend, {formatValue: v=>fmtCLPShort(v)})}</div>

    <h3 class="fin-sub">Tratamientos más solicitados este mes</h3>
    ${topServices.length ? `<div class="chart-box">${svgHBarChart(topServices)}</div>` : '<div class="hint">Sin citas este mes.</div>'}

    <h3 class="fin-sub">Ingresos por especialista este mes</h3>
    ${espByRevenue.length ? `<div class="chart-box">${svgHBarChart(espByRevenue, {formatValue: v=>fmtCLPShort(v)})}</div>` : '<div class="hint">Sin citas este mes.</div>'}

    <h3 class="fin-sub">Citas atendidas por especialista este mes</h3>
    ${espByCitas.length ? `<div class="chart-box">${svgHBarChart(espByCitas)}</div>` : '<div class="hint">Sin citas este mes.</div>'}
  `;

function waPhoneDigits(phone){
  let d = (phone||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('56')) return d; // ya tiene código de país
  if(d.length===9 && d.startsWith('9')) return '56'+d; // celular chileno sin código de país
  if(d.length===8) return '569'+d; // celular chileno sin el 9 inicial
  return d; // lo que haya, mejor eso que nada
}
function waLink(phone, msg){
  return `https://wa.me/${waPhoneDigits(phone)}?text=${encodeURIComponent(msg)}`;
}
// navigator.clipboard falla en algunos webviews/file://, así que si no está
// disponible cae a la forma vieja de copiar (seleccionar texto + execCommand).
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(err){}
  document.body.removeChild(ta);
}
