// ---------------- Retoques: clientas atendidas hace 30–45 días ----------------
// El retoque se recomienda entre 30 y 45 días después de la SESIÓN INICIAL. Una
// cita que ya es en sí misma un retoque (servicio "Retoque…") no cuenta como
// sesión inicial: si contara, la clienta que ya se hizo su retoque volvería a
// aparecer pidiendo "otro retoque", lo cual no corresponde.
function isRetoqueAppt(a){
  return (a.services||[]).some(s=>/retoque/i.test(s||''));
}
// Si la clienta ya tiene una cita posterior a la sesión inicial (no cancelada),
// ya no hace falta avisarle: significa que ya volvió o que ya está agendada.
function touchupCandidates(){
  const today = new Date(); today.setHours(0,0,0,0);
  const minDate = addDays(today, -45);
  const maxDate = addDays(today, -30);
  const byClient = new Map();
  state.appointments.forEach(a=>{
    if(a.estado!=='Realizada' || !a.client) return;
    if(isRetoqueAppt(a)) return; // ya es un retoque, no una sesión inicial
    const dt = parseKey(a.date);
    if(dt < minDate || dt > maxDate) return;
    const key = normalizeName(a.client);
    const prev = byClient.get(key);
    if(!prev || a.date > prev.date) byClient.set(key, a);
  });
  const hasLaterAppt = a=>{
    const key = normalizeName(a.client);
    return state.appointments.some(o=>
      o.id!==a.id && normalizeName(o.client)===key &&
      o.estado!=='Cancelada' && o.date > a.date
    );
  };
  return Array.from(byClient.values())
    .filter(a=>!hasLaterAppt(a))
    .map(a=>({appt:a, diffDays: Math.round((today - parseKey(a.date)) / 86400000)}))
    .sort((x,y)=>x.diffDays - y.diffDays);
}

Ya pasaron unas semanas desde tu sesión de ${svc} y este es justo el momento ideal para hacerte el retoque y dejar el resultado perfecto ✨

function exportMonthCSV(){
  const year = ui.currentDate.getFullYear();
  const month = ui.currentDate.getMonth();
  const monthAppts = state.appointments
    .filter(a=>{ const dt = parseKey(a.date); return dt.getFullYear()===year && dt.getMonth()===month; })
    .sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));

  if(!monthAppts.length){
    showAlert('No hay citas registradas en ' + MONTHS[month] + ' de ' + year + ' para exportar.');
    return;
  }

  const headers = ['Fecha','Hora inicio','Hora fin','Cliente','Teléfono','Servicio','Especialista','Estado','Precio','Abono','Método abono','Saldo','Método saldo','Notas'];
  const estadoLabels = {Pendiente:'Pendiente',Confirmada:'Confirmada',Realizada:'Realizada',Cancelada:'Cancelada',NoShow:'No se presentó'};
  const csvEscape = v=>{
    const s = (v==null?'':v).toString();
    return '"' + s.replace(/"/g,'""') + '"';
  };
  const lines = [headers.map(csvEscape).join(';')];
  monthAppts.forEach(a=>{
    lines.push([
      a.date, a.start, a.end, a.client, a.phone, summarizeServices(a.services||[]), a.specialist,
      estadoLabels[a.estado]||a.estado, a.price, a.abono,
      a.abonoPrevio ? 'Abono previo (ya pagado antes, no es plata nueva)' : paymentMethodSummary(a.metodoAbono, Number(a.abono)||0, a.metodoAbono2, a.montoAbono2),
      a.saldo,
      paymentMethodSummary(a.metodoSaldo, Number(a.saldo)||0, a.metodoSaldo2, a.montoSaldo2),
      a.notas
    ].map(csvEscape).join(';'));
  });
  const csvContent = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `Sibana-Santiago-${MONTHS[month]}-${year}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

function onAction(e){
  const act = e.currentTarget.dataset.act;
  if(act !== 'toggle-menu') ui.menuOpen = false;
  if(ui.mode!=='admin' && ADMIN_ONLY_ACTIONS.has(act)) return; // protección extra, además de ocultar los botones
  switch(act){
    case 'toggle-mode': {
      if(ui.mode==='admin'){
        ui.mode = 'staff';
        ui.modal = null;
        render();
      } else {
        const pass = state.settings.adminPassword || '';
        if(!pass){
          ui.mode = 'admin';
          render();
          showAlert('Entraste en modo administrador. Todavía no has configurado una contraseña — hazlo en Más → Seguridad para que no cualquiera pueda entrar aquí.');
        } else {
          showPrompt('Ingresa la contraseña de administrador:', (val)=>{
            if(val === pass){
              ui.mode = 'admin';
              safeSetLocal(ADMIN_TRUST_KEY, '1'); // este dispositivo queda como admin para siempre, sin volver a pedir contraseña
              render();
            } else {
              showAlert('Contraseña incorrecta.');
            }
          });
        }
      }
      break;
    }
    case 'prev':
      ui.currentDate = ui.view==='day' ? addDays(ui.currentDate,-1) : ui.view==='week' ? addDays(ui.currentDate,-7) : addMonths(ui.currentDate,-1);
      render(); break;
    case 'next':
      ui.currentDate = ui.view==='day' ? addDays(ui.currentDate,1) : ui.view==='week' ? addDays(ui.currentDate,7) : addMonths(ui.currentDate,1);
      render(); break;
    case 'today':
      ui.currentDate = new Date(); render(); break;
    case 'view-day':
      ui.view='day'; render(); break;
    case 'view-week':
      ui.view='week'; render(); break;
    case 'view-month':
      ui.view='month'; render(); break;
    case 'goto-day':
      ui.currentDate = parseKey(e.currentTarget.dataset.date);
      ui.view='day'; render(); break;
    case 'toggle-menu':
      ui.menuOpen = !ui.menuOpen; render(); break;
    case 'filter-specialist':
      ui.specialistFilter = e.currentTarget.dataset.spec; render(); break;
    case 'new-appt':
      ui.modal = {type:'appt', mode:'new', data: blankAppt()};
      render(); break;
    case 'new-appt-at':
      ui.modal = {type:'appt', mode:'new', data: blankAppt(Number(e.currentTarget.dataset.hour))};
      render(); break;
    case 'new-block':
      ui.modal = {type:'block', mode:'new', data: blankBlock()};
      render(); break;
    case 'new-block-at':
      ui.modal = {type:'block', mode:'new', data: blankBlock(Number(e.currentTarget.dataset.hour))};
      render(); break;
    case 'edit-block': {
      const id = e.currentTarget.dataset.id;
      const found = (state.blocks||[]).find(b=>b.id===id);
      if(found){ ui.modal = {type:'block', mode:'edit', data: Object.assign({}, found)}; render(); }
      break;
    }
    case 'toggle-split': {
      const target = e.currentTarget.dataset.target; // 'abono' | 'saldo'
      const box = document.getElementById(`split-${target}`);
      const monto1 = document.getElementById(target==='abono' ? 'f-montoAbono1' : 'f-montoSaldo1');
      const totalInput = document.getElementById(target==='abono' ? 'f-abono' : 'f-saldo');

      if(box){
        const showing = box.style.display !== 'none';
        box.style.display = showing ? 'none' : 'flex';
        if(monto1) monto1.style.display = showing ? 'none' : 'block';
        if(showing){
          // al ocultar, se quita la división: vuelve a ser un solo monto editable
          const monto2 = document.getElementById(target==='abono' ? 'f-montoAbono2' : 'f-montoSaldo2');
          if(monto2) monto2.value = 0;
          if(totalInput) totalInput.removeAttribute('readonly');
          if(totalField){ const lbl = totalField.querySelector('label'); if(lbl){ lbl.textContent = target==='abono'?'Abono':'Saldo'; lbl.removeAttribute('style'); } }
        } else {
          // al activar, el monto 1 arranca en lo que ya había como total, y el
          // total pasa a ser de solo lectura (se calcula solo entre los dos montos)
          if(monto1 && totalInput) monto1.value = totalInput.value;
          if(totalInput) totalInput.setAttribute('readonly','readonly');
          if(totalField){ const lbl = totalField.querySelector('label'); if(lbl){ lbl.textContent = (target==='abono'?'Abono':'Saldo') + ' (suma automática)'; lbl.style.opacity='.7'; } }
        }
      }
      break;
    }
    case 'view-consent': {
      const clientName = e.currentTarget.dataset.client || '';
      const apptId = e.currentTarget.dataset.apptId || '';
      const knownConsentId = e.currentTarget.dataset.consentId || '';
      viewConsent(clientName, apptId, knownConsentId);
      break;
    }
    case 'edit-appt': {
      const id = e.currentTarget.dataset.id;
      const found = state.appointments.find(a=>a.id===id);
      if(found) {
        const data = Object.assign({}, found);
        if(!Array.isArray(data.services)) data.services = data.service ? [data.service] : [];
        ui.modal = {type:'appt', mode:'edit', data};
        render();
      }
      break;
    }
    case 'open-services':
      ui.modal = {type:'services'};
      render(); break;
    case 'open-specialists':
      ui.modal = {type:'specialists'};
      render(); break;
    case 'open-schedule':
      ui.modal = {type:'schedule'};
      render(); break;
    case 'open-security':
      ui.modal = {type:'security'};
      render(); break;
    case 'open-noshows':
      ui.modal = {type:'noshows'};
      render(); break;
    case 'open-clients':
      ui.modal = {type:'clients'};
      render(); break;
    case 'toggle-client': {
      const key = e.currentTarget.dataset.key;
      if(ui.expandedClients.has(key)) ui.expandedClients.delete(key); else ui.expandedClients.add(key);
      render(); break;
    }
    case 'delete-client': {
      const key = e.currentTarget.dataset.key;
      const c = getClientStats().find(c=>normalizeName(c.name)===key);
      const label = c ? c.name : 'este cliente';
      showConfirmDialog(`¿Eliminar a ${label}? Esto borra también su historial de ${c?c.count:0} cita${c&&c.count===1?'':'s'}. No se puede deshacer.`, ()=>{
        state.clients = state.clients.filter(cl=>normalizeName(cl.name)!==key);
        state.appointments = state.appointments.filter(a=>normalizeName(a.client)!==key);
        ui.expandedClients.delete(key);
        render();
        saveData();
      });
      break;
    }
    case 'export-csv':
      exportMonthCSV(); break;
    case 'download-backup':
      downloadFullBackup(); break;
    case 'sync-all-backup':
      runFullBackupSync(); break;
    case 'open-search':
      ui.modal = {type:'search'}; render(); break;
    case 'open-reminders':
      ui.modal = {type:'reminders'}; ui.menuOpen = false; render(); break;
    case 'open-touchups':
      ui.modal = {type:'touchups'}; ui.menuOpen = false; render(); break;
    case 'copy-touchup-msg': {
      const box = document.getElementById('touchup-generic-msg');
      const text = box ? box.value : genericTouchupMsg();
      copyToClipboard(text).then(()=>showAlert('Mensaje copiado ✅ Ya lo puedes pegar en WhatsApp.'));
      break;
    }
    case 'toggle-touchup-avisado': {
      const id = e.currentTarget.dataset.id;
      const appt = state.appointments.find(a=>a.id===id);
      if(appt){ appt.retoqueAvisado = e.currentTarget.checked; saveData(); }
      render(); break;
    }
    case 'open-reviews':
      ui.modal = {type:'reviews'}; ui.menuOpen = false; render(); break;
    case 'copy-review-msg': {
      const box = document.getElementById('review-generic-msg');
      const text = box ? box.value : genericReviewMsg();
      copyToClipboard(text).then(()=>showAlert('Mensaje copiado ✅ Ya lo puedes pegar en WhatsApp.'));
      break;
    }
    case 'toggle-review-avisado': {
      const id = e.currentTarget.dataset.id;
      const appt = state.appointments.find(a=>a.id===id);
      if(appt){ appt.reviewAvisada = e.currentTarget.checked; saveData(); }
      render(); break;
    }
    case 'goto-section':
      ui.section = e.currentTarget.dataset.section;
      if(ui.section==='finanzas' && !ui.reportsDate) ui.reportsDate = new Date();
      render(); break;
    case 'finance-tab':
      ui.financeTab = e.currentTarget.dataset.tab; render(); break;
    case 'reports-prev-month':
      ui.reportsDate = addMonths(ui.reportsDate||new Date(), -1); render(); break;
    case 'reports-next-month':
      ui.reportsDate = addMonths(ui.reportsDate||new Date(), 1); render(); break;
    case 'save-comision-pct': {
      const input = document.getElementById('f-comision-pct');
      const pct = Math.max(0, Math.min(100, Number(input && input.value) || 0));
      state.settings.comisionPct = pct/100;
      render(); saveData();
      break;
    }
    case 'add-recurring-expense':
      state.recurringExpenses.push({id:uid(), categoria:'Nuevo gasto fijo', monto:0, diaPago:5, metodoPago:''});
      render();
      break;
    case 'remove-recurring-expense': {
      const idx = Number(e.currentTarget.dataset.idx);
      showConfirmDialog('¿Eliminar este gasto fijo recurrente? Dejará de sumarse todos los meses.', ()=>{
        state.recurringExpenses.splice(idx,1);
        render(); saveData();
      });
      break;
    }
    case 'save-recurring-expenses':
      saveRecurringExpensesFromForm(); break;
    case 'add-recurring-income':
      state.recurringIncomes.push({id:uid(), categoria:'Nuevo ingreso fijo', monto:0, metodoPago:''});
      render();
      break;
    case 'remove-recurring-income': {
      const idx = Number(e.currentTarget.dataset.idx);
      showConfirmDialog('¿Eliminar este ingreso fijo recurrente? Dejará de sumarse todas las semanas.', ()=>{
        state.recurringIncomes.splice(idx,1);
        render(); saveData();
      });
      break;
    }
    case 'save-recurring-incomes':
      saveRecurringIncomesFromForm(); break;
    case 'add-expense': {
      const tipo = e.currentTarget.dataset.tipo;
      if(!ui.reportsDate) ui.reportsDate = new Date();
      const year = ui.reportsDate.getFullYear(), month = ui.reportsDate.getMonth();
      const cats = tipo==='Fijo' ? EXPENSE_CATEGORIES_FIJO : EXPENSE_CATEGORIES_VARIABLE;
      state.expenses.push({
        id: uid(),
        date: toKey(new Date(year, month, Math.min(new Date().getDate(), daysInMonth(year,month)))),
        tipo, categoria: cats[0], descripcion:'', monto:0, metodoPago: PAYMENT_METHODS[0],
      });
      render();
      break;
    }
    case 'remove-expense': {
      const idx = Number(e.currentTarget.dataset.idx);
      showConfirmDialog('¿Eliminar este gasto?', ()=>{
        state.expenses.splice(idx,1);
        render(); saveData();
      });
      break;
    }
    case 'save-expenses':
      saveExpensesFromForm(); break;
    case 'add-stock-item': {
      const categoria = e.currentTarget.dataset.categoria;
      state.stockItems.push({id:uid(), categoria, name:'', valor:0, umbral:0, actualizadoEn:''});
      render();
      break;
    }
    case 'remove-stock-item': {
      const idx = Number(e.currentTarget.dataset.idx);
      showConfirmDialog('¿Eliminar este ítem del stock?', ()=>{
        state.stockItems.splice(idx,1);
        render(); saveData();
      });
      break;
    }
    case 'save-stock':
      saveStockFromForm(); break;
    case 'close-modal':
    case 'overlay-close':
      ui.modal = null; render(); break;
    case 'save-appt':
      saveApptFromForm(); break;
    case 'delete-appt': {
      const id = e.currentTarget.dataset.id;
      showConfirmDialog('¿Eliminar esta cita? Esta acción no se puede deshacer.', ()=>{
        const deleted = state.appointments.find(a=>a.id===id);
        state.appointments = state.appointments.filter(a=>a.id!==id);
        ui.modal = null; render(); saveData();
        if(deleted) syncToBackupWebhook('delete', deleted);
      });
      break;
    }
    case 'save-block':
      saveBlockFromForm(); break;
    case 'delete-block': {
      const id = e.currentTarget.dataset.id;
      showConfirmDialog('¿Quitar este bloqueo de horario?', ()=>{
        state.blocks = (state.blocks||[]).filter(b=>b.id!==id);
        ui.modal = null; render(); saveData();
      });
      break;
    }
    case 'add-service':
      state.services.push({name:'Nuevo servicio', price:0, duration:60});
      render(); break;
    case 'remove-service': {
      const idx = Number(e.currentTarget.dataset.idx);
      showConfirmDialog('¿Eliminar este servicio del tarifario?', ()=>{
        state.services.splice(idx,1);
        render();
      });
      break;
    }
    case 'save-services':
      saveServicesFromForm(); break;
    case 'add-specialist':
      state.specialists.push({id:uid(), name:'Nueva especialista', color:'#5AA9E6'});
      render(); break;
    case 'remove-specialist': {
      const idx = Number(e.currentTarget.dataset.idx);
      showConfirmDialog('¿Eliminar esta especialista de la lista? Las citas ya agendadas conservarán su nombre como texto.', ()=>{
        state.specialists.splice(idx,1);
        render();
      });
      break;
    }
    case 'save-specialists':
      saveSpecialistsFromForm(); break;
    case 'toggle-day-closed': {
      const day = Number(e.currentTarget.dataset.day);
      if(!state.settings.hours) state.settings.hours = {};
      if(state.settings.hours[day]){
        state.settings.hours[day] = null; // marcar cerrado
      } else {
        state.settings.hours[day] = {open:10, close:20}; // reabrir con un horario por defecto, editable
      }
      render(); break;
    }
    case 'save-schedule':
      saveScheduleFromForm(); break;
    case 'save-security': {
      const val = document.getElementById('f-adminpass').value.trim();
      state.settings.adminPassword = val;
      ui.modal = null;
      render();
      saveData();
      break;
    }
    case 'forget-device': {
      safeRemoveLocal(ADMIN_TRUST_KEY);
      ui.mode = 'staff';
      ui.modal = null;
      render();
      break;
    }
  }
}

function saveApptFromForm(){
  const d = ui.modal.data;
  const get = id=>document.getElementById(id).value;
  const services = getServiceQuantities().flatMap(({idx,qty})=>{
    const svc = state.services[idx];
    return svc ? Array(qty).fill(svc.name) : [];
  });
  const updated = {
    ...d,
    date: get('f-date'), start: get('f-start'), end: get('f-end'),
    client: get('f-client').trim(), phone: get('f-phone').trim(),
    services, specialist: get('f-specialist'),
    estado: get('f-estado'),
    price: Number(get('f-price'))||0, abono: Number(get('f-abono'))||0,
    metodoAbono: get('f-metodoAbono'), saldo: Number(get('f-saldo'))||0,
    metodoSaldo: get('f-metodoSaldo'), notas: get('f-notas'),
    metodoAbono2: get('f-metodoAbono2'), montoAbono2: Number(get('f-montoAbono2'))||0,
    metodoSaldo2: get('f-metodoSaldo2'), montoSaldo2: Number(get('f-montoSaldo2'))||0,
    cremaComprada: !!(document.getElementById('f-crema') && document.getElementById('f-crema').checked),
    abonoPrevio: !!(document.getElementById('f-abonoPrevio') && document.getElementById('f-abonoPrevio').checked),
  };
  delete updated.service;
  if(!updated.client){ showAlert('Ingresa el nombre del cliente.'); return; }
  if(!updated.services.length){ showAlert('Elige al menos un servicio.'); return; }
  if(updated.end <= updated.start){ showAlert('La hora de fin debe ser posterior a la hora de inicio.'); return; }

  const commit = ()=>{
    const idx = state.appointments.findIndex(a=>a.id===updated.id);
    if(idx>=0) state.appointments[idx] = updated; else state.appointments.push(updated);
    upsertClient(updated.client, updated.phone, summarizeServices(updated.services));
    ui.modal = null;
    render();
    saveData();
    syncToBackupWebhook('save', updated);
  };

  const overlapping = findOverlappingAppt(updated);
  const afterOverlapCheck = ()=>{
    const coveringBlock = findCoveringBlock(parseKey(updated.date), updated.start, updated.end, updated.specialist);
    if(coveringBlock){
      const suffix = coveringBlock.specialist===ALL_SPECIALISTS_VALUE ? 'Elige otra hora.' : 'Elige otra hora, u otra especialista disponible.';
      showAlert(`${blockSpecialistLabel(coveringBlock.specialist)} bloqueó ese horario (${coveringBlock.start}–${coveringBlock.end}${coveringBlock.reason?': '+coveringBlock.reason:''}). ${suffix}`);
      return;
    }
    if(apptFallsInBlockedTime(parseKey(updated.date), updated.start, updated.end)){
      showConfirmDialog('Este horario cae fuera de la atención habitual (cerrado o en horario de almuerzo). ¿Agendar de todas formas?', commit);
    } else {
      commit();
    }
  };

  if(overlapping){
    showConfirmDialog(`Ya hay una cita de ${overlapping.start} a ${overlapping.end} (${overlapping.client||'sin nombre'}) en ese horario. Como solo hay un box, lo normal es no agendar dos citas al mismo tiempo. ¿Quieres agendarla igual?`, afterOverlapCheck);
    return;
  }

  afterOverlapCheck();
}

function saveBlockFromForm(){
  const d = ui.modal.data;
  const get = id=>document.getElementById(id).value;
  const updated = {
    ...d,
    date: get('f-block-date'), start: get('f-block-start'), end: get('f-block-end'),
    specialist: get('f-block-specialist'), reason: get('f-block-reason').trim(),
  };
  if(!updated.specialist){ showAlert('Elige qué especialista bloquea ese horario.'); return; }
  if(updated.end <= updated.start){ showAlert('La hora de fin debe ser posterior a la hora de inicio.'); return; }

  const commit = ()=>{
    const idx = (state.blocks||[]).findIndex(b=>b.id===updated.id);
    if(!state.blocks) state.blocks = [];
    if(idx>=0) state.blocks[idx] = updated; else state.blocks.push(updated);
    ui.modal = null;
    render();
    saveData();
  };

  const clashing = state.appointments.find(a=>
    a.date===updated.date && a.estado!=='Cancelada' && a.estado!=='NoShow' &&
    (updated.specialist===ALL_SPECIALISTS_VALUE || normalizeName(a.specialist)===normalizeName(updated.specialist)) &&
    minutesFromMidnight(a.start) < minutesFromMidnight(updated.end) &&
    minutesFromMidnight(updated.start) < minutesFromMidnight(a.end)
  );
  if(clashing){
    const who = updated.specialist===ALL_SPECIALISTS_VALUE ? `Ya hay al menos una cita agendada (${clashing.client||'sin nombre'}, de ${clashing.start} a ${clashing.end})` : `${blockSpecialistLabel(updated.specialist)} ya tiene una cita agendada de ${clashing.start} a ${clashing.end} (${clashing.client||'sin nombre'})`;
    showConfirmDialog(`${who} en ese horario. ¿Bloquear igual? (la cita queda tal cual, solo quedará marcado el choque)`, commit);
  } else {
    commit();
  }
}

function saveServicesFromForm(){
  document.querySelectorAll('[data-svc-name]').forEach(inp=>{
    const i = Number(inp.dataset.svcName);
    if(state.services[i]) state.services[i].name = inp.value;
  });
  document.querySelectorAll('[data-svc-price]').forEach(inp=>{
    const i = Number(inp.dataset.svcPrice);
    if(state.services[i]) state.services[i].price = Number(inp.value)||0;
  });
  document.querySelectorAll('[data-svc-duration]').forEach(inp=>{
    const i = Number(inp.dataset.svcDuration);
    if(state.services[i]) state.services[i].duration = Number(inp.value)||60;
  });
  ui.modal = null;
  render();
  saveData();
}

function saveSpecialistsFromForm(){
  document.querySelectorAll('[data-spec-name]').forEach(inp=>{
    const i = Number(inp.dataset.specName);
    if(state.specialists[i]) state.specialists[i].name = inp.value.trim() || state.specialists[i].name;
  });
  document.querySelectorAll('[data-spec-color]').forEach(inp=>{
    const i = Number(inp.dataset.specColor);
    if(state.specialists[i]) state.specialists[i].color = inp.value;
  });
  ui.modal = null;
  render();
  saveData();
}

function saveScheduleFromForm(){
  if(!state.settings.hours) state.settings.hours = {};
  for(let day=0; day<=6; day++){
    const openSel = document.querySelector(`[data-day-open="${day}"]`);
    const closeSel = document.querySelector(`[data-day-close="${day}"]`);
    if(openSel && closeSel){
      state.settings.hours[day] = { open: Number(openSel.value), close: Number(closeSel.value) };
    }
    // si el día está marcado como cerrado no hay <select>, y state.settings.hours[day] ya quedó en null
    // desde el botón "toggle-day-closed" — no hace falta tocarlo aquí.
  }
  state.settings.lunchStart = document.getElementById('f-lunchStart').value;
  state.settings.lunchEnd = document.getElementById('f-lunchEnd').value;
  ui.modal = null;
  render();
  saveData();
}

// auto-fill precio/saldo/hora fin cuando cambia el servicio u la hora de inicio,
// y autocompletado de cliente mientras se escribe — delegados en document
// para que sigan funcionando después de cada render() del modal.
// auto-fill precio/saldo/hora fin cuando cambian los servicios elegidos u la hora
// de inicio, y autocompletado de cliente mientras se escribe — delegados en
// document para que sigan funcionando después de cada render() del modal.
document.addEventListener('change', e=>{
  if(e.target && e.target.id==='f-crema'){
    recomputeServiceFields();
  }
  if(e.target && e.target.id==='f-start'){
    const endInput = document.getElementById('f-end');
    if(endInput && e.target.value){
      endInput.value = addMinutesToHHMM(e.target.value, getTotalDuration());
    }
  }
  if(e.target && e.target.id==='f-abono'){
    const priceInput = document.getElementById('f-price');
    const saldoInput = document.getElementById('f-saldo');
    if(priceInput && saldoInput){
      saldoInput.value = Math.max((Number(priceInput.value)||0) - (Number(e.target.value)||0), 0);
    }
  }
  if(e.target && e.target.id==='f-price'){
    const abonoInput = document.getElementById('f-abono');
    const saldoInput = document.getElementById('f-saldo');
    if(abonoInput && saldoInput){
      saldoInput.value = Math.max((Number(e.target.value)||0) - (Number(abonoInput.value)||0), 0);
    }
  }
  if(e.target && e.target.id==='f-abonoPrevio'){
    const box = document.getElementById('field-metodo-abono');
    if(box) box.style.display = e.target.checked ? 'none' : 'block';
  }
});

document.addEventListener('input', e=>{
  if(e.target && e.target.id==='f-client'){
    renderClientSuggestions(e.target.value);
  }
  if(e.target && e.target.id==='client-search'){
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.client-row').forEach(row=>{
      row.style.display = (row.dataset.clientName||'').includes(q) ? '' : 'none';
    });
  }
  if(e.target && e.target.id==='appt-search-input'){
    const results = document.getElementById('appt-search-results');
    if(results) results.innerHTML = renderApptSearchResults(e.target.value);
  }
  if(e.target && (e.target.id==='f-montoAbono1' || e.target.id==='f-montoAbono2')){
    const m1 = document.getElementById('f-montoAbono1');
    const m2 = document.getElementById('f-montoAbono2');
    const abonoInput = document.getElementById('f-abono');
    const priceInput = document.getElementById('f-price');
    const saldoInput = document.getElementById('f-saldo');
    const splitSaldoBox = document.getElementById('split-saldo');
    const saldoIsSplit = splitSaldoBox && splitSaldoBox.style.display !== 'none';
    if(abonoInput){
      abonoInput.value = (Number(m1&&m1.value)||0) + (Number(m2&&m2.value)||0);
      if(priceInput && saldoInput && !saldoIsSplit){
        saldoInput.value = Math.max((Number(priceInput.value)||0) - (Number(abonoInput.value)||0), 0);
      }
    }
  }
  if(e.target && (e.target.id==='f-montoSaldo1' || e.target.id==='f-montoSaldo2')){
    const m1 = document.getElementById('f-montoSaldo1');
    const m2 = document.getElementById('f-montoSaldo2');
    const saldoInput = document.getElementById('f-saldo');
    if(saldoInput){
      saldoInput.value = (Number(m1&&m1.value)||0) + (Number(m2&&m2.value)||0);
    }
  }
});
document.addEventListener('focusin', e=>{
  if(e.target && e.target.id==='f-client' && e.target.value){
    renderClientSuggestions(e.target.value);
  }
});
document.addEventListener('focusout', e=>{
  if(e.target && e.target.id==='f-client'){
    setTimeout(()=>{ const box=document.getElementById('client-ac'); if(box) box.style.display='none'; }, 150);
  }
});
document.addEventListener('mousedown', e=>{
  const item = e.target.closest && e.target.closest('.ac-item');
  if(!item) return;
  e.preventDefault();
  const nameInput = document.getElementById('f-client');
  const phoneInput = document.getElementById('f-phone');
  if(nameInput) nameInput.value = item.dataset.name;
  if(phoneInput && item.dataset.phone) phoneInput.value = item.dataset.phone;
  const box = document.getElementById('client-ac');
  if(box){ box.style.display='none'; box.innerHTML=''; }
});

startRealtimeSync();
</script>
