<script>
// Modo claro (rediseño oct 2026): se aplica ANTES de pintar, así no hay un
// destello oscuro al abrir. La preferencia es de cada aparato (sibanaTema).
try{ if(localStorage.getItem('sibanaTema')==='claro') document.documentElement.dataset.tema='claro'; }catch(e){}

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Agenda Sibana">
<script>
(function(){
  // Reusa el mismo ícono que ya está puesto como favicon, para no repetir la
  // imagen otra vez en el archivo.
  var iconHref = document.querySelector('link[rel="icon"]').href;
  // Nombre con que se instala: el de la última sede con que se entró en este
  // aparato (aplicarCuenta lo guarda en 'sibanaUltimaSede'). Un teléfono
  // nuevo (todavía sin entrar) ve "Agenda Sibana": antes veía "Sibana
  // Santiago" aunque fuera de Buenos Aires (12/10/2026, pantalla de instalar).
  var NOMBRES_SEDE = {santiago: "Sibana Santiago - Agenda", buenosaires: "Sibana Buenos Aires - Agenda", vina: "Sibana Viña del Mar - Agenda"};
  var ultimaSede = null;
  try{ ultimaSede = localStorage.getItem('sibanaUltimaSede'); }catch(e){}
  var manifest = {
    name: NOMBRES_SEDE[ultimaSede] || "Agenda Sibana",
    short_name: "Agenda Sibana",
    start_url: ".",
    display: "standalone",
    background_color: "#100d09",
    theme_color: "#100d09",
    icons: [
      {src: iconHref, sizes: "200x200", type: "image/png", purpose: "any maskable"}
    ]
  };
  var blob = new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"});
  var manifestLink = document.createElement("link");
  manifestLink.rel = "manifest";
  manifestLink.href = URL.createObjectURL(blob);
  document.head.appendChild(manifestLink);
  // Al entrar ya se sabe la sede (Santiago / Buenos Aires): se ajusta el
  // nombre con que se instala la app en el teléfono.
  window.__manifestNombreInicial = manifest.name;
  window.__setManifestName = function(name){
    if(manifest.name === name) return;
    manifest.name = name;
    manifestLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"}));
  };

  var appleIcon = document.createElement("link");
  appleIcon.rel = "apple-touch-icon";
  appleIcon.href = iconHref;
  document.head.appendChild(appleIcon);
})();

  .appt .t-time{font-size:11px;line-height:13px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;}
  .appt .spec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1.5px color-mix(in oklab,var(--ink) 55%,transparent);}
  .appt .t-name{font-size:13px;line-height:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .appt .t-service{font:italic 500 14px/15px var(--head);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .appt.sin-serv .t-service{display:none;}
  .appt.apretada{display:flex;align-items:flex-start;gap:6px;}
  .appt.apretada .t-time{flex-shrink:0;}
  .appt.apretada .t-name{min-width:0;flex:1;}
  .appt.compact{display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;overflow:hidden;}
  .appt.compact .t-time{flex-shrink:0;}
  .appt.compact .t-name-compact{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .appt.block-appt{background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--danger) 12%,transparent) 0 7px,color-mix(in oklab,var(--danger) 4%,transparent) 7px 14px),var(--bg-2);border:1px dashed color-mix(in oklab,var(--danger) 50%,transparent);border-left:4px solid var(--danger);color:var(--bloq-ink);}
  .block-appt .t-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .appt.curso-block{--st:var(--curso);}
  .curso-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;}
  .curso-row:last-child{border-bottom:none;}
  .curso-row .cr-name{font-weight:600;}
  .curso-row .cr-rut{color:var(--ink-soft);font-size:12px;}
  .curso-row .cr-right{text-align:right;font-size:12.5px;color:var(--ink-soft);}
  .day-banners{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;}
  .day-banner{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:10px 12px;border-radius:10px;background:color-mix(in oklab,var(--danger) 12%,transparent);border:1px solid color-mix(in oklab,var(--danger) 35%,transparent);border-left:6px solid var(--danger);cursor:pointer;}
  .appt.ghost-appt{background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--canc) 42%,transparent) 0 8px,color-mix(in oklab,var(--canc) 20%,transparent) 8px 16px);border:1.5px dashed var(--ink-soft);border-left:7px dashed var(--ink-soft);color:var(--ink);box-shadow:none;opacity:.88;}
  .appt.ghost-appt .t-name{opacity:.85;}
  .ghost-tag{background:var(--badge-bg);color:var(--badge-ink);font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap;}
  .day-banner .db-who{font-weight:700;font-size:13.5px;color:var(--ink);}
  .day-banner .db-when{font-size:12.5px;color:var(--ink-soft);}
  .wd-block,.mc-block{font-size:11px;color:var(--bloq-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
  .bk-item{display:inline-flex;align-items:center;gap:3px;min-width:0;}
  .bk-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .bk-name{overflow:hidden;text-overflow:ellipsis;}
  @media (max-width:600px){ .mc-block .bk-name{display:none;} .wd-block{flex-direction:column;align-items:flex-start;} }
  .reloj-bloqueo{display:flex;align-items:center;gap:8px;}
  .reloj-bloqueo b{font-size:20px;}
  .reloj-casilla{flex:1;min-width:78px;display:flex;align-items:center;justify-content:space-between;gap:6px;font:inherit;font-size:18px;
    padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer;}
  .reloj-casilla::after{content:'▾';font-size:14px;color:var(--gold-soft);}
  .reloj-casilla.abierta{border-color:var(--wine);box-shadow:0 0 0 1px var(--wine);}
  .reloj-opciones{margin-top:8px;padding:10px;background:var(--panel);border:1px solid var(--wine);border-radius:12px;}
  .reloj-opciones .reloj-titulo{font-size:12px;color:var(--ink-soft);margin:0 0 8px 2px;}
  .reloj-grilla{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .reloj-op{font:inherit;font-size:18px;padding:10px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;}
  .reloj-op.on{background:var(--gold-fill);border-color:var(--gold);color:var(--on-accent);font-weight:700;}
  .bloqueo-quien{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-weight:600;}
  .block-kind{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;}
  .block-kind label{flex:1;text-align:center;padding:9px 4px;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .block-kind input{display:none;}
  .block-kind label.on{background:var(--gold-fill);color:var(--on-accent);font-weight:700;}
  .personas-badge{background:var(--badge-bg);color:var(--badge-ink);font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;flex-shrink:0;white-space:nowrap;margin-left:4px;}
  .firma-badge{background:var(--badge-bg);color:var(--badge-ink);font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;flex-shrink:1;min-width:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* En una ficha angosta (varias citas a la misma hora, sobre todo en el
     teléfono) la etiqueta no cabe: se cambia por un ✍️ en la esquina. */
  #f-specialist option:disabled{color:var(--ink-soft);opacity:.6;}
  .firma-esquina{display:none;position:absolute;bottom:3px;right:3px;font-size:11px;line-height:1;padding:1px 3px;border-radius:999px;background:var(--badge-bg);z-index:1;}
  /* El ✍️ va abajo a la derecha (arriba le quitaba el lugar a "Sin abono") */
  @container (max-width:170px){ .firma-badge{display:none;} .firma-esquina{display:block;} .appt.con-firma .t-name,.appt.con-firma .t-service,.appt.con-firma .t-name-compact{padding-right:20px;} }
  .linea-ahora{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--danger);z-index:5;pointer-events:none;}
  .linea-ahora::before{content:'';position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger);}
  .linea-ahora-hora{position:absolute;right:6px;top:-9px;font-size:11px;font-weight:700;line-height:1;padding:2px 5px;border-radius:999px;background:var(--danger);color:#fff;}
  .resumen-dia{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;}
  .rd-titulo{font-weight:700;font-size:13px;color:var(--ink);margin-right:2px;}
  .rd-chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);white-space:nowrap;}
  .rd-chip b{color:var(--ink);}
  .rd-chip.rd-ojo{color:var(--ink);}
  .firma-aviso{font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:8px;border:1px dashed var(--ink-soft);margin:0 0 10px;}
  .reprog-badge{background:var(--badge-bg);color:var(--badge-ink);font-size:11px;font-weight:700;padding:1px 5px;border-radius:999px;flex-shrink:0;white-space:nowrap;}
  .reprog-panel{border:1px solid var(--line);border-radius:10px;padding:12px;margin:-4px 0 14px;}
  .reprog-hist b{display:block;margin-bottom:2px;}
  /* "Sin abono": siempre visible. Ficha angosta: solo la hora de inicio, para
     dejarle lugar; muy angosta: queda el ícono. */
  .no-abono-badge{display:inline-flex;align-items:center;gap:3px;background:var(--warn-ink);color:var(--on-accent);font-size:11px;line-height:13px;font-weight:700;padding:1px 7px;border-radius:999px;flex-shrink:0;white-space:nowrap;}
  .no-abono-badge .ico{display:none;width:12px;height:12px;stroke-width:2.4;}
  @container (max-width:185px){ .appt .fin{display:none;} }
  .appt.angosta .fin{display:none;}
  .appt.angosta .no-abono-badge{padding:2px;} .appt.angosta .no-abono-badge .ico{display:block;}
  .appt.angosta .no-abono-badge .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  .appt.muy-angosta .no-abono-badge{position:absolute;top:3px;right:3px;z-index:1;}
  .cobrar-box{background:color-mix(in oklab,var(--wine) 12%,transparent);border:1px solid color-mix(in oklab,var(--wine) 35%,transparent);border-radius:10px;padding:10px 14px;margin:2px 0 16px;}
  .cobrar-box label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
  .cobrar-box .cobrar-amount{font-family:var(--head);font-size:34px;line-height:1.1;font-weight:700;color:var(--gold);}
  .cobrar-box .cobrar-hint{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.35;}
  .appt.st-Pendiente{--st:var(--pending);--st-pct:62%;} /* más vivo: si no, se parece al gris de Cancelada */
  .appt.st-Confirmada{--st:var(--wine);}
  .appt.st-Realizada{--st:var(--ok);}
  .appt.st-Cancelada{--st:var(--canc);} .appt.st-Cancelada:not(.block-appt) .t-name,.appt.st-Cancelada:not(.block-appt) .t-name-compact{text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--ink) 45%,transparent);color:var(--ink-soft);}
  .appt.st-NoShow{--st:var(--danger);}
  .status-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 24px 12px;font-size:12px;color:var(--mute);}
  .legend-item{display:inline-flex;align-items:center;gap:6px;}
  /* El circulito de la leyenda se pinta IGUAL que la cita (mismo tinte sobre el
     mismo fondo y mismo borde), para que se reconozca de un vistazo. */
  .legend-dot{width:11px;height:11px;border-radius:50%;display:inline-block;--st-pct:50%;
    background:linear-gradient(0deg,color-mix(in oklab,var(--st) var(--st-pct),transparent),color-mix(in oklab,var(--st) var(--st-pct),transparent)),var(--panel-2);
    border:1px solid color-mix(in oklab,var(--st) 85%,transparent);}
  .legend-dot.st-Pendiente{--st:var(--pending);--st-pct:62%;}
  .legend-dot.st-Confirmada{--st:var(--wine);}
  .legend-dot.st-Realizada{--st:var(--ok);}
  .legend-dot.st-Cancelada{--st:var(--canc);}
  .legend-dot.st-NoShow{--st:var(--danger);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .reminders-table{width:100%;border-collapse:collapse;margin:10px 0;}
  .reminders-table th,.reminders-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;}
  .reminders-table td .btn{padding:4px 10px;font-size:12px;margin-right:6px;}
  .appt:hover{filter:brightness(1.1);}

  /* ---------- Week view ---------- */
  .weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;}
  .weekday{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px;cursor:pointer;min-height:120px;display:flex;flex-direction:column;gap:6px;
    transition:border-color .12s ease,transform .12s ease,box-shadow .12s ease;
  }
  .weekday:hover{border-color:var(--wine);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.3);}
  .weekday.today{outline:2px solid var(--gold);}
  .weekday .wd-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .weekday .wd-num{font-family:var(--head);font-size:24px;font-weight:600;}
  .weekday .wd-count{font-size:12px;color:var(--gold);font-weight:600;margin-top:auto;}
  .weekday .wd-rev{font-size:11.5px;color:var(--ink-soft);}

  /* ---------- Month view ---------- */
  .monthgrid{display:flex;flex-direction:column;gap:6px;}
  .month-headerrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:2px;}
  .month-headerrow div{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding-bottom:4px;}
  .month-weekrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .month-cell{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:6px 7px;min-height:92px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
    transition:border-color .12s ease, transform .12s ease;
  }
  .month-cell:hover{border-color:var(--wine);transform:translateY(-1px);}
  .month-cell.other-month{opacity:.35;}
  .month-cell.today{outline:2px solid var(--gold);}
  .month-cell .mc-num{font-family:var(--head);font-size:17px;font-weight:600;}
  .month-cell .mc-count{display:none;font-size:11px;color:var(--gold);font-weight:600;}
  .month-cell .mc-event{
    font-size:11px;line-height:1.35;padding:2px 5px;border-radius:5px;
    background:color-mix(in oklab,var(--wine) 16%,transparent);color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:4px;
  }
  .month-cell .mc-event .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .month-cell .mc-more{font-size:11px;color:var(--ink-soft);padding-left:5px;}
  .month-cell .mc-rev{font-size:11px;color:var(--gold);margin-top:auto;font-weight:600;}
  @media (max-width:720px){
    .month-cell{min-height:52px;padding:4px 5px;}
    .month-cell .mc-event, .month-cell .mc-more, .month-cell .mc-rev{display:none;}
    .month-cell .mc-count{display:block;}
  }

  /* ---------- Finanzas (reportes / gastos) ---------- */
  .section-tabs{display:flex;gap:2px;background:var(--bg);border-bottom:1px solid var(--line-soft);padding:0 16px;}
  .section-tabs button{
    display:inline-flex;align-items:center;gap:8px;
    background:none;border:none;color:var(--mute);font-family:var(--ui);font-size:14px;font-weight:600;
    padding:13px 14px 11px;cursor:pointer;border-bottom:2px solid transparent;transition:color .12s, border-color .12s;
  }
  .section-tabs button:hover{color:var(--ink);}
  .section-tabs button.active{color:var(--gold);border-bottom-color:var(--wine);}
  /* Teléfono: con 5 pestañas (dueños, desde "Pagos" el 18/10/2026) no
     cabían en una línea y la página se corría de lado. Se achican y, si aun
     así no caben, la fila se desliza sola sin mover la página. */
  @media (max-width:720px){
    .section-tabs{padding:0 4px;overflow-x:auto;scrollbar-width:none;}
    .section-tabs::-webkit-scrollbar{display:none;}
    .section-tabs button{padding:11px 7px 9px;font-size:13px;gap:6px;white-space:nowrap;flex-shrink:0;}
    .section-tabs button .ico{width:16px;height:16px;}
  }
  .fin-main{flex:1;overflow-y:auto;padding:20px 24px 60px;}
  .fin-page{max-width:820px;margin:0 auto;}
  .fin-subtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .fin-subtabs button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink-soft);border-radius:20px;
    padding:7px 16px;font-size:12.5px;cursor:pointer;transition:background .12s, color .12s;
  }
  .fin-subtabs button.active{background:color-mix(in oklab,var(--wine) 16%,transparent);border-color:var(--wine);color:var(--gold);font-weight:600;}
  .fin-monthnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;}
  .fin-monthnav .curdate{font-family:var(--head);font-size:24px;font-weight:700;color:var(--ink);min-width:160px;text-align:center;}
  .fin-monthnav button.arrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;cursor:pointer;color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .fin-monthnav button.arrow:disabled{opacity:.35;cursor:default;}
  .fin-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .fin-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;}
  .fin-card.highlight{border-color:var(--wine);background:color-mix(in oklab,var(--wine) 10%,transparent);}
  .fin-card .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .fin-card .val{font-family:var(--head);font-size:22px;font-weight:600;color:var(--gold-soft);}
  .fin-sub{font-family:var(--ui);font-size:12px;color:var(--gold);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
  .fin-table{width:100%;border-collapse:collapse;font-size:13px;}
  .fin-table th,.fin-table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;}
  .fin-table th{color:var(--ink-soft);font-size:11px;text-transform:uppercase;font-weight:600;}
  /* Finanzas → Pagos (pago semanal de las especialistas) */
  .pago-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;}
  .pago-card.pagado{border-color:var(--ok);}
  .pago-card.cambio{border-color:var(--danger);}
  .pago-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;cursor:pointer;}
  .pago-head .quien{font-weight:600;font-size:15px;}
  .pago-head .hint{margin:2px 0 0;}
  .pago-neto{font-family:var(--head);font-size:23px;font-weight:600;color:var(--gold-soft);white-space:nowrap;text-align:right;}
  .pago-neto small{display:block;font-family:inherit;font-size:11px;font-weight:400;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .pago-estado{padding:0 12px 12px;font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .pago-estado .btn{font-size:12.5px;padding:7px 14px;}
  .pago-detalle{border-top:1px solid var(--line);padding:4px 12px 12px;}
  .pago-detalle h4{font-size:11.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 4px;font-weight:600;}
  .pago-fila{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .pago-fila .como{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .pago-fila .monto{white-space:nowrap;font-weight:600;}
  .pago-fila.click{cursor:pointer;}
  /* ⭐ Garantías (pestaña de arriba, solo dueños) */
  .gar-page{max-width:1000px;}
  .gar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:0 10px;}
  .gar-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
  .gar-titulo{font-weight:600;font-size:14.5px;margin-bottom:8px;}
  .gar-fila{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);}
  .gar-titulo + .gar-fila{border-top:none;}
  .gar-chips{margin-bottom:12px;}
  .gar-rank{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line);}
  .gar-titulo + .gar-rank, .gar-titulo + .hint + .gar-rank{border-top:none;}
  .gar-medalla{width:26px;font-size:20px;line-height:1.2;text-align:center;flex-shrink:0;}
  .gar-rank-cuerpo{flex:1;min-width:0;}
  .gar-rank-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;}
  .gar-pct{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .gar-pct b{font-size:15px;color:var(--ink);}
  .gar-rank .gar-rec{margin-top:4px;}
  .gar-ojo{color:var(--warn-text);}
  .gar-quien{font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere;}
  .gar-quien .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .gar-barra{height:10px;border-radius:5px;background:var(--line);overflow:hidden;}
  .gar-barra span{display:block;height:100%;border-radius:5px;}
  .gar-num{font-size:13px;white-space:nowrap;text-align:right;}
  .gar-num span{color:var(--ink-soft);font-size:11.5px;margin-left:4px;}
  .gar-rec{grid-column:1/-1;font-size:11px;color:var(--ink-soft);margin-top:-2px;}
  .gar-fila.pocos .gar-barra,.gar-fila.pocos .gar-num b{opacity:.5;}
  .pago-fila.click:hover{background:color-mix(in oklab,var(--wine) 6%,transparent);}
  .pago-suma{margin-top:12px;font-size:13px;}
  .pago-suma div{display:flex;justify-content:space-between;padding:3px 0;}
  .pago-suma .neto{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:700;color:var(--gold);font-size:14px;}
  .pago-aviso{border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;}
  .reparto{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .reparto h3{margin:0 0 4px;font-size:22px;color:var(--ink);}
  .reparto-fila{margin:12px 0;}
  .reparto-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:14px;}
  .reparto-top > span:first-child{display:flex;align-items:center;gap:8px;}
  .reparto-monto{font-family:var(--head);font-size:19px;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;}
  .reparto-barra{position:relative;height:10px;background:var(--panel-2);border-radius:5px;margin-top:6px;}
  .reparto-barra i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;}
  .reparto-meta{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);}
  .reparto-aviso{margin-top:12px;border-left:3px solid var(--warn);background:var(--tenue);border-radius:0 8px 8px 0;padding:9px 12px;font-size:13px;}
  .reparto-aviso.ok{border-left-color:var(--ok);}
  .pago-aviso.peligro{border-color:var(--danger);}
  .pago-aviso.ok{border-color:var(--ok);}
  .pago-aviso.gan-proximas{border-color:var(--line);}
  .pago-fila.por-cerrar > div:first-child > div:first-child, .pago-fila.por-cerrar .monto s{opacity:.75;}
  .pago-fila .pago-cierre{color:var(--warn-text);}
  .gan-page{max-width:720px;}
  .gan-total .val{font-size:28px;}
  .gan-total.pagado{border-color:var(--ok);}
  .gan-cerrar-top{font-size:14.5px;margin-bottom:4px;}
  .gan-preview{border-color:var(--gold);}
  .gan-disenos{margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .gs-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;}
  .gs-boleta{text-align:left;}
  .gs-hola{font-size:14px;color:var(--ink-soft);}
  .gs-sub{font-size:13px;color:var(--ink-soft);margin-top:10px;text-align:center;}
  .gs-grande{font-family:var(--head);font-size:46px;font-weight:700;color:var(--gold-soft);text-align:center;margin:2px 0 12px;}
  .gs-linea{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px;border-top:1px dashed var(--line);}
  .gs-linea.total{font-weight:700;color:var(--gold);border-top:1px solid var(--line);}
  .gs-linea.chica{font-size:13.5px;}
  .gs-no-vino{color:var(--ink-soft);}
  .gs-pista{text-align:center;font-size:12.5px;color:var(--warn-text);margin-top:8px;}
  .gs-titulo{font-weight:600;font-size:15px;margin-bottom:6px;}
  .gs-cerrar{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft);border-radius:0;padding:14px 2px;color:var(--ink);font:inherit;cursor:pointer;}
  .gs-cerrar b{font-size:15.5px;}
  .gs-cerrar.tarde small{color:var(--danger-text);}
  .gs-cerrar small,.gs-cita small,.gs-no-vino small{display:block;font-size:12px;color:var(--ink-soft);font-weight:400;margin-top:2px;}
  .gs-mas{font-weight:700;color:var(--warn-text);white-space:nowrap;}
  .gs-listo{font-size:14.5px;color:var(--ok-text);font-weight:600;}
  .gs-vale{width:100%;font-size:15px;padding:12px;margin-bottom:10px;}
  .gs-cita{border-top:1px dashed var(--line);padding:8px 0;font-size:14.5px;}
  .gs-cita summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;}
  .gs-cita summary::-webkit-details-marker{display:none;}
  .gs-cita summary b{white-space:nowrap;}
  .gs-flecha{display:inline-block;font-style:normal;margin-left:8px;color:var(--ink-soft);transition:transform .15s;}
  .gs-cita[open] .gs-flecha{transform:rotate(90deg);}
  .gs-pasos{margin:8px 0 2px;padding:8px 12px;background:var(--panel);border-radius:8px;}
  .gs-paso{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;color:var(--ink-soft);}
  .gs-paso.sub{border-top:1px solid var(--line);margin-top:3px;padding-top:6px;color:var(--ink);}
  .gs-paso.tuya{color:var(--gold);font-weight:700;font-size:14.5px;}
  .gs-paso.texto{display:block;}
  .gs-paso > span:last-child{white-space:nowrap;}
  .modal.gan-modal{max-width:760px;}
  .gan-modal .fin-page{padding:0;}
  .pago-aviso ul{margin:6px 0 0;padding-left:18px;}
  .pago-aviso li{margin:3px 0;}
  .pago-ok{color:var(--ok-text);}
  .pago-mal{color:var(--danger-text);}
  .pago-hist tr.sel td{background:color-mix(in oklab,var(--wine) 10%,transparent);}
  .pago-hist tr{cursor:pointer;}
  .fin-table td:last-child, .fin-table th:last-child{text-align:right;}
  .exp-row{display:grid;grid-template-columns:1.3fr 1.6fr 1fr .9fr 1.1fr auto;gap:6px;align-items:center;margin-bottom:8px;}
  .exp-row.rec-row{grid-template-columns:1.4fr 1fr .8fr 1.1fr auto;}
  .exp-row select,.exp-row input{
    background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;
    color:var(--ink);font-size:12.5px;font-family:var(--ui);width:100%;
  }
  .stock-row{display:grid;grid-template-columns:1.6fr 1fr .9fr auto auto;gap:6px;align-items:center;margin-bottom:8px;}
  .stock-row.staff-row{grid-template-columns:1.6fr 1fr auto;}
  .stock-row select,.stock-row input{
    background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;
    color:var(--ink);font-size:12.5px;font-family:var(--ui);width:100%;
  }
  .stock-row-name{font-size:13px;color:var(--ink);}
  .stock-row-head{
    margin-bottom:4px;color:var(--ink-soft);font-size:11px;letter-spacing:.03em;
    text-transform:uppercase;font-family:var(--ui);
  }
  .stock-low{
    background:color-mix(in oklab,var(--danger) 18%,transparent);color:var(--danger-text);font-weight:700;font-size:11px;
    padding:4px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0;
  }
  .fin-hero{background:color-mix(in oklab,var(--wine) 10%,var(--panel));border:1px solid var(--wine);border-radius:16px;padding:16px 14px;text-align:center;margin-bottom:14px;}
  .fin-hero .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .fin-hero .val{font-family:var(--head);font-size:44px;font-weight:700;color:var(--gold-soft);margin:2px 0 4px;}
  .fin-hero.negativo .val{color:var(--danger-text);}
  .fin-hero-sub{font-size:13.5px;color:var(--ink);}
  .fin-hero-comp{font-size:12.5px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .fin-delta{font-weight:700;white-space:nowrap;}
  .fin-delta.sube{color:var(--ok-text);}
  .fin-delta.baja{color:var(--danger-text);}
  .fin-boleta{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 14px 10px;}
  .fin-linea{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px;border-top:1px dashed var(--line);}
  .fin-linea span:last-child{white-space:nowrap;}
  .fin-linea.total{font-weight:700;font-size:15px;color:var(--gold);border-top:1px solid var(--wine);margin-top:4px;}
  .fin-linea-titulo{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 2px;}
  .fin-esp th, .fin-esp td{text-align:right;}
  .fin-esp th:first-child, .fin-esp td:first-child{text-align:left;}
  .gasto-nuevo-btn{width:100%;font-size:15px;padding:12px;margin-bottom:10px;}
  .gasto-fila{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);}
  .gasto-info{flex:1;min-width:0;text-align:left;background:none;border:none;color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer;padding:0;}
  .gasto-info small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .gasto-monto{font-weight:600;white-space:nowrap;color:var(--danger-text);}
  .chart-box{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 10px;margin-bottom:6px;overflow-x:auto;}
  @media (max-width:600px){
    .fin-cards{grid-template-columns:1fr;}
    .fin-main{padding:14px 12px 60px;}
    .exp-row{display:flex;flex-wrap:wrap;}
    .exp-row > *{flex:1 1 45%;}
    .exp-row .iconbtn{flex:0 0 32px;}
    .stock-row{display:flex;flex-wrap:wrap;}
    .stock-row > *{flex:1 1 45%;}
    .stock-row .iconbtn{flex:0 0 32px;}
    .reminders-table{min-width:480px;}
    .svc-row,.svc-row-head{display:flex;flex-wrap:wrap;}
    .svc-row > *{flex:1 1 45%;}
    .svc-row .iconbtn{flex:0 0 32px;}
    .svc-row-head > *{flex:1 1 45%;}
  }

  /* ---------- Footer summary ---------- */
  footer.summary{
    background:var(--panel);border-top:1px solid var(--line);
    padding:12px 24px;display:flex;gap:28px;flex-wrap:wrap;align-items:center;
  }
  footer.summary .stat{display:flex;flex-direction:column;}
  footer.summary .stat .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  footer.summary .stat .val{font-family:var(--head);font-size:22px;font-weight:600;color:var(--gold-soft);}
  /* Resumen de dinero (dueños, 21/10/2026): "Entró $X de $Y" con barrita,
     las citas sin cerrar o "Todo cobrado", por método y citas. */
  footer.summary.r2{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:14px 22px;align-items:start;}
  .r2-main{display:grid;gap:6px;min-width:0;}
  .r2-lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .r2-cifra{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.05;color:var(--gold);font-variant-numeric:lining-nums tabular-nums;}
  .r2-cifra small{font-family:var(--ui);font-weight:500;font-size:13px;color:var(--ink-soft);margin-left:6px;}
  .r2-barra{height:7px;border-radius:5px;background:var(--tenue);overflow:hidden;}
  .r2-barra i{display:block;height:100%;border-radius:5px;background:var(--metal);}
  .r2-estado{font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .r2-estado b{color:var(--warn-text);}
  .r2-estado.ok b{color:var(--ok-text);}
  .r2-estado .linklike{font-size:12.5px;color:var(--gold);text-decoration:underline dotted;text-underline-offset:3px;min-height:36px;padding:0 6px;margin:-8px 0;}
  .r2-col{display:grid;gap:4px;min-width:0;}
  .r2-fila{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .r2-fila span:first-child{color:var(--ink-soft);min-width:0;overflow-wrap:anywhere;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.65);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:460px;
    max-height:90vh;overflow-y:auto;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,0.55);
  }
  .modal h2{margin:0 0 16px 0;font-size:26px;line-height:1.15;color:var(--ink);padding-bottom:10px;border-bottom:1px solid var(--line);}
  .field{margin-bottom:12px;position:relative;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:14px;font-family:var(--ui);background:var(--panel-2);color:var(--ink);
  }
  .field input::placeholder,.field textarea::placeholder{color:var(--mute);}
  /* Iconos de calendario/reloj de los campos de fecha y hora: el navegador los
     pinta negros y sobre el fondo oscuro casi no se veían → blancos. */
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator,
  input[type=month]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.9;cursor:pointer;}
  .field select option{background:var(--panel-2);color:var(--ink);}
  .split-fields input,.split-fields select{
    padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;font-family:var(--ui);background:var(--panel-2);color:var(--ink);
  }
  .split-fields select option{background:var(--panel-2);color:var(--ink);}
  .split-fields input::placeholder{color:var(--mute);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  /* Formulario de la cita: secciones con título chico (mismos campos, mismo
     orden). En pantallas anchas va en dos columnas para no tener que bajar. */
  .appt-sec{margin-bottom:6px;}
  .appt-sec-t{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .label-hint{font-weight:400;opacity:.75;}
  /* Teléfono: las columnas no existen (display:contents) y las secciones
     siguen el orden de siempre, con Notas al final. */
  .appt-cols{display:flex;flex-direction:column;}
  .appt-col{display:contents;}
  .sec-cuando{order:1;} .sec-clienta{order:2;} .sec-trat{order:3;} .sec-pago{order:4;} .sec-notas{order:5;}
  .appt-sec{border-top:1px solid var(--line);padding-top:12px;}
  .appt-sec.sec-cuando{border-top:none;padding-top:0;}
  .svc-chips:empty{display:none;}
  /* Nada se sale por el borde en pantallas angostas (ej. pago con dos métodos). */
  .appt-modal .row2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .appt-modal input,.appt-modal select{min-width:0;}
  .appt-modal .split-fields > *{min-width:0;}
  .appt-modal .split-fields .linklike{flex-shrink:0;}
  @media (max-width:374px){ .appt-modal .row2{grid-template-columns:1fr !important;} }
  @media (min-width:760px){
    .modal.appt-modal{max-width:880px;}
    .appt-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;align-items:start;}
    .appt-col{display:block;}
    .appt-col > .appt-sec:first-child{border-top:none;padding-top:0;}
  }
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;}
  .modal-actions .right{display:flex;gap:8px;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:-6px;margin-bottom:10px;}

  /* selector de varios servicios (combos) */
  .svc-picker{
    display:flex;flex-direction:column;max-height:220px;overflow-y:auto;
    border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
    box-shadow:inset 0 1px 5px rgba(0,0,0,.25);
  }
  .svc-picker::-webkit-scrollbar{width:8px;}
  .svc-picker::-webkit-scrollbar-track{background:transparent;}
  .svc-picker::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  .svc-picker::-webkit-scrollbar-thumb:hover{background:var(--wine);}
  .svc-picker-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;
    border-left:3px solid transparent;border-bottom:1px solid var(--tenue);
    transition:background .12s, border-color .12s;
  }
  .svc-picker-row:last-child{border-bottom:none;}
  .svc-picker-row:hover{background:color-mix(in oklab,var(--wine) 7%,transparent);}
  .svc-picker-row.checked{background:color-mix(in oklab,var(--wine) 13%,transparent);border-left-color:var(--wine);}
  .svc-picker-row input{accent-color:var(--wine);flex-shrink:0;width:17px;height:17px;cursor:pointer;}
  .svc-picker-info{display:flex;flex-direction:column;flex:1;min-width:0;gap:1px;}
  .svc-picker-name{font-size:13.5px;color:var(--ink);line-height:1.3;}
  .svc-picker-row.checked .svc-picker-name{color:var(--gold);font-weight:600;}
  .svc-picker-duration{font-size:11px;color:var(--ink-soft);}
  .svc-picker-price{
    font-size:12px;color:var(--ink-soft);flex-shrink:0;background:var(--tenue);
    padding:3px 9px;border-radius:20px;font-variant-numeric:tabular-nums;
  }
  .svc-picker-row.checked .svc-picker-price{color:var(--gold-soft);background:color-mix(in oklab,var(--wine) 14%,transparent);}
  .svc-qty{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .svc-qty-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;transition:background .12s, border-color .12s;
  }
  .svc-qty-btn:hover:not(:disabled){background:color-mix(in oklab,var(--wine) 18%,transparent);border-color:var(--wine);}
  .svc-qty-btn:disabled{opacity:.35;cursor:not-allowed;}
  .svc-qty-num{min-width:14px;text-align:center;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .svc-picker-row.checked .svc-qty-num{color:var(--gold);font-weight:700;}
  .svc-picker-row.no-hace:not(.checked){opacity:.45;}
  .svc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:20px;}
  .svc-chips-empty{font-size:11.5px;color:var(--ink-soft);font-style:italic;}
  .svc-chip-tag{
    display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--wine);
    color:var(--gold-soft);border-radius:8px;padding:5px 6px 5px 11px;font-size:12px;font-weight:600;
    cursor:pointer;transition:background .12s;
  }
  .svc-chip-tag:hover{background:color-mix(in oklab,var(--wine) 12%,transparent);}
  .svc-chip-tag .x{
    opacity:.65;font-size:11px;width:16px;height:16px;display:inline-flex;align-items:center;
    justify-content:center;border-radius:50%;background:var(--tenue);
  }
  .svc-chip-tag:hover .x{opacity:1;background:var(--wine);color:var(--on-accent);}
  .svc-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
  .svc-summary-empty{font-size:11.5px;color:var(--ink-soft);font-style:italic;}
  .svc-summary-badge{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--ink);}
  .svc-summary-price{color:var(--gold);border-color:var(--wine);font-weight:700;}

  /* services / specialists modal rows */
  .svc-row{display:grid;grid-template-columns:2fr 1fr .8fr auto;gap:8px;align-items:center;margin-bottom:8px;}
  .svc-row input{
    background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;
    color:var(--ink);font-size:12.5px;font-family:var(--ui);width:100%;
  }
  .svc-row-head{
    display:grid;grid-template-columns:2fr 1fr .8fr auto;gap:8px;margin-bottom:6px;
    color:var(--ink-soft);font-size:11px;letter-spacing:.03em;text-transform:uppercase;
    font-family:var(--ui);
  }
  .spec-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .spec-item{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .spec-reparto{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);margin:6px 0 2px;cursor:pointer;}
  .spec-perfil summary{cursor:pointer;font-size:12.5px;color:var(--ink);padding:2px 0;}
  .spec-perfil-head,.spec-perfil-row{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:center;}
  .spec-perfil-head{font-size:11px;color:var(--ink-soft);margin:0 0 4px;}
  .spec-perfil-head span:last-child{text-align:center;}
  .spec-perfil-row{padding:3px 0;border-top:1px solid var(--line);}
  .spec-perfil-row label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;min-width:0;}
  .spec-perfil-row label span{min-width:0;overflow-wrap:anywhere;}
  .spec-perfil-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:var(--wine);}

<script>
// ---------------- Instalar la agenda (12/10/2026, pedido de Juan Diego) ----------------
// Antes había que mandar el link y explicar a mano "Agregar a pantalla de
// inicio" (y compartir la app desde Android mandaba un archivo base.apk que
// pedía instalar apps de origen desconocido: NO usar). Ahora:
// - TELÉFONO abierto en el navegador → pantalla completa "Instala la agenda"
//   con UN botón "📲 Instalar la agenda": instala en un toque si el
//   navegador lo permite; si no (iPhone siempre), al tocarlo aparecen ahí los
//   pasos (menú ⋮ / Compartir → "Agregar a inicio"). Abajo, "Usar en el
//   navegador por esta vez" (esa pestaña, máx. 30 min): nunca deja a nadie
//   sin poder entrar (navegador raro, urgencia, teléfono prestado).
// - Abierta desde el ÍCONO (app instalada, display-mode standalone): nada.
// - COMPUTADOR: una tarjeta abajo a la derecha "Instalar" / "Ahora no" (24 h),
//   SOLO si el navegador deja instalar con un clic (beforeinstallprompt). Si no
//   (ya instalada, incógnito, Safari/Firefox) no sale nada: nunca un paso a paso
//   (pedido de Juan Diego, 22/10/2026).
// Va encima de todo y fuera de #root: la agenda (sesión, datos) carga igual
// por debajo, no toca nada de cómo arranca ni de lo que se guarda.

  // Pedido de Juan Diego ("quiero que de verdad se use la app, que moleste"):
  // decir que no NUNCA es para siempre. En el teléfono "por esta vez" dura
  // esa pestaña y como mucho SALTAR_MIN minutos; en el computador "Ahora no"
  // dura BANNER_HORAS.
  var SALTAR_MIN = 30, BANNER_HORAS = 24;

  // Safari nunca), al tocarlo se muestran los pasos ahí mismo.
  var mostrarPasos = false;
  function vigente(st, k, ms){ var v = Number(leer(st, k)); return v > 0 && (Date.now() - v) < ms; }
  var promptGuardado = null, instaladaRecien = false;
  function leer(st, k){ try{ return window[st].getItem(k); }catch(e){ return null; } }
  function guardar(st, k, v){ try{ window[st].setItem(k, v); }catch(e){} }
  function estaInstalada(){
    try{
      if(window.navigator.standalone===true) return true;

    }catch(e){ return false; }
  }
  var ua = navigator.userAgent || '';
  var esIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && (navigator.maxTouchPoints||0) > 1);

  // Navegadores dentro de otras apps (Instagram, Facebook...): no pueden instalar.
  var enOtraApp = /FBAN|FBAV|FB_IAB|Instagram|Line\//i.test(ua);
  window.__instalarInfo = function(){ return {telefono: esIOS||esAndroid, ios: esIOS, android: esAndroid, otraApp: enOtraApp, instalada: estaInstalada(), puedeBoton: !!promptGuardado}; };

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); // el aviso lo muestra la agenda (pantalla o franja)
    promptGuardado = e;
    pintar();
  });
  window.addEventListener('appinstalled', function(){
    promptGuardado = null; instaladaRecien = true;
    var b = document.getElementById('instalar-banner'); if(b) b.remove();
    guardar('localStorage', BANNER_KEY, String(Date.now())); // recién instalada: no volver a ofrecerla enseguida
    pintar();
  });

  function logo(){ var l = document.querySelector('link[rel="icon"]'); return l ? l.href : ''; }
  function instalarConBoton(){
    if(!promptGuardado){ mostrarPasos = true; pintar(); return; }
    var p = promptGuardado;
    promptGuardado = null;
    try{ p.prompt(); }catch(e){ mostrarPasos = true; pintar(); return; } // si no lo deja: los pasos
    (p.userChoice || Promise.resolve({})).then(function(r){
      if(!(r && r.outcome==='accepted')) mostrarPasos = true; // la cerró sin instalar: quedan los pasos a la vista
      if(r && r.outcome==='accepted'){ instaladaRecien = true; var b = document.getElementById('instalar-banner'); if(b) b.remove(); guardar('localStorage', BANNER_KEY, String(Date.now())); }
      pintar();
    }).catch(function(){ pintar(); });
  }
  function pasosHtml(pasos){
    return '<div class="instalar-pasos">' + pasos.map(function(t, i){
      return '<div class="instalar-paso"><span class="instalar-num">'+(i+1)+'</span><span>'+t+'</span></div>';
    }).join('') + '</div>';
  }
  function contenidoTelefono(){
    var cab = '<img class="instalar-logo" src="'+logo()+'" alt="Sibana"><h1 class="serif">Agenda Sibana</h1>';
    var saltar = '<button type="button" class="instalar-saltar" id="instalar-saltar">Usar en el navegador por esta vez</button>';
    if(instaladaRecien){
      return cab + '<p class="instalar-lead">✅ <b>¡Lista!</b> La agenda quedó instalada. Ciérrala aquí y ábrela desde el ícono <b>Agenda Sibana</b> de tu pantalla de inicio.</p>' + saltar;
    }
    if(enOtraApp){
      return cab + '<p class="instalar-lead">Para instalar la agenda, abre este link en <b>'+(esIOS?'Safari':'Chrome')+'</b>.</p>'
        + pasosHtml(['Toca <span class="instalar-ico">⋯</span> arriba a la derecha', 'Elige <b>“Abrir en '+(esIOS?'Safari':'Chrome')+'”</b> (o “Abrir en el navegador”)']) + saltar;
    }
    var html = cab + '<p class="instalar-lead">Instálala en tu teléfono y ábrela con un toque desde tu pantalla de inicio.</p>'
      + '<button type="button" class="btn btn-primary instalar-btn" id="instalar-btn">📲 Instalar la agenda</button>';
    if(mostrarPasos && !promptGuardado){
      html += '<p class="instalar-nota" style="margin:16px 0 10px;">Tu teléfono la instala así:</p>' + pasosHtml(esIOS ? [
        'Toca <span class="instalar-ico">⬆</span> <b>Compartir</b> (en Safari, abajo; en Chrome, arriba)',
        'Elige <b>“Agregar a inicio”</b>',
        'Abre la agenda desde el <b>ícono nuevo</b>'
      ] : [
        'Toca <span class="instalar-ico">⋮</span> arriba a la derecha',
        'Elige <b>“Instalar aplicación”</b> o <b>“Agregar a pantalla principal”</b>',
        'Abre la agenda desde el <b>ícono nuevo</b>'
      ]) + '<p class="instalar-nota">Si ya la instalaste, ábrela desde el ícono <b>Agenda Sibana</b>.</p>';
    } else {
      html += '<p class="instalar-nota">Se instala en segundos.</p>';
    }
    return html + saltar;
  }
  function pintar(){
    if(!document.body) return;
    if(estaInstalada()){ var g0 = document.getElementById('instalar-gate'); if(g0) g0.remove(); return; }
    if(esIOS || esAndroid){
      if(vigente('sessionStorage', SALTAR_KEY, SALTAR_MIN*60000)) return;
      var g = document.getElementById('instalar-gate');
      if(!g){
        g = document.createElement('div');
        g.id = 'instalar-gate';
        g.setAttribute('role', 'dialog');
        g.setAttribute('aria-label', 'Instalar la agenda');
        g.className = 'entrando';
        setTimeout(function(){ g.classList.remove('entrando'); }, 700);
        document.body.appendChild(g);
      }
      g.innerHTML = contenidoTelefono();
      var bi = document.getElementById('instalar-btn');
      if(bi) bi.addEventListener('click', instalarConBoton);
      document.getElementById('instalar-saltar').addEventListener('click', function(){
        guardar('sessionStorage', SALTAR_KEY, String(Date.now()));
        mostrarPasos = false;
        g.remove();
      });
      return;
    }
    // Computador: tarjeta solo si se puede instalar con un clic (y no dijo "Ahora no" hace poco).
    var b = document.getElementById('instalar-banner');
    if(!promptGuardado || vigente('localStorage', BANNER_KEY, BANNER_HORAS*3600000)){ if(b) b.remove(); return; }
    if(b) return;
    b = document.createElement('div');
    b.id = 'instalar-banner';
    b.setAttribute('role', 'dialog');
    b.setAttribute('aria-label', 'Instalar la agenda');
    b.innerHTML = '<img src="'+logo()+'" alt="">'
      + '<div class="ib-tit">Instala la agenda en este computador</div>'
      + '<div class="ib-sub">Se abre en su propia ventana, con un clic.</div>'
      + '<div class="ib-acc"><button type="button" class="instalar-banner-no" id="instalar-banner-no">Ahora no</button>'
      + '<button type="button" class="btn btn-primary" id="instalar-banner-si">Instalar</button></div>';
    document.body.appendChild(b);
    document.getElementById('instalar-banner-si').addEventListener('click', instalarConBoton);
    document.getElementById('instalar-banner-no').addEventListener('click', function(){
      guardar('localStorage', BANNER_KEY, String(Date.now()));
      b.remove();
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', pintar);
  else pintar();
  // Al volver a la pestaña (después de horas) se revisa de nuevo si toca ofrecerla.
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') pintar(); });
})();
</script>

// Pantalla de carga con el logo + una animación — mucho más visual que un
// simple texto. Se usa tanto apenas se abre la página (más abajo) como
// mientras render() espera a que llegue el primer dato de Firestore.
function loadingScreenHtml(message){
  return `
    <div class="loading-screen">
      <img src="${LOGO_ICONO_SRC}" alt="Sibana">
      <div class="loading-spinner"></div>
      <div class="loading-text">${message||'Cargando agenda…'}</div>
    </div>`;

// su dirección está en este código público y antes cualquiera podía borrar o
// inventar eventos del Calendar y filas de la Hoja.
async function postBackupWebhook(body){
  let token = '';
  try{
    const u = firebase.auth().currentUser;

    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({token}, body)),
  });
}

// usar las veces que quieras — como ya identifica cada cita por su ID, nunca
// duplica filas ni eventos, solo los actualiza si ya existían (y junta los
// repetidos). Va en TANDAS y espera a que el script termine cada una antes de
// mandar la siguiente: antes mandaba una cita cada 350 ms sin esperar, y el
// script (que atiende de a un aviso, para no duplicar) no alcanzaba —la
// mayoría se perdían sin aviso y el Calendar quedaba a medias (pasó de
// verdad el 04/10/2026). Necesita el script con "lote" (oct 2026).
const BACKUP_TANDA = 15;
function runFullBackupSync(){
  if(!backupWebhookActivo()){
    showAlert('Todavía no has conectado ninguna Hoja/Calendar (falta pegar la URL del script). Pídele a Claude que te ayude con ese paso primero.');
    return;
  }
  const total = state.appointments.length;
  if(!total){ showAlert('No hay ninguna cita guardada para sincronizar.'); return; }
  showConfirmDialog(`Esto va a mandar las ${total} citas guardadas (incluidas las de meses anteriores) a tu Hoja de Google y a crear/actualizar su evento en Calendar. Puede tardar varios minutos: no cierres la agenda hasta que diga "Listo". ¿Continuar?`, async ()=>{
    const citas = state.appointments.slice();
    const prog = document.createElement('div');
    prog.id = 'backup-progress';
    prog.className = 'confirm-overlay';
    prog.innerHTML = '<div class="confirm-box"><p id="backup-progress-text"></p></div>';
    document.body.appendChild(prog);
    const texto = n => { const el = document.getElementById('backup-progress-text'); if(el) el.textContent = `☁️ Mandando citas a la Hoja y al Calendar… ${n} de ${citas.length}. No cierres la agenda.`; };
    let enviadas = 0, fallidas = 0;
    for(let i = 0; i < citas.length; i += BACKUP_TANDA){
      texto(i);
      const tanda = citas.slice(i, i + BACKUP_TANDA);
      const body = { lote: tanda.map(a=>backupAviso('save', a)) };
      let ok = false;
      for(let intento = 0; intento < 2 && !ok; intento++){
        try{ await postBackupWebhook(body); ok = true; }
        catch(e){ console.error('Tanda del respaldo sin respuesta', e); await new Promise(r=>setTimeout(r, 3000)); }
      }
      if(ok) enviadas += tanda.length; else fallidas += tanda.length;
    }
    prog.remove();
    showAlert(fallidas
      ? `Se mandaron ${enviadas} de ${citas.length} citas; ${fallidas} no se pudieron mandar (¿se cortó internet?). Puedes tocar "Reenviar todo" de nuevo: no duplica nada.`
      : `Listo — se mandaron las ${citas.length} citas a la Hoja y al Calendar.`);
  });
}

function fmtCLP(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-CL');
}
function fmtCLPShort(n){
  n = Number(n)||0;
  if(Math.abs(n)>=1000000) return '$'+(n/1000000).toLocaleString('es-CL',{maximumFractionDigits:1})+'M';
  if(Math.abs(n)>=1000) return '$'+Math.round(n/1000)+'K';
  return '$'+n;
}
function pad(n){return n.toString().padStart(2,'0');}
function toKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function sameDay(a,b){return toKey(a)===toKey(b);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function addMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}
function daysInMonth(year,month){return new Date(year,month+1,0).getDate();}
function startOfWeek(d){const r=new Date(d);const day=(r.getDay()+6)%7;r.setDate(r.getDate()-day);return r;}

function minutesFromMidnight(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function addMinutesToHHMM(hhmm, minsToAdd){
  const total = minutesFromMidnight(hhmm) + minsToAdd;
  const clamped = Math.max(0, Math.min(total, 23*60+59));
  return pad(Math.floor(clamped/60)) + ':' + pad(clamped%60);
}
function timeLabel(hhmm){return hhmm;}
function normalizeName(s){return (s||'').trim().toLowerCase();}
// Compara dos nombres de forma flexible (uno "contiene" al otro) — no exige
// coincidencia exacta, porque un nombre puede llevar o no el segundo
// apellido, un diminutivo, etc. Solo se usa para avisar de un vínculo de
// consentimiento que parece ser de otra persona, no para bloquear nada.
function namesLikelyMatch(a, b){
  const na = normalizeName(a), nb = normalizeName(b);
  if(!na || !nb) return true;
  return na.includes(nb) || nb.includes(na);
}

// ---------------- Custom dialogs (reemplazan alert()/confirm() nativos,

function showDialog(opts){
  const existing = document.getElementById('custom-dialog');
  if(existing) existing.remove();
  const showCancel = opts.showCancel !== false;
  const wrap = document.createElement('div');
  wrap.id = 'custom-dialog';
  wrap.className = 'confirm-overlay';
  wrap.innerHTML = `
    <div class="confirm-box">
      <p>${escapeHtml(opts.message)}</p>
      <div class="confirm-actions">
        ${showCancel ? `<button class="btn btn-ghost" id="dlg-cancel">${escapeHtml(opts.cancelLabel||'Cancelar')}</button>` : ''}
        <button class="btn btn-primary" id="dlg-ok">${escapeHtml(opts.confirmLabel||'Entendido')}</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.querySelector('#dlg-ok').addEventListener('click', ()=>{ close(); if(opts.onConfirm) opts.onConfirm(); });
  const cancelBtn = wrap.querySelector('#dlg-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ close(); if(opts.onCancel) opts.onCancel(); });
  wrap.addEventListener('click', e=>{ if(e.target===wrap) close(); });
}

// ---------------- Consentimiento firmado (colección "sibana-consentimientos") ----------------
// Las fichas las puede crear cualquiera (sin contraseña), así que su contenido
// nunca se mete tal cual en la pantalla: los textos pasan por escapeHtml y la
// firma solo se muestra si es de verdad una imagen PNG. Antes la firma se
// ponía directo en <img src="...">, y una "firma" armada a propósito podía
// ejecutar un programa con la sesión de quien abriera la búsqueda de fichas.
function firmaSegura(u){
  return (typeof u==='string' && /^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(u)) ? u : '';
}
function consentMatchScore(query, entry){
  const q = normalizeName(query);
  if(!q) return 1; // sin texto de búsqueda: se muestran todas por igual
  const n = entry.nombre_buscar || normalizeName(entry.nombre||'');
  const rut = (entry.rut||'').toLowerCase();
  const tel = (entry.telefono||'').toLowerCase();
  if(n === q) return 100;
  if(n.includes(q) || q.includes(n)) return 50;
  if((rut && rut.includes(q)) || (tel && tel.includes(q))) return 40;
  const qWords = q.split(/\s+/).filter(w=>w.length>=3);
  const nWords = n.split(/\s+/).filter(w=>w.length>=3);
  // A propósito "contiene" en vez de coincidencia exacta: así encuentra
  // aunque escriban un diminutivo ("Rosa" por "Rosario") o parte del nombre.
  let shared = 0;
  qWords.forEach(w=>{ if(nWords.some(nw=>nw.includes(w)||w.includes(nw))) shared++; });
  return shared>0 ? 10*shared : 0;
}

function renderConsentSearch(box, allDocs, initialQuery, close, apptId, linkedConsentId){
  const fmt = iso=>{ if(!iso) return ''; const dt=new Date(iso); return dt.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' · ' + dt.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); };
  const yn = v=> v===true?'Sí':(v===false?'No':'—');

  function entryHtml(e){
    const isLinked = !!(linkedConsentId && e._id===linkedConsentId);
    const linkBtn = !apptId ? '' : isLinked
      ? `<span class="hint" style="display:inline-block;margin-top:8px;color:var(--ok);font-weight:600;">✓ Ya vinculada a esta cita</span>`
      : `<button type="button" class="btn btn-ghost" data-consent-link="${escapeHtml(e._id)}" data-consent-name="${escapeHtml(e.nombre||'')}" style="font-size:11.5px;margin-top:8px;">Vincular esta ficha a esta cita</button>`;
    // Eliminar una ficha de consentimiento es un documento legal, sin
    // "Deshacer" — se deja solo para Admin. Las especialistas pueden ver y
    // vincular fichas (lo hacen presencialmente con la clienta), pero si una
    // clienta firma mal, la solución es rehacerla y vincular la nueva, no
    // borrar la anterior.
    const deleteBtn = ui.mode==='admin' ? `<button type="button" class="btn btn-ghost" data-consent-delete="${escapeHtml(e._id)}" style="font-size:11.5px;margin-top:8px;margin-left:6px;color:var(--danger);">Eliminar esta ficha</button>` : '';
    return `
      <div style="border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <b style="font-size:13.5px;">${escapeHtml(e.nombre||'—')}</b>
          <span style="font-size:11.5px;color:var(--mute);white-space:nowrap;">${fmt(e.submittedAtClient)}</span>
        </div>
        <div style="font-size:12.5px;line-height:1.6;margin-top:6px;">
          <div><b>${SEDE.docIdentidad}:</b> ${escapeHtml(e.rut||'—')}</div>
          <div><b>Teléfono:</b> ${escapeHtml(e.telefono||'—')}</div>
          <div><b>Técnica:</b> ${escapeHtml(e.tecnica||'—')}</div>
          <div><b>Diseño aprobado por la clienta:</b> ${yn(e.diseno_aprobado)}</div>
          <div><b>Alergias:</b> ${yn(e.alergias)}${e.alergias_detalle?' — '+escapeHtml(e.alergias_detalle):''}</div>
          <div><b>Condiciones de piel:</b> ${yn(e.cond_piel)}${e.cond_piel_detalle?' — '+escapeHtml(e.cond_piel_detalle):''}</div>
        </div>
        ${firmaSegura(e.firmaDataUrl)?`<div style="background:var(--firma-bg);border-radius:4px;margin-top:8px;padding:4px;"><img src="${firmaSegura(e.firmaDataUrl)}" style="max-width:200px;display:block;"></div>`:''}
        ${linkBtn}${deleteBtn}
      </div>`;
  }

  function renderList(query){
    const scored = allDocs
      .map(e=>({e, score: consentMatchScore(query, e)}))
      .filter(x=> query.trim()==='' ? true : x.score>0)
      .sort((a,b)=> b.score-a.score || (b.e.submittedAtClient||'').localeCompare(a.e.submittedAtClient||''));
    if(scored.length===0){
      return `<p class="hint" style="margin-top:10px">No hay coincidencias. Prueba con otra parte del nombre, o borra el texto para ver todas las fichas firmadas.</p>`;
    }
    return scored.slice(0,30).map(({e})=>entryHtml(e)).join('');
  }

  box.innerHTML = `
    <p style="margin-top:0">Buscar en las ${allDocs.length} ficha${allDocs.length===1?'':'s'} firmada${allDocs.length===1?'':'s'}:</p>
    <input type="text" id="consent-search-input" class="client-search-input" style="margin-bottom:10px" value="${escapeHtml(initialQuery||'')}" placeholder="Nombre, ${SEDE.docIdentidad} o teléfono">
    <div id="consent-search-results">${renderList(initialQuery||'')}</div>
    <div class="confirm-actions"><button class="btn btn-primary" id="dlg-ok2">Cerrar</button></div>
  `;
  box.querySelector('#dlg-ok2').addEventListener('click', close);
  const input = box.querySelector('#consent-search-input');
  // Antes de vincular, se avisa (sin bloquear) si algo parece un error: el
  // nombre de la ficha no se parece al de la clienta de esta cita, o la
  // ficha ya está vinculada a OTRA cita. No se bloquea del todo porque hay
  // casos legítimos (ej. reusar la misma ficha para un retoque más
  // adelante de la misma clienta) — solo se pide confirmar a propósito.
  const wireLinkButtons = ()=>{
    box.querySelectorAll('[data-consent-link]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const consentId = btn.dataset.consentLink;
        const consentName = btn.dataset.consentName;
        const doLink = ()=>{ linkConsentToAppt(apptId, consentId, consentName); close(); };

        const targetAppt = apptId ? state.appointments.find(a=>a.id===apptId) : null;
        const clientName = targetAppt ? targetAppt.client : '';
        const nameMismatch = !!(clientName && consentName && !namesLikelyMatch(clientName, consentName));
        const otherAppt = apptId ? state.appointments.find(a=>a.id!==apptId && a.consentId===consentId) : null;

        if(!nameMismatch && !otherAppt){ doLink(); return; }

        const warnings = [];
        if(nameMismatch) warnings.push(`esta ficha es de "${consentName}", pero esta cita es de "${clientName}"`);
        if(otherAppt) warnings.push(`ya está vinculada a otra cita (${otherAppt.client||'sin nombre'}, ${otherAppt.date})`);

        const holder = document.createElement('span');
        holder.style.cssText = 'display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px;';
        holder.innerHTML = `
          <span style="font-size:11.5px;color:var(--danger);">⚠️ Ojo: ${escapeHtml(warnings.join('; '))}. ¿La vinculas igual?</span>
          <button type="button" class="btn btn-ghost" style="font-size:11.5px;">Cancelar</button>
          <button type="button" class="btn btn-primary" style="font-size:11.5px;">Sí, vincular igual</button>
        `;
        const [cancelBtn, okBtn] = holder.querySelectorAll('button');
        btn.replaceWith(holder);
        cancelBtn.addEventListener('click', ()=> holder.replaceWith(btn));
        okBtn.addEventListener('click', doLink);
      });
    });
  };
  // Al eliminar, en vez de un botón que hay que apretar dos veces (fácil de
  // no notar), se reemplaza por una pregunta explícita con "Cancelar" y
  // "Sí, eliminar" — igual de clara que la del Panel Sibana, pero sin abrir
  // un diálogo nuevo (eso reusaría el mismo id "custom-dialog" de este
  // mismo diálogo y lo cerraría de golpe).
  const wireDeleteButtons = ()=>{
    box.querySelectorAll('[data-consent-delete]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.consentDelete;
        const holder = document.createElement('span');
        holder.style.cssText = 'display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px;margin-left:6px;';
        holder.innerHTML = `
          <span style="font-size:11.5px;color:var(--danger);">¿Eliminar esta ficha? No se puede deshacer.</span>
          <button type="button" class="btn btn-ghost" style="font-size:11.5px;">Cancelar</button>
          <button type="button" class="btn btn-primary" style="font-size:11.5px;background:var(--danger);border-color:var(--danger);">Sí, eliminar</button>
        `;
        const [cancelBtn, okBtn] = holder.querySelectorAll('button');
        btn.replaceWith(holder);
        cancelBtn.addEventListener('click', ()=> holder.replaceWith(btn));
        okBtn.addEventListener('click', ()=>{
          okBtn.disabled = true;
          cancelBtn.disabled = true;
          okBtn.textContent = 'Eliminando…';
          db.collection(SEDE.consentCollection).doc(id).delete()
            .then(()=>{
              const idx = allDocs.findIndex(d=>d._id===id);
              if(idx>=0) allDocs.splice(idx,1);
              if(box.isConnected){

// ---- Vínculo automático (10/10/2026, pedido de Juan Diego: las
// especialistas nunca vinculaban la ficha a la cita) ----
// Una ficha firmada se vincula sola a la cita de ESE día cuyo nombre de
// clienta es exactamente el mismo (sin contar mayúsculas, tildes ni espacios
// de más). Si la clienta tiene dos citas ese día, va a la que está más cerca
// de la hora de la firma. Nunca toca una cita que ya tiene ficha, ni una
// ficha que ya está vinculada a otra cita, ni citas canceladas/no llegó ni
// de cursos. Se escuchan solo las fichas de los últimos días.
const CONSENT_AUTO_DIAS = 1; // hoy y ayer (las fichas traen la firma: no bajar más de lo necesario)
let fichasRecientes = [];
let consentAutoUnsub = null, consentAutoDesde = '';
function nombreExacto(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
}
function fechaHoraEnSede(iso){
  const d = new Date(iso);
  if(isNaN(d)) return null;
  const s = d.toLocaleString('sv-SE',{timeZone:SEDE.zonaHoraria}); // "2026-10-03 21:05:00"
  return {date: s.slice(0,10), time: s.slice(11,16)};
}
// "✍️ Falta firmar" (11/10/2026, pedido de Juan Diego: a las especialistas
// se les olvida hacer firmar el consentimiento). Desde el 14/10/2026 solo en
// los tratamientos que llevan consentimiento (citaLlevaFirma). El aviso sale SOLO mientras todavía sirve:
// el mismo día, desde 1 hora antes de la cita hasta 30 min después — después ya
// no se puede hacer nada y quedaría ahí para siempre (él no lo quería así).
// Se va solo cuando la ficha se vincula (sola si el nombre es igual, o a mano).
const FIRMA_AVISO_ANTES_MIN = 60;
const FIRMA_AVISO_DESPUES_MIN = 30; // un rato después de terminar, por si la clienta sigue ahí (pedido de Juan Diego)
// ¿Este tratamiento lleva consentimiento firmado? (14/10/2026, Juan Diego lo
// dejó a criterio: solo lo que pone pigmento bajo la piel con aguja, o sea la
// micropigmentación y sus retoques; NO perfilado, lifting, laminado, tinte,
// limpieza...). Se marca a mano por servicio en Servicios y tarifario
// ("✍️ Lleva consentimiento", s.llevaFirma). Si nunca se marcó: lo que es
// micropigmentación o se llama como una (así entran los retoques).
const NOMBRE_MICRO_RE = /microblading|sombreado|delineado|mixbrows|t[eé]cnica mixta|full lips|labios/i;
function servicioLlevaFirma(nombre){
  if(!nombre || /evaluaci[oó]n|garant[ií]a/i.test(nombre)) return false;
  const svc = (state.services||[]).find(s=>s.name===nombre);
  if(svc && svc.llevaFirma!=null) return !!svc.llevaFirma;
  return !!(svc && svc.micropigmentacion) || NOMBRE_MICRO_RE.test(nombre);
}
function citaLlevaFirma(a){
  return (a.services||[]).some(x=>servicioLlevaFirma(x))
    || (isGarantiaAppt(a) && !!a.garantiaDe && servicioLlevaFirma(a.garantiaDe));
}
function faltaFirmarAhora(a){
  if(!a || a.consentId || a.cursoId || a.estado==='Cancelada' || a.estado==='NoShow') return false;
  if(!citaLlevaFirma(a)) return false;
  const now = sedeNow();
  if(a.date!==now.date) return false;
  const m = minutesFromMidnight(now.time);
  return m >= minutesFromMidnight(a.start||'00:00') - FIRMA_AVISO_ANTES_MIN && m < minutesFromMidnight(a.end||a.start||'00:00') + FIRMA_AVISO_DESPUES_MIN;
}
function faltaFirmarAvisoHtml(a){
  return faltaFirmarAhora(a) ? `<div class="firma-aviso">✍️ <b>Falta que la clienta firme el consentimiento.</b> Pídeselo antes de empezar, y que firme con el mismo nombre de la cita: <b>${escapeHtml(a.client||'')}</b>.</div>` : '';
}
// ---- Vista Día: línea de "ahora" y resumen del día (12/10/2026, a pedido de
// Juan Diego, "más visual") ----
// La línea roja marca la hora actual (de la sede) cuando se mira el día de
// hoy; se mueve sola cada minuto sin redibujar toda la agenda.
// EN PAUSA (12/10/2026): Juan Diego todavía no decide si publicarlas. Para
// mostrarlas, poner VISTA_DIA_EXTRAS = true.
const VISTA_DIA_EXTRAS = false;
function lineaAhoraHtml(dateKey, rangeStart, rangeEnd){
  if(!VISTA_DIA_EXTRAS) return '';
  const now = sedeNow();
  if(dateKey!==now.date) return '';
  const m = minutesFromMidnight(now.time);
  if(m < rangeStart*60 || m > rangeEnd*60) return '';
  return `<div id="linea-ahora" class="linea-ahora" data-desde="${rangeStart}" data-hasta="${rangeEnd}" style="top:${((m - rangeStart*60)/60)*SLOT_PX}px"><span class="linea-ahora-hora">${now.time}</span></div>`;
}
function moverLineaAhora(){
  const el = document.getElementById('linea-ahora');
  if(!el) return;
  const now = sedeNow(), desde = Number(el.dataset.desde), hasta = Number(el.dataset.hasta);
  const m = minutesFromMidnight(now.time);
  if(m > hasta*60){ el.remove(); return; }
  el.style.top = (((m - desde*60)/60)*SLOT_PX) + 'px';
  const h = el.querySelector('.linea-ahora-hora');
  if(h) h.textContent = now.time;
}
// Resumen arriba de la vista Día: lo que hay que tener presente de un
// vistazo (no plata; eso sigue abajo). Cuenta lo mismo que se ve en las
// fichas (respeta el filtro de especialista).
function resumenDiaHtml(dateKey, appts){
  if(!VISTA_DIA_EXTRAS) return '';
  const activas = appts.filter(a=>a.estado!=='Cancelada' && a.estado!=='NoShow');
  if(!activas.length) return '';
  const now = sedeNow();
  const esHoy = dateKey===now.date, pasado = dateKey < now.date;
  const sinAbono = activas.filter(a=>!(Number(a.abono)>0) && !isGarantiaAppt(a)).length;
  const porConfirmar = pasado ? 0 : activas.filter(a=>(a.estado||'Pendiente')==='Pendiente').length;
  // Por firmar: citas de hoy sin ficha que todavía no terminan (+30 min).
  const mNow = minutesFromMidnight(now.time);
  const porFirmar = !esHoy ? 0 : activas.filter(a=>!a.consentId && !a.cursoId && citaLlevaFirma(a)
    && mNow < minutesFromMidnight(a.end||a.start||'00:00') + FIRMA_AVISO_DESPUES_MIN).length;
  const realizadas = activas.filter(a=>a.estado==='Realizada').length;
  const chip = (txt, cls)=>`<span class="rd-chip${cls?' '+cls:''}">${txt}</span>`;
  const partes = [chip(`📅 <b>${activas.length}</b> cita${activas.length===1?'':'s'}`)];
  if(esHoy && realizadas) partes.push(chip(`✅ ${realizadas} realizada${realizadas===1?'':'s'}`));
  if(porConfirmar) partes.push(chip(`🟣 ${porConfirmar} por confirmar`, 'rd-ojo'));
  if(sinAbono) partes.push(chip(`💸 ${sinAbono} sin abono`, 'rd-ojo'));
  if(porFirmar) partes.push(chip(`✍️ ${porFirmar} por firmar`, 'rd-ojo'));
  return `<div class="resumen-dia"><span class="rd-titulo">${esHoy ? 'Hoy' : 'Este día'}</span>${partes.join('')}</div>`;
}
// Cada minuto, si en la vista Día cambió a quién le toca el aviso, se redibuja.
let ultimoFaltaFirmar = '';
setInterval(()=>{
  if(!ui.loaded || ui.modal || document.visibilityState!=='visible') return;

  if(k!==ultimoFaltaFirmar){ ultimoFaltaFirmar = k; render(); }
}, 60*1000);
function escucharFichasRecientes(){
  if(!db || !SEDE.consentCollection) return;
  const hoy = sedeNow().date;
  if(consentAutoUnsub && consentAutoDesde === hoy) return;
  if(consentAutoUnsub){ consentAutoUnsub(); consentAutoUnsub = null; }
  consentAutoDesde = hoy;
  const desdeIso = new Date(Date.now() - (CONSENT_AUTO_DIAS+1)*86400000).toISOString();
  consentAutoUnsub = db.collection(SEDE.consentCollection).where('submittedAtClient','>=',desdeIso)
    .onSnapshot(snap=>{
      fichasRecientes = snap.docs.map(d=>({_id:d.id, nombre:d.data().nombre, submittedAtClient:d.data().submittedAtClient}));
      vincularConsentimientosSolos();
    }, err=>{ console.error('No se pudieron leer las fichas recientes', err); });
}
let vinculoTimer = null;
function vincularConsentimientosSolos(){
  if(!ui.loaded || appOutdated || !fichasRecientes.length || vinculoTimer) return;
  if(!vinculosPendientes().size) return;
  // Todos los teléfonos abiertos ven la ficha nueva a la vez: cada uno espera
  // unos segundos al azar y vuelve a revisar, así normalmente lo guarda uno
  // solo y los demás ya lo ven hecho.
  vinculoTimer = setTimeout(()=>{ vinculoTimer = null; aplicarVinculosConsentimiento(); }, 1500 + Math.random()*6000);
}
function vinculosPendientes(){
  const usadas = new Set(state.appointments.filter(a=>a.consentId).map(a=>a.consentId));
  const tomadas = new Set();
  const asignar = new Map(); // id de la cita -> ficha
  fichasRecientes
    .slice().sort((x,y)=>String(y.submittedAtClient||'').localeCompare(String(x.submittedAtClient||''))) // la firma más nueva primero
    .forEach(f=>{
      if(usadas.has(f._id)) return;
      const nom = nombreExacto(f.nombre);
      const cuando = fechaHoraEnSede(f.submittedAtClient);
      if(!nom || !cuando) return;
      const citas = state.appointments.filter(a=> a.date===cuando.date && !a.consentId && !a.cursoId && !tomadas.has(a.id)
        && a.estado!=='Cancelada' && a.estado!=='NoShow' && nombreExacto(a.client)===nom);
      if(!citas.length) return;
      const firmaMin = minutesFromMidnight(cuando.time);
      const dist = a=> Math.abs(minutesFromMidnight(a.start||'00:00') - firmaMin);
      citas.sort((a,b)=> dist(a)-dist(b));
      // Si firmó dos veces para la misma cita, queda la última firma, y la
      // otra NO se pasa a otra cita suya del mismo día.
      if([...asignar.values()].some(g=>nombreExacto(g.nombre)===nom && fechaHoraEnSede(g.submittedAtClient).date===cuando.date) && citas.length===1) return;
      tomadas.add(citas[0].id);
      asignar.set(citas[0].id, f);
    });

}
function aplicarVinculosConsentimiento(){
  if(!ui.loaded || appOutdated) return;
  const asignar = vinculosPendientes();
  if(!asignar.size) return;
  asignar.forEach((f, apptId)=>{
    const a = state.appointments.find(x=>x.id===apptId);
    if(!a) return;
    a.consentId = f._id;
    if(ui.modal && ui.modal.data && ui.modal.data.id===apptId) ui.modal.data.consentId = f._id;
  });
  saveData({recordUndo:false, silent:true});
  if(!ui.modal) render();
}
