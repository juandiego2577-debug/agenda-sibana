// ---------------- Horario / bloqueos ----------------
function dayHoursFor(date){
  const h = state.settings.hours || {};
  return h[date.getDay()] || null; // null = cerrado ese día
}
function isClosedWeekday(date){
  return !dayHoursFor(date);
}
function hourIsBlocked(hour, date){
  const dh = dayHoursFor(date);
  if(!dh) return true;
  const slotStart = hour*60, slotEnd = (hour+1)*60;
  const openStart = (Number(dh.open)||0)*60;
  const openEnd = (Number(dh.close)||24)*60;
  if(slotStart < openStart || slotEnd > openEnd) return true;
  const s = state.settings;
  if(s.lunchStart && s.lunchEnd){
    const lunchS = minutesFromMidnight(s.lunchStart), lunchE = minutesFromMidnight(s.lunchEnd);
    if(slotStart < lunchE && slotEnd > lunchS) return true;
  }
  return false;
}
function apptFallsInBlockedTime(date, start, end){
  const dh = dayHoursFor(date);
  if(!dh) return true;
  const s = state.settings;
  const startMin = minutesFromMidnight(start), endMin = minutesFromMidnight(end);
  const openStart = (Number(dh.open)||0)*60, openEnd = (Number(dh.close)||24)*60;
  if(startMin < openStart || endMin > openEnd) return true;
  if(s.lunchStart && s.lunchEnd){
    const lunchS = minutesFromMidnight(s.lunchStart), lunchE = minutesFromMidnight(s.lunchEnd);
    if(startMin < lunchE && endMin > lunchS) return true;
  }
  return false;
}

// Mañana o tarde (19/10/2026): en los teléfonos con reloj de 12 horas es
// fácil poner "4:00" queriendo decir las 16:00. Pasó con dos bloqueos que
// quedaron de 4 de la madrugada a 8 de la noche (parecían "todo el día"), y
// a Juan Diego le pasa al agendar. Si la hora de inicio cae antes de que abra
// el estudio, se pregunta; si 12 horas después cae dentro del horario, se
// ofrece corregirla en un toque.
function horaEnPalabras(hhmm){
  const m = minutesFromMidnight(hhmm), h = Math.floor(m/60), min = m%60;
  const h12 = h%12===0 ? 12 : h%12;
  const parte = h<6 ? 'de la madrugada' : h<12 ? 'de la mañana' : h<13 ? 'del mediodía' : h<20 ? 'de la tarde' : 'de la noche';
  return `${h12}${min ? ':'+pad(min) : ''} ${parte}`;
}
function revisarMananaTarde(dateKey, start, end){
  const dh = dayHoursFor(parseKey(dateKey));
  const abre = (dh ? Number(dh.open)||0 : HOUR_START)*60, cierra = (dh ? Number(dh.close)||24 : HOUR_END)*60;
  const s = minutesFromMidnight(start), e = minutesFromMidnight(end);
  if(s >= abre) return null;
  const dentro = m => m>=abre && m<=cierra;
  const ns = dentro(s+720) ? s+720 : s;
  const ne = (e<=abre+60 && dentro(e+720)) ? e+720 : e;
  const corregido = ns!==s && ne>ns ? {start: addMinutesToHHMM(start, ns-s), end: addMinutesToHHMM(end, ne-e)} : null;
  return {abre: pad(Math.floor(abre/60))+':'+pad(abre%60), corregido};
}
// Pregunta (si hace falta) y llama a "seguir" con las horas que quedaron.
// Devuelve true si mostró la pregunta (quien llama debe esperar).
function preguntarMananaTarde(dateKey, start, end, que, seguir, opts){
  const volverAlForm = opts && opts.volverAlForm; // bloqueos: "No" vuelve al formulario para corregir
  const r = revisarMananaTarde(dateKey, start, end);
  if(!r) return false;
  const c = r.corregido;
  if(c){
    showDialog({
      message: `${que} empieza a las ${start} (${horaEnPalabras(start)}), antes de que abra el estudio. ¿Quisiste decir de ${c.start} a ${c.end} (${horaEnPalabras(c.start)} a ${horaEnPalabras(c.end)})?`,
      confirmLabel: `Sí, ${c.start} a ${c.end}`, cancelLabel: volverAlForm ? 'No, la corrijo yo' : `No, dejar ${start} a ${end}`,
      onConfirm: ()=>seguir(c.start, c.end), onCancel: volverAlForm ? null : ()=>seguir(start, end, true),
    });
  } else {
    showDialog({
      message: `${que} empieza a las ${start} (${horaEnPalabras(start)}), antes de que abra el estudio (abre a las ${r.abre}). ¿Está bien así?`,
      confirmLabel: 'Sí, está bien', cancelLabel: 'Corregir la hora',
      onConfirm: ()=>seguir(start, end, true),
    });
  }
  return true;
}

// Hay NUM_BOXES box físicos disponibles: cuantas citas se crucen en el mismo
// horario, sin importar qué especialista las atienda, no puede pasar de esa
// cantidad (una NoShow o Cancelada libera el horario). Antes había 1 solo
// box; ahora 2 (Lucy trajo un segundo box propio, que ella misma arrienda) —
// si el número de box vuelve a cambiar, ajustar solo esta constante.
const NUM_BOXES = 2;
function apptsOverlap(a, b){
  if(a.date !== b.date) return false;
  const aStart = minutesFromMidnight(a.start), aEnd = minutesFromMidnight(a.end);
  const bStart = minutesFromMidnight(b.start), bEnd = minutesFromMidnight(b.end);
  return aStart < bEnd && bStart < aEnd;
}
function overlappingAppts(candidate){
  return state.appointments.filter(a=>
    a.id !== candidate.id &&
    a.estado !== 'Cancelada' && a.estado !== 'NoShow' &&
    apptsOverlap(a, candidate)
  );
}
// Cuántas citas quedarían ocupando box AL MISMO TIEMPO si se agrega `candidate`
// (no basta con contar cuántas citas "tocan" en algún punto el rango de
// `candidate` — dos citas consecutivas, ej. 15:30–16:30 y 16:30–17:30, nunca
// están ocurriendo juntas, aunque una cita de 15:30–17:00 toque a ambas).
// Recorre el rango de `candidate` y devuelve, en el instante de mayor
// ocupación, cuántas citas (contando la propia `candidate`) están activas a
// la vez, junto con cuáles son (sin contar `candidate`).
function peakBoxOccupancy(candidate, overlapping){
  const cStart = minutesFromMidnight(candidate.start), cEnd = minutesFromMidnight(candidate.end);
  const points = new Set([cStart, cEnd]);
  overlapping.forEach(o=>{
    points.add(Math.max(cStart, minutesFromMidnight(o.start)));
    points.add(Math.min(cEnd, minutesFromMidnight(o.end)));
  });
  const sorted = Array.from(points).sort((a,b)=>a-b);
  let best = { count: 1, active: [] };
  for(let i=0;i<sorted.length-1;i++){
    const mid = (sorted[i]+sorted[i+1])/2;
    if(mid < cStart || mid >= cEnd) continue;
    const active = overlapping.filter(o=>{
      const s = minutesFromMidnight(o.start), e = minutesFromMidnight(o.end);
      return s <= mid && mid < e;
    });
    if(active.length + 1 > best.count) best = { count: active.length + 1, active };
  }
  return best;
}

// ---------------- Bloqueos de hora (especialistas) ----------------
const ALL_SPECIALISTS_VALUE = '__TODAS__'; // bloqueo general del estudio (ej: corte de luz), no depende de una especialista
function blockSpecialistLabel(specialist){
  return specialist===ALL_SPECIALISTS_VALUE ? 'Todo el estudio' : (specialist||'');
}
// Último día que cubre un bloqueo (el mismo día si es de un solo día).
function blockLastDate(b){
  return (b.dateEnd && b.dateEnd > b.date) ? b.dateEnd : b.date;
}
function blockIsFullDay(b){
  return !!b.allDay || blockLastDate(b)!==b.date;
}
// Los bloqueos de día completo (o de varios días) se muestran de HOUR_START a
// HOUR_END en la grilla, pero cuentan como bloqueado el día entero.
function allBlocksForDate(dateKey){
  return (state.blocks||[])
    .filter(b=>b.date<=dateKey && dateKey<=blockLastDate(b))
    .map(b=>blockIsFullDay(b) ? {...b, start:pad(HOUR_START)+':00', end:pad(HOUR_END)+':00', fullDay:true} : b)
    .sort((a,b)=>minutesFromMidnight(a.start)-minutesFromMidnight(b.start));
}
// Reparte en columnas los elementos que se cruzan en horario (ej. dos
// especialistas que bloquean la misma hora), para dibujarlos lado a lado.
// Devuelve, para cada elemento, {col, cols}.
// Box habitual de cada especialista: en la vista Día, cuando hay citas al
// mismo tiempo, las del Box 1 van a la izquierda y las del Box 2 a la derecha
// (pedido de Juan Diego: Salomé y Melissa siempre en el 1, Lucy y Helen en el
// 2). Se elige en Más → Especialistas (s.box = 1 | 2 | 'libre'). Si nunca se
// eligió, en Santiago vale BOX_POR_DEFECTO (así funcionó desde el primer día
// sin guardar nada); en otra sede, sin box fijo. Solo cambia DÓNDE se dibuja
// cada cita: ningún dato, precio ni aviso de choque depende de esto.
const BOX_POR_DEFECTO = {salome:1, melissa:1, lucy:2, helen:2};
function sinTildes(s){ return normalizeName(s).normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function boxDeEspecialista(nombre){
  const key = normalizeName(nombre);
  if(!key) return null;
  const s = state.specialists.find(x=>normalizeName(x.name)===key);
  const b = s ? s.box : undefined;
  if(b===1 || b===2) return b;
  if(b==='libre') return null;
  if(SEDE.id!=='santiago') return null;
  return BOX_POR_DEFECTO[sinTildes(nombre)] || null;
}
// Reparte lado a lado lo que se cruza en el horario. Cada grupo de cosas que
// se cruzan entre sí usa sus propias columnas; una cita que no se cruza con
// nada ocupa todo el ancho. Dentro de un grupo, cada una va a la columna de
// su box (Box 1 = 1ra, Box 2 = 2da); si su box ya está ocupado a esa hora
// (ej. Lucy y Helen a la vez, una en la silla de afuera) va a una columna
// extra a la derecha. Lo que no tiene box (bloqueo de "Todas", cita sin
// especialista, una reemplazo sin box) va a la primera columna libre. Las
// columnas que quedan vacías en un grupo se quitan.
function layoutSideBySide(items){
  const pref = items.map(it=>{ const b = boxDeEspecialista(it.specialist); return b ? b-1 : null; });
  const order = items.map((it,i)=>i).sort((a,b)=>
    (minutesFromMidnight(items[a].start)-minutesFromMidnight(items[b].start))
    || ((pref[a]==null) - (pref[b]==null))
    || (a-b));
  const result = items.map(()=>({col:0, cols:1}));
  let cluster = [], laneEnds = [], clusterEnd = -1;
  const isFree = (l, st)=> laneEnds[l]==null || laneEnds[l] <= st;
  const close = ()=>{
    // Quita las columnas que nadie usó en este grupo y renumera en orden.
    const used = [...new Set(cluster.map(i=>result[i].col))].sort((x,y)=>x-y);
    cluster.forEach(i=>{ result[i].col = used.indexOf(result[i].col); result[i].cols = used.length; });
    cluster = []; laneEnds = [];
  };
  order.forEach(i=>{
    const st = minutesFromMidnight(items[i].start), en = minutesFromMidnight(items[i].end);
    if(cluster.length && st >= clusterEnd) close();
    let c;
    if(pref[i]!=null){
      if(isFree(pref[i], st)) c = pref[i];
      else { c = 2; while(!isFree(c, st)) c++; }
    } else {
      c = 0; while(!isFree(c, st)) c++;
    }
    laneEnds[c] = en;
    result[i].col = c;
    cluster.push(i);
    clusterEnd = cluster.length===1 ? en : Math.max(clusterEnd, en);
  });
  if(cluster.length) close();
  return result;
}
// Aviso compacto de quién tiene el día completo bloqueado, para las vistas
// Semana y Mes. En pantallas angostas (teléfono) se ve solo "🚫" + un punto del
// color de cada especialista; en pantallas anchas, también el nombre.
function fullDayBlocksMarkup(dateKey, cls){
  const list = blocksForDate(dateKey).filter(b=>b.fullDay);
  if(!list.length) return '';
  const who = list.map(b=>`<span class="bk-item"><span class="bk-dot" style="background:${specialistColor(b.specialist)}"></span><span class="bk-name">${escapeHtml(blockSpecialistLabel(b.specialist))}</span></span>`).join('');
  return `<div class="${cls}">🚫${who}</div>`;
}
function blockDateLabel(key){
  const d = parseKey(key);
  return `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;
}
function blockWhenLabel(b){
  const last = blockLastDate(b);
  if(last!==b.date) return `${blockDateLabel(b.date)} al ${blockDateLabel(last)}`;
  return blockIsFullDay(b) ? 'Todo el día' : `${b.start}–${b.end}`;
}
// blockWhenLabel(b) por sí sola no incluye la fecha en un bloqueo de un solo
// día (pensada para usarse donde la fecha ya se ve por el contexto, ej. la
// vista de Día) — para listas donde el bloqueo puede ser de cualquier día
// (el aviso de bloqueos nuevos, "Ver bloqueos") hay que anteponer la fecha.
function blockWhenWithDate(b){

function blocksForDate(dateKey){
  const list = allBlocksForDate(dateKey);
  if(ui.specialistFilter==='all') return list;
  return list.filter(b=>b.specialist===ALL_SPECIALISTS_VALUE || normalizeName(b.specialist)===normalizeName(ui.specialistFilter));
}
// Con onlyStudio, solo cuentan los bloqueos de todo el estudio (así, que una
// especialista esté de viaje no le impide a otra tocar esa hora para
// bloquear la suya).
function blockCoversHour(hour, date, onlyStudio){
  const dateKey = toKey(date);
  const slotStart = hour*60, slotEnd = (hour+1)*60;
  return allBlocksForDate(dateKey).find(b=>{
    if(onlyStudio && b.specialist!==ALL_SPECIALISTS_VALUE) return false;
    const bs = minutesFromMidnight(b.start), be = minutesFromMidnight(b.end);
    return slotStart < be && bs < slotEnd;
  });
}
function findCoveringBlock(date, start, end, specialist){
  const dateKey = toKey(date);
  const startMin = minutesFromMidnight(start), endMin = minutesFromMidnight(end);
  return allBlocksForDate(dateKey).find(b=>{
    if(b.specialist!==ALL_SPECIALISTS_VALUE && specialist!==undefined && normalizeName(b.specialist)!==normalizeName(specialist)) return false;
    if(b.fullDay) return true;
    const bs = minutesFromMidnight(b.start), be = minutesFromMidnight(b.end);
    return startMin < be && bs < endMin;
  });
}

// ---------------- Especialistas ----------------
function specialistColor(name){
  if(name===ALL_SPECIALISTS_VALUE) return '#B23A2E';
  const sp = state.specialists.find(s=>normalizeName(s.name)===normalizeName(name));
  return sp ? colorSeguro(sp.color) : '#6B6152';
}
// Un color de especialista va dentro de style="..." en muchos lugares: solo se
// acepta un color "#rrggbb" de verdad (lo que da el selector de colores). Así
// nadie con acceso a la agenda puede esconder un programa en ese campo.
function colorSeguro(c){
  return /^#[0-9a-fA-F]{3,8}$/.test(String(c||'').trim()) ? String(c).trim() : '#6B6152';
}
// Rediseño (oct 2026): negro o blanco, el que más contraste tenga sobre ese
// color (WCAG), para la inicial de cada especialista sobre su color.
function textoSobre(color){
  let h = colorSeguro(color).slice(1);
  if(h.length < 6) h = h.split('').map(c=>c+c).join('');
  const lin = v=>{ v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  const [r,g,b] = [0,2,4].map(i=>lin(parseInt(h.slice(i,i+2),16)));
  const L = 0.2126*r + 0.7152*g + 0.0722*b;
  return (L+0.05)/0.05 >= 1.05/(L+0.05) ? '#0b0a08' : '#ffffff';
}
// Círculo con la inicial de la especialista. La letra va por CSS (data-l), no
// como texto, para no cambiar lo que dice el botón.
function inicialHtml(nombre, color){
  const c = colorSeguro(color);
  const l = String(nombre||'').trim().charAt(0).toUpperCase();
  return `<span class="inicial" aria-hidden="true" data-l="${escapeHtml(l)}" style="background:${c};color:${textoSobre(c)}"></span>`;
}
// Vista Día (rediseño oct 2026): cada ficha muestra solo las líneas que caben
// ENTERAS. Primero se esconde el tratamiento; si ni así cabe, hora y nombre
// pasan a una sola fila. Nunca queda una línea cortada a la mitad (antes, en
// las citas de 1 h, el tratamiento se veía cortado por abajo).
function ajustarFichasDia(raiz){
  (raiz||document).querySelectorAll('.dayrow .appt').forEach(c=>{
    c.classList.remove('sin-serv','apretada','angosta','muy-angosta');
    // A lo ancho: si la fila de la hora no cabe, primero se esconde la hora de
    // término y "Sin abono" pasa a ícono; si aun así no cabe, el ícono va a la
    // esquina (como "Falta firmar").
    const borde = e=>{ const t = e.closest('.t-time'); if(t && t!==e){ const r = t.getBoundingClientRect(); return r.right - parseFloat(getComputedStyle(t).paddingRight) + 1; } return c.getBoundingClientRect().right - 1; };
    const anchoSobra = ()=>Array.from(c.querySelectorAll('.t-time,.t-time > *,.no-abono-badge')).some(e=>e.getClientRects().length && getComputedStyle(e).position!=='absolute' && e.getBoundingClientRect().right > borde(e));
    if(anchoSobra()) c.classList.add('angosta');
    if(anchoSobra()) c.classList.add('muy-angosta');
    if(c.classList.contains('compact')) return;
    const sobra = ()=>{ const fondo = c.getBoundingClientRect().bottom - 1;
      return Array.from(c.children).some(e=>!e.classList.contains('firma-esquina') && getComputedStyle(e).position!=='absolute' && e.getClientRects().length && e.getBoundingClientRect().bottom > fondo); };
    if(sobra()) c.classList.add('sin-serv');
    if(sobra()) c.classList.add('apretada');
  });
}

// Perfil de cada especialista (pedido de Juan Diego, oct 2026), lo llenan
// los dueños en Más → Especialistas:
// - s.noHace = [nombres de servicios que ella NO hace]. Si nunca se marcó
//   nada, hace todo (así un servicio nuevo lo puede hacer cualquiera hasta
//   que se diga lo contrario). En "Nueva cita" solo aparecen las que hacen
//   todos los tratamientos elegidos, y con una especialista elegida lo que
//   ella no hace se ve en gris.
// - s.duraciones = {servicio: minutos} solo donde ella se demora distinto de
//   la duración general (ej. Lucy hace el microblading en 1 h). La cita
//   nueva dura eso. Lo vacío usa la duración de Servicios y tarifario.
// Son campos dentro de cada especialista: no exigió subir APP_VERSION.
function especialistaPorNombre(nombre){
  const key = normalizeName(nombre);
  return key ? state.specialists.find(x=>normalizeName(x.name)===key) || null : null;
}
function especialistaHace(nombreEsp, servicio){
  const s = especialistaPorNombre(nombreEsp);
  if(!s || !Array.isArray(s.noHace) || !servicio) return true;
  return !s.noHace.includes(servicio);
}
function duracionPropia(nombreEsp, servicio){
  const s = especialistaPorNombre(nombreEsp);
  const m = s && s.duraciones ? Number(s.duraciones[servicio]) : 0;
  return m>0 ? m : null;
}
function duracionServicioPara(svc, nombreEsp){
  if(!svc) return 0;
  return duracionPropia(nombreEsp, svc.name) || (Number(svc.duration)||0);
}
function filterBySpecialist(list){
  if(ui.specialistFilter==='all') return list;
  return list.filter(a=>normalizeName(a.specialist)===normalizeName(ui.specialistFilter));
}

function deriveClientsFromAppointments(appts){
  const map = new Map();
  (appts || state.appointments).slice()
    .sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))
    .forEach(a=>{
      if(!a.client) return;
      map.set(normalizeName(a.client), {id:uid(), name:a.client, phone:a.phone||'', lastService:summarizeServices(a.services||[]), lastDate:a.date});
    });
  return Array.from(map.values());
}
function upsertClient(name, phone, service){
  if(!name) return;
  const key = normalizeName(name);
  let c = state.clients.find(c=>normalizeName(c.name)===key);
  if(c){
    if(phone) c.phone = phone;
    c.lastService = service;
    c.lastDate = toKey(new Date());
  } else {
    state.clients.push({id:uid(), name, phone, lastService:service, lastDate:toKey(new Date())});
  }
}
// Correo de la clienta: se toma de su cita más reciente que tenga uno (no se
// guarda aparte en state.clients), para autocompletarlo al elegirla.
function lastEmailForClient(name){
  const key = normalizeName(name);
  const withEmail = state.appointments
    .filter(a=>a.email && normalizeName(a.client)===key)
    .sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
  return withEmail.length ? withEmail[0].email : '';
}
function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}
function findClientMatches(query){
  const q = normalizeName(query);
  if(!q) return [];
  return state.clients
    .filter(c=>normalizeName(c.name).includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name))
    .slice(0,6);
}
function getClientStats(){
  const map = new Map();
  state.clients.forEach(c=>{
    map.set(normalizeName(c.name), {name: c.name, phone: c.phone||'', appts: []});
  });
  state.appointments.forEach(a=>{
    if(!a.client) return;
    const key = normalizeName(a.client);
    if(!map.has(key)) map.set(key, {name: a.client, phone: a.phone||'', appts: []});
    const entry = map.get(key);
    entry.appts.push(a);
    if(a.phone && !entry.phone) entry.phone = a.phone;
  });
  return Array.from(map.values()).map(c=>{
    const sorted = c.appts.slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
    // Mismo criterio que en el resumen del día (ver apptRevenue): si la cita se
    // canceló o no llegó, solo cuenta el abono (salvo que se haya devuelto) como
    // plata gastada, no el precio completo del servicio que nunca se hizo.
    const totalSpent = c.appts.reduce((s,a)=> s + apptRevenue(a), 0);
    return {
      name: c.name, phone: c.phone, count: c.appts.length, totalSpent,
      lastDate: sorted[0] ? sorted[0].date : null,
      appts: sorted,
    };
  }).sort((a,b)=>(b.lastDate||'').localeCompare(a.lastDate||''));
}
function renderClientSuggestions(query){
  const box = document.getElementById('client-ac');
  if(!box) return;
  const matches = findClientMatches(query);
  if(!matches.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = matches.map(c=>`
    <div class="ac-item" data-name="${escapeHtml(c.name)}" data-phone="${escapeHtml(c.phone||'')}">
      <div class="ac-name">${escapeHtml(c.name)}</div>
      <div class="ac-meta">${escapeHtml(c.phone||'Sin teléfono')}${c.lastService?' · Última: '+escapeHtml(c.lastService):''}</div>
    </div>`).join('');
  box.style.display='block';
}

function serviceSummaryHtml(count, totalDuration, totalPrice){

  return `

function getServiceQuantities(){
  return Array.from(document.querySelectorAll('[data-svc-row]')).map(row=>({
    idx: Number(row.dataset.svcRow),
    qty: Number(row.dataset.qty)||0
  })).filter(x=>x.qty>0);
}
function especialistaDelForm(){
  const sel = document.getElementById('f-specialist');
  return sel ? sel.value : '';
}
function getTotalDuration(){
  const q = getServiceQuantities();
  const durGarantia = duracionGarantiaElegida();
  const esp = especialistaDelForm();
  const total = q.reduce((sum,{idx,qty})=>{
    const svc = state.services[idx];
    if(!svc) return sum;
    // Una garantía dura lo que el tratamiento del que es garantía. Si la
    // especialista elegida se demora distinto en algo, cuenta lo suyo.
    const dur = esServicioGarantia(svc.name) && durGarantia!=null ? durGarantia : duracionServicioPara(svc, esp);
    return sum + dur*qty;
  }, 0);
  return total || 60;
}
function setServiceQty(idx, qty){
  const row = document.querySelector(`[data-svc-row="${idx}"]`);
  if(!row) return;
  const clamped = Math.max(0, Math.min(9, qty));
  row.dataset.qty = clamped;
  row.classList.toggle('checked', clamped>0);
  const num = row.querySelector('.svc-qty-num');
  if(num) num.textContent = clamped;
  const decBtn = row.querySelector('[data-svc-dec]');
  if(decBtn) decBtn.disabled = clamped<=0;
  recomputeServiceFields();
}
function recomputeServiceFields(){
  actualizarCampoGarantia();
  actualizarPerfilEnForm();
  const q = getServiceQuantities();
  const isNew = ui.modal && ui.modal.mode === 'new';
  const cremaEl = document.getElementById('f-crema');
  // En una cita NUEVA, un retoque nunca lleva la crema incluida gratis (se
  // puede comprar aparte si corresponde, pero no se regala) — sin importar
  // el interruptor general de "crema incluida". Se revisa cada vez que
  // cambia la selección de servicios, para que el stepper de crema
  // aparezca o se esconda solo.
  if(isNew){
    const stepperWrap = document.getElementById('crema-stepper-wrap');
    const note = document.getElementById('crema-incluida-note');
    if(stepperWrap && note){
      const isRetoqueNow = q.some(({idx})=>/retoque/i.test(state.services[idx]?.name||''));
      const showStepper = !state.settings.cremaIncluida || isRetoqueNow;
      if(showStepper){
        stepperWrap.style.display = '';
        note.style.display = 'none';
      } else {
        stepperWrap.style.display = 'none';
        note.style.display = '';
        if(cremaEl && Number(cremaEl.value)>0){
          cremaEl.value = 0;
          const num = document.getElementById(cremaEl.id+'-num');
          if(num) num.textContent = '0';
        }
      }
    }
  }
  const totalCount = q.reduce((s,x)=>s+x.qty,0);
  const totalPrice = q.reduce((s,{idx,qty})=> s + (state.services[idx] ? (Number(state.services[idx].price)||0)*qty : 0), 0);
  const totalDuration = getTotalDuration();
  const cremaExtra = cremaEl ? CREMA_PRICE*(Number(cremaEl.value)||0) : 0;
  const finalPrice = totalPrice + cremaExtra;

  const chipsBox = document.getElementById('svc-chips');
  if(chipsBox){
    chipsBox.innerHTML = renderServiceChipsMarkup(q);
  }
  const summary = document.getElementById('svc-summary');
  if(summary){
    summary.innerHTML = serviceSummaryHtml(totalCount, totalDuration, totalPrice);
  }

  const priceInput = document.getElementById('f-price');
  const abonoInput = document.getElementById('f-abono');
  const saldoInput = document.getElementById('f-saldo');
  const startInput = document.getElementById('f-start');
  const endInput = document.getElementById('f-end');
  if(priceInput) priceInput.value = finalPrice;
  // El abono por defecto ($5.000 por tratamiento) solo tiene sentido sugerirlo
  // en una cita NUEVA. En una cita que ya existe, cambiar la cantidad de un
  // servicio (por cualquier motivo, incluso uno que no tenga que ver con el
  // pago) NUNCA debe borrar el abono que ya quedó registrado/cobrado.
  if(isNew && abonoInput){
    // Una garantía es gratis: no se le sugiere abono.
    const conAbono = q.filter(({idx})=>!esServicioGarantia(state.services[idx] && state.services[idx].name)).reduce((s,x)=>s+x.qty,0);
    abonoInput.value = abonoSugeridoPorTratamiento() * conAbono;
  }
  if(abonoInput && saldoInput){
    // Si el saldo está dividido entre dos métodos de pago, su valor ya lo
    // controla esa suma (ver listeners de f-montoSaldo1/2) — no lo pisamos aquí.
    const splitSaldoBox = document.getElementById('split-saldo');
    const saldoIsSplit = splitSaldoBox && splitSaldoBox.style.display !== 'none';
    if(!saldoIsSplit){
      saldoInput.value = Math.max(finalPrice - (Number(abonoInput.value)||0), 0);
    }
  }
  if(startInput && endInput && startInput.value){
    endInput.value = addMinutesToHHMM(startInput.value, totalDuration);
  }
  actualizarPerfilEnForm(); // con la hora de término nueva (bloqueos)
}

// ---------------- Carga / guardado (Firestore, en tiempo real) ----------------
// Las partes del documento de Firestore que maneja la agenda (lo mismo que
// escribe saveData).
const DOC_KEYS = ['appointments','services','specialists','clients','blocks','courses','expenses','recurringExpenses','recurringIncomes','stockItems','vales','ajustes','pagos','settings'];

// Convierte el documento tal como viene de Firestore en la forma en que la
// agenda lo usa (servicios ordenados, valores por defecto, etc.). Devuelve
// siempre una copia nueva, nunca comparte objetos con "data".
function normalizeDoc(data){
  const d = JSON.parse(JSON.stringify(data || {}));
  const appointments = (d.appointments || []).map(a=>{
    if(!Array.isArray(a.services)) a.services = a.service ? [a.service] : [];
    // Cantidad de cremas siempre explícita (las citas viejas solo tenían
    // cremaComprada), para comparar bien qué cambió al guardar.
    a.cremaCantidad = apptCremas(a);
    return a;
  });
  // Las listas por defecto (servicios con precios en pesos chilenos, y las
  // especialistas de Santiago) son solo de Santiago: otra sede arranca vacía.
  const conDefaults = SEDE.id==='santiago';
  const services = (d.services && d.services.length) ? d.services : (conDefaults ? JSON.parse(JSON.stringify(DEFAULT_SERVICES)) : []);
  services.forEach(s=>{ if(s.duration==null) s.duration = 60; });
  services.sort((a,b)=>(a.name||'').localeCompare(b.name||'', 'es', {sensitivity:'base'}));
  return {
    appointments,
    services,
    specialists: (d.specialists && d.specialists.length) ? d.specialists : (conDefaults ? DEFAULT_SPECIALISTS.map(s=>Object.assign({}, s)) : []),
    clients: (d.clients && d.clients.length) ? d.clients : deriveClientsFromAppointments(appointments),
    blocks: d.blocks || [],
    courses: d.courses || [],
    expenses: d.expenses || [],
    recurringExpenses: d.recurringExpenses || [],
    recurringIncomes: d.recurringIncomes || [],
    stockItems: d.stockItems || [],
    vales: d.vales || [],
    ajustes: d.ajustes || [],
    pagos: d.pagos || [],
    settings: Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), d.settings || {}),
  };
}
function stateDocCopy(){
  const out = {};
  DOC_KEYS.forEach(k=>{ out[k] = state[k]; });
  return JSON.parse(JSON.stringify(out));
}

let remoteDataSeq = 0; // cuántas veces llegó una versión nueva de la base de datos
function applyRemoteData(data){
  remoteDataSeq++;
  // Copia profunda de cómo llegó el documento (la usa "Deshacer").
  lastRemoteData = JSON.parse(JSON.stringify(data));
  // lastRemoteBase: el documento tal como está en la base de datos, ya
  // preparado igual que state — es la referencia contra la que saveData
  // calcula "qué cambió este teléfono".
  lastRemoteBase = normalizeDoc(data);
  // Si hay guardados de este teléfono todavía en camino, se siguen mostrando
  // encima de lo que llegó (si no, desaparecerían un instante de la pantalla).
  const pending = pendingSaves.length ? pendingSaves[pendingSaves.length-1] : null;
  const view = pending ? mergeDocs(pending.base, pending.mine, lastRemoteBase) : normalizeDoc(data);
  DOC_KEYS.forEach(k=>{ state[k] = view[k]; });
  if(state.appointments.length > lastKnownGoodCount) lastKnownGoodCount = state.appointments.length;
}

  (state.expenses||[]).forEach(g=>{ if(g.metodoPago) g.metodoPago = normalizePaymentMethod(g.metodoPago); });

  state.settings[PAYMENT_METHOD_NORMALIZE_KEY] = true;
  return true;
}

// Contraseñas para ver el calendario: una por cada cuenta de CUENTAS (equipo
// de Santiago, equipo de Buenos Aires, dueños). El correo es solo un
// identificador técnico que pide Firebase por dentro, nadie lo escribe ni lo
// ve. La cuenta con la que se entra decide la sede y el modo (ver
// aplicarCuenta).

function startRealtimeSync(){
  if(!FIREBASE_READY){
    document.getElementById('root').innerHTML = '<div class="loading">No se pudo cargar Firebase (revisa tu conexión a internet o vuelve a intentarlo). Si el problema sigue, avísame.</div>';
    return;
  }
  let syncStarted = false, revisandoPerfil = false;
  firebase.auth().onAuthStateChanged(user=>{
    if(creandoCuenta) return; // la pantalla "Crear cuenta" se encarga
    if(syncStarted){
      // La sesión se cerró sola con la agenda abierta (ej. se borró la cuenta
      // con la que se había entrado): se recarga para pedir la contraseña.
      if(!user || user.isAnonymous) reloadFresh();
      return;
    }
    // Un teléfono que había entrado con una cuenta que ya no se usa (las de
    // los correos viejos): se cierra esa sesión y se pide la contraseña, que
    // entra con la cuenta nueva.
    // Un usuario personal (no está en CUENTAS): se lee su perfil para saber
    // sede y nombre. Si no tiene perfil o está desactivado, se cierra la sesión.
    if(user && !user.isAnonymous && !esCuentaConocida(user)){
      if(revisandoPerfil) return;
      revisandoPerfil = true;
      cargarPerfilPersonal(user).then(perfil=>{
        revisandoPerfil = false;
        if(perfil===null){ revisarCuentaSinAcceso(user); return; }
        if(!perfil){
          avisoLoginGate = 'Tu acceso a la agenda está desactivado. Si crees que es un error, avísale a Sibana.';
          firebase.auth().signOut().catch(err=>console.error(err));
          return;
        }
        syncStarted = true;
        aplicarCuenta(user, perfil);
        startFirestoreSync();
      }).catch(err=>{
        revisandoPerfil = false;
        console.error('No se pudo leer el usuario', err);
        document.getElementById('root').innerHTML = '<div class="loading">No se pudo comprobar tu usuario (¿sin señal?). Revisa tu conexión a internet y <a href="#" onclick="reloadFresh();return false;">vuelve a intentar</a>.</div>';
      });
      return;
    }
    if(user && !user.isAnonymous && esCuentaCompartidaApagada(user)){
      avisoLoginGate = 'Desde ahora cada una entra con su propia cuenta. Si todavía no tienes una, toca "Crear cuenta".';
      firebase.auth().signOut().catch(err=>console.error(err));
      return;
    }
    if(user && !user.isAnonymous){
      syncStarted = true;
      aplicarCuenta(user);
      startFirestoreSync();
    } else {
      showTeamLoginGate();
    }
  });
}

// Cuando la agenda vuelve a primer plano (se desbloquea el teléfono, se
// vuelve a la app), se piden los datos frescos a la base de datos de
// inmediato, en vez de confiar en que la conexión en tiempo real siga viva:
// en los teléfonos, una app que pasó horas en segundo plano puede quedar
// "dormida" mostrando datos viejos sin avisar.
let refreshInFlight = false;
function refreshFromServer(){
  if(!ui.loaded || !db || !DOC_REF || refreshInFlight) return;
  refreshInFlight = true;
  let finished = false;
  const timer = setTimeout(()=>{ if(!finished) setOffline(true); }, 8000);
  // Se lee con una transacción (el mismo camino que usa el guardado): así
  // funciona aunque la conexión en tiempo real esté "dormida" — una lectura
  // normal usaría esa misma conexión dormida y se quedaría esperando.
  let raw = null;
  db.runTransaction(tx=>tx.get(DOC_REF).then(snap=>{ raw = snap.exists ? snap.data() : null; })).then(()=>{
    finished = true;
    clearTimeout(timer);
    setOffline(false);
    if(!raw) return; // nunca se actúa sobre un "no existe" (lección 1)
    checkRemoteVersion(raw);
    if(lastRemoteBase && sameValue(normalizeDoc(raw), lastRemoteBase)) return; // ya estaba al día
    // Llegó algo que la conexión en tiempo real no había traído: se muestra
    // y se reinicia esa conexión para que vuelva a funcionar.
    applyRemoteData(raw);
    if(!ui.modal) render();
    restartRealtime();
  }).catch(err=>{
    finished = true;
    clearTimeout(timer);
    console.error('No se pudieron actualizar los datos', err);
    if(cerrarSiSinPermiso(err)) return;
    setOffline(true);
  }).finally(()=>{ refreshInFlight = false; });
}
let reconnecting = false;
function restartRealtime(){
  if(reconnecting) return;
  reconnecting = true;
  db.disableNetwork().then(()=>db.enableNetwork()).catch(err=>console.error('No se pudo reiniciar la conexión', err))
    .finally(()=>setTimeout(()=>{ reconnecting = false; }, 4000));
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshFromServer(); });
window.addEventListener('online', ()=>refreshFromServer());
window.addEventListener('offline', ()=>setOffline(true));
// Mientras la agenda está en pantalla, cada 2 minutos se confirma que lo que
// se ve está al día (1 lectura; no cuesta nada dentro del plan gratis).
setInterval(()=>{ if(document.visibilityState==='visible') refreshFromServer(); if(ui.loaded) escucharFichasRecientes(); }, 2*60*1000);

// Lo que se escribe en "Correo" al entrar: un correo, o (cuentas viejas) un
// usuario corto como "salome", que por dentro es emailDeUsuario().
function correoDeEntrada(v){
  v = String(v||'').trim();
  if(!v) return '';
  return v.includes('@') ? v.toLowerCase() : emailDeUsuario(v);
}
function correoValido(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'')); }

function showTeamLoginGate(){
  const root = document.getElementById('root');
  const conUsuario = campoUsuarioVisible();
  root.innerHTML = `
    <div class="login-gate">
      <img src="${LOGO_SRC}" alt="Sibana" class="login-gate-logo">
      <h1 class="serif">Agenda Sibana</h1>
      <p class="hint">${conUsuario ? 'Entra con tu correo electrónico y tu contraseña.' : 'Ingresa la contraseña del equipo para entrar.'}</p>
      <div class="login-gate-box">
        ${conUsuario ? `<label class="auth-label" for="team-login-user">Correo electrónico</label>
        <input type="email" id="team-login-user" class="client-search-input" placeholder="nombre@gmail.com" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        <label class="auth-label" for="team-login-input">Contraseña</label>` : ''}
        <div class="pw-field">
          <input type="password" id="team-login-input" class="client-search-input" placeholder="${conUsuario ? '' : 'Contraseña'}" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="team-login-toggle" aria-label="Mostrar contraseña">👁</button>
        </div>
        <div id="team-login-error" class="login-gate-error"></div>
        <button class="btn btn-primary" id="team-login-btn" style="width:100%;">Entrar</button>
        ${conUsuario ? `
        <div style="margin-top:10px;"><button type="button" id="team-login-olvide" class="auth-link">¿Olvidaste tu contraseña?</button></div>
        <div class="auth-sep">¿Primera vez?</div>
        <button type="button" id="team-login-crear" class="auth-outline">Crear cuenta</button>` : ''}
      </div>
    </div>`;
  const input = document.getElementById('team-login-input');
  const userInput = document.getElementById('team-login-user');
  const btn = document.getElementById('team-login-btn');
  const errBox = document.getElementById('team-login-error');
  if(avisoLoginGate){ errBox.textContent = avisoLoginGate; avisoLoginGate = ''; }
  document.getElementById('team-login-toggle').addEventListener('click', ()=>{
    input.type = input.type==='password' ? 'text' : 'password';
  });
  const submit = ()=>{
    const pass = input.value;
    if(!pass){ errBox.textContent = 'Escribe la contraseña.'; return; }
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    errBox.textContent = '';
    // Solo se escribe la contraseña: se prueba con cada cuenta, en orden
    // (primero el equipo de Santiago, así a ellas les funciona igual que
    // siempre). Si ninguna la acepta, es una contraseña incorrecta.
    const compartidas = CUENTAS.filter(c=>CUENTAS_COMPARTIDAS_EQUIPO || c.rol!=='equipo');
    const tryAccount = i=>{
      if(i >= compartidas.length) return Promise.reject(new Error('Ninguna cuenta aceptó la contraseña'));
      return firebase.auth().signInWithEmailAndPassword(compartidas[i].email, pass).catch(()=>tryAccount(i+1));
    };
    // Con correo: su cuenta personal. Sin correo: las cuentas compartidas.
    const correo = userInput ? correoDeEntrada(userInput.value) : '';
    const intento = correo
      ? firebase.auth().signInWithEmailAndPassword(correo, pass)
      : tryAccount(0);
    intento.catch(err=>{
      console.error('No se pudo iniciar sesión', err);
      errBox.textContent = /too-many-requests/.test((err && err.code) || '')
        ? 'Demasiados intentos. Espera unos minutos y vuelve a intentar.'
        : (correo ? 'Correo o contraseña incorrectos. Intenta de nuevo.'
          : (!CUENTAS_COMPARTIDAS_EQUIPO && userInput ? 'Escribe tu correo y tu contraseña. Si todavía no tienes cuenta, toca "Crear cuenta".' : 'Contraseña incorrecta. Intenta de nuevo.'));
      btn.disabled = false;
      btn.textContent = 'Entrar';
      input.value = '';
      input.focus();
    });
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  if(userInput){
    userInput.addEventListener('keydown', e=>{ if(e.key==='Enter') input.focus(); });
    document.getElementById('team-login-crear').addEventListener('click', mostrarCrearCuenta);
    document.getElementById('team-login-olvide').addEventListener('click', ()=>{
      const correo = correoDeEntrada(userInput.value);
      if(!correo || !correoValido(correo)){ errBox.textContent = 'Escribe tu correo arriba y vuelve a tocar "¿Olvidaste tu contraseña?".'; userInput.focus(); return; }
      firebase.auth().sendPasswordResetEmail(correo).catch(err=>{
        // No se dice si el correo existe o no (así nadie puede averiguar
        // quién tiene cuenta); solo se avisa si falló la conexión.
        if(err && /network/.test(err.code||'')) throw err;
        console.error(err);
      }).then(()=>{
        errBox.textContent = '';
        showAlert('Si ese correo tiene una cuenta, te llegó un mensaje para elegir una contraseña nueva. Revisa tu correo (mira también en "Spam" o "Correo no deseado"). El enlace dura 1 hora.');
      }).catch(()=>{ errBox.textContent = 'No se pudo mandar el correo (¿sin señal?). Vuelve a intentarlo.'; });
    });
    userInput.focus();
  } else input.focus();
}

      btn.disabled = false; btn.textContent = 'Crear cuenta';

      if(/email-already-in-use/.test(code)) errBox.textContent = 'Ese correo ya tiene una cuenta. Vuelve atrás y entra con él (si no te acuerdas de la contraseña, toca "¿Olvidaste tu contraseña?").';
      else if(/invalid-email/.test(code)) errBox.textContent = 'Revisa tu correo: parece que está mal escrito.';
      else if(/weak-password/.test(code)) errBox.textContent = 'Esa contraseña es muy fácil de adivinar. Usa una más larga.';
      else if(/too-many-requests/.test(code)) errBox.textContent = 'Demasiados intentos. Espera unos minutos y vuelve a intentar.';
      else errBox.textContent = 'No se pudo crear la cuenta (¿sin señal?). Vuelve a intentarlo.';
    });
  };
  btn.addEventListener('click', enviar);
  repetir.addEventListener('keydown', e=>{ if(e.key==='Enter') enviar(); });
  $('cc-nombre').focus();
}
async function crearCuentaPropia(nombre, correo, clave){
  creandoCuenta = true;
  try{
    const user = (await firebase.auth().createUserWithEmailAndPassword(correo, clave)).user;
    // El nombre también queda en la cuenta, por si el pedido no alcanzara a
    // guardarse (se vuelve a pedir solo al entrar, ver revisarCuentaSinAcceso).
    try{ await user.updateProfile({displayName: nombre}); }catch(e){ console.error(e); }
    await pedirAcceso(user, nombre);
  }finally{ creandoCuenta = false; }
}
function pedirAcceso(user, nombre){
  return db.collection(SOLICITUDES_COLECCION).doc(user.uid).set({
    nombreCompleto: String(nombre || user.displayName || user.email || '').slice(0, 80),

// Entró con una cuenta que no tiene acceso (no está en sibana-usuarios):
// - creó su cuenta con "Crear cuenta" y no la aprueban todavía → se le dice
//   que avise a Sibana (y si por algo no quedó su pedido, se deja ahora:
//   esas cuentas tienen su nombre guardado, displayName);
// - su pedido fue rechazado → "no tiene acceso";
// - cualquier otra cuenta (ej. una vieja que ya no se usa) → se cierra la
//   sesión y vuelve la pantalla de entrada, como antes.
function revisarCuentaSinAcceso(user){
  pantallaCuenta('<p class="hint">Revisando tu cuenta…</p>');
  const salir = `firebase.auth().signOut().finally(()=>reloadFresh())`;
  const esperando = ()=>{
    const nombre = String(user.displayName || '').split(' ')[0];
    pantallaCuenta(`
      <div class="auth-icon wait">⏳</div>
      <p class="auth-title">Hola${nombre ? ' ' + escapeHtml(nombre) : ''} 👋</p>
      <p class="auth-sub">Tu cuenta (<b>${escapeHtml(user.email||'')}</b>) ya está creada, pero <b>todavía no tiene acceso</b>.<br>Avísale a Sibana y, cuando te confirmen, toca "Volver a revisar".</p>
      <div class="login-gate-box">
        <button class="btn btn-primary" style="width:100%;" onclick="reloadFresh()">Volver a revisar</button>
        <div style="margin-top:12px;"><button type="button" class="auth-link" onclick="${salir}">Salir (entrar con otra cuenta)</button></div>
      </div>`);
  };
  db.collection(SOLICITUDES_COLECCION).doc(user.uid).get().then(snap=>{
    if(snap.exists && snap.data().rechazada){
      pantallaCuenta(`
        <p class="auth-sub">Esta cuenta (<b>${escapeHtml(user.email||'')}</b>) no tiene acceso a la agenda. Si crees que es un error, avísale a Sibana.</p>
        <div class="login-gate-box"><button class="btn btn-primary" style="width:100%;" onclick="${salir}">Salir</button></div>`);
    } else if(snap.exists){
      esperando();
    } else if(user.displayName){
      pedirAcceso(user, user.displayName).catch(err=>console.error('No se pudo dejar el pedido de acceso', err)).then(esperando);
    } else {
      avisoLoginGate = 'Esa cuenta no tiene acceso a la agenda.';
      firebase.auth().signOut().catch(err=>console.error(err));
    }
  }).catch(err=>{
    console.error('No se pudo revisar el pedido de acceso', err);
    pantallaCuenta(`<p class="hint">No se pudo comprobar tu cuenta (¿sin señal?). Revisa tu conexión a internet y <a href="#" onclick="reloadFresh();return false;">vuelve a intentar</a>.</p>`);
  });
}

function startFirestoreSync(){
  DOC_REF.onSnapshot({includeMetadataChanges:true}, snap=>{
    // fromCache = lo que se ve viene de la memoria del teléfono, no de la
    // base de datos (sin conexión).
    const fromCache = !!(snap.metadata && snap.metadata.fromCache);
    // (al reiniciar la conexión a propósito, un momento "sin conexión" es
    // normal y no se muestra)
    if(!(fromCache && reconnecting)) setOffline(fromCache);
    // Sin conexión no se toca nada: se sigue mostrando lo último que llegó de
    // la base de datos (con el aviso de "Sin conexión" arriba).
    if(fromCache && (ui.loaded || !snap.exists)) return;
    if(snap.exists){
      checkRemoteVersion(snap.data());
      applyRemoteData(snap.data());
      // Las cargas y correcciones de datos viejos son SOLO de Santiago (datos
      // reales de Santiago): nunca deben correr en otra sede.
      const migrated = SEDE.migraciones ? runSantiagoMigrations() : false;
      ui.loaded = true;
      // Si hay un modal abierto (alguien escribiendo), no lo interrumpimos con un
      // re-render completo — los datos ya quedaron actualizados por dentro y se
      // van a ver apenas cierre ese modal.
      if(!ui.modal) render();
      if(migrated) saveData({recordUndo:false, silent:true});
      runDailyAutoBackupIfNeeded();
      actualizarDolarAutomatico();
      checkUnseenBlocksIfNeeded();
      avisoEspacioSiHaceFalta();
      checkStaffIdentityIfNeeded();
      checkNewServicesIfNeeded();
      avisoSedeSiCambio();
      escucharFichasRecientes();
      vincularConsentimientosSolos();
    } else {
      // No existe ningún documento en la base de datos. Después de la primera
      // vez que se configuró Firebase, esto NUNCA debería volver a pasar — si
      // aparece ahora, es señal de un problema de lectura/conexión, no de una
      // base de datos nueva. Por seguridad, jamás se guarda nada automáticamente
      // en este caso: así un error pasajero de lectura no puede borrar datos
      // reales que sí existen del otro lado.
      ui.loaded = true;
      // Una sede nueva (Buenos Aires) arranca sin documento: solo un dueño
      // puede crearlo, y solo tocando el botón a propósito — nunca solo.
      if(SEDE.id!=='santiago'){ document.getElementById('root').innerHTML = sedeSinCrearHtml(); return; }
      document.getElementById('root').innerHTML = '<div class="loading">⚠️ No se pudo leer la base de datos (o aparenta estar vacía). Por seguridad, la agenda no va a guardar ni sobrescribir nada mientras esto pase — no agendes nada aquí y avísale a Juan Diego antes de seguir. Prueba recargando la página o revisando tu conexión a internet.'
        + (ui.mode==='admin' ? '<br><br>Si de verdad se perdieron los datos, puedes recuperarlos desde un respaldo:<br><button class="btn btn-ghost" style="margin-top:10px;" onclick="abrirRescate()">🗓️ Ver respaldos para restaurar</button>' : '')
        + '</div>';
    }
  }, err=>{
    console.error('Error de sincronización', err);
    // Sin permiso = la cuenta con la que se entró ya no sirve (ej. una de las
    // cuentas viejas): se cierra la sesión y vuelve a pedir la contraseña.
    if(cerrarSiSinPermiso(err)) return;
    ui.loaded = true;
    render();
    showAlert('No se pudo conectar con la base de datos compartida (Firebase). Revisa tu conexión a internet o la configuración del proyecto.');
  });
}

      if(SEDE.preciosIniciales){
        // Misma moneda que Santiago (Viña): se copian los servicios con sus

        // apertura de la sede (SEDE.preciosIniciales; un retoque nunca).
        services = lista.map(x=>{

        // micropigmentación (llevan el descuento) las que claramente lo son;
        // el resto se puede marcar a mano en Servicios.
        services = lista.map(x=>({
          name: x.name, price: 0, duration: x.duration||60,
          micropigmentacion: !/retoque/i.test(x.name||'') && /microblading|sombreado|delineado|mixbrows|t[eé]cnica mixta|full lips/i.test(x.name||''),
        }));
      }
    }catch(e){ console.error('No se pudo leer la lista de servicios de Santiago (se crea vacía)', e); }
    const settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    settings.cremaIncluida = true; // en las sedes nuevas la crema va incluida desde el primer día
    settings.creadaEn = new Date().toISOString();
    const inicial = {

      settings, appVersion: APP_VERSION,

    };
    await db.runTransaction(async tx=>{

let lastKnownGoodCount = 0; // la mayor cantidad de citas que se ha visto realmente cargada esta sesión

// ---------------- Deshacer último cambio ----------------
// lastRemoteData: una copia de cómo estaba el documento en Firestore la
// última vez que se leyó (antes de aplicar cualquier cambio nuevo).
// undoSnapshot: a qué versión anterior volvería "Deshacer" si se aprieta
// ahora — se arma justo antes de cada guardado real (no en los guardados
// automáticos de migraciones, para no confundir un "Deshacer" con deshacer
// una corrección automática que ya se hizo sola).
let lastRemoteData = null;
let undoSnapshot = null;
let lastRemoteBase = null;
let pendingSaves = []; // guardados de este teléfono que todavía no terminan ({base, mine})

// ---------------- Guardado sin pisar a los demás ----------------
// Antes, cada guardado escribía la agenda COMPLETA tal como la tenía ese
// teléfono. Si un teléfono estaba "dormido" (la agenda abierta horas en
// segundo plano, sin recibir los cambios de los demás) y guardaba cualquier
// cosa, borraba todo lo que otros habían hecho mientras tanto — así se
// perdían los pagos que marcaban las especialistas y se "perdió" un curso.
// Ahora, justo antes de guardar, se lee la versión más reciente de la base
// de datos y se le aplica SOLO lo que este teléfono cambió (comparando con
// la última versión que este teléfono había recibido).
function stableStringify(v){
  if(v===undefined) return 'undefined';
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stableStringify).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
}
function sameValue(a,b){ return stableStringify(a)===stableStringify(b); }
// Para decidir si un campo "cambió": vacío, 0, false y "no existe" cuentan
// igual (ej. el formulario de Admin guarda montoSaldo2:0 en una cita que no
// tenía ese campo — eso no es un cambio real y no debe pisar lo de otro).
function sameField(a,b){
  const n = v=>(v===undefined||v===null||v===''||v===false||v===0) ? null : v;
  return sameValue(n(a), n(b));
}
// Un objeto (una cita, la configuración...) campo por campo: si este
// teléfono no tocó un campo, queda lo que hay en la base de datos; si lo
// tocó, queda lo suyo.
function mergeObj3(base, mine, theirs){
  base = base || {}; mine = mine || {}; theirs = theirs || {};
  const out = {};
  new Set([...Object.keys(mine), ...Object.keys(theirs)]).forEach(k=>{
    const v = sameField(mine[k], base[k]) ? theirs[k] : mine[k];
    if(v!==undefined) out[k] = v;
  });
  return out;
}
function hasUniqueIds(list){
  if(!Array.isArray(list)) return false;
  const seen = new Set();
  for(const x of list){
    if(!x || typeof x!=='object' || x.id==null || seen.has(x.id)) return false;
    seen.add(x.id);
  }
  return true;
}
// Una lista (citas, bloqueos, cursos...). Si todos sus elementos tienen id,
// se mezcla elemento por elemento; si no (ej. servicios), la lista se trata
// como un solo valor.
function mergeList3(base, mine, theirs){
  base = base || []; mine = mine || []; theirs = theirs || [];
  if(!(hasUniqueIds(base) && hasUniqueIds(mine) && hasUniqueIds(theirs))){
    return sameValue(mine, base) ? theirs : mine;
  }
  const B = new Map(base.map(x=>[x.id,x]));
  const M = new Map(mine.map(x=>[x.id,x]));
  const T = new Map(theirs.map(x=>[x.id,x]));
  const out = [];
  theirs.forEach(t=>{
    const id = t.id, b = B.get(id), m = M.get(id);
    if(!b && !m){ out.push(t); return; }              // lo agregó otro teléfono
    if(b && !m) return;                               // este teléfono lo borró
    if(!b && m){ out.push(mergeObj3({}, m, t)); return; }
    if(sameValue(m,b)) out.push(t);                   // este teléfono no lo tocó
    else if(sameValue(t,b)) out.push(m);              // solo este teléfono lo cambió
    else out.push(mergeObj3(b, m, t));                // ambos lo cambiaron: campo por campo
  });
  mine.forEach(m=>{
    if(T.has(m.id)) return;
    if(B.has(m.id)) return;                           // otro teléfono lo borró
    out.push(m);                                      // este teléfono lo agregó
  });
  return out;
}
function mergeDocs(base, mine, theirs){
  const out = {};
  DOC_KEYS.forEach(k=>{
    out[k] = k==='settings' ? mergeObj3(base.settings, mine.settings, theirs.settings)
                            : mergeList3(base[k], mine[k], theirs[k]);
  });
  return JSON.parse(JSON.stringify(out));
}

  if(!el) return;
  if(appOutdated){
    el.innerHTML = `<div class="sync-banner-msg update"><span>🔄 Hay una versión nueva de la agenda. Recarga para seguir guardando cambios. (Si después de recargar sigue apareciendo, espera unos minutos y vuelve a recargar.)</span><button type="button" onclick="reloadFresh()">Recargar</button></div>`;
  } else if(appOffline){
    el.innerHTML = `<div class="sync-banner-msg offline"><span>📡 Sin conexión a internet. Lo que ves puede no estar al día y no se puede guardar nada hasta que vuelva la señal.</span></div>`;
  } else {
    el.innerHTML = '';
  }
}
// Recarga pidiendo la página de nuevo al servidor (con un parámetro distinto
// cada vez), para no quedarse con la versión vieja guardada en el teléfono.
function reloadFresh(){
  try{
    const u = new URL(location.href);
    u.searchParams.set('v', Date.now());
    location.replace(u.toString());
  }catch(e){ location.reload(); }
}
function setOffline(v){ if(appOffline!==v){ appOffline = v; renderSyncBanner(); } }
function checkRemoteVersion(raw){
  if(raw && Number(raw.appVersion||0) > APP_VERSION && !appOutdated){
    appOutdated = true;
    renderSyncBanner();
  }
}

// opts.allowRemoved: cuántas citas se están borrando A PROPÓSITO en este
// guardado (por defecto 1 — el botón "Eliminar" de una cita). Solo "Eliminar
// cliente" borra varias de una vez, y lo avisa explícitamente.
// opts.recordUndo: por defecto true — en false en los guardados automáticos
// de migraciones, para que "Deshacer" nunca apunte a deshacer una corrección
// que se aplicó sola (ver más abajo).
function saveData(opts){
  opts = opts || {};
  // Qué había y qué hay ahora se "fotografía" en el momento de pedir el
  // guardado (no cuando le toca el turno), para que nada que llegue en el
  // intertanto se confunda con un cambio de este teléfono.
  // Cada guardado va por su cuenta (no en fila): si uno se queda esperando
  // por falta de señal, no traba a los siguientes. Dos guardados al mismo
  // tiempo no se pisan: la transacción de Firestore reintenta el que llegó
  // segundo con los datos ya actualizados.
  const job = { base: lastRemoteBase, mine: stateDocCopy() };
  pendingSaves.push(job);
  return runSave(job, opts);
}

async function runSave(job, opts){
  const recordUndo = opts.recordUndo !== undefined ? opts.recordUndo : true;
  const done = ok=>{
    pendingSaves = pendingSaves.filter(j=>j!==job);
    if(!ok) restoreFromServer();
    return ok;
  };
  if(appOutdated){
    showAlert('Hay una versión nueva de la agenda. Recarga la página (botón "Recargar" arriba) y vuelve a hacer el cambio — con esta versión no se guardó.');
    return done(false);
  }
  const mine = job.mine;
  // Red de seguridad: si en algún momento de esta sesión llegamos a ver, por
  // ejemplo, 80 citas reales, y de repente se intenta guardar con 0 (o casi
  // 0), eso es casi siempre síntoma de un error (no de que alguien borró
  // realmente 80 citas de una sola vez) — se bloquea el guardado y se avisa,
  // en vez de sobrescribir en silencio la base de datos real.
  if(mine.appointments.length === 0 && lastKnownGoodCount > 5){
    console.error('Guardado bloqueado por seguridad: se intentó guardar con 0 citas habiendo visto', lastKnownGoodCount, 'antes.');
    showAlert('Por seguridad, no se guardó un cambio que hubiera dejado la agenda vacía (antes había '+lastKnownGoodCount+' citas). Si esto fue intencional, avísale a Juan Diego. Si no lo fue, no toques nada más y avísale también.');
    return done(false);
  }
  // Segunda red de seguridad: se bloquea cualquier guardado que haga
  // desaparecer de golpe más citas de las que se borraron a propósito
  // (borrar de a una con "Eliminar" sigue funcionando normal).
  const allowedRemoved = opts.allowRemoved || 1;
  const baseIds = job.base ? job.base.appointments.map(a=>a.id) : [];
  const mineIds = new Set(mine.appointments.map(a=>a.id));
  const removedHere = baseIds.filter(id=>!mineIds.has(id)).length;
  if(removedHere > allowedRemoved){
    console.error('Guardado bloqueado por seguridad: desaparecerían', removedHere, 'citas de golpe.');
    showAlert('Por seguridad, no se guardó este cambio: habría hecho desaparecer '+removedHere+' citas de una sola vez. Recarga la página antes de seguir, y si vuelve a pasar, avísale a Juan Diego.');
    return done(false);
  }
  // Justo antes de escribir el cambio nuevo, guardamos cómo estaba el
  // documento hasta ahora — eso es lo que "Deshacer" restaura si alguien
  // se equivoca (ej. mover la ficha que no era).
  if(recordUndo) undoSnapshot = lastRemoteData;
  ui.saving = true;
  // Si no hay señal, el guardado se queda esperando: se avisa en vez de
  // fingir que quedó guardado.
  let slowShown = false;
  const slowTimer = opts.silent ? null : setTimeout(()=>{
    slowShown = true;
    setOffline(true);
    showAlert('⏳ Todavía no se termina de guardar — parece que no hay buena señal de internet. No cierres la agenda: te vamos a avisar cuando quede guardado.');
  }, 6000);
  let ok = true;
  let committed = null;
  const seqAtStart = remoteDataSeq;
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(DOC_REF);
      // Nunca se crea el documento desde acá: si "no existe", es un problema
      // de lectura, no una base de datos nueva (ver lección 1 en CLAUDE.md).
      if(!snap.exists) throw Object.assign(new Error('El documento no existe'), {sibana:'missing'});
      const raw = snap.data();
      if(Number(raw.appVersion||0) > APP_VERSION) throw Object.assign(new Error('Versión vieja'), {sibana:'outdated'});
      const theirs = normalizeDoc(raw);
      const merged = job.base ? mergeDocs(job.base, mine, theirs) : mine;
      // Tercera red: lo que finalmente se escribe no puede hacer desaparecer
      // más citas (de las que hay HOY en la base de datos) de las que este
      // teléfono borró a propósito.
      const mergedIds = new Set(merged.appointments.map(a=>a.id));
      const lost = theirs.appointments.filter(a=>!mergedIds.has(a.id)).length;
      if(lost > allowedRemoved) throw Object.assign(new Error('Desaparecerían '+lost+' citas'), {sibana:'blocked', lost});
      // Si lo que quedaría es IGUAL a lo que ya hay (ej. otro teléfono hizo
      // el mismo cambio un segundo antes, como el vínculo automático del
      // consentimiento), no se vuelve a escribir: ahorra datos y choques.
      if(sameValue(merged, theirs) && Number(raw.appVersion||0)===APP_VERSION){
        committed = Object.assign({}, merged, {appVersion: APP_VERSION});
        return;
      }
      tx.set(DOC_REF, Object.assign({}, merged, {
        appVersion: APP_VERSION,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }));
      committed = Object.assign({}, merged, {appVersion: APP_VERSION});
    });
    setOffline(false);
    // Lo que se acaba de escribir ES la versión más reciente de la base de
    // datos: si mientras tanto no llegó nada más nuevo, este teléfono queda
    // al día con todo (también con lo que hicieron los demás), aunque su
    // conexión en tiempo real esté "dormida".
    if(committed && remoteDataSeq===seqAtStart){
      pendingSaves = pendingSaves.filter(j=>j!==job);
      applyRemoteData(committed);
      if(!ui.modal) render();
    }
  }catch(e){
    console.error('Error guardando', e);
    ok = false;
    if(e && e.sibana==='outdated'){
      appOutdated = true; renderSyncBanner();
      showAlert('Hay una versión nueva de la agenda. Recarga la página (botón "Recargar" arriba) y vuelve a hacer el cambio — con esta versión no se guardó.');
    } else if(e && e.sibana==='blocked'){
      showAlert('Por seguridad, no se guardó este cambio: habría hecho desaparecer '+e.lost+' citas de una sola vez. Recarga la página antes de seguir, y si vuelve a pasar, avísale a Juan Diego.');
    } else if(e && e.sibana==='missing'){
      showAlert('No se pudo leer la base de datos, así que por seguridad no se guardó nada. Recarga la página y avísale a Juan Diego si sigue pasando.');
    } else if(cerrarSiSinPermiso(e)){
      // la cuenta ya no tiene acceso: se cierra la sesión
    } else {
      if(e && (e.code==='unavailable' || e.code==='deadline-exceeded')) setOffline(true);
      showAlert('❌ No se pudo guardar el cambio (revisa tu conexión a internet). No quedó guardado: vuelve a intentarlo cuando tengas señal.');
    }
  }
  if(slowTimer) clearTimeout(slowTimer);
  ui.saving = false;
  if(ok && slowShown) showAlert('✅ Listo, ya quedó guardado.');
  if(!ok) refreshFromServer(); // traer lo que de verdad hay en la base de datos
  return done(ok);
}

// Si un guardado falla, lo que se ve en pantalla vuelve a ser lo que
// realmente está en la base de datos (más los otros guardados que sigan en
// camino) — para que la pantalla nunca muestre algo que no quedó guardado.
function restoreFromServer(){
  if(!lastRemoteBase) return;
  const pending = pendingSaves.length ? pendingSaves[pendingSaves.length-1] : null;
  const view = pending ? mergeDocs(pending.base, pending.mine, lastRemoteBase) : JSON.parse(JSON.stringify(lastRemoteBase));
  DOC_KEYS.forEach(k=>{ state[k] = view[k]; });
  if(!ui.modal) render();
}

function undoLastChange(){
  if(!undoSnapshot){
    showAlert('No hay ningún cambio reciente para deshacer.');
    return;
  }
  const restore = undoSnapshot;
  showConfirmDialog('¿Deshacer el último cambio guardado? La agenda va a volver a como estaba antes de esa última edición.', ()=>{
    // La agenda en pantalla vuelve a como estaba; lo que hay HOY en la base de
    // datos sigue siendo la referencia, así el guardado aplica justamente la
    // vuelta atrás.
    const keepBase = lastRemoteBase, keepRaw = lastRemoteData;
    const restored = normalizeDoc(restore);
    DOC_KEYS.forEach(k=>{ state[k] = restored[k]; });
    lastRemoteBase = keepBase; lastRemoteData = keepRaw;
    undoSnapshot = null; // se usa una sola vez — hasta el próximo cambio real no queda nada más que deshacer
    ui.modal = null;
    render();
    const restoredIds = new Set(restored.appointments.map(a=>a.id));
    const removing = keepBase ? keepBase.appointments.filter(a=>!restoredIds.has(a.id)).length : 0;
    saveData({recordUndo:false, allowRemoved: Math.max(1, removing)}).then(ok=>{ if(ok) showAlert('Listo, se deshizo el último cambio.'); });
  });
}

function render(){
  const root = document.getElementById('root');
  if(!ui.loaded){root.innerHTML = loadingScreenHtml();return;}

  // Cada llamada a render() reconstruye TODO el HTML de una — eso crea un
  // <div class="modal"> nuevo cada vez, que arranca con el scroll en el
  // tope. Sin esto, marcar algo dentro de un modal largo (ej. "Avisada
  // hoy" en Retoques pendientes) hacía "saltar" la lista al principio en
  // vez de quedarse donde uno estaba — una ladilla real al ir marcando
  // varias filas una por una.
  const prevModal = root.querySelector('.modal');
  const prevScrollTop = prevModal ? prevModal.scrollTop : null;
  // Lo mismo de lado: las tablas anchas dentro de un modal (Retoques
  // pendientes) se deslizan a la derecha en el teléfono, y al marcar
  // "Avisada hoy" volvían solas a la izquierda.
  const prevScrollLeft = prevModal ? Array.from(prevModal.querySelectorAll('.table-scroll')).map(el=>el.scrollLeft) : [];

  if(ui.section==='finanzas' && ui.mode!=='admin' && !MIS_GANANCIAS_VISIBLE) ui.section = 'agenda';
  if(ui.section==='garantias' && !puedeVerGarantias()) ui.section = 'agenda';
  if(ui.section==='pagos' && ui.mode!=='admin') ui.section = 'agenda';
  const html = `
    <header class="topbar">
      <div class="brand">
        <img src="${LOGO_SRC}" alt="Sibana" />
        ${veVariasSedes() ? `<span class="tagline tagline-sede">${escapeHtml(SEDE.nombre)}</span>` : `<span class="tagline">${escapeHtml(SEDE.nombre)} · Panel interno</span>`}
      </div>
      <div class="topbar-right">
        ${temaBotonHtml()}
        ${ui.mode!=='admin' ? staffIdentityBadgeHtml() : ''}
        ${veVariasSedes() ? `<button class="mode-toggle sede-btn" data-act="open-sede" aria-label="Sede: ${escapeHtml(SEDE.nombre)} (cambiar)">${iconoSvg('sede')}<span class="sede-texto">${escapeHtml(SEDE.nombre)}</span></button>`
          : puedeCambiarModo() ? `<button class="mode-toggle" data-act="toggle-mode">${ui.mode==='admin' ? '🔓 Admin' : '🔒 Especialista'}</button>` : ''}
      </div>
    </header>
    ${sectionTabsHtml()}
    ${ui.section==='finanzas' ? `
      <main class="fin-main">${ui.mode==='admin' ? finanzasPageHtml() : MIS_GANANCIAS_VISIBLE ? misGananciasPageHtml() : ''}</main>
    ` : ui.section==='stock' ? `
      <main class="fin-main">${stockPageHtml()}</main>
    ` : ui.section==='garantias' ? `
      <main class="fin-main">${garantiasSeccionHtml()}</main>
    ` : ui.section==='pagos' ? `
      <main class="fin-main"><div class="fin-page">${pagosPageHtml()}</div></main>
    ` : `
      ${toolbarHtml()}
      ${statusLegendHtml()}
      <main>
        <div class="calendar-wrap">
          ${ui.view==='day' ? dayViewHtml() : ui.view==='week' ? weekViewHtml() : monthViewHtml()}
        </div>
      </main>
      ${summaryHtml()}
    `}
    ${ui.modal ? modalHtml() : ''}
  `;
  root.innerHTML = html;
  attachEvents();
  if(ui.view==='day') ajustarFichasDia(root);
  // El menú Más se abre hacia el lado donde quepa (antes, a 768 px, se salía de la pantalla).
  const mm = root.querySelector('.moremenu');
  if(mm){
    if(mm.getBoundingClientRect().left < 8){ mm.style.left = '0'; mm.style.right = 'auto'; }
    if(mm.getBoundingClientRect().right > window.innerWidth - 8){ mm.style.left = 'auto'; mm.style.right = '0'; }
  }
  // Si no caben todas las especialistas en su fila (5 o más), el borde
  // derecho se difumina para que se note que hay más deslizando de lado.
  const sf = root.querySelector('.toolbar .specfilter');
  if(sf && sf.scrollWidth > sf.clientWidth + 1) sf.classList.add('has-more');
  // En un teléfono muy angosto las pestañas se deslizan: la elegida queda a la vista.
  const tabActiva = root.querySelector('.section-tabs .active');
  if(tabActiva && tabActiva.offsetLeft + tabActiva.offsetWidth > tabActiva.parentNode.clientWidth) tabActiva.parentNode.scrollLeft = tabActiva.offsetLeft;

  if(prevScrollTop!=null){
    const newModal = root.querySelector('.modal');
    if(newModal) newModal.scrollTop = prevScrollTop;
  }
  if(prevScrollLeft.some(x=>x>0)){
    const newModal = root.querySelector('.modal');
    if(newModal) newModal.querySelectorAll('.table-scroll').forEach((el,k)=>{ if(prevScrollLeft[k]) el.scrollLeft = prevScrollLeft[k]; });
  }
}
