// ---------------- Finanzas: ingresos, gastos y comisiones ----------------
// Ingreso real de una cita: si se realizó, el precio completo; si se canceló o
// no se presentó, solo el abono (no se devuelve). Mismo criterio que ya usa el
// resto de la agenda en el resumen de arriba.
// Cuántas personas se atendieron en una misma ficha (ej. una clienta que
// viene con una amiga y se hacen las dos el delineado, anotado en una sola
// cita). Las citas antiguas no tienen este dato: cuentan como 1 persona.
function apptPersonas(a){
  const n = Math.floor(Number(a && a.personas));
  return n>=1 ? n : 1;
}
// Personas que de verdad se atendieron: una cita Cancelada o "No se presentó"
// no atendió a nadie, así que cuenta 0 (aunque la ficha fuera de 2 personas).
function apptPersonasAtendidas(a){
  return (a.estado==='Cancelada' || a.estado==='NoShow') ? 0 : apptPersonas(a);
}
// Si la misma clienta tiene más de una cita en el período que se está
// contando (ej. la agendaron dos veces el mismo día, a horas distintas), es
// UNA persona que vino dos veces, no dos personas distintas — se cuenta una
// sola vez. Si alguna de sus fichas fue con acompañante (personas>1), se usa
// la de más personas, para no perder al acompañante ni duplicar a la titular.
function countPersonas(appts){
  const porClienta = {};
  let total = 0;
  appts.forEach(a=>{
    const n = apptPersonasAtendidas(a);
    const key = normalizeName(a.client);
    if(!key){ total += n; return; }
    if(!(key in porClienta) || n > porClienta[key]) porClienta[key] = n;
  });
  Object.values(porClienta).forEach(n=>{ total += n; });
  return total;
}
// Texto corto para mostrar junto al número de citas, solo cuando hay alguna
// ficha con más de una persona (si no, el número sería el mismo y estorba).
// Vale la pena mostrar "personas" junto a "citas" solo si hay algo que las
// haga distintas: una ficha de 2+ personas, o una cita que no se atendió.
function personasWorthShowing(appts){
  return appts.some(a=>apptPersonas(a)>1) || countPersonas(appts)!==appts.length;
}
function personasSuffix(appts, short){
  const p = countPersonas(appts);
  if(!personasWorthShowing(appts)) return '';
  return short ? ` · ${p} pers.` : ` · ${p} persona${p===1?'':'s'}`;
}

// Cuántas cremas post-tratamiento compró la clienta en esta cita. Antes solo
// se podía marcar "compró / no compró" (a.cremaComprada): las citas viejas
// que no tienen a.cremaCantidad cuentan como 1 si estaban marcadas.
function apptCremas(a){
  if(a.cremaCantidad!=null && a.cremaCantidad!=='') return Math.max(0, Math.floor(Number(a.cremaCantidad))||0);
  return a.cremaComprada ? 1 : 0;
}
function apptRevenue(a){
  if(a.estado==='Cancelada' || a.estado==='NoShow') return a.abonoDevuelto ? 0 : (Number(a.abono)||0);
  // Si el abono ya se pagó en una cita anterior que se canceló/reagendó
  // (abonoPrevio), esa plata ya está contada como ingreso en la cita
  // anterior: acá solo entra lo nuevo (el precio menos ese abono). Antes se
  // contaba dos veces en "Ingreso total" y Finanzas (en cambio "Abonos
  // recibidos" y "Por método de pago" ya lo hacían bien). La comisión NO
  // usa esto: se calcula sobre el precio completo (ver apptCommissionBase).
  if(a.abonoPrevio) return Math.max(0, (Number(a.price)||0) - (Number(a.abono)||0));
  return Number(a.price)||0;
}
// Base sobre la que se calcula la comisión de la especialista: igual que
// apptRevenue, pero sin los $5.000 de CADA crema post-tratamiento — esa plata
// es 100% para el dueño, la especialista no se queda con nada de la crema.
//
// Regla de comisión (igual en las dos sedes, definida con Juan Diego): a cada
// tratamiento de MICROPIGMENTACIÓN se le resta primero un monto (Santiago:
// $10.000 en las citas con precios nuevos; Buenos Aires: 10 dólares en pesos,
// ver SEDE.descuentoMicro) que queda para el negocio, y recién eso se reparte
// con el %. Los demás servicios (lifting, perfilado, etc.), los retoques y los
// cursos se reparten directo, sin descuento. La crema comprada aparte nunca
// se reparte.
// Si la clienta cancela o no viene, el abono que pierde es 100% del negocio:
// no genera comisión (en Santiago, para citas desde
// SEDE.abonoPerdidoSoloNegocioDesde; las anteriores quedan como se pagaron).
// Una cita realizada genera comisión sobre su precio COMPLETO, aunque parte
// se haya pagado como abono en una cita anterior que se reagendó (abonoPrevio).
function apptCommissionBase(a){
  const cancelada = a.estado==='Cancelada' || a.estado==='NoShow';
  if(cancelada){
    if(SEDE.abonoPerdidoSoloNegocioDesde && (a.date||'') >= SEDE.abonoPerdidoSoloNegocioDesde) return 0;
    return apptRevenue(a);
  }
  const base = (Number(a.price)||0) - CREMA_PRICE*apptCremas(a);
  return Math.max(0, base - apptDescuentoMicro(a));
}
// El % de comisión que le toca a una cita: el vigente en el mes de la cita.
function apptComisionPct(a){
  const d = parseKey(a.date);
  return comisionPctForMonth(d.getFullYear(), d.getMonth());
}
// Lo que gana la especialista con esta cita, redondeado al peso cita por
// cita (así el total de la semana es exactamente la suma de lo que se ve en
// el detalle, y nunca aparecen decimales como "$24.995,5").
function apptCommission(a){
  return Math.round(apptCommissionBase(a) * apptComisionPct(a));
}
// Explicación, en palabras, de cómo se llegó a la comisión de una cita (para
// el detalle de "Pagos"). El número sale SIEMPRE de apptCommission: esto
// solo lo explica, nunca calcula por su cuenta.
function apptCommissionExplicacion(a){
  const pct = Math.round(apptComisionPct(a)*100) + '%';
  const base = apptCommissionBase(a);
  const cancelada = a.estado==='Cancelada' || a.estado==='NoShow';
  if(cancelada){
    const que = a.estado==='Cancelada' ? 'Cancelada' : 'No llegó';
    const abono = Number(a.abono)||0;
    if(a.abonoDevuelto) return `${que}: se le devolvió el abono, no genera comisión.`;
    if(abono<=0) return `${que}: sin abono, no genera comisión.`;
    if(base<=0) return `${que}: el abono (${fmtCLP(abono)}) queda entero para el negocio.`;
    return `${que}: abono ${fmtCLP(base)} → ${pct} (regla anterior: antes el abono perdido también se repartía).`;
  }
  const precio = Number(a.price)||0;
  const partes = [fmtCLP(precio)];
  const cremas = apptCremas(a);
  if(cremas) partes.push(`− ${cremas>1?cremas+' × ':''}${fmtCLP(CREMA_PRICE)} crema (es del negocio)`);
  const desc = apptDescuentoMicro(a);
  if(desc){
    const n = tratamientosConDescuento(a);
    partes.push(`− ${n>1?n+' × ':''}${fmtCLP(desc/n)} micropigmentación (es del negocio)`);
  }
  let txt = partes.join(' ');
  if(partes.length>1) txt += ` = ${fmtCLP(base)}`;
  txt += ` → ${pct}`;
  if(precio<=0) txt = isGarantiaAppt(a) ? 'Garantía sin costo: no genera comisión.' : 'Sin precio anotado: no genera comisión.';
  if(a.abonoPrevio) txt += ' (el abono lo pagó en una cita anterior; la comisión es sobre el precio completo)';
  return txt;
}

// ---- Garantía hecha por OTRA especialista (pedido de Juan Diego, oct 2026) ----
// Caso poco común: la clienta pide que la garantía se la haga otra
// especialista. Regla: toda la comisión que ganó la especialista del
// tratamiento original se le pasa a la que hace la garantía, en la semana de
// pago de la garantía (la semana del tratamiento ya se pagó y queda como
// fue). Queda anotado en la propia cita de garantía (a.traspasoComision =
// {originalId, de, monto, tratamiento, fechaOriginal}), con el monto
// congelado al guardarla. Si la garantía se cancela o no llega, no cuenta.
function tratamientoOriginalDeGarantia(a){
  if(!a || !a.garantiaDe) return null;
  const n = normalizeName(a.client||'');
  const t = normalizeName(a.garantiaDe);
  if(!n) return null;
  const limite = (a.date||'') + (a.start||'');
  return state.appointments
    .filter(x=>x.id!==a.id && normalizeName(x.client||'')===n && !isGarantiaAppt(x) && !x.cursoId
      && x.estado!=='Cancelada' && x.estado!=='NoShow'
      && (x.services||[]).some(s=>normalizeName(s)===t)
      && (x.date+(x.start||'')) <= limite)
    .sort((x,y)=>(y.date+(y.start||'')).localeCompare(x.date+(x.start||'')))[0] || null;
}
function traspasoDeGarantia(a){
  const t = a && a.traspasoComision;
  if(!t || !(Number(t.monto)>0) || !t.de || !a.specialist) return null;
  if(a.estado==='Cancelada' || a.estado==='NoShow') return null;
  if(normalizeName(t.de)===normalizeName(a.specialist)) return null;
  return t;
}
// Movimientos de comisión por garantías en un rango de fechas (fecha de la
// garantía): [{specialist, monto (+ o −), texto, apptId}].
function traspasosEnRango(startKey, endKey){
  const out = [];
  state.appointments.forEach(a=>{
    if(a.date<startKey || a.date>endKey) return;
    const t = traspasoDeGarantia(a);
    if(!t) return;
    const trat = t.tratamiento || a.garantiaDe || 'tratamiento';
    const cuando = t.fechaOriginal ? ` el ${parseKey(t.fechaOriginal).getDate()}/${pad(parseKey(t.fechaOriginal).getMonth()+1)}` : '';
    out.push({specialist: a.specialist, monto: Number(t.monto), apptId: a.id, date: a.date,
      texto: `Garantía de ${a.client} (${trat}): el tratamiento lo hizo ${t.de}${cuando} — se le pasa su comisión`});
    out.push({specialist: t.de, monto: -Number(t.monto), apptId: a.id, date: a.date,
      texto: `Garantía de ${a.client} (${trat}) la hizo ${a.specialist} — se le pasa la comisión de ese tratamiento`});
  });
  return out;
}
// ¿Esta cita lleva el descuento por micropigmentación? Nunca los cursos. En
// Santiago, solo las citas con precios nuevos: queda congelado al crear la
// cita (a.conDescuentoMicro, según estuviera prendida la "crema incluida",
// que llegó junto con la subida de precios); las citas de antes de esto usan
// a.cremaIncluidaPolitica, que marca exactamente lo mismo.
function apptLlevaDescuentoMicro(a){
  const cfg = SEDE.descuentoMicro;
  if(!cfg || a.cursoId) return false;
  if(!cfg.soloPrecioNuevo) return true;
  if(a.conDescuentoMicro!=null) return !!a.conDescuentoMicro;
  return !!a.cremaIncluidaPolitica;
}
function descuentoMicroPorTratamiento(dateKey){
  const cfg = SEDE.descuentoMicro;
  if(!cfg) return 0;
  return cfg.tipo==='dolar' ? descuentoUSDParaFecha(dateKey) : (Number(cfg.pesos)||0);
}
function apptDescuentoMicro(a){
  return apptLlevaDescuentoMicro(a) ? descuentoMicroPorTratamiento(a.date) * tratamientosConDescuento(a) : 0;
}
// Texto corto del descuento ("$10.000" / "10 dólares"), para las pantallas.
function descuentoMicroTexto(){
  const cfg = SEDE.descuentoMicro;
  if(!cfg) return '';
  return cfg.tipo==='dolar' ? `${cfg.dolares} dólares` : fmtCLP(cfg.pesos);
}
// ---- Buenos Aires: el valor del dólar ----
// Cuántos pesos es 1 dólar va cambiando, así que se guarda un historial
// (state.settings.dolarHistory = [{desde:'YYYY-MM-DD', pesos}]) y cada cita
// usa el valor vigente el día de la cita: cambiarlo hoy NUNCA recalcula citas
// ni semanas ya pasadas (mismo cuidado que comisionHistory). De ese mismo
// valor salen los 10 dólares que se restan por micropigmentación. (El abono
// sugerido de Buenos Aires ya no sale del dólar: va en pesos, ver
// abonoSugeridoPorTratamiento.)
const DESCUENTO_USD = (SEDES.buenosaires.descuentoMicro || {}).dolares || 10;
function valorDolarParaFecha(dateKey){
  const h = state.settings.dolarHistory;
  if(!Array.isArray(h)) return 0;
  let pesos = 0;
  h.slice().sort((a,b)=>(a.desde||'').localeCompare(b.desde||'')).forEach(x=>{
    if(x.desde && x.desde<=dateKey) pesos = Math.max(0, Number(x.pesos)||0);
  });
  return pesos;
}
function descuentoUSDParaFecha(dateKey){
  return Math.round(DESCUENTO_USD * valorDolarParaFecha(dateKey));
}
// ¿Este servicio es micropigmentación (lleva el descuento)? Se marca a mano en
// Servicios y tarifario (casilla de cada servicio). Un retoque nunca cuenta,
// aunque esté marcado.
function esMicropigmentacion(nombre){
  if(/retoque/i.test(nombre||'')) return false;
  const svc = state.services.find(x=>normalizeName(x.name)===normalizeName(nombre));
  return !!(svc && svc.micropigmentacion);
}
function contarMicropigmentaciones(services){
  return (services||[]).filter(esMicropigmentacion).length;
}
// Cuántas micropigmentaciones tiene la cita: cada una cuenta una vez por cada
// unidad (si vienen 2 personas y se anota el tratamiento 2 veces, se descuenta
// 2 veces). Queda congelado en la cita al guardarla (a.tratamientosMicro), así
// que cambiar después la casilla de un servicio no altera citas ya agendadas.
// Las citas de curso nunca llevan descuento (ver apptLlevaDescuentoMicro).
function tratamientosConDescuento(a){
  if(a.tratamientosMicro!=null && a.tratamientosMicro!=='') return Math.max(0, Number(a.tratamientosMicro)||0);
  return contarMicropigmentaciones(a.services);
}
function abonoSugeridoPorTratamiento(){
  // La sede deja que el dueño elija el monto (Buenos Aires): el que eligió.
  if(SEDE.abonoEditable){
    const elegido = state.settings && state.settings.abonoSugeridoPesos;
    if(typeof elegido==='number' && isFinite(elegido) && elegido>=0) return elegido;
  }
  if(SEDE.abonoSugerido!=null) return SEDE.abonoSugerido;
  // En dólares: se pasa a pesos con el valor de hoy y se redondea a la
  // centena (es solo una sugerencia, se puede cambiar).
  if(SEDE.abonoSugeridoUSD) return Math.round(SEDE.abonoSugeridoUSD * valorDolarParaFecha(toKey(new Date())) / 100) * 100;
  return 0;
}
// Lo que falta cobrarle a la clienta en la cita: precio total (ya con
// cualquier descuento que se haya puesto directo en el campo Precio) menos
// el abono ya pagado. Así la especialista sabe cuánto pedir sin tener que
// hacer la resta ella misma ni depender de que quede anotado en las notas.
function apptPorCobrar(a){
  return Math.max((Number(a.price)||0) - (Number(a.abono)||0), 0);
}
function apptsInMonth(year, month){
  return state.appointments.filter(a=>{
    const dt = parseKey(a.date);
    return dt.getFullYear()===year && dt.getMonth()===month;
  });
}
function expensesInMonth(year, month){
  return (state.expenses||[]).filter(g=>{
    const dt = parseKey(g.date);
    return dt.getFullYear()===year && dt.getMonth()===month;
  });
}
// El % de comisión puede cambiar de un mes a otro (ej. subir precios y bajar
// el %) sin alterar los meses ya pasados: se guarda un historial con la fecha
// desde la que aplica cada cambio, y cada mes usa el que estaba vigente en
// ese momento.
function comisionPctForMonth(year, month){
  const key = `${year}-${pad(month+1)}`; // 'YYYY-MM'
  const history = state.settings.comisionHistory;
  const fallback = state.settings.comisionPct!=null ? Number(state.settings.comisionPct) : 0.5;
  if(!Array.isArray(history) || !history.length) return fallback;
  const sorted = history.slice().sort((a,b)=> (a.desde||'').localeCompare(b.desde||''));
  let pct = fallback;
  sorted.forEach(h=>{ if(h.desde && h.desde<=key) pct = Number(h.pct); });
  return pct;
}
function recurringIncomeTotal(){
  return (state.recurringIncomes||[]).reduce((s,r)=>s+(Number(r.monto)||0),0);
}
// Finanzas cuenta una cita como ingreso SOLO cuando está cerrada (18/10/2026,
// decidido con Juan Diego, igual que Pagos): Realizada, o Cancelada/No llegó
// (cuenta su abono). Las Pendiente/Confirmada van aparte, en "Todavía por
// entrar". Solo desde FINANZAS_SOLO_REALIZADAS_DESDE (todo octubre 2026, lo
// pidió él; primero era desde el 19/10): septiembre y antes se siguen
// sumando como siempre. Los inscritos de cursos cuentan siempre (como en Pagos).
const FINANZAS_SOLO_REALIZADAS_DESDE = '2026-10-01';
function cuentaEnFinanzas(a){
  if(a.date < FINANZAS_SOLO_REALIZADAS_DESDE || a.cursoId) return true;
  return !citaAbierta(a);
}
const CATEGORIA_DEVOLUCION = 'Devolución a clienta';
function esDevolucion(g){ return g.categoria===CATEGORIA_DEVOLUCION; }
// hastaKey (opcional): solo lo que pasó hasta ese día, para comparar con el
// mes anterior "a la misma fecha".
function monthFinancials(year, month, hastaKey){
  let todas = apptsInMonth(year, month);
  let gastos = expensesInMonth(year, month);
  if(hastaKey){ todas = todas.filter(a=>a.date<=hastaKey); gastos = gastos.filter(g=>g.date<=hastaKey); }
  const appts = todas.filter(cuentaEnFinanzas);
  const porEntrar = todas.filter(a=>!cuentaEnFinanzas(a));
  const porEntrarMonto = porEntrar.reduce((s,a)=>s+apptRevenue(a),0);
  const noVino = a=>a.estado==='Cancelada' || a.estado==='NoShow';
  const hechas = appts.filter(a=>!noVino(a));
  const ingresosCitas = appts.reduce((s,a)=>s+apptRevenue(a),0);
  const ingresosAbonosPerdidos = appts.filter(noVino).reduce((s,a)=>s+apptRevenue(a),0);
  // El ingreso pasivo (ej. arriendo de un box) llega una vez por cada semana
  // que cae dentro del mes — la misma cantidad de semanas que se ven en el
  // desglose semanal de abajo, para que ambos números siempre cuadren.
  const ingresosPasivos = recurringIncomeTotal() * weekRangesForMonth(year, month).filter(r=>!hastaKey || toKey(r.start)<=hastaKey).length;
  const ingresos = ingresosCitas + ingresosPasivos;
  const cremasVendidas = appts.filter(a=>a.estado!=='Cancelada' && a.estado!=='NoShow').reduce((s,a)=>s+apptCremas(a),0);
  const recurringTotal = (state.recurringExpenses||[]).reduce((s,r)=>s+(Number(r.monto)||0),0);
  const gastosFijos = recurringTotal + gastos.filter(g=>g.tipo==='Fijo').reduce((s,g)=>s+(Number(g.monto)||0),0);
  const gastosVariables = gastos.filter(g=>g.tipo==='Variable' && !esDevolucion(g)).reduce((s,g)=>s+(Number(g.monto)||0),0);
  // Dinero devuelto a una clienta (ej. un tratamiento que hubo que devolver):
  // se anota en Gastos con su propia categoría para verlo aparte.
  const devoluciones = gastos.filter(esDevolucion).reduce((s,g)=>s+(Number(g.monto)||0),0);
  const comisionPct = comisionPctForMonth(year, month);
  // La comisión de las especialistas se calcula solo sobre lo que generan las
  // citas (sin contar la crema ni el ingreso pasivo del box) — ver
  // apptCommissionBase.
  // Redondeada cita por cita (apptCommission), igual que en "Pagos", para
  // que los dos lugares den exactamente el mismo número.
  const comisiones = appts.reduce((s,a)=>s+apptCommission(a),0);
  // Ajustes a mano del pago de las especialistas (bonos, correcciones…), por
  // la semana de pago a la que se anotaron (su lunes cae en este mes).
  const ajustesMes = ajustesEnMes(year, month);
  const ajustesTotal = ajustesMes.reduce((s,x)=>s+(Number(x.monto)||0),0);
  const gastosTotal = gastosFijos + gastosVariables + devoluciones + comisiones + ajustesTotal;
  const beneficio = ingresos - gastosTotal;

  const porMetodo = paymentBreakdown(appts);

  const porEspecialista = {};
  appts.forEach(a=>{
    const name = a.specialist || 'Sin asignar';
    if(!porEspecialista[name]) porEspecialista[name] = {ingresos:0, comisionBase:0, citas:0, hechas:0, personas:0, multi:false, _appts:[]};
    porEspecialista[name].ingresos += apptRevenue(a);
    if(!noVino(a)) porEspecialista[name].hechas += 1;
    porEspecialista[name].comisionBase += apptCommissionBase(a);
    porEspecialista[name].comision = (porEspecialista[name].comision||0) + apptCommission(a);
    porEspecialista[name].citas += 1;
    porEspecialista[name]._appts.push(a);
    if(apptPersonas(a)>1) porEspecialista[name].multi = true;
  });
  // Garantías hechas por otra especialista: la comisión del tratamiento
  // original pasa de una a otra (el total del negocio no cambia).
  const ultimoDia = new Date(year, month+1, 0);
  traspasosEnRango(toKey(new Date(year, month, 1)), toKey(ultimoDia)).forEach(t=>{
    const name = state.specialists.map(s=>s.name).find(n=>normalizeName(n)===normalizeName(t.specialist)) || t.specialist;
    if(!porEspecialista[name]) porEspecialista[name] = {ingresos:0, comisionBase:0, comision:0, citas:0, hechas:0, personas:0, multi:false, _appts:[]};
    porEspecialista[name].comision = (porEspecialista[name].comision||0) + t.monto;
  });
  Object.keys(porEspecialista).forEach(name=>{
    const e = porEspecialista[name];
    e.comision = e.comision||0;
    // Misma clienta con más de una cita en el mes con esta especialista -> se
    // cuenta una sola vez (ver countPersonas).
    e.personas = countPersonas(e._appts);
    delete e._appts;
  });

  return {ingresos, ingresosCitas, ingresosAbonosPerdidos, ingresosPasivos, gastosFijos, gastosVariables, devoluciones, comisiones, ajustesTotal, gastosTotal, beneficio, porMetodo, porEspecialista, comisionPct, appts, hechas, porEntrar, porEntrarMonto, gastos, cremasVendidas};
}
function weekRangesForMonth(year, month){
  // Semanas de lunes a domingo, recortadas a los límites del mes — igual que
  // el "Corte Semanal" del Excel.
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  const ranges = [];
  let cursor = new Date(first);
  while(cursor <= last){
    let weekEnd = addDays(startOfWeek(cursor), 6);
    if(weekEnd > last) weekEnd = new Date(last);
    ranges.push({start:new Date(cursor), end:new Date(weekEnd)});
    cursor = addDays(weekEnd, 1);
  }
  return ranges;
}
function rangeFinancials(start, end){
  const startKey = toKey(start), endKey = toKey(end);
  const appts = state.appointments.filter(a=> a.date>=startKey && a.date<=endKey && cuentaEnFinanzas(a));
  const gastosVar = (state.expenses||[]).filter(g=> g.date>=startKey && g.date<=endKey && g.tipo==='Variable').reduce((s,g)=>s+(Number(g.monto)||0),0);
  // Cada llamada a esta función representa una semana (ver weekRangesForMonth),
  // así que el ingreso pasivo se suma una vez por llamada.
  const ingresos = appts.reduce((s,a)=>s+apptRevenue(a),0) + recurringIncomeTotal();
  const comisiones = appts.reduce((s,a)=>s+apptCommission(a),0);
  return {ingresos, comisiones, gastosVar, ganancia: ingresos - comisiones - gastosVar};
}

// Semana de PAGO de la comisión a las especialistas: lunes a sábado (el
// domingo se paga lo que se generó esa semana) — confirmado explícitamente
// con el usuario. Es DISTINTA del "Corte semanal" de más abajo (lunes a
// domingo), que es solo para reportar ingresos por semana calendario, no
// para calcular pagos. Los vales se descuentan de ESTA semana.
function payoutWeekRange(date){
  const start = startOfWeek(date);
  return { start, end: addDays(start, 5) };
}
function valesTotalInRange(specialist, start, end){
  const startKey = toKey(start), endKey = toKey(end);
  const key = normalizeName(specialist);
  return (state.vales||[]).filter(v=>normalizeName(v.specialist)===key && v.date>=startKey && v.date<=endKey)
    .reduce((s,v)=>s+(Number(v.monto)||0),0);
}
// Comisión generada por una especialista en un rango de fechas cualquiera,
// usando el % vigente en el mes de CADA cita (nunca un solo % para todo el
// rango, aunque cruce de mes — ver punto 8 de CLAUDE.md).
function commissionInRange(specialist, start, end){
  const startKey = toKey(start), endKey = toKey(end);
  const key = normalizeName(specialist);
  return state.appointments
    .filter(a=>normalizeName(a.specialist)===key && a.date>=startKey && a.date<=endKey)
    .reduce((s,a)=>s+apptCommission(a), 0);
}
// Ajustes a mano del pago (state.ajustes = [{id, specialist, semana:'YYYY-MM-DD'
// (el lunes de la semana de pago), monto (+ suma / − resta), motivo,
// registradoPor, creadoEn}]): bonos, correcciones, cualquier caso raro.
function ajustesDeSemana(semanaKey){
  return (state.ajustes||[]).filter(x=>x.semana===semanaKey);
}
function ajustesEnMes(year, month){
  const pref = `${year}-${pad(month+1)}-`;
  return (state.ajustes||[]).filter(x=>(x.semana||'').startsWith(pref));
}
// Registro de lo que ya se pagó (state.pagos = [{id, specialist, semana,
// comision, traspasos, ajustes, vales, neto, citas, pagadoEn, registradoPor}]).
function pagoRegistrado(semanaKey, specialist){
  const k = normalizeName(specialist);
  return (state.pagos||[]).find(p=>p.semana===semanaKey && normalizeName(p.specialist)===k) || null;
}
function hoySedeKey(){ return sedeNow().date; }
// Todo lo que hace falta para pagar una semana (lun–sáb, que empieza el
// lunes "monday"): por especialista, sus citas con lo que deja cada una,
// las garantías traspasadas, los ajustes, los vales y el neto; más los
// avisos de cosas que conviene revisar antes de pagar.
// Desde la semana de pago del lunes 12/10/2026 (pedido de Juan Diego, como
// incentivo para que el equipo cierre sus citas): una cita cuenta en el pago
// SOLO cuando está cerrada (Realizada; Cancelada/No llegó ya daban 0). Una
// Pendiente/Confirmada aparece en el detalle con lo que sumaría, pero no
// entra en el total hasta que alguien la marque. Los cursos siguen como antes
// (sus inscritos no se van cerrando uno por uno). Las citas de septiembre y
// antes no cambian.
// 18/10/2026: Juan Diego pidió que valga desde el 1 de octubre (antes era
// desde la semana del 12/10), igual que Finanzas. Se mira cita por cita (la
// semana del 28/09 tiene días de septiembre, que siguen con la regla de antes).
const PAGO_SOLO_CERRADAS_DESDE = '2026-10-01';
function citaAbierta(a){ return a.estado!=='Realizada' && a.estado!=='Cancelada' && a.estado!=='NoShow'; }
function payoutWeekData(monday){
  const {start, end} = payoutWeekRange(monday);
  const startKey = toKey(start), endKey = toKey(end);
  const soloCerradas = endKey >= PAGO_SOLO_CERRADAS_DESDE;
  const domingoKey = toKey(addDays(start, 6));
  const hoy = hoySedeKey();
  const porNombre = new Map(); // normalizeName -> grupo
  const grupo = name=>{
    const k = normalizeName(name);
    if(!porNombre.has(k)) porNombre.set(k, {name, citas:[], traspasos:[], ajustes:[], vales:[], comision:0, totalTraspasos:0, totalAjustes:0, totalVales:0, neto:0, sinCerrar:0, porCerrar:0, montoPorCerrar:0});
    return porNombre.get(k);
  };
  state.specialists.forEach(s=>grupo(s.name));
  const citasSemana = state.appointments.filter(a=>a.date>=startKey && a.date<=endKey)
    .sort((x,y)=>(x.date+(x.start||'')).localeCompare(y.date+(y.start||'')));
  const sinEspecialista = [];
  const sinCerrar = [];
  const porVenir = [];
  citasSemana.forEach(a=>{
    const abierta = citaAbierta(a);
    if(abierta && a.date<hoy) sinCerrar.push(a);
    if(abierta && a.date>=hoy) porVenir.push(a);
    if(!a.specialist){ if(!a.cursoId && apptCommission(a)>0) sinEspecialista.push(a); return; }
    const g = grupo(a.specialist);
    const c = apptCommission(a);
    // porCerrar: con la regla nueva, todavía no suma (se ve lo que sumaría).
    const porCerrar = abierta && !a.cursoId && a.date >= PAGO_SOLO_CERRADAS_DESDE;
    g.citas.push({a, comision: porCerrar ? 0 : c, porCerrar, comisionAlCerrar: c});
    g.comision += porCerrar ? 0 : c;
    if(porCerrar && c>0){ g.porCerrar++; g.montoPorCerrar += c; }
    if(abierta && a.date<hoy) g.sinCerrar++;
  });
  traspasosEnRango(startKey, endKey).forEach(t=>{
    const g = grupo(t.specialist);
    g.traspasos.push(t);
    g.totalTraspasos += t.monto;
  });
  ajustesDeSemana(startKey).forEach(x=>{
    const g = grupo(x.specialist);
    g.ajustes.push(x);
    g.totalAjustes += Number(x.monto)||0;
  });
  (state.vales||[]).filter(v=>v.date>=startKey && v.date<=endKey)
    .sort((x,y)=>x.date.localeCompare(y.date)).forEach(v=>{
      const g = grupo(v.specialist||'Sin nombre');
      g.vales.push(v);
      g.totalVales += Number(v.monto)||0;
    });
  const especialistas = Array.from(porNombre.values());
  especialistas.forEach(g=>{
    g.neto = g.comision + g.totalTraspasos + g.totalAjustes - g.totalVales;
    g.pago = pagoRegistrado(startKey, g.name);
    g.tieneAlgo = g.citas.length || g.traspasos.length || g.ajustes.length || g.vales.length;
  });
  // Lo del domingo (cerrado) no entra en ninguna semana de pago: se avisa.
  const delDomingo = state.appointments.filter(a=>a.date===domingoKey && apptCommission(a)>0).length
    + (state.vales||[]).filter(v=>v.date===domingoKey).length;
  return { start, end, startKey, endKey, especialistas, sinEspecialista, sinCerrar, porVenir, delDomingo, soloCerradas,
    terminada: hoy>endKey, enCurso: hoy>=startKey && hoy<=endKey };
}
// Lo de una especialista en la semana de pago EN CURSO (lo usa "Mis
// ganancias", hoy oculta).
function payoutWeekSummary(specialist){
  const w = payoutWeekData(parseKey(hoySedeKey()));
  const g = w.especialistas.find(x=>normalizeName(x.name)===normalizeName(specialist));
  const comision = g ? g.comision + g.totalTraspasos + g.totalAjustes : 0;
  const vales = g ? g.totalVales : 0;
  return { start: w.start, end: w.end, comision, vales, neto: comision - vales };
}

// "Mis ganancias" (la pestaña de Finanzas de las especialistas). Rehecha el
// 12/10/2026 a pedido de Juan Diego: cada especialista ve SU semana de pago
// (lun–sáb) con el mismo detalle que Admin en Finanzas → Pagos (cita por cita
// con la cuenta en palabras, garantías, ajustes, vales y lo que se le paga el
// domingo), y como incentivo ve lo que NO le suma porque la cita sigue sin
// cerrar (PAGO_SOLO_CERRADAS_DESDE) y un botón para anotar sus vales. Empieza
// en la semana del 12/10 (las anteriores tienen datos desordenados).
// Publicada el 12/10/2026 (Juan Diego la aprobó viendo las capturas). La
// pestaña se llama "💵 Mi pago" y va AL FINAL de las pestañas de la
// especialista (después de Stock: nunca mover un botón que ya existía). Él
// la ve igual desde Finanzas → Pagos → "👁 Ver lo que ve …". En false se
// vuelve a esconder.
const MIS_GANANCIAS_VISIBLE = true;
// "Mi pago" sigue empezando en la semana del 12/10 (decidido el 12/10: las
// semanas anteriores tenían datos desordenados), aunque la regla de citas
// cerradas ahora valga desde el 1/10.
const MIS_GANANCIAS_DESDE = '2026-10-12';
// Dos diseños a prueba (12/10/2026): 'detallado' (recuadros + cada cita con su
// cuenta) y 'simple' (una boleta corta arriba, la lista de citas en una línea
// y la cuenta solo al tocarla). En la vista previa se cambia con dos botones.
const MIS_GANANCIAS_DISENO = 'simple';
function misGananciasPageHtml(nombre, vistaPrevia){
  const identity = nombre || staffIdentity();
  if(!identity){
    return `
      <div class="fin-page">
        <h2 class="serif" style="margin-top:0;">¿Quién eres?</h2>
        <p class="hint">Elige tu nombre para ver tus propias ganancias. Este dispositivo lo va a recordar, así que solo se pregunta una vez.</p>
        ${state.specialists.map(s=>`<button type="button" class="btn btn-primary" style="width:100%;margin-bottom:8px;" data-act="set-staff-identity" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</button>`).join('')}
      </div>`;
  }
  const actual = semanaPagoActualKey();
  const primera = toKey(startOfWeek(parseKey(MIS_GANANCIAS_DESDE)));
  if(!ui.ganSemana || ui.ganSemana>actual) ui.ganSemana = actual;
  if(ui.ganSemana<primera) ui.ganSemana = primera;
  const w = payoutWeekData(parseKey(ui.ganSemana));
  const g = w.especialistas.find(x=>normalizeName(x.name)===normalizeName(identity))
    || {name: identity, citas:[], traspasos:[], ajustes:[], vales:[], comision:0, totalTraspasos:0, totalAjustes:0, totalVales:0, neto:0, porCerrar:0, montoPorCerrar:0, pago:null};
  const etiqueta = w.enCurso ? 'Semana en curso' : (w.terminada ? 'Semana terminada' : 'Semana que viene');
  const hoy = hoySedeKey();
  const estado = estadoPago(g);
  const primerNombre = escapeHtml(String(identity).split(' ')[0]);

  let grande;
  if(estado==='pagado'){
    grande = `<div class="fin-card highlight gan-total pagado"><div class="lbl">✅ Ya te pagamos</div><div class="val">${fmtNeto(g.pago.neto)}</div><div class="hint" style="margin:2px 0 0;">${pagoFechaTexto(g.pago.actualizadoEn||g.pago.pagadoEn)}</div></div>`;
  } else if(estado==='cambio'){
    grande = `<div class="fin-card highlight gan-total"><div class="lbl">Te pagamos ${fmtNeto(g.pago.neto)} ${pagoFechaTexto(g.pago.actualizadoEn||g.pago.pagadoEn)}</div><div class="val">Ahora da ${fmtNeto(g.neto)}</div><div class="hint" style="margin:2px 0 0;">Después se corrigió algo de esta semana: lo revisamos contigo.</div></div>`;
  } else {
    grande = `<div class="fin-card highlight gan-total"><div class="lbl">${w.terminada ? 'Te vamos a pagar' : 'Llevas esta semana'}</div><div class="val">${fmtNeto(g.neto)}</div>${w.terminada ? '' : `<div class="hint" style="margin:2px 0 0;">Va subiendo a medida que cierras tus citas.</div>`}</div>`;
  }

  // Incentivo: lo que todavía no suma porque la cita no está cerrada.
  // También las de $0 (ej. una garantía sin costo): no cambian el pago, pero
  // igual hay que cerrarlas (antes salía "✅ Todas tus citas están cerradas").
  const pendientes = g.citas.filter(c=>c.porCerrar);
  // Por cerrar: las que ya empezaron (se pueden marcar). Próximas: todavía no.
  const porCerrar = pendientes.filter(c=>citaYaEmpezo(c.a));

  const montoPorCerrar = porCerrar.reduce((t,c)=>t+c.comisionAlCerrar,0);

  const pasadas = porCerrar.filter(c=>c.a.date<hoy);

  } else if(g.citas.length && !proximas.length){

  const filas = g.citas.map(c=>pagoCitaFilaHtml(c)).join('') || `<div class="hint">No tienes citas esta semana.</div>`;
  const traspasos = g.traspasos.map(t=>`

  const ajustes = g.ajustes.map(x=>`

  // Semanas anteriores (desde que existe esta pantalla).
  const historial = [];
  for(let k = actual; k>=primera && historial.length<8; k = toKey(addDays(parseKey(k), -7))){
    const wk = payoutWeekData(parseKey(k));
    const gk = wk.especialistas.find(x=>normalizeName(x.name)===normalizeName(identity));

  const comoSeCalcula = `<div class="hint" style="margin-top:16px;">Cómo se calcula: a cada micropigmentación ${SEDE.descuentoMicro && SEDE.descuentoMicro.soloPrecioNuevo ? '(con los precios nuevos) ' : ''}se le restan ${descuentoMicroTexto()} que quedan para el negocio, y lo que queda se divide ${pct}% para ti. Lo demás (lifting, perfilado, retoques…) se divide directo. Si haces la garantía de un tratamiento de otra especialista, recibes la comisión de ese tratamiento (y al revés). Los vales se restan.</div>`;
  const diseno = vistaPrevia ? (ui.ganDiseno || MIS_GANANCIAS_DISENO) : MIS_GANANCIAS_DISENO;
  const previaHtml = vistaPrevia ? `<div class="pago-aviso gan-preview">👁 <b>Vista previa:</b> así lo ve ${escapeHtml(identity)} en su teléfono${MIS_GANANCIAS_VISIBLE ? '' : ' (todavía no está publicado: ellas no lo ven)'}.

  const navHtml = `

// La cuenta de una cita paso a paso, una línea por paso (para "Mis
// ganancias", diseño simple). Los números salen de las mismas funciones que
// el pago (apptCremas, apptDescuentoMicro, apptCommissionBase,
// apptCommission): esto solo los ordena. Si no hay nada que repartir
// (cancelada, garantía sin costo…), se usa la explicación en palabras.
function apptCuentaPasosHtml(a){
  const precio = Number(a.price)||0;
  const cancelada = a.estado==='Cancelada' || a.estado==='NoShow';
  if(cancelada || precio<=0 || a.cursoId) return `<div class="gs-paso texto">${escapeHtml(apptCommissionExplicacion(a))}</div>`;
  const pct = Math.round(apptComisionPct(a)*100);
  const fila = (t, v, cls) => `<div class="gs-paso ${cls||''}"><span>${t}</span><span>${v}</span></div>`;
  const pasos = [fila(apptPersonas(a)>1 ? `Precio (${apptPersonas(a)} personas)` : 'Precio', fmtCLP(precio))];
  const cremas = apptCremas(a);
  if(cremas) pasos.push(fila(`Crema${cremas>1?' × '+cremas:''} (del negocio)`, '−'+fmtCLP(CREMA_PRICE*cremas)));
  const desc = apptDescuentoMicro(a);
  if(desc){
    const n = tratamientosConDescuento(a);
    pasos.push(fila(`Micropigmentación${n>1?' × '+n:''} (del negocio)`, '−'+fmtCLP(desc)));
  }
  if(pasos.length>1) pasos.push(fila('Queda', fmtCLP(apptCommissionBase(a)), 'sub'));
  pasos.push(fila(`Tu parte (${pct}%)`, fmtCLP(apptCommission(a)), 'tuya'));
  if(a.abonoPrevio) pasos.push(`<div class="gs-paso texto">El abono lo pagó en una cita anterior: tu parte es sobre el precio completo.</div>`);
  return pasos.join('');
}

// ---- Buenos Aires: dólar automático ----
// Si en "Valor del dólar" se eligió un tipo de dólar (state.settings.dolarAuto),
// una vez al día la agenda consulta su valor en dolarapi.com (gratis, sin
// clave) y, si cambió, lo agrega al historial desde hoy — igual que si alguien
// lo hubiera anotado a mano. Si la página no responde, no pasa nada: se sigue
// usando el último valor guardado (y se puede anotar a mano).
const DOLAR_TIPOS = {oficial: 'Oficial (el del banco)', blue: 'Blue', bolsa: 'MEP (bolsa)'};
const DOLAR_API_URL = 'https://dolarapi.com/v1/dolares/';
let dolarAutoRevisado = null; // día ya revisado en esta pestaña
async function actualizarDolarAutomatico(forzar){
  const tipo = state.settings.dolarAuto;
  if(!ui.loaded || appOutdated || !DOLAR_TIPOS[tipo] || (SEDE.descuentoMicro||{}).tipo!=='dolar') return false;
  const hoy = toKey(new Date());
  if(!forzar && dolarAutoRevisado===hoy) return false;
  dolarAutoRevisado = hoy;
  try{
    const ctrl = typeof AbortController!=='undefined' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 10000) : null;
    const resp = await fetch(DOLAR_API_URL + tipo, ctrl ? {signal: ctrl.signal} : {});
    if(timer) clearTimeout(timer);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const pesos = Math.round((Number(data && data.venta)||0) * 100) / 100;
    if(!(pesos > 0)) throw new Error('Respuesta sin valor');
    if(state.settings.dolarAuto!==tipo) return false; // lo cambiaron mientras tanto
    if(valorDolarParaFecha(hoy)===pesos) return false; // no cambió
    const h = (state.settings.dolarHistory||[]).filter(x=>x.desde!==hoy);
    h.push({desde: hoy, pesos, auto: tipo});
    state.settings.dolarHistory = h;
    if(!ui.modal || ui.modal.type==='valores-sede') render();
    await saveData({recordUndo:false, silent:true});
    return true;
  }catch(e){
    console.error('No se pudo actualizar el dólar automáticamente (se sigue usando el último valor)', e);
    return false;
  }
}
// Si la agenda queda abierta de un día para otro, revisa cada hora.
setInterval(()=>{ actualizarDolarAutomatico(); }, 60*60*1000);

  if(!hoy) return `<div class="hint" style="margin-bottom:8px;color:var(--danger);">⚠️ Falta cargar el valor del dólar (Más → "💱 Valor del dólar"). Mientras no esté, la comisión se calcula sin restar los ${DESCUENTO_USD} dólares.</div>`;
  return `<div class="hint" style="margin-bottom:8px;">Antes de repartir, a cada micropigmentación se le restan ${DESCUENTO_USD} dólares (hoy ${fmtCLP(hoy)}), que quedan para el negocio. Los demás servicios, los retoques y los cursos se reparten directo. Si la clienta cancela o no viene, el abono queda entero para el negocio.</div>`;
}

function saveValoresSedeFromForm(){
  const auto = document.getElementById('f-dolar-auto').value;
  const pesosRaw = document.getElementById('f-dolar-pesos').value.trim();
  const desde = document.getElementById('f-dolar-desde').value;
  const autoCambio = (state.settings.dolarAuto||'') !== auto;
  if(pesosRaw===''){
    if(!autoCambio){ showAlert('Escribe cuántos pesos es 1 dólar, o elige si se actualiza solo.'); return; }
  } else {
    const pesos = Number(pesosRaw);
    if(!(pesos>0)){ showAlert('Escribe cuántos pesos es 1 dólar (un número mayor que 0).'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(desde)){ showAlert('Elige desde qué fecha aplica el valor nuevo.'); return; }
    const h = Array.isArray(state.settings.dolarHistory) ? state.settings.dolarHistory.slice() : [];
    const i = h.findIndex(x=>x.desde===desde);
    if(i>=0) h[i] = {desde, pesos}; else h.push({desde, pesos});
    state.settings.dolarHistory = h;
  }
  state.settings.dolarAuto = auto;
  ui.modal = null;
  render();
  saveData().then(ok=>{ if(ok && autoCambio && auto) actualizarDolarAutomatico(true); });
}
function removeValorDolar(desde){
  showConfirmDialog('¿Quitar este valor? Las citas desde esa fecha van a usar el valor anterior (y su comisión puede cambiar).', ()=>{
    state.settings.dolarHistory = (state.settings.dolarHistory||[]).filter(x=>x.desde!==desde);
    render();
    saveData();
  });
}

// ---------------- Finanzas → 💵 Pagos (pago semanal de las especialistas) ----------------
// Pedido de Juan Diego (oct 2026): que lo que hay que pagarle a cada
// especialista salga solo, explicado (de dónde sale cada peso), con las
// semanas anteriores a la vista y un registro de lo que ya se pagó. Semana
// de pago lun–sáb (payoutWeekRange), se paga el domingo.
function fmtNeto(n){ n = Number(n)||0; return n<0 ? '−'+fmtCLP(-n) : fmtCLP(n); }
function fmtSigno(n){ n = Number(n)||0; return (n<0 ? '−' : '+') + fmtCLP(Math.abs(n)); }
function diaCorto(key){ const d = parseKey(key); return `${DAY_NAMES[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; }
function rangoSemanaTexto(start, end){
  return `${start.getDate()} ${MONTHS[start.getMonth()].slice(0,3)} – ${end.getDate()} ${MONTHS[end.getMonth()].slice(0,3)}`;
}
function semanaPagoActualKey(){ return toKey(startOfWeek(parseKey(hoySedeKey()))); }
// Primera semana con citas (para no navegar hacia atrás sin fin).
function primeraSemanaConDatos(){
  let min = null;
  state.appointments.forEach(a=>{ if(a.date && (!min || a.date<min)) min = a.date; });
  return min ? toKey(startOfWeek(parseKey(min))) : semanaPagoActualKey();
}
// Estado del pago de una especialista en una semana: 'pagado' | 'cambio'
// (se pagó, pero después cambió algo y el total ya no es el mismo) |
// 'pendiente' | 'nada' (no tiene nada esa semana).
function estadoPago(g){
  if(g.pago) return Number(g.pago.neto)===g.neto ? 'pagado' : 'cambio';
  return g.tieneAlgo ? 'pendiente' : 'nada';
}
function pagoFechaTexto(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `el ${pad(d.getDate())}/${pad(d.getMonth()+1)} a las ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function pagosPageHtml(){
  const actual = semanaPagoActualKey();
  if(!ui.pagoSemana || ui.pagoSemana>actual) ui.pagoSemana = actual;
  if(!ui.pagoAbiertos) ui.pagoAbiertos = {};
  const w = payoutWeekData(parseKey(ui.pagoSemana));
  const domingo = addDays(w.start, 6);
  const puedeAtras = ui.pagoSemana > primeraSemanaConDatos();
  const puedeAdelante = ui.pagoSemana < actual;
  const conAlgo = w.especialistas.filter(g=>g.tieneAlgo || state.specialists.some(s=>normalizeName(s.name)===normalizeName(g.name)));
  const total = conAlgo.reduce((s,g)=>s+g.neto,0);
  const etiqueta = w.enCurso ? 'Semana en curso' : (w.terminada ? 'Semana terminada' : 'Semana que viene');

  const avisos = [];
  if(w.sinCerrar.length){
    avisos.push(`<div class="pago-aviso peligro">⚠️ <b>${w.sinCerrar.length} cita${w.sinCerrar.length===1?'':'s'} que ya pasó${w.sinCerrar.length===1?'':'aron'} sigue${w.sinCerrar.length===1?'':'n'} como Pendiente o Confirmada.</b> ${w.soloCerradas ? `No se cuenta${w.sinCerrar.length===1?'':'n'} en el pago hasta que se cierre${w.sinCerrar.length===1?'':'n'}` : `Por ahora se cuenta${w.sinCerrar.length===1?'':'n'} como hecha${w.sinCerrar.length===1?'':'s'}`}. Antes de pagar, márcala${w.sinCerrar.length===1?'':'s'} como Realizada, Cancelada o No llegó (tócala para abrirla):
      <ul>${w.sinCerrar.map(a=>`<li><button type="button" class="linklike" data-act="edit-appt" data-id="${escapeHtml(a.id)}">${diaCorto(a.date)} ${escapeHtml(a.start||'')} · ${escapeHtml(a.client||'(sin nombre)')} · ${escapeHtml(a.specialist||'sin especialista')} (${escapeHtml(a.estado||'Pendiente')})</button></li>`).join('')}</ul></div>`);
  }
  if(w.sinEspecialista.length){
    avisos.push(`<div class="pago-aviso peligro">⚠️ <b>${w.sinEspecialista.length} cita${w.sinEspecialista.length===1?'':'s'} sin especialista:</b> su comisión no se le está pagando a nadie.
      <ul>${w.sinEspecialista.map(a=>`<li><button type="button" class="linklike" data-act="edit-appt" data-id="${escapeHtml(a.id)}">${diaCorto(a.date)} ${escapeHtml(a.start||'')} · ${escapeHtml(a.client||'(sin nombre)')}</button></li>`).join('')}</ul></div>`);
  }
  if(w.delDomingo){
    avisos.push(`<div class="pago-aviso">⚠️ Hay citas o vales anotados el <b>domingo ${domingo.getDate()} de ${MONTHS[domingo.getMonth()]}</b>. El domingo no entra en ninguna semana de pago (lun–sáb), así que no se cuentan: revisa si la fecha está bien.</div>`);
  }
  if(w.enCurso && w.porVenir.length){
    avisos.push(`<div class="hint" style="margin-bottom:12px;">ℹ️ Todavía falta${w.porVenir.length===1?'':'n'} ${w.porVenir.length} cita${w.porVenir.length===1?'':'s'} de esta semana: ${w.soloCerradas ? 'van sumando a medida que se marcan como realizadas' : 'ya están sumadas, y el número final queda el sábado al cerrar'}.</div>`);
  }

  const tarjetas = conAlgo.map(g=>pagoEspecialistaHtml(g, w)).join('')
    || `<div class="empty-msg">No hay especialistas cargadas.</div>`;

  return `
    <div class="fin-monthnav">
      <button class="arrow" data-act="pagos-prev" ${puedeAtras?'':'disabled'} aria-label="Anterior">${iconoSvg('izq')}</button>
      <div class="curdate">${rangoSemanaTexto(w.start, w.end)}<div class="hint" style="margin:2px 0 0;font-family:inherit;font-size:11.5px;">${etiqueta}</div></div>
      <button class="arrow" data-act="pagos-next" ${puedeAdelante?'':'disabled'} aria-label="Siguiente">${iconoSvg('der')}</button>
    </div>
    ${ui.pagoSemana!==actual ? `<div style="text-align:center;margin:-8px 0 14px;"><button type="button" class="linklike" data-act="pagos-hoy">Volver a la semana en curso</button></div>` : ''}
    ${avisos.join('')}
    <div class="fin-cards" style="grid-template-columns:1fr;">
      <div class="fin-card highlight"><div class="lbl">Total a pagar esta semana</div><div class="val">${fmtNeto(total)}</div></div>
    </div>
    <div class="hint" style="margin-bottom:10px;">Toca a cada especialista para ver de dónde sale su número: cada cita con su cuenta, los vales y los ajustes.</div>
    ${tarjetas}
    ${pagosHistorialHtml()}
    <div class="hint" style="margin-top:16px;">Cómo se calcula: a cada micropigmentación ${SEDE.descuentoMicro && SEDE.descuentoMicro.soloPrecioNuevo ? '(con los precios nuevos) ' : ''}se le restan ${descuentoMicroTexto()} que quedan para el negocio, y lo que queda se divide ${Math.round(comisionPctForMonth(w.start.getFullYear(), w.start.getMonth())*100)}% para la especialista. Lo demás (lifting, perfilado, retoques, cursos…) se divide directo. La crema es 100% del negocio. Si la clienta cancela o no llega, el abono queda entero para el negocio. Los vales sacados en la semana se restan.</div>
    ${repartoPagosHtml()}`;
}
function pagoEspecialistaHtml(g, w){
  const abierto = !!ui.pagoAbiertos[normalizeName(g.name)];
  const estado = estadoPago(g);
  const resumen = [];
  const t = citasPagoPorTipo(g);
  if(!g.citas.length) resumen.push('Sin citas');
  else resumen.push(cuantas(t.hechas.length, 'realizada', 'realizadas'));
  if(t.porCerrar.length) resumen.push(`${t.porCerrar.length} por cerrar${g.montoPorCerrar ? ` (${fmtCLP(g.montoPorCerrar)} sin sumar)` : ''}`);
  if(t.canceladas.length) resumen.push(cuantas(t.canceladas.length, 'cancelada', 'canceladas'));
  if(t.noLlego.length) resumen.push(`${t.noLlego.length} no llegó`);
  if(g.totalVales) resumen.push(`vales −${fmtCLP(g.totalVales)}`);
  if(g.totalTraspasos) resumen.push(`garantías ${fmtSigno(g.totalTraspasos)}`);
  if(g.totalAjustes) resumen.push(`ajustes ${fmtSigno(g.totalAjustes)}`);
  const nameAttr = escapeHtml(g.name);
  let estadoHtml = '';
  if(estado==='pagado'){
    estadoHtml = `<span class="pago-ok">✅ Pagado ${fmtNeto(g.pago.neto)} ${pagoFechaTexto(g.pago.actualizadoEn||g.pago.pagadoEn)}</span>
      <button type="button" class="linklike" data-act="pago-desmarcar" data-name="${nameAttr}">Desmarcar</button>`;
  } else if(estado==='cambio'){
    const dif = g.neto - (Number(g.pago.neto)||0);
    estadoHtml = `<span class="pago-mal">⚠️ Se marcó pagado ${fmtNeto(g.pago.neto)} ${pagoFechaTexto(g.pago.actualizadoEn||g.pago.pagadoEn)}, pero después cambió algo de esta semana y ahora da ${fmtNeto(g.neto)}: ${dif>0 ? `falta pagarle ${fmtCLP(dif)}` : `se le pagaron ${fmtCLP(-dif)} de más`}.</span>
      <button type="button" class="btn btn-primary" data-act="pago-actualizar" data-name="${nameAttr}">Ya quedó resuelto (dejar pagado ${fmtNeto(g.neto)})</button>
      <button type="button" class="linklike" data-act="pago-desmarcar" data-name="${nameAttr}">Desmarcar</button>`;
  } else if(estado==='pendiente' && w.startKey<PAGOS_REGISTRO_DESDE){
    estadoHtml = `<span class="hint" style="margin:0;">Semana anterior a este registro (se pagó a mano).</span>
      <button type="button" class="linklike" data-act="pago-marcar" data-name="${nameAttr}">Marcar como pagado igual</button>`;
  } else if(estado==='pendiente'){
    estadoHtml = w.start > parseKey(hoySedeKey()) ? '' : `<button type="button" class="btn btn-primary" data-act="pago-marcar" data-name="${nameAttr}">Marcar como pagado (${fmtNeto(g.neto)})</button>
      ${g.sinCerrar ? `<span class="pago-mal">${g.sinCerrar} cita${g.sinCerrar===1?'':'s'} sin cerrar</span>` : ''}`;
  } else {
    estadoHtml = `<span class="hint" style="margin:0;">Nada que pagar esta semana.</span>`;
  }
  return `
    <div class="pago-card ${estado==='pagado'?'pagado':''} ${estado==='cambio'?'cambio':''}">
      <div class="pago-head" data-act="pago-toggle" data-name="${nameAttr}">
        <div><div class="quien">${escapeHtml(g.name)} <span class="hint" style="margin:0;font-weight:400;">${abierto?'▴':'▾'}</span></div><div class="hint">${resumen.join(' · ')}</div></div>
        <div class="pago-neto"><small>A pagar</small>${fmtNeto(g.neto)}</div>
      </div>
      <div class="pago-estado">${estadoHtml}</div>
      ${abierto ? pagoDetalleHtml(g, w) : ''}
    </div>`;
}
// Las citas de una especialista en la semana de pago, separadas por cómo
// terminaron (17/10/2026, pedido de Juan Diego: "13 citas" con 4 canceladas
// parecía poco para lo que se le paga). Solo las ordena: los montos siguen
// saliendo de payoutWeekData. "hechas" = las que suman (Realizadas, inscritos
// de cursos y, en semanas de antes de PAGO_SOLO_CERRADAS_DESDE, las que
// quedaron sin cerrar y se contaban como hechas).
function citasPagoPorTipo(g){
  const t = {hechas:[], porCerrar:[], canceladas:[], noLlego:[]};
  g.citas.forEach(c=>{
    if(c.a.estado==='Cancelada') t.canceladas.push(c);
    else if(c.a.estado==='NoShow') t.noLlego.push(c);
    else if(c.porCerrar) t.porCerrar.push(c);
    else t.hechas.push(c);
  });
  return t;
}
function masAlCerrar(c){ return c.comisionAlCerrar>0 ? '+'+fmtCLP(c.comisionAlCerrar) : 'sin costo'; }
function cuantas(n, uno, varios){ return n===1 ? `1 ${uno}` : `${n} ${varios}`; }
// Una cita en el detalle del pago (Pagos de Admin y "Mis ganancias").
function pagoCitaFilaHtml({a, comision, porCerrar, comisionAlCerrar}){
  const abierta = citaAbierta(a);
  const estadoTxt = a.estado==='NoShow' ? 'No llegó' : (a.estado||'Pendiente');
  const pasada = a.date<hoySedeKey();
  const marca = (abierta && pasada) ? ` <span class="pago-mal">· ${escapeHtml(estadoTxt)}, sin cerrar</span>` : (a.estado!=='Realizada' ? ` · ${escapeHtml(estadoTxt)}` : '');
  const clic = a.cursoId ? '' : ` click" data-act="edit-appt" data-id="${escapeHtml(a.id)}`;
  const sumaria = porCerrar && comisionAlCerrar>0;
  return `
      <div class="pago-fila${clic}${sumaria?' por-cerrar':''}">
        <div>
          <div>${diaCorto(a.date)} ${escapeHtml(a.start||'')} · <b>${escapeHtml(a.client||'(sin nombre)')}</b>${marca}</div>
          <div class="como">${escapeHtml(a.cursoId ? '📚 Curso: '+(a.cursoNombre||'') : apptServiciosTexto(a))}</div>
          <div class="como">${escapeHtml(apptCommissionExplicacion(a))}</div>
          ${sumaria ? `<div class="como pago-cierre">🔒 ${pasada ? 'Todavía no suma' : 'Suma cuando se marque como realizada'}: ${fmtCLP(comisionAlCerrar)} al cerrarla.</div>` : ''}
        </div>
        <div class="monto">${sumaria ? `<s>${fmtCLP(comisionAlCerrar)}</s><div class="como" style="text-align:right;">$0</div>` : fmtCLP(comision)}</div>
      </div>`;
}
function pagoDetalleHtml(g, w){
  const nameAttr = escapeHtml(g.name);
  const t = citasPagoPorTipo(g);
  const noVinieron = t.canceladas.concat(t.noLlego).sort((x,y)=>(x.a.date+(x.a.start||'')).localeCompare(y.a.date+(y.a.start||'')));
  const sumanNoVinieron = noVinieron.reduce((s,c)=>s+c.comision,0);
  const citas = !g.citas.length ? `<div class="hint">Sin citas esta semana.</div>` : `
      <h4>Realizadas (${t.hechas.length}) — lo que gana con cada una</h4>
      ${t.hechas.map(c=>pagoCitaFilaHtml(c)).join('') || `<div class="hint" style="margin:0 0 6px;">Ninguna todavía.</div>`}
      ${t.porCerrar.length ? `<h4>Por cerrar (${t.porCerrar.length}) — todavía no suman</h4>${t.porCerrar.map(c=>pagoCitaFilaHtml(c)).join('')}` : ''}
      ${noVinieron.length ? `<h4>Canceladas o no llegó (${noVinieron.length})</h4>
      ${sumanNoVinieron ? '' : `<div class="hint" style="margin:0 0 4px;">No suman: el abono queda para el negocio.</div>`}
      ${noVinieron.map(c=>pagoCitaFilaHtml(c)).join('')}` : ''}`;
  const traspasos = g.traspasos.map(t=>`
      <div class="pago-fila click" data-act="edit-appt" data-id="${escapeHtml(t.apptId)}">
        <div><div>${diaCorto(t.date)}</div><div class="como">${escapeHtml(t.texto)}</div></div>
        <div class="monto ${t.monto<0?'pago-mal':'pago-ok'}">${fmtSigno(t.monto)}</div>
      </div>`).join('');
  const ajustes = g.ajustes.map(x=>`
      <div class="pago-fila">
        <div><div>${escapeHtml(x.motivo||'(sin motivo)')}</div>${x.creadoEn?`<div class="como">${x.tipo==='compra' ? `Lo anotó ${escapeHtml(x.specialist)}` : 'Anotado'} ${pagoFechaTexto(x.creadoEn)}</div>`:''}</div>
        <div style="display:flex;align-items:center;gap:6px;"><span class="monto ${Number(x.monto)<0?'pago-mal':'pago-ok'}">${fmtSigno(x.monto)}</span><button type="button" class="iconbtn" data-act="delete-ajuste" data-id="${escapeHtml(x.id)}" title="Borrar ajuste">✕</button></div>
      </div>`).join('');
  const vales = g.vales.map(v=>`
      <div class="pago-fila">
        <div><div>${diaCorto(v.date)}</div>${v.notas?`<div class="como">${escapeHtml(v.notas)}</div>`:''}</div>
        <div class="monto pago-mal">−${fmtCLP(v.monto)}</div>
      </div>`).join('');
  return `
    <div class="pago-detalle">
      ${citas}
      ${traspasos ? `<h4>Garantías hechas por otra especialista</h4>${traspasos}` : ''}
      ${vales ? `<h4>Vales sacados esta semana</h4>${vales}` : ''}
      <h4>Ajustes</h4>

// ---------------- ⭐ Garantías por especialista (calidad) ----------------
// Pedido de Juan Diego (oct 2026): saber quién hace mejor cada tratamiento.
// Se mide con las GARANTÍAS (trabajo que hubo que rehacer gratis), contadas a
// quien hizo el tratamiento ORIGINAL (no a quien hizo la garantía). Los
// retoques no cuentan: son parte normal del proceso. Solo dueños: pestaña
// "⭐ Garantías" arriba, al lado de Stock (él pidió que fuera una sección como
// Finanzas o Stock; primero estuvo en Finanzas y después en Más).
// - Desde GARANTIAS_DESDE (inicio de esta agenda). Todo tratamiento cuenta
//   desde el mismo día (antes había una espera de 30 días para que la
//   clienta alcanzara a volver; a Juan Diego le confundía y dejaba todo en 0%,
//   se quitó el 10/10/2026).
// - Medallas (11/10/2026, pedido de Juan Diego: "Melissa 🥉 100% · 1
//   trabajo" quedaba arriba de "Salomé 81% · 27 trabajos", poco realista):
//   solo compiten las que tienen al menos GARANTIAS_MIN_DATOS trabajos de ese
//   tratamiento, ordenadas por el % visible; las demás van después, sin
//   medalla, con "pocos trabajos todavía".
// - Garantía sin "¿de qué tratamiento?" (las de antes de que existiera esa
//   pregunta): si la clienta tuvo un solo tratamiento antes, es ese; si no,
//   queda en "sin tratamiento anotado" para elegirlo a mano en la cita.
// - Garantías de antes de que existiera "Garantía de servicio" (quedaron
//   como el mismo tratamiento a $0 o con "garantía" en las notas): Juan
//   Diego las marcó una vez (10/10/2026) con un buscador temporal que ya se
//   quitó. Quedaron en a.garantiaRevision = {es:true, de:<tratamiento>, en}
//   (o {es:false, en} = "no era garantía"). SOLO lo usan estas estadísticas
//   y Retoques: no toca precio, comisión, pagos ni isGarantiaAppt (que sí
//   mueve plata). En "una por una" se pueden desmarcar.
const GARANTIAS_DESDE = '2026-09-01';
const GARANTIAS_MIN_DATOS = 5; // trabajos de ese tratamiento para competir por medalla (antes 3)
// Un trabajo de los últimos GARANTIAS_VENTANA_DIAS días todavía puede volver
// por garantía: cuenta en el %, pero no para ganar medalla (ver rankingGarantias).
const GARANTIAS_VENTANA_DIAS = 30;
function esGarantiaParaStats(a){
  return isGarantiaAppt(a) || !!(a.garantiaRevision && a.garantiaRevision.es);
}
function garantiaDeStats(a){
  if(a.garantiaDe) return a.garantiaDe;
  return a.garantiaRevision && a.garantiaRevision.es ? (a.garantiaRevision.de || '') : '';
}
function originalDeGarantiaParaStats(g, rastreados){
  const n = normalizeName(g.client||'');
  if(!n) return null;
  const limite = (g.date||'') + (g.start||'');
  const previas = state.appointments
    .filter(x=>x.id!==g.id && normalizeName(x.client||'')===n && !esGarantiaParaStats(x) && !x.cursoId
      && x.estado!=='Cancelada' && x.estado!=='NoShow'
      && (x.date+(x.start||'')) <= limite)
    .sort((x,y)=>(y.date+(y.start||'')).localeCompare(x.date+(x.start||'')));
  const de = garantiaDeStats(g);
  if(de){
    const t = normalizeName(de);
    const orig = previas.find(x=>(x.services||[]).some(sv=>normalizeName(sv)===t));
    return orig ? {orig, tratamiento: de} : null;
  }
  const prev = previas.find(x=>(x.services||[]).some(sv=>rastreados.has(sv)));
  if(!prev) return null;
  const trats = Array.from(new Set((prev.services||[]).filter(sv=>rastreados.has(sv))));
  return trats.length===1 ? {orig: prev, tratamiento: trats[0], adivinado: true} : null;
}
// Por qué una garantía no se puede contar ("Garantías que no cuentan").
function nombresParecidos(a, b){
  const tok = x=> new Set(sinTildes(x||'').split(/\s+/).filter(w=>w.length>1));
  const ta = tok(a), tb = tok(b);
  let comunes = 0; ta.forEach(w=>{ if(tb.has(w)) comunes++; });
  return comunes>=2 || (comunes>=1 && Math.min(ta.size, tb.size)===1 && ta.size+tb.size<=3);
}
function fechaTexto(key){
  const d = parseKey(key);
  return `${d.getDate()} de ${MONTHS[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear() ? ' de '+d.getFullYear() : ''}`;
}
function razonGarantiaNoCuenta(g){
  const de = garantiaDeStats(g);
  if(!de) return 'No dice de qué tratamiento es la garantía.';
  const t = normalizeName(de), n = normalizeName(g.client||'');
  const limite = (g.date||'') + (g.start||'');
  const previas = state.appointments.filter(x=>x.id!==g.id && !esGarantiaParaStats(x) && !x.cursoId
      && x.estado!=='Cancelada' && x.estado!=='NoShow' && (x.date+(x.start||'')) <= limite)
    .sort((x,y)=>(y.date+(y.start||'')).localeCompare(x.date+(x.start||'')));
  const conTrat = x=>(x.services||[]).some(sv=>normalizeName(sv)===t);
  const misma = previas.find(x=>conTrat(x) && normalizeName(x.client||'')===n);
  const desdeTxt = fechaTexto(GARANTIAS_DESDE);
  if(misma){
    if(!misma.specialist) return `Su ${escapeHtml(de)} del ${fechaTexto(misma.date)} no tiene especialista anotada: ábrelo y elige quién lo hizo.`;
    return `Su ${escapeHtml(de)} fue el ${fechaTexto(misma.date)} con ${escapeHtml(misma.specialist)}, antes del ${desdeTxt} (desde cuando se mide).`;
  }
  const parecida = previas.find(x=>conTrat(x) && nombresParecidos(x.client, g.client));
  if(parecida) return `Hay un ${escapeHtml(de)} de "<b>${escapeHtml(parecida.client)}</b>" el ${fechaTexto(parecida.date)}: si es la misma clienta, el nombre está escrito distinto. Corrígelo en una de las dos citas para que coincida${parecida.date<GARANTIAS_DESDE ? ` (aunque, al ser de antes del ${desdeTxt}, igual no contaría)` : ''}.`;
  const otra = previas.find(x=>normalizeName(x.client||'')===n);
  return `No hay ningún ${escapeHtml(de)} anterior de esta clienta en la agenda (quizás se lo hizo antes de que existiera la agenda)${otra ? `. Lo último que tiene anotado antes es ${escapeHtml(summarizeServices(otra.services||[]))} el ${fechaTexto(otra.date)}` : ''}.`;
}
function garantiasStats(){
  const hoy = toKey(new Date());
  const garantias = state.appointments.filter(a=>esGarantiaParaStats(a) && !a.cursoId && a.date>=GARANTIAS_DESDE && a.date<=hoy
    && a.estado!=='Cancelada' && a.estado!=='NoShow');
  // Qué tratamientos se miden: los que llevan retoque (micropigmentación) y
  // cualquiera que haya tenido una garantía.
  const rastreados = new Set(state.services.map(s=>s.name).filter(servicioLlevaRetoque));
  garantias.forEach(g=>{ const de = garantiaDeStats(g); if(de) rastreados.add(de); });
  const celdas = {}; // tratamiento -> especialista -> {n, g, citas}
  const celda = (t, esp)=>{
    celdas[t] = celdas[t] || {};
    return celdas[t][esp] = celdas[t][esp] || {n:0, g:0, peso:0, rec:0, citas:[]};
  };
  const hoyD = parseKey(hoy);
  state.appointments.forEach(a=>{
    if(a.cursoId || esGarantiaParaStats(a) || !a.specialist) return;
    if(a.estado==='Cancelada' || a.estado==='NoShow') return;
    if(a.date<GARANTIAS_DESDE || a.date>hoy) return;
    const dias = Math.round((hoyD - parseKey(a.date)) / 86400000);
    const peso = Math.min(1, Math.max(0, dias / GARANTIAS_VENTANA_DIAS));
    (a.services||[]).forEach(sv=>{
      if(!rastreados.has(sv)) return;
      const c = celda(sv, a.specialist);
      c.n++; c.peso += peso; if(peso<1) c.rec++;
    });
  });
  const sinAnotar = [], fuera = [];
  garantias.forEach(g=>{
    const r = originalDeGarantiaParaStats(g, rastreados);
    // Original no encontrado (o de antes de esta agenda) pero Juan Diego dijo
    // a quién contársela (a.garantiaAsignadaA, botón en "Garantías que no
    // cuentan"): cuenta como 1 tratamiento + 1 garantía para ella, porque ese
    // tratamiento existió aunque no esté medido.
    const sinOriginal = !r || !r.orig.specialist || r.orig.date<GARANTIAS_DESDE;
    if(sinOriginal && g.garantiaAsignadaA && garantiaDeStats(g)){
      const c = celda(garantiaDeStats(g), g.garantiaAsignadaA);
      c.n++; c.peso += 1; c.g++;
      c.citas.push({g, orig:null, asignada:true});
      return;
    }
    if(!r){ (garantiaDeStats(g) ? fuera : sinAnotar).push(g); return; }
    const {orig, tratamiento} = r;
    // Tratamiento original de antes de esta agenda (o sin especialista):
    // no se puede comparar con nada, no cuenta.
    if(!orig.specialist || orig.date<GARANTIAS_DESDE){ fuera.push(g); return; }
    const c = celda(tratamiento, orig.specialist);
    c.g++;
    c.citas.push({g, orig, adivinado: !!r.adivinado});
  });
  const resumen = {n:0, g:0, garantias: garantias.length, sinAnotar: sinAnotar.length, fuera: fuera.length};
  Object.values(celdas).forEach(porEsp=>Object.values(porEsp).forEach(c=>{ resumen.n += c.n; resumen.g += c.g; }));
  return {celdas, sinAnotar, fuera, resumen};
}
// Más de la mitad de sus tratamientos son de los últimos días: su % todavía
// puede cambiar (por eso puede tener 100% y no quedar primera).
function mayoriaRecientes(c){ return c.n>0 && c.rec*2 > c.n; }
function pctBien(c){ return c.n ? Math.max(0, Math.round((c.n - c.g)*100/c.n)) : 0; }
// Ranking de un tratamiento (o de todos), de mejor a peor por el MISMO % que
// se ve ("quedaron bien"); si empatan, va primero la que tiene más trabajos
// (está más probada). Medallas 🥇🥈🥉 por puesto, siempre que haya al menos
// dos (pedido de Juan Diego, 10/10/2026: con medallas solo para quien tuviera
// 3 trabajos de hace más de un mes, casi nadie llegaba y no salía ninguna).
// Pocos trabajos o la mayoría recientes: solo una nota de cuidado al lado.
// (Una versión con una "cuenta más justa" escondida ponía "94% 🥇" arriba de
// "100% 🥈": no se entendía. El orden es siempre el % visible.)
const MEDALLAS = ['🥇','🥈','🥉'];
function rankingGarantias(porEsp){
  const filas = Object.keys(porEsp||{}).filter(e=>porEsp[e].n).map(e=>{
    const c = porEsp[e];
    const motivo = c.n < GARANTIAS_MIN_DATOS ? 'pocos trabajos todavía'
      : mayoriaRecientes(c) ? `la mayoría son de los últimos ${GARANTIAS_VENTANA_DIAS} días (todavía pueden volver)` : '';
    return {esp:e, c, pct: pctBien(c), motivo};
  }).sort((x,y)=>((y.c.n>=GARANTIAS_MIN_DATOS)-(x.c.n>=GARANTIAS_MIN_DATOS)) || (y.pct-x.pct) || (y.c.n-x.c.n) || x.esp.localeCompare(y.esp));

  if(filas.length>=2){
    filas.filter(f=>f.c.n>=GARANTIAS_MIN_DATOS).forEach((f,i,comp)=>{
      const ant = comp[i-1];
      f.puesto = (ant && ant.pct===f.pct && ant.c.n===f.c.n) ? ant.puesto : i+1;
      f.medalla = MEDALLAS[f.puesto-1] || '';
    });
  }
  return {filas};
}

function garantiasStatsDelForm(){
  if(!(ui.mode==='admin' && esDueno())) return null;
  if(!ui.modal || ui.modal.type!=='appt') return garantiasStats();
  if(!ui.modal._garStats) Object.defineProperty(ui.modal, '_garStats', {value: garantiasStats(), enumerable:false, writable:true});
  return ui.modal._garStats;
}
// En el formulario de la cita (solo dueños): la lista de especialistas va
// ordenada de mejor a peor con su medalla, su % y cuántos trabajos tiene
// (pedido de Juan Diego). Con varios tratamientos (combo) se suman los
// trabajos y garantías de cada una en esos tratamientos. Antes había además
// una nota debajo de la lista (se quitó) y la etiqueta "(pocos datos)", que
// también salía cuando la mayoría eran recientes y confundía: ahora dice el
// número de trabajos.
function rankingParaForm(servicios){
  const sv = serviciosParaFiltro(servicios);
  if(!sv.length) return null;
  const st = garantiasStatsDelForm();
  if(!st) return null;
  const suma = {};
  sv.forEach(t=>Object.entries(st.celdas[t]||{}).forEach(([e,c])=>{
    const x = suma[e] = suma[e] || {n:0, g:0, peso:0, rec:0};
    x.n += c.n; x.g += c.g; x.peso += c.peso||0; x.rec += c.rec||0;
  }));
  const filas = rankingGarantias(suma).filas;
  return filas.length ? filas : null;
}

// Comparación con el mes anterior. En el mes en curso compara "a la misma
// fecha" (ej. del 1 al 18 contra del 1 al 18 del mes pasado), para no poner
// medio mes contra un mes completo. Solo las citas: los gastos fijos se
// cuentan completos cada mes y no se pueden partir por día.
function comparacionMesHtml(year, month){
  const hoy = hoySedeKey();
  const ini = toKey(new Date(year, month, 1)), fin = toKey(new Date(year, month+1, 0));
  if(hoy < ini) return '';
  const prev = addMonths(new Date(year, month, 1), -1);
  const py = prev.getFullYear(), pm = prev.getMonth();
  let actual, antes, texto;
  if(hoy <= fin){
    const dia = parseKey(hoy).getDate();
    const diaPrev = Math.min(dia, daysInMonth(py, pm));
    actual = monthFinancials(year, month, hoy).ingresosCitas;
    antes = monthFinancials(py, pm, toKey(new Date(py, pm, diaPrev))).ingresosCitas;
    texto = `Citas: llevas <b>${fmtCLP(actual)}</b> al ${dia} de ${MONTHS[month]}. El mes pasado, al ${diaPrev} de ${MONTHS[pm]}, llevabas ${fmtCLP(antes)}.`;
  } else {
    actual = monthFinancials(year, month).ingresosCitas;
    antes = monthFinancials(py, pm).ingresosCitas;
    texto = `Citas: <b>${fmtCLP(actual)}</b> en ${MONTHS[month]}, contra ${fmtCLP(antes)} en ${MONTHS[pm]}.`;
  }
  let delta = '';
  if(antes > 0){
    const pct = Math.round((actual - antes) / antes * 100);
    delta = pct===0 ? ' <span class="fin-delta">= igual</span>'
      : ` <span class="fin-delta ${pct>0?'sube':'baja'}">${pct>0?'▲':'▼'} ${Math.abs(pct)}%</span>`;
  }
  return `<div class="fin-hero-comp">${texto}${delta}</div>`;
}

// ---------------- Gráficos (SVG livianos, sin librerías externas) ----------------
// Ancho de los gráficos según la pantalla: antes siempre medían 620 y en el
// teléfono se achicaban enteros (letras de ~6px y mucho espacio vacío).
function anchoGrafico(){
  const w = (typeof window!=='undefined' && window.innerWidth) || 620;
  return Math.max(300, Math.min(620, w - 52));
}
function svgHBarChart(data, opts={}){
  const w = opts.width || anchoGrafico(), barH = 24, gap = 10, padding = 8;
  const labelW = opts.labelW || Math.round(Math.min(170, w*0.4));
  const maxVal = Math.max(1, ...data.map(d=>d.value));
  const chartW = w - labelW - 62;
  const h = data.length*(barH+gap) - gap + padding*2;
  const bars = data.map((d,i)=>{
    const y = padding + i*(barH+gap);
    const barW = Math.max(2, (Math.max(0, d.value)/maxVal)*chartW);
    const valTxt = opts.formatValue ? opts.formatValue(d.value, d) : d.value;
    // Un nombre largo se corta con "…" para que no se salga por la izquierda.
    const maxLetras = Math.floor((labelW-10)/6.3);
    const etiqueta = String(d.label).length > maxLetras ? String(d.label).slice(0, maxLetras-1)+'…' : String(d.label);
    return `
      <text x="${labelW-8}" y="${y+barH/2+4}" text-anchor="end" font-size="11.5" style="fill:var(--ink)" font-family="Montserrat,sans-serif"><title>${escapeHtml(d.label)}</title>${escapeHtml(etiqueta)}</text>
      <rect x="${labelW}" y="${y}" width="${barW}" height="${barH}" rx="5" style="fill:var(--wine)"></rect>
      <text x="${labelW+barW+8}" y="${y+barH/2+4}" font-size="11.5" style="fill:var(--gold-soft)" font-weight="600" font-family="Montserrat,sans-serif">${valTxt}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:${w}px;display:block;">${bars}</svg>`;
}
// Barras verticales. Acepta números negativos (ej. un mes en que se perdió
// dinero): bajan desde la línea del cero, en rojo.
function svgVBarChart(data, opts={}){
  const w = opts.width || anchoGrafico(), h = opts.height || 210, gap = 14;
  const padding = 16, arriba = 20;
  const vals = data.map(d=>Number(d.value)||0);
  const maxVal = Math.max(1, ...vals), minVal = Math.min(0, ...vals);
  // Abajo va el mes; si hay negativos, también su número debajo de la barra.
  const chartH = h - arriba - 26 - (minVal<0 ? 16 : 0);
  const escala = chartH / (maxVal - minVal);
  const y0 = arriba + maxVal*escala;
  const barW = (w - padding*2 - gap*(data.length-1)) / data.length;
  const bars = data.map((d,i)=>{
    const v = vals[i];
    const barH = Math.max(2, Math.abs(v)*escala);
    const x = padding + i*(barW+gap);
    const y = v>=0 ? y0 - barH : y0;
    const valTxt = opts.formatValue ? opts.formatValue(v) : v;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="5" style="fill:var(${v<0?'--danger':'--wine'})"></rect>
      <text x="${x+barW/2}" y="${v>=0 ? y-6 : y+barH+13}" text-anchor="middle" font-size="11" style="fill:var(${v<0?'--danger':'--gold-soft'})" font-weight="600" font-family="Montserrat,sans-serif">${valTxt}</text>
      <text x="${x+barW/2}" y="${h-8}" text-anchor="middle" font-size="11" style="fill:var(--ink-soft)" font-family="Montserrat,sans-serif">${escapeHtml(d.label)}</text>
    `;
  }).join('');
  const linea0 = minVal<0 ? `<line x1="${padding}" x2="${w-padding}" y1="${y0}" y2="${y0}" style="stroke:var(--line)" stroke-width="1"></line>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="max-width:${w}px;display:block;">${linea0}${bars}</svg>`;
}

function finanzasGraficosHtml(year, month){
  const meses = [];
  for(let i=5;i>=0;i--){
    const d = addMonths(new Date(year,month,1), -i);
    meses.push({d, fin: monthFinancials(d.getFullYear(), d.getMonth())});
  }
  const etiqueta = d=>MONTHS[d.getMonth()].slice(0,3);
  const quedo = meses.map(x=>({label: etiqueta(x.d), value: x.fin.beneficio}));
  const entro = meses.map(x=>({label: etiqueta(x.d), value: x.fin.ingresos}));

  const f = monthFinancials(year, month);
  // Lo que deja cada tratamiento: en un combo el precio se reparte según el
  // precio de lista de cada servicio (si no hay precio, en partes iguales).
  const precioLista = name=>{ const sv = state.services.find(x=>x.name===name); return sv ? (Number(sv.price)||0) : 0; };
  const porTrat = {};
  f.hechas.filter(a=>!a.cursoId).forEach(a=>{
    const svcs = (a.services||[]).filter(Boolean);
    if(!svcs.length) return;
    const total = svcs.reduce((t,x)=>t+precioLista(x),0);
    svcs.forEach(x=>{
      const parte = total>0 ? precioLista(x)/total : 1/svcs.length;
      if(!porTrat[x]) porTrat[x] = {dinero:0, n:0};
      porTrat[x].dinero += apptRevenue(a)*parte;
      porTrat[x].n += 1;
    });
  });
  const topTrat = Object.keys(porTrat).map(k=>({label:k, n:porTrat[k].n, value:Math.round(porTrat[k].dinero)})).sort((a,b)=>b.value-a.value).slice(0,8);

  const espDeja = Object.keys(f.porEspecialista).map(k=>({label:k, value:f.porEspecialista[k].ingresos - f.porEspecialista[k].comision})).sort((a,b)=>b.value-a.value);
  const espCitas = Object.keys(f.porEspecialista).map(k=>({label:k, value:f.porEspecialista[k].hechas})).sort((a,b)=>b.value-a.value);

  return `
    <h3 class="fin-sub">Lo que te quedó — últimos 6 meses</h3>

// ---------------- WhatsApp: enlaces y copiar al portapapeles ----------------

function waPhoneDigits(phone){
  let d = (phone||'').replace(/\D/g,'');
  if(!d) return '';
  if(SEDE.telPais==='54') return waPhoneDigitsArgentina(d);
  if(d.startsWith('56')) return d; // ya tiene código de país
  if(d.length===9 && d.startsWith('9')) return '56'+d; // celular chileno sin código de país
  if(d.length===8) return '569'+d; // celular chileno sin el 9 inicial
  return d; // lo que haya, mejor eso que nada
}
// WhatsApp exige los celulares argentinos como 54 + 9 + código de área (sin
// el 0) + número (sin el 15). Ej.: "011 15 2345-6789" → 5491123456789.
function waPhoneDigitsArgentina(d){
  if(d.startsWith('549')) return d; // ya está completo
  if(d.startsWith('54')) d = d.slice(2); // código de país sin el 9
  if(d.startsWith('0')) d = d.slice(1); // 0 del código de área
  // El "15" de los celulares va después del código de área (2 a 4 dígitos):
  // con él, el número queda con 12 dígitos en vez de 10.
  if(d.length===12){
    for(const area of [2,3,4]){
      if(d.slice(area, area+2)==='15'){ d = d.slice(0, area) + d.slice(area+2); break; }
    }
  }
  if(d.length===10) return '549'+d;
  return d; // lo que haya, mejor eso que nada
}
function waLink(phone, msg){
  return `https://wa.me/${waPhoneDigits(phone)}?text=${encodeURIComponent(msg)}`;
}
// navigator.clipboard falla en algunos webviews/file://, así que si no está
// disponible cae a la forma vieja de copiar (seleccionar texto + execCommand).
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).catch(()=>legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(err){}
  document.body.removeChild(ta);
}

// El retoque se recomienda entre 30 y 45 días después de la SESIÓN INICIAL. Una
// cita que ya es en sí misma un retoque (servicio "Retoque…") no cuenta como
// sesión inicial: si contara, la clienta que ya se hizo su retoque volvería a
// aparecer pidiendo "otro retoque", lo cual no corresponde.
function isRetoqueAppt(a){
  return (a.services||[]).some(s=>/retoque/i.test(s||''));
}
// Una "Evaluación" es solo una consulta previa (gratis, sin tratamiento
// aplicado todavía) — no tiene sentido ofrecerle un retoque a alguien que
// todavía no se hizo nada.
function isEvaluacionAppt(a){
  return (a.services||[]).some(s=>/evaluaci[oó]n/i.test(s||''));
}
// Lo mismo con "Garantía de servicio": es una visita para corregir algo de
// un tratamiento anterior (gratis), no una sesión inicial nueva — tampoco
// le corresponde un "retoque" de la garantía en sí.
function isGarantiaAppt(a){
  return (a.services||[]).some(s=>esServicioGarantia(s));
}
function esServicioGarantia(nombre){ return /garant[ií]a/i.test(nombre||''); }
// Una garantía guarda de qué tratamiento es (a.garantiaDe, ej. "Microblading
// (MB)", pedido de Juan Diego, oct 2026): se muestra "Garantía de servicio
// (Microblading (MB))" y dura lo mismo que ese tratamiento. Las garantías
// viejas no lo tienen y se muestran como siempre.
function serviciosParaMostrar(a){

}

// El último tratamiento de esa clienta (para dejarlo sugerido).
function ultimoTratamientoDe(cliente){
  const n = normalizeName(cliente||'');
  if(!n) return '';
  const validos = new Set(tratamientosParaGarantia());
  const citas = state.appointments.filter(a=>normalizeName(a.client||'')===n && !isGarantiaAppt(a))
    .sort((x,y)=> (y.date+y.start).localeCompare(x.date+x.start));
  for(const a of citas){
    const t = (a.services||[]).find(sv=>validos.has(sv) && !/evaluaci[oó]n/i.test(sv));
    if(t) return t;
  }
  return '';
}

// Cuánto de la comisión de la cita original corresponde al tratamiento de la
// garantía: toda, si la cita fue solo eso; si fue un combo (ej. Microblading
// + Delineado), la parte proporcional al precio de lista de ese tratamiento.
function montoTraspasoSugerido(orig, tratamiento){
  const total = apptCommission(orig);
  const servicios = orig.services||[];
  const t = normalizeName(tratamiento||'');
  const precioDe = n=>{ const svc = state.services.find(x=>normalizeName(x.name)===normalizeName(n)); return svc ? (Number(svc.price)||0) : 0; };
  const suma = servicios.reduce((s,n)=>s+precioDe(n),0);
  const delTrat = servicios.filter(n=>normalizeName(n)===t).reduce((s,n)=>s+precioDe(n),0);
  if(servicios.length<=1 || !suma || !delTrat || servicios.every(n=>normalizeName(n)===t)) return total;
  return Math.round(total * delTrat / suma);
}
// El cuadro "el tratamiento original lo hizo otra especialista" dentro de
