// ---------------- Restaurar un respaldo ----------------
// Vuelve la agenda de la sede a como estaba en un respaldo. Es delicado, así
// que: solo Admin, dos confirmaciones, y ANTES se guarda sola una copia de
// cómo está ahora (en la misma transacción), que aparece en Respaldos para
// poder deshacer la restauración. Lo que el respaldo no tenga (ej. los cursos
// en respaldos viejos) se deja como está ahora. Después se recarga la página.
function restaurarRespaldo(key, etiqueta){
  if(ui.mode!=='admin' || !key) return;
  if(ui.saving || pendingSaves.length){ showAlert('Espera un momento a que termine de guardarse el último cambio, y vuelve a intentarlo.'); return; }
  showConfirmDialog(`¿Volver la agenda de ${SEDE.nombre} a como estaba en el respaldo del ${etiqueta || key}? Todo lo que se haya hecho DESPUÉS de ese respaldo (citas nuevas, pagos marcados, cambios) va a desaparecer de la agenda. Antes se va a guardar una copia de cómo está ahora, por si te arrepientes.`, ()=>{
    setTimeout(()=>showConfirmDialog('Última confirmación: ¿restaurar ahora? Avísale al equipo que recargue la agenda después.', ()=>{ ejecutarRestauracion(key); }), 50);
  });
}
async function ejecutarRestauracion(key){
  if(!db || !DOC_REF) return;
  const site = autoBackupSite();
  const col = db.collection(AUTO_BACKUP_COLLECTION);
  const root = document.getElementById('root');
  try{
    const bsnap = await col.doc(`${site}_${key}`).get();
    const respaldo = bsnap.exists ? bsnap.data().data : null;
    if(!respaldo || !Array.isArray(respaldo.appointments)){ showAlert('No se encontró ese respaldo (o está incompleto). No se cambió nada.'); return; }
    const copiaId = 'antes-restaurar-' + new Date().toISOString().replace(/[:.]/g, '-');
    let habiaDatos = false;
    await db.runTransaction(async tx=>{
      const snap = await tx.get(DOC_REF);
      const actual = snap.exists ? snap.data() : null;
      if(actual && Number(actual.appVersion||0) > APP_VERSION) throw Object.assign(new Error('Versión vieja'), {sibana:'outdated'});
      const nuevo = {};
      DOC_KEYS.forEach(k=>{
        if(respaldo[k]!==undefined) nuevo[k] = respaldo[k];
        else if(actual && actual[k]!==undefined) nuevo[k] = actual[k];
      });
      nuevo.appVersion = APP_VERSION;
      nuevo.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      habiaDatos = !!actual;
      if(actual){
        tx.set(col.doc(`${site}_${copiaId}`), {
          site, fecha: toKey(new Date()), tipo: 'antes-de-restaurar', restauradoDesde: key,
          citas: (actual.appointments||[]).length,
          creado: firebase.firestore.FieldValue.serverTimestamp(),
          data: actual,
        });
      }
      tx.set(DOC_REF, nuevo);
    });
    if(habiaDatos){
      await col.doc(`${site}_indice`).set({ antesDeRestaurar: firebase.firestore.FieldValue.arrayUnion(copiaId) }, {merge:true}).catch(err=>console.error(err));
    }
    if(root) root.innerHTML = loadingScreenHtml('Listo, se restauró el respaldo. Recargando…');
    setTimeout(reloadFresh, 1200);
  }catch(e){
    console.error('No se pudo restaurar el respaldo', e);
    if(e && e.sibana==='outdated'){ appOutdated = true; renderSyncBanner(); showAlert('Hay una versión nueva de la agenda. Recarga la página y vuelve a intentarlo. No se cambió nada.'); return; }
    showAlert('❌ No se pudo restaurar (revisa tu conexión a internet). No se cambió nada.');
  }
}
// Pantalla de rescate: si la agenda no puede leer sus datos (o no existen),
// un Admin igual puede ver los respaldos y restaurar uno desde ahí.
async function abrirRescate(){
  const root = document.getElementById('root');
  if(!root) return;
  root.innerHTML = loadingScreenHtml('Buscando respaldos…');
  let fechas = [], antes = [];
  try{
    const snap = await db.collection(AUTO_BACKUP_COLLECTION).doc(`${autoBackupSite()}_indice`).get();
    fechas = ((snap.exists && snap.data().fechas) || []).slice().sort().reverse();
    antes = ((snap.exists && snap.data().antesDeRestaurar) || []).slice().sort().reverse();
  }catch(e){
    root.innerHTML = '<div class="loading">No se pudo leer la lista de respaldos (' + escapeHtml(e.code||e.message||'error') + '). Revisa la conexión y recarga la página.</div>';
    return;
  }
  const fila = (k, etiqueta)=>`<div class="ns-item"><div><div class="ns-name">${escapeHtml(etiqueta)}</div></div>
    <button class="btn btn-ghost" style="font-size:12.5px;" onclick="restaurarRespaldo('${k}', '${escapeHtml(etiqueta)}')">↩️ Restaurar</button></div>`;
  root.innerHTML = `
    <div class="login-gate">
      <img src="${LOGO_SRC}" alt="Sibana" class="login-gate-logo">
      <h1 class="serif">Respaldos de ${escapeHtml(SEDE.nombre)}</h1>
      <p class="hint">Elige el respaldo a restaurar. Antes se guarda sola una copia de lo que haya ahora.</p>
      <div class="login-gate-box" style="max-width:520px;width:100%;">
        ${fechas.length ? fechas.map(k=>{ const d = parseKey(k); return fila(k, `${DAY_NAMES[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]} ${d.getFullYear()}`); }).join('') : '<div class="empty-msg">No hay respaldos de esta sede.</div>'}
        ${antes.map(k=>fila(k, 'Copia de antes de restaurar (' + k.replace('antes-restaurar-','').slice(0,16).replace('T',' ') + ' UTC)')).join('')}
        <button class="btn btn-ghost" style="width:100%;margin-top:12px;" onclick="reloadFresh()">Volver</button>
      </div>
    </div>`;
}

function autoBackupsModalHtml(){
  const m = ui.modal;
  const body = m.loading ? '<div class="hint">Cargando…</div>'
    : m.error ? `<div class="hint">${escapeHtml(m.error)}</div>`
    : !(m.list||[]).length ? '<div class="empty-msg">Todavía no hay respaldos automáticos. El primero se crea solo apenas alguien abra la agenda.</div>'
    : m.list.map(k=>{
        const d = parseKey(k);
        const etiqueta = `${DAY_NAMES[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
        return `<div class="ns-item"><div><div class="ns-name">${etiqueta}</div></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
            <button class="btn btn-ghost" style="font-size:12.5px;" data-act="download-autobackup" data-date="${k}">💾 Descargar</button>
            <button class="btn btn-ghost" style="font-size:12.5px;" data-act="restore-autobackup" data-date="${k}" data-label="${escapeHtml(etiqueta)}">↩️ Restaurar</button>
          </div></div>`;
      }).join('') + antesDeRestaurarHtml(m.antes);
  return `
  <div class="overlay" data-act="overlay-close">
    <div class="modal" data-stop="1">
      <h2 class="serif">Respaldos</h2>
      ${espacioUsadoHtml()}
      <p class="hint">Cada día, la primera vez que alguien abre la agenda, se guarda sola una copia completa de todos los datos. Se guardan los últimos ${AUTO_BACKUP_KEEP_DAYS} días. Si algún día se pierde algo, con estas copias se puede recuperar.</p>
      <p class="hint"><b>↩️ Restaurar</b> vuelve la agenda de ${escapeHtml(SEDE.nombre)} a como estaba ese día (lo hecho después se pierde de la agenda). Antes de restaurar se guarda sola una copia de cómo está ahora, por si te arrepientes.</p>
      ${body}
      <p class="hint" style="margin:18px 0 8px;">Cada cita también se copia sola a la Hoja de Google y a Google Calendar. Si alguna no aparece allá (por ejemplo, porque justo falló internet), esto las vuelve a mandar todas — nunca duplica nada.</p>
      <button type="button" class="btn btn-ghost" style="font-size:12.5px;" data-act="sync-all-backup">☁️ Reenviar todo a Sheets/Calendar</button>
      <div class="modal-actions">
        <div></div>
        <div class="right"><button class="btn btn-ghost" data-act="close-modal">Cerrar</button></div>
      </div>
    </div>
  </div>`;
}

// ---------------- Events ----------------
function attachEvents(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  document.querySelectorAll('[data-stop]').forEach(el=>{
    el.addEventListener('click', e=>e.stopPropagation());
  });
  const chipsBox = document.getElementById('svc-chips');
  if(chipsBox){
    chipsBox.addEventListener('click', e=>{
      const tag = e.target.closest('[data-svc-remove]');
      if(!tag) return;
      setServiceQty(Number(tag.dataset.svcRemove), 0);
    });
  }
  const searchResults = document.getElementById('appt-search-results');
  if(searchResults){
    searchResults.addEventListener('click', e=>{
      const row = e.target.closest('[data-goto-appt]');
      if(row) gotoApptFromSearch(row.dataset.gotoAppt);
    });
  }
  const svcPicker = document.getElementById('svc-picker');
  if(svcPicker){
    actualizarPerfilEnForm();
    svcPicker.addEventListener('click', e=>{
      const incBtn = e.target.closest('[data-svc-inc]');
      const decBtn = e.target.closest('[data-svc-dec]');
      if(incBtn){
        const idx = Number(incBtn.dataset.svcInc);
        const row = incBtn.closest('[data-svc-row]');
        setServiceQty(idx, (Number(row?.dataset.qty)||0) + 1);
      } else if(decBtn){
        const idx = Number(decBtn.dataset.svcDec);
        const row = decBtn.closest('[data-svc-row]');
        setServiceQty(idx, (Number(row?.dataset.qty)||0) - 1);
      }
    });
  }
  document.querySelectorAll('.reloj-bloqueo').forEach(caja=>{
    caja.querySelectorAll('[data-reloj-parte]').forEach(btn=>btn.addEventListener('click', ()=>abrirRelojBloqueo(caja, btn.dataset.relojParte)));
  });
  const blockDate = document.getElementById('f-block-date');
  if(blockDate && document.querySelector('.reloj-bloqueo')) blockDate.addEventListener('change', ajustarRelojesAlDia);
  const blockKind = document.getElementById('block-kind');
  if(blockKind){
    blockKind.addEventListener('change', ()=>{
      const kind = (blockKind.querySelector('input:checked')||{}).value || 'hours';
      blockKind.querySelectorAll('label').forEach(l=>l.classList.toggle('on', l.querySelector('input').checked));
      document.getElementById('block-hours-fields').style.display = kind==='hours' ? 'grid' : 'none';
      document.getElementById('block-dateend-field').style.display = kind==='days' ? 'block' : 'none';
      document.getElementById('f-block-date-label').textContent = kind==='days' ? 'Desde el día' : 'Fecha';
    });
  }
  const reprogOpen = document.getElementById('reprog-open');
  if(reprogOpen){
    const panel = document.getElementById('reprog-panel');
    reprogOpen.addEventListener('click', ()=>{
      // Si ya se cambió el día o la hora arriba en el formulario, el cuadro
      // parte con eso (bug real 12/10/2026: la "Nueva hora" venía con la hora
      // original y, al guardar, la cita volvía a esa hora).
      const d0 = ui.modal && ui.modal.data;
      const fDate = document.getElementById('f-date'), fStart = document.getElementById('f-start');
      if(d0 && fDate && fDate.value && fDate.value!==d0.date) document.getElementById('reprog-date').value = fDate.value;
      if(fStart && fStart.value) document.getElementById('reprog-start').value = fStart.value;
      panel.style.display = 'block';
      reprogOpen.style.display = 'none';
      document.getElementById('reprog-date').focus();
    });
    document.getElementById('reprog-cancel').addEventListener('click', ()=>{
      panel.style.display = 'none';
      reprogOpen.style.display = '';
    });
    document.getElementById('reprog-ok').addEventListener('click', aplicarReprogramacion);
  }
  const splitToggle = document.getElementById('staff-split-toggle');
  if(splitToggle){
    splitToggle.addEventListener('click', ()=>{
      const box = document.getElementById('staff-split-box');
      const on = box.style.display==='none';
      box.style.display = on ? 'block' : 'none';
      splitToggle.textContent = on ? '✕ Pagó con un solo método' : '➕ Pagó con dos métodos (ej. efectivo y transferencia)';
      if(!on){
        document.getElementById('f-staff-metodoSaldo2').value = '';
        document.getElementById('f-staff-montoSaldo2').value = '';
      }
      updateStaffSplitHint();
    });
    ['f-staff-metodoSaldo','f-staff-metodoSaldo2','f-staff-montoSaldo2'].forEach(id=>{
      const el = document.getElementById(id);
      if(el){ el.addEventListener('input', updateStaffSplitHint); el.addEventListener('change', updateStaffSplitHint); }
    });
    updateStaffSplitHint();
  }
  document.querySelectorAll('[data-crema-stepper]').forEach(wrap=>{
    const input = document.getElementById(wrap.dataset.cremaStepper);
    if(!input) return;
    wrap.addEventListener('click', e=>{
      const inc = e.target.closest('[data-crema-inc]');
      const dec = e.target.closest('[data-crema-dec]');
      if(!inc && !dec) return;
      const prev = Number(input.value)||0;
      const n = Math.max(0, Math.min(9, prev + (inc?1:-1)));
      input.value = n;
      document.getElementById(input.id+'-num').textContent = n;
      wrap.querySelector('[data-crema-dec]').disabled = n<=0;
      wrap.querySelector('[data-crema-inc]').disabled = n>=9;
      if(input.id==='f-crema'){
        if(ui.modal && ui.modal.mode==='new'){
          recomputeServiceFields();
        } else if(ui.modal && ui.modal.data && n!==prev){
          // Editando una cita YA existente: solo se ajusta por el cambio
          // real de cremas, sin recalcular el resto del precio desde la
          // lista de servicios actual — así nunca se pisa el precio
          // histórico de la cita, aunque los precios de la lista hayan
          // cambiado después (ver "Crema incluida" en CLAUDE.md).
          const priceInput = document.getElementById('f-price');
          const abonoInput = document.getElementById('f-abono');
          const saldoInput = document.getElementById('f-saldo');
          const delta = (n - prev) * CREMA_PRICE;
          if(priceInput) priceInput.value = Math.max(0, (Number(priceInput.value)||0) + delta);
          if(saldoInput && abonoInput && priceInput){
            const splitSaldoBox = document.getElementById('split-saldo');
            const saldoIsSplit = splitSaldoBox && splitSaldoBox.style.display !== 'none';
            if(!saldoIsSplit) saldoInput.value = Math.max(0, (Number(priceInput.value)||0) - (Number(abonoInput.value)||0));
          }
        }
      }
      if(input.id==='f-staff-crema' && ui.modal && ui.modal.data){
        // El monto a cobrar se actualiza al tiro con las cremas elegidas.
        const d = ui.modal.data;
        const price = (Number(d.price)||0) + (n - apptCremas(d))*CREMA_PRICE;
        const box = document.getElementById('staff-cobrar-amount');
        if(box) box.textContent = fmtCLP(apptPorCobrar({price, abono:d.abono}));
        updateStaffSplitHint();
      }
    });
  });
  // Botón discreto (solo Admin, editando una cita ya existente) para corregir
  // a mano una cita ambigua con el cambio de "crema incluida" — por ejemplo,
  // una agendada justo en el momento del corte, que quedó con la condición
  // que no correspondía. Cambia solo ESA cita; no toca el interruptor
  // general de Configuración ni ninguna otra cita.
  const togglePolicyBtn = document.getElementById('toggle-crema-policy-btn');
  if(togglePolicyBtn){
    togglePolicyBtn.addEventListener('click', ()=>{
      const d = ui.modal.data;
      const cremaInput = document.getElementById('f-crema');
      const currentQty = cremaInput ? Math.max(0, Math.min(9, Number(cremaInput.value)||0)) : apptCremas(d);
      d.cremaIncluidaPolitica = !d.cremaIncluidaPolitica;
      const note = document.getElementById('crema-incluida-note');
      const stepperWrap = document.getElementById('crema-stepper-wrap');
      if(d.cremaIncluidaPolitica){
        // Pasa a "incluida": si tenía cremas cobradas aparte, se descuenta
        // ese monto del precio/saldo (ya no corresponde cobrarlas). El
        // resto del precio NO se toca — no se recalcula desde la lista de
        // precios actual, para no pisar el precio congelado de esta cita.
        if(currentQty>0){
          const priceInput = document.getElementById('f-price');
          const abonoInput = document.getElementById('f-abono');
          const saldoInput = document.getElementById('f-saldo');
          const diff = currentQty*CREMA_PRICE;
          if(priceInput) priceInput.value = Math.max(0, (Number(priceInput.value)||0) - diff);
          if(saldoInput && abonoInput && priceInput) saldoInput.value = Math.max(0, (Number(priceInput.value)||0) - (Number(abonoInput.value)||0));
        }
        if(cremaInput){
          cremaInput.value = 0;
          const num = document.getElementById(cremaInput.id+'-num');
          if(num) num.textContent = '0';
        }
        note.style.display = '';
        stepperWrap.style.display = 'none';
        togglePolicyBtn.textContent = 'Esta cita en realidad debía cobrar la crema aparte — cambiar a la condición anterior';
      } else {
        note.style.display = 'none';
        stepperWrap.style.display = '';
        togglePolicyBtn.textContent = 'Esta cita en realidad debía tener la crema incluida — cambiar a la condición nueva';
      }
    });
  }
  const personasInput = document.getElementById('f-personas');
  if(personasInput){
    const wrap = personasInput.parentElement;
    wrap.addEventListener('click', e=>{
      const inc = e.target.closest('[data-personas-inc]');
      const dec = e.target.closest('[data-personas-dec]');
      if(!inc && !dec) return;
      const n = Math.max(1, Math.min(9, (Number(personasInput.value)||1) + (inc?1:-1)));
      personasInput.value = n;
      document.getElementById('f-personas-num').textContent = n;
      wrap.querySelector('[data-personas-dec]').disabled = n<=1;
      wrap.querySelector('[data-personas-inc]').disabled = n>=9;
    });
  }
}

  return {
    id: uid(), date: toKey(ui.currentDate),
    start, end: addMinutesToHHMM(start, 60),
    client:'', phone:'', services: [],
    price: 0,
    specialist:'', estado:'Pendiente',
    abono:0, metodoAbono:'Transferencia', saldo:0, metodoSaldo:'', notas:'',
    metodoAbono2:'', montoAbono2:0, metodoSaldo2:'', montoSaldo2:0,
    abonoPrevio:false,
    abonoDevuelto:false,
    cremaComprada:false
  };
}
function blankBlock(hour){
  // Dentro del horario del estudio ese día (las casillas del bloqueo solo
  // ofrecen esas horas; ver horasBloqueoPara).
  const r = horasBloqueoPara(toKey(ui.currentDate));
  const abreH = Math.ceil(r.abre/60), ultimaH = Math.ceil(r.cierra/60) - 1;
  const h = Math.min(Math.max(hour!==undefined ? hour : 10, abreH), ultimaH);
  const start = pad(h)+':00';
  const finMin = Math.min(minutesFromMidnight(start) + 60, r.cierra);
  return {
    id: uid(), date: toKey(ui.currentDate),
    start, end: pad(Math.floor(finMin/60))+':'+pad(finMin%60),
    specialist: '', reason: '' // vacío a propósito: quien bloquea elige el nombre (evita bloquear a otra por error)
  };
}

// ¿La especialista cambió el método de pago o las cremas en la vista de una
// cita, sin tocar todavía el botón de guardar?
function staffHasUnsavedPayment(){
  if(ui.mode==='admin' || !ui.modal || ui.modal.type!=='appt') return false;
  const d = ui.modal.data;
  const sel = document.getElementById('f-staff-metodoSaldo');
  const crema = document.getElementById('f-staff-crema');
  if(sel && sel.value && sel.value!==(d.metodoSaldo||'')) return true;
  if(crema && (Number(crema.value)||0)!==apptCremas(d)) return true;
  const box = document.getElementById('staff-split-box');
  if(box){
    const on = box.style.display!=='none';
    const m2 = on ? (Number(document.getElementById('f-staff-montoSaldo2').value)||0) : 0;
    const met2 = on ? document.getElementById('f-staff-metodoSaldo2').value : '';
    const hadSplit = (Number(d.montoSaldo2)||0)>0;
    if(m2!==(hadSplit ? Number(d.montoSaldo2) : 0)) return true;
    if(on && met2!==(hadSplit ? (d.metodoSaldo2||'') : '') && (m2>0 || met2)) return true;
  }
  return false;
}

function onAction(e){
  const act = e.currentTarget.dataset.act;
  if(act !== 'toggle-menu') ui.menuOpen = false;
  if(ui.mode!=='admin' && ADMIN_ONLY_ACTIONS.has(act)) return; // protección extra, además de ocultar los botones
  switch(act){
    case 'toggle-tema': cambiarTema(); break;
    case 'toggle-mode': {
      if(!puedeCambiarModo()) break; // los dueños y el equipo de Buenos Aires no tienen este botón
      if(ui.mode==='admin'){
        ui.mode = 'staff';
        ui.modal = null;
        render();
        checkStaffIdentityIfNeeded();
        checkNewServicesIfNeeded();
      } else {
        const pass = state.settings.adminPassword || '';
        if(!pass){
          ui.mode = 'admin';
          render();
          showAlert('Entraste en modo administrador. Todavía no has configurado una contraseña — hazlo en Más → Seguridad para que no cualquiera pueda entrar aquí.');
          checkUnseenBlocksIfNeeded();
        } else {
          showPrompt('Ingresa la contraseña de administrador:', (val)=>{
            if(val === pass){
              ui.mode = 'admin';
              safeSetLocal(ADMIN_TRUST_KEY, '1'); // este dispositivo queda como admin para siempre, sin volver a pedir contraseña
              render();
              checkUnseenBlocksIfNeeded();
            } else {
              showAlert('Contraseña incorrecta.');
            }
          });
        }
      }
      break;
    }
    case 'open-sede':
      if(!veVariasSedes()) break;
      ui.modal = {type:'sede'}; render(); break;
    case 'set-sede':
      cambiarSede(e.currentTarget.dataset.sede); break;
    case 'cambiar-cuenta':
      cambiarDeCuenta(); break;
    case 'open-valores-sede':
      ui.modal = {type:'valores-sede'}; render(); break;
    case 'save-valores-sede':
      saveValoresSedeFromForm(); break;
    case 'remove-dolar':
      removeValorDolar(e.currentTarget.dataset.desde); break;
    case 'prev':
      ui.currentDate = ui.view==='day' ? addDays(ui.currentDate,-1) : ui.view==='week' ? addDays(ui.currentDate,-7) : addMonths(ui.currentDate,-1);
      render(); break;
    case 'next':
      ui.currentDate = ui.view==='day' ? addDays(ui.currentDate,1) : ui.view==='week' ? addDays(ui.currentDate,7) : addMonths(ui.currentDate,1);
      render(); break;
    case 'today':
      ui.currentDate = new Date(); render(); break;
    case 'view-day':
      ui.view='day'; render(); break;
    case 'view-week':
      ui.view='week'; render(); break;
    case 'view-month':
      ui.view='month'; render(); break;
    case 'goto-day':
      ui.currentDate = parseKey(e.currentTarget.dataset.date);
      ui.view='day'; render(); break;
    case 'toggle-menu':
      ui.menuOpen = !ui.menuOpen; render(); break;
    case 'filter-specialist':
      ui.specialistFilter = e.currentTarget.dataset.spec; render(); break;
    case 'new-appt':

      if(appt.estado!=='Realizada' && !citaYaEmpezo(appt)){
        showAlert('Esta cita todavía no empieza. Vas a poder marcarla como realizada desde la hora de la cita.');
        break;
      }
      const select = document.getElementById('f-staff-metodoSaldo');
      const metodo = select ? select.value : '';
      if(!metodo){
        showAlert('Elige primero el método de pago antes de guardar.');
        break;
      }
      const cremaInput = document.getElementById('f-staff-crema');
      const cremas = cremaInput ? Math.max(0, Math.min(9, Number(cremaInput.value)||0)) : apptCremas(appt);
      const splitBox = document.getElementById('staff-split-box');
      const splitOn = !!(splitBox && splitBox.style.display!=='none');
      let metodo2 = '', monto2 = 0;
      if(splitOn){
        metodo2 = document.getElementById('f-staff-metodoSaldo2').value;
        monto2 = Math.round(Number(document.getElementById('f-staff-montoSaldo2').value)||0);
        const total = Math.max(0, (Number(appt.saldo)||0) + (cremas - apptCremas(appt))*CREMA_PRICE);
        if(!metodo2){ showAlert('Elige también el segundo método de pago (o toca "Pagó con un solo método").'); break; }
        if(metodo2===metodo){ showAlert('Los dos métodos de pago son iguales. Si pagó todo con '+metodo+', toca "Pagó con un solo método".'); break; }
        if(monto2<=0){ showAlert('Escribe cuánto pagó con '+metodo2+'.'); break; }
        if(monto2>=total){ showAlert('Lo que pagó con '+metodo2+' tiene que ser menos que el total a cobrar ('+fmtCLP(total)+'). El resto se anota solo en '+metodo+'.'); break; }
      }
      // Cada crema suma $5.000 al precio (igual que en el formulario de Admin).
      // Antes el checkbox de la especialista marcaba la crema pero no la
      // sumaba al precio — y como la comisión le descuenta la crema al
      // precio, a la especialista se le terminaba restando plata que nunca
      // se sumó.
      const diff = (cremas - apptCremas(appt)) * CREMA_PRICE;
      if(diff){
        appt.price = Math.max(0, (Number(appt.price)||0) + diff);
        appt.saldo = Math.max(0, (Number(appt.saldo)||0) + diff);
      }
      appt.cremaCantidad = cremas;
      appt.cremaComprada = cremas>0;

      appt.pagoMarcadoPor = { nombre: staffIdentity() || '', en: new Date().toISOString() };

        state.appointments = state.appointments.filter(a=>a.id!==id);
        ui.modal = null; render(); saveData();
        if(deleted) syncToBackupWebhook('delete', deleted);

      showConfirmDialog(many ? `¿Quitar este bloqueo? Se quitan todos sus días (${blockWhenLabel(toRemove)}).` : '¿Quitar este bloqueo de horario?', ()=>{

        ui.modal = null; render(); saveData();

    case 'remove-service': {

      showConfirmDialog('¿Eliminar este servicio del tarifario?', ()=>{

        render();
      });

    case 'save-services':
      saveServicesFromForm(); break;
    case 'add-specialist':
      state.specialists.push({id:uid(), name:'Nueva especialista', color:'#5AA9E6'});
      render(); break;
    case 'remove-specialist': {
      const idx = Number(e.currentTarget.dataset.idx);
      showConfirmDialog('¿Eliminar esta especialista de la lista? Las citas ya agendadas conservarán su nombre como texto.', ()=>{
        state.specialists.splice(idx,1);
        render();
      });
      break;
    }
    case 'save-specialists':
      saveSpecialistsFromForm(); break;
    case 'toggle-day-closed': {
      const day = Number(e.currentTarget.dataset.day);
      if(!state.settings.hours) state.settings.hours = {};
      if(state.settings.hours[day]){
        state.settings.hours[day] = null; // marcar cerrado
      } else {
        state.settings.hours[day] = {open:10, close:20}; // reabrir con un horario por defecto, editable
      }
      render(); break;
    }
    case 'save-schedule':
      saveScheduleFromForm(); break;
    case 'save-security': {
      const val = document.getElementById('f-adminpass').value.trim();
      state.settings.adminPassword = val;
      ui.modal = null;
      render();
      saveData();
      break;
    }
    case 'forget-device': {
      safeRemoveLocal(ADMIN_TRUST_KEY);
      ui.mode = 'staff';
      ui.modal = null;
      render();
      break;
    }
  }
}

// Mientras Admin tiene una cita abierta, otra persona puede cambiarla desde
// otro teléfono (ej. la especialista la marca como realizada con su método
// de pago). El formulario de Admin sigue mostrando los datos de cuando se
// abrió, así que al tocar "Guardar" se pisaba ese cambio con los datos viejos
// y la cita volvía a quedar sin marcar (bug real). Ahora, campo por campo: si
// Admin NO tocó un campo en el formulario y otra persona sí lo cambió
// mientras tanto, se queda el cambio de la otra persona. Si Admin sí lo
// cambió, gana lo que puso Admin.
function mergeConcurrentApptChanges(original, updated, current){
  const same = (a,b)=>{
    const n = v=>(v===undefined||v===null||v===''||v===false||v===0) ? null : JSON.stringify(v);
    return n(a)===n(b);
  };
  const special = new Set(['cremaCantidad','cremaComprada','personas']);
  const keys = new Set([...Object.keys(updated), ...Object.keys(current)]);
  const takenFromCurrent = new Set();
  keys.forEach(k=>{
    if(k==='id' || k==='service' || special.has(k)) return;
    if(same(updated[k], original[k]) && !same(current[k], original[k])){
      if(current[k]===undefined) delete updated[k]; else updated[k] = current[k];
      takenFromCurrent.add(k);
    }
  });
  // Cremas y personas se comparan por su valor real (una cita vieja sin
  // cremaCantidad pero con cremaComprada:true = 1 crema; sin personas = 1).
  if(apptCremas(updated)===apptCremas(original) && apptCremas(current)!==apptCremas(original)){
    const cremaDiff = (apptCremas(current) - apptCremas(original)) * CREMA_PRICE;
    updated.cremaCantidad = apptCremas(current);
    updated.cremaComprada = updated.cremaCantidad>0;
    // Las cremas que agregó la otra persona ya vienen sumadas en SU precio. Si
    // Admin además cambió el precio/saldo a mano (ej. un descuento), gana el
    // número de Admin, pero sin perder esas cremas.
    ['price','saldo'].forEach(k=>{
      if(!takenFromCurrent.has(k)) updated[k] = Math.max(0, (Number(updated[k])||0) + cremaDiff);
    });
  }
  if(apptPersonas(updated)===apptPersonas(original) && apptPersonas(current)!==apptPersonas(original)){
    updated.personas = apptPersonas(current);
  }
}

function saveApptFromForm(){
  const d = ui.modal.data;
  const get = id=>document.getElementById(id).value;
  const services = getServiceQuantities().flatMap(({idx,qty})=>{
    const svc = state.services[idx];
    return svc ? Array(qty).fill(svc.name) : [];
  });
  const updated = {
    ...d,
    date: get('f-date'), start: get('f-start'), end: get('f-end'),
    client: get('f-client').trim(), phone: get('f-phone').trim(),
    email: document.getElementById('f-email') ? get('f-email').trim().toLowerCase() : (d.email||''),
    services, specialist: get('f-specialist'),
    estado: get('f-estado'),
    price: Number(get('f-price'))||0, abono: Number(get('f-abono'))||0,
    metodoAbono: get('f-metodoAbono'), saldo: Number(get('f-saldo'))||0,
    metodoSaldo: get('f-metodoSaldo'), notas: get('f-notas'),
    metodoAbono2: get('f-metodoAbono2'), montoAbono2: Number(get('f-montoAbono2'))||0,
    metodoSaldo2: get('f-metodoSaldo2'), montoSaldo2: Number(get('f-montoSaldo2'))||0,
    cremaCantidad: document.getElementById('f-crema') ? Math.max(0, Math.min(9, Number(get('f-crema'))||0)) : apptCremas(d),
    abonoPrevio: !!(document.getElementById('f-abonoPrevio') && document.getElementById('f-abonoPrevio').checked),
    abonoDevuelto: !!(document.getElementById('f-abonoDevuelto') && document.getElementById('f-abonoDevuelto').checked),
    personas: Math.max(1, Math.min(9, Math.floor(Number(document.getElementById('f-personas') ? get('f-personas') : 1))||1)),
  };
  updated.cremaComprada = updated.cremaCantidad>0;
  // De qué tratamiento es la garantía (solo si la cita lleva garantía).
  const garantiaSel = document.getElementById('f-garantia-de');
  if(updated.services.some(esServicioGarantia) && garantiaSel){
    if(garantiaSel.value) updated.garantiaDe = garantiaSel.value;
    else if(ui.modal.mode==='new'){ showAlert('Elige de qué tratamiento es la garantía (debajo de los servicios).'); return; }
  } else delete updated.garantiaDe;
  // Garantía hecha por otra especialista: se congela cuánto de la comisión
  // del tratamiento original pasa a la que hace la garantía (ver
  // traspasoDeGarantia). Solo Admin ve este cuadro; si no aparece (misma
  // especialista, o no se encontró el tratamiento original) no hay traspaso.
  const traspasoChk = document.getElementById('f-traspaso');
  const traspasoOrig = traspasoChk ? state.appointments.find(x=>x.id===(document.getElementById('f-traspaso-orig')||{}).value) : null;
  if(updated.garantiaDe && traspasoChk && traspasoOrig){
    const monto = Math.round(Math.max(0, Number((document.getElementById('f-traspaso-monto')||{}).value)||0));
    if(traspasoChk.checked){
      if(monto<=0){ showAlert('Escribe el monto de la comisión que pasa a '+updated.specialist+' (o desmarca la casilla).'); return; }
      updated.traspasoComision = { originalId: traspasoOrig.id, de: traspasoOrig.specialist, monto, tratamiento: updated.garantiaDe, fechaOriginal: traspasoOrig.date };
      delete updated.sinTraspasoComision;
    } else {
      delete updated.traspasoComision;
      updated.sinTraspasoComision = true;
    }
  } else if(ui.mode==='admin'){
    delete updated.traspasoComision;
    delete updated.sinTraspasoComision;
  }
  // Cuántas micropigmentaciones lleva la cita (para el descuento de la
  // comisión) queda congelado al guardarla; solo se vuelve a contar si se
  // cambian sus servicios. Y si la cita lleva o no ese descuento (en
  // Santiago, solo con los precios nuevos) se congela al crearla.
  if(SEDE.descuentoMicro){
    if(d.tratamientosMicro==null || !sameValue(updated.services, d.services)){
      updated.tratamientosMicro = contarMicropigmentaciones(updated.services);
    }
    if(ui.modal.mode==='new'){
      updated.conDescuentoMicro = SEDE.descuentoMicro.soloPrecioNuevo ? !!state.settings.cremaIncluida : true;
    }
  }
  // Congela para siempre, en el momento de crear la cita, si la crema iba
  // incluida sin costo o se cobraba aparte — así, si más adelante se prende o
  // apaga el interruptor de Configuración, las citas ya agendadas nunca
  // cambian de condición (mismo patrón que el precio: cada cita se queda con
  // las reglas del día en que se agendó).
  if(ui.modal.mode==='new'){
    // Un retoque nunca lleva la crema incluida gratis (se puede comprar
    // aparte si corresponde, pero no se regala) — sin importar el
    // interruptor general.
    updated.cremaIncluidaPolitica = !!state.settings.cremaIncluida && !isRetoqueAppt(updated);
  }
  delete updated.service;
  // Reprogramada con el botón "📅 Reprogramar": se anota de qué día/hora venía.
  // (Cambiar la fecha a mano en el formulario es una corrección y no se anota.)
  const original0 = ui.modal.original || d;
  if(ui.modal.reprogramar && ui.modal.mode==='edit' && (updated.date!==original0.date || updated.start!==original0.start)){
    updated.reprogramaciones = [
      ...(Array.isArray(original0.reprogramaciones) ? original0.reprogramaciones : []),
      {desde: original0.date, inicio: original0.start, fin: original0.end, en: new Date().toISOString(), ...(original0.estado && original0.estado!=='Pendiente' ? {estadoAntes: original0.estado} : {})},
    ];
  }
  if(!updated.client){ showAlert('Ingresa el nombre del cliente.'); return; }
  if(updated.email && !isValidEmail(updated.email)){ showAlert('El correo electrónico no parece estar bien escrito (ej. nombre@gmail.com). Corrígelo o déjalo vacío.'); return; }
  if(!updated.services.length){ showAlert('Elige al menos un servicio.'); return; }
  if(updated.end <= updated.start){ showAlert('La hora de fin debe ser posterior a la hora de inicio.'); return; }
  // ¿Mañana o tarde? (ver revisarMananaTarde). Solo si cambió el horario: una
  // cita vieja que ya estaba así no vuelve a preguntar.
  const claveHora = updated.date+updated.start+updated.end;
  const horaCambio = !(ui.modal.mode==='edit' && d.date===updated.date && d.start===updated.start && d.end===updated.end);
  if(horaCambio && ui.modal._mananaTardeOk!==claveHora && preguntarMananaTarde(updated.date, updated.start, updated.end, 'La cita', (s2, e2, aceptado)=>{
    document.getElementById('f-start').value = s2;
    document.getElementById('f-end').value = e2;
    if(aceptado) ui.modal._mananaTardeOk = updated.date+s2+e2;
    saveApptFromForm();
  })) return;

  const original = ui.modal.original;
  const commit = ()=>{
    const idx = state.appointments.findIndex(a=>a.id===updated.id);
    if(idx>=0 && original) mergeConcurrentApptChanges(original, updated, state.appointments[idx]);
    if(idx>=0) state.appointments[idx] = updated; else state.appointments.push(updated);
    upsertClient(updated.client, updated.phone, summarizeServices(updated.services));
    ui.modal = null;
    render();
    saveData();
    syncToBackupWebhook('save', updated);
  };

  const overlapping = overlappingAppts(updated);
  const afterOverlapCheck = ()=>{
    const coveringBlock = findCoveringBlock(parseKey(updated.date), updated.start, updated.end, updated.specialist);
    if(coveringBlock){
      const suffix = coveringBlock.specialist===ALL_SPECIALISTS_VALUE ? 'Elige otra hora.' : 'Elige otra hora, u otra especialista disponible.';
      showAlert(`${blockSpecialistLabel(coveringBlock.specialist)} bloqueó ese horario (${coveringBlock.start}–${coveringBlock.end}${coveringBlock.reason?': '+coveringBlock.reason:''}). ${suffix}`);
      return;
    }
    if(apptFallsInBlockedTime(parseKey(updated.date), updated.start, updated.end) && ui.modal._mananaTardeOk!==claveHora){
      showConfirmDialog('Este horario cae fuera de la atención habitual (cerrado o en horario de almuerzo). ¿Agendar de todas formas?', commit);
    } else {
      commit();
    }
  };

  // Sin importar cuántos box haya, UNA especialista nunca puede atender dos
  // citas a la vez — esto se revisa primero y siempre avisa, sea cual sea
  // NUM_BOXES (una especialista no se puede "duplicar" solo porque haya más
  // de un box).
  const overlappingMismaEspecialista = updated.specialist
    ? overlapping.filter(o=>normalizeName(o.specialist)===normalizeName(updated.specialist))
    : [];
  if(overlappingMismaEspecialista.length){
    const detalle = overlappingMismaEspecialista.map(o=>`${o.start}–${o.end} (${o.client||'sin nombre'})`).join(', ');
    showConfirmDialog(`${updated.specialist} ya tiene ${overlappingMismaEspecialista.length===1?'una cita':overlappingMismaEspecialista.length+' citas'} a esa hora (${detalle}) — no puede atender dos citas al mismo tiempo. ¿Quieres agendarla igual?`, afterOverlapCheck);
    return;
  }

  const boxPeak = overlapping.length ? peakBoxOccupancy(updated, overlapping) : null;
  if(boxPeak && boxPeak.count > NUM_BOXES){
    const detalle = boxPeak.active.map(o=>`${o.start}–${o.end} (${o.client||'sin nombre'})`).join(', ');
    showConfirmDialog(`En parte de ese horario habría ${boxPeak.count} citas al mismo tiempo (${detalle}) y solo hay ${NUM_BOXES} box disponibles. ¿Quieres agendarla igual?`, afterOverlapCheck);
    return;
  }

  afterOverlapCheck();
}

function saveBlockFromForm(){
  const d = ui.modal.data;
  const get = id=>document.getElementById(id).value;
  const kindInput = document.querySelector('input[name="block-kind"]:checked');
  const kind = kindInput ? kindInput.value : 'hours';
  const updated = {
    ...d,
    date: get('f-block-date'), start: leerRelojBloqueo('f-block-start'), end: leerRelojBloqueo('f-block-end'),
    specialist: get('f-block-specialist'), reason: get('f-block-reason').trim(),
  };
  delete updated.allDay; delete updated.dateEnd;
  const yo = bloqueadoraFija();
  if(yo){
    const previo = (state.blocks||[]).find(b=>b.id===updated.id);
    if(previo && !puedeTocarBloqueo(previo)){ showAlert('Este bloqueo es de otra especialista: solo ella o Sibana pueden cambiarlo.'); return; }
    updated.specialist = yo;
  }
  if(!updated.date){ showAlert('Elige la fecha.'); return; }
  if(!updated.specialist){ showAlert('Elige a quién afecta el bloqueo (tu nombre, o "Todas").'); return; }
  if(kind==='hours'){
    if(updated.end <= updated.start){ showAlert('La hora de fin debe ser posterior a la hora de inicio.'); return; }
    // Solo dentro del horario del estudio ese día (las casillas ya no
    // ofrecen otra cosa; esto atrapa un bloqueo viejo con una hora rara).
    const rango = horasBloqueoPara(updated.date);
    const fueraDeHorario = !rango.cerrado && (minutesFromMidnight(updated.start) < rango.abre || minutesFromMidnight(updated.end) > rango.cierra);
    const r12 = fueraDeHorario ? revisarMananaTarde(updated.date, updated.start, updated.end) : null;
    if(fueraDeHorario && !(r12 && r12.corregido)){
      const hm = m=>pad(Math.floor(m/60))+':'+pad(m%60);
      showAlert(`Ese día el estudio atiende de ${hm(rango.abre)} a ${hm(rango.cierra)}. Elige las horas dentro de ese horario.`); return;
    }
    const clave = updated.date+updated.start+updated.end;
    if(ui.modal._mananaTardeOk!==clave && preguntarMananaTarde(updated.date, updated.start, updated.end, 'El bloqueo', (s2, e2, aceptado)=>{
      ponerRelojBloqueo('f-block-start', s2);
      ponerRelojBloqueo('f-block-end', e2);
      if(aceptado) ui.modal._mananaTardeOk = updated.date+s2+e2;
      saveBlockFromForm();
    }, {volverAlForm:true})) return;
  } else {
    updated.allDay = true;
    updated.start = pad(HOUR_START)+':00'; updated.end = pad(HOUR_END)+':00';
    if(kind==='days'){
      const dateEnd = get('f-block-dateEnd');
      if(!dateEnd || dateEnd <= updated.date){ showAlert('El último día tiene que ser después del primero. (Si es un solo día, elige "Día completo".)'); return; }
      updated.dateEnd = dateEnd;
    }
  }
  const lastDate = blockLastDate(updated);

  const commit = ()=>{
    const idx = (state.blocks||[]).findIndex(b=>b.id===updated.id);
    if(!state.blocks) state.blocks = [];
    if(idx>=0){
      state.blocks[idx] = updated;
    } else {
      // Se guarda cuándo se creó (no al editar uno ya existente) para poder
      // avisarle a Admin de los bloqueos nuevos que todavía no vio — ver
      // checkUnseenBlocksIfNeeded().
      updated.creadoEn = new Date().toISOString();
      state.blocks.push(updated);
    }
    ui.modal = null;
    render();
    saveData();
  };

  const clashing = state.appointments.find(a=>
    a.date>=updated.date && a.date<=lastDate && a.estado!=='Cancelada' && a.estado!=='NoShow' &&
    (updated.specialist===ALL_SPECIALISTS_VALUE || normalizeName(a.specialist)===normalizeName(updated.specialist)) &&
    (updated.allDay || (minutesFromMidnight(a.start) < minutesFromMidnight(updated.end) &&
    minutesFromMidnight(updated.start) < minutesFromMidnight(a.end)))
  );
  if(clashing){
    const when = lastDate!==updated.date || updated.allDay ? `el ${blockDateLabel(clashing.date)} de ${clashing.start} a ${clashing.end}` : `de ${clashing.start} a ${clashing.end}`;
    const who = updated.specialist===ALL_SPECIALISTS_VALUE ? `Ya hay al menos una cita agendada (${clashing.client||'sin nombre'}, ${when})` : `${blockSpecialistLabel(updated.specialist)} ya tiene una cita agendada ${when} (${clashing.client||'sin nombre'})`;
    showConfirmDialog(`${who} en ese horario. ¿Bloquear igual? (la cita queda tal cual, solo quedará marcado el choque)`, commit);
  } else {
    commit();
  }
}

function saveCourseFromForm(){
  const d = ui.modal.data;
  const get = id=>document.getElementById(id).value;
  const updated = {
    ...d,
    nombre: get('f-course-nombre').trim(),
    date: get('f-course-date'), start: get('f-course-start'), end: get('f-course-end'),
    specialist: get('f-course-specialist'),
    price: Number(get('f-course-price'))||0,
    notas: get('f-course-notas'),
  };
  if(!updated.nombre){ showAlert('Ponle un nombre al curso.'); return; }
  if(!updated.date){ showAlert('Elige la fecha del curso.'); return; }
  if(updated.end <= updated.start){ showAlert('La hora de fin debe ser posterior a la hora de inicio.'); return; }

  if(!state.courses) state.courses = [];
  const idx = state.courses.findIndex(c=>c.id===updated.id);
  if(idx>=0) state.courses[idx] = updated; else state.courses.push(updated);
  // Si se edita nombre/fecha/hora/especialista de un curso ya con inscritos,
  // esos datos se actualizan también en cada cita-inscrito (para que sigan
  // apareciendo juntos en el día correcto y con el nombre correcto).
  state.appointments.forEach(a=>{
    if(a.cursoId!==updated.id) return;
    a.cursoNombre = updated.nombre;
    a.date = updated.date; a.start = updated.start; a.end = updated.end;
    a.specialist = updated.specialist;
    a.services = [updated.nombre];
  });
  ui.modal = {type:'curso', id: updated.id};
  render();
  saveData();
}

function saveCursoAttendeeFromForm(){
  const d = ui.modal.data;
  const get = id=>document.getElementById(id).value;
  const updated = {
    ...d,
    id: d.id || uid(),
    client: get('f-cur-client').trim(), rut: get('f-cur-rut').trim(), email: get('f-cur-email').trim(),
    phone: get('f-cur-phone').trim(),
    estado: get('f-cur-estado'),
    price: Number(get('f-cur-price'))||0, abono: Number(get('f-cur-abono'))||0,
    metodoAbono: get('f-cur-metodoAbono'), saldo: Number(get('f-cur-saldo'))||0,
    metodoSaldo: get('f-cur-metodoSaldo'), notas: get('f-cur-notas'),
  };
  if(!updated.client){ showAlert('Ingresa el nombre completo de la persona.'); return; }

  const idx = state.appointments.findIndex(a=>a.id===updated.id);
  if(idx>=0) state.appointments[idx] = updated; else state.appointments.push(updated);
  upsertClient(updated.client, updated.phone, summarizeServices(updated.services));
  ui.modal = {type:'curso', id: updated.cursoId};
  render();
  saveData();
  syncToBackupWebhook('save', updated);
}

function saveServicesFromForm(){
  document.querySelectorAll('[data-svc-name]').forEach(inp=>{
    const i = Number(inp.dataset.svcName);
    if(!state.services[i]) return;
    const viejo = state.services[i].name;
    state.services[i].name = inp.value;
    // El perfil de las especialistas guarda el servicio por su nombre: si se
    // renombra, se renombra también ahí (si no, quedaría "haciéndolo" todas).
    if(viejo && viejo!==inp.value) state.specialists.forEach(sp=>{
      if(Array.isArray(sp.noHace) && sp.noHace.includes(viejo)) sp.noHace = sp.noHace.map(n=>n===viejo ? inp.value : n);
      if(sp.duraciones && sp.duraciones[viejo]!=null){
        const d = {...sp.duraciones}; d[inp.value] = d[viejo]; delete d[viejo]; sp.duraciones = d;
      }
    });
  });
  document.querySelectorAll('[data-svc-price]').forEach(inp=>{
    const i = Number(inp.dataset.svcPrice);
    if(state.services[i]) state.services[i].price = Number(inp.value)||0;
  });
  document.querySelectorAll('[data-svc-duration]').forEach(inp=>{
    const i = Number(inp.dataset.svcDuration);
    if(state.services[i]) state.services[i].duration = Number(inp.value)||60;
  });
  document.querySelectorAll('[data-svc-micro]').forEach(inp=>{
    const i = Number(inp.dataset.svcMicro);
    if(state.services[i]) state.services[i].micropigmentacion = inp.checked;
  });
  document.querySelectorAll('[data-svc-retoque]').forEach(inp=>{
    const i = Number(inp.dataset.svcRetoque);
    if(state.services[i]) state.services[i].llevaRetoque = inp.checked;
  });
  document.querySelectorAll('[data-svc-firma]').forEach(inp=>{
    const i = Number(inp.dataset.svcFirma);
    if(state.services[i]) state.services[i].llevaFirma = inp.checked;
  });
  const cremaIncluidaInput = document.getElementById('f-crema-incluida');
  if(cremaIncluidaInput) state.settings.cremaIncluida = cremaIncluidaInput.checked;
  const abonoSugeridoInput = document.getElementById('f-abono-sugerido');
  if(abonoSugeridoInput && SEDE.abonoEditable && abonoSugeridoInput.value.trim()!==''){
    const v = Math.round(Number(abonoSugeridoInput.value));
    if(isFinite(v) && v>=0) state.settings.abonoSugeridoPesos = v;
  }
  ui.modal = null;
  render();
  saveData();
}

function saveSpecialistsFromForm(){
  document.querySelectorAll('[data-spec-name]').forEach(inp=>{
    const i = Number(inp.dataset.specName);
    if(state.specialists[i]) state.specialists[i].name = inp.value.trim() || state.specialists[i].name;
  });
  document.querySelectorAll('[data-spec-color]').forEach(inp=>{
    const i = Number(inp.dataset.specColor);
    if(state.specialists[i]) state.specialists[i].color = inp.value;
  });
  document.querySelectorAll('[data-spec-box]').forEach(sel=>{
    const i = Number(sel.dataset.specBox);
    if(!state.specialists[i]) return;
    const v = sel.value==='1' ? 1 : sel.value==='2' ? 2 : 'libre';
    // Solo se anota si cambió respecto de lo que ya valía (así no se escribe
    // nada si solo se tocó un nombre o un color).
    if((boxDeEspecialista(state.specialists[i].name)||'libre') !== v) state.specialists[i].box = v;
  });
  document.querySelectorAll('[data-spec-reparto]').forEach(cb=>{
    const sp = state.specialists[Number(cb.dataset.specReparto)];
    if(sp && entraEnReparto(sp) !== cb.checked) sp.reparto = cb.checked;
  });
  // Perfil: qué hace y su propio tiempo. Solo se escribe si cambió.
  state.specialists.forEach((sp,i)=>{
    const cajas = document.querySelectorAll(`[data-spec-hace^="${i}:"]`);
    if(!cajas.length) return;
    const noHace = [];
    cajas.forEach(cb=>{ const sv = state.services[Number(cb.dataset.specHace.split(':')[1])]; if(sv && !cb.checked) noHace.push(sv.name); });
    const antes = Array.isArray(sp.noHace) ? sp.noHace : [];
    // Lo que no está en la lista actual de servicios se conserva tal cual.
    const otros = antes.filter(n=>!state.services.some(sv=>sv.name===n));
    const nuevoNoHace = otros.concat(noHace);
    if(JSON.stringify(nuevoNoHace.slice().sort()) !== JSON.stringify(antes.slice().sort())) sp.noHace = nuevoNoHace;
    const durs = {};
    Object.keys(sp.duraciones||{}).forEach(n=>{ if(!state.services.some(sv=>sv.name===n)) durs[n] = sp.duraciones[n]; });
    document.querySelectorAll(`[data-spec-dur^="${i}:"]`).forEach(inp=>{
      const sv = state.services[Number(inp.dataset.specDur.split(':')[1])];
      const m = Math.round(Number(inp.value)||0);
      if(sv && m>0 && m!==(Number(sv.duration)||0)) durs[sv.name] = m;
    });
    if(JSON.stringify(durs) !== JSON.stringify(sp.duraciones||{})) sp.duraciones = durs;
  });
  ui.modal = null;
  render();
  saveData();
}

function saveScheduleFromForm(){
  if(!state.settings.hours) state.settings.hours = {};
  for(let day=0; day<=6; day++){
    const openSel = document.querySelector(`[data-day-open="${day}"]`);
    const closeSel = document.querySelector(`[data-day-close="${day}"]`);
    if(openSel && closeSel){
      state.settings.hours[day] = { open: Number(openSel.value), close: Number(closeSel.value) };
    }
    // si el día está marcado como cerrado no hay <select>, y state.settings.hours[day] ya quedó en null
    // desde el botón "toggle-day-closed" — no hace falta tocarlo aquí.
  }
  state.settings.lunchStart = document.getElementById('f-lunchStart').value;
  state.settings.lunchEnd = document.getElementById('f-lunchEnd').value;
  ui.modal = null;
  render();
  saveData();
}

// auto-fill precio/saldo/hora fin cuando cambia el servicio u la hora de inicio,
// y autocompletado de cliente mientras se escribe — delegados en document
// para que sigan funcionando después de cada render() del modal.
// auto-fill precio/saldo/hora fin cuando cambian los servicios elegidos u la hora
// de inicio, y autocompletado de cliente mientras se escribe — delegados en
// document para que sigan funcionando después de cada render() del modal.
document.addEventListener('change', e=>{
  if(e.target && ['f-specialist','f-client','f-date','f-start','f-traspaso','f-traspaso-monto'].includes(e.target.id)) actualizarTraspasoGarantia();
  if(e.target && e.target.id==='f-specialist' && ui.modal){
    // Elegida a mano (también "Sin asignar"): el retoque ya no la cambia solo.
    Object.defineProperty(ui.modal, '_especialistaTocada', {value: true, enumerable:false, writable:true, configurable:true});
  }
  if(e.target && e.target.id==='f-specialist'){
    actualizarPerfilEnForm();
    // En una cita NUEVA la hora de término sigue a lo que se demora esa
    // especialista; al editar una cita ya guardada no se mueve sola.
    if(ui.modal && ui.modal.mode==='new') ajustarDuracionGarantia();
  }
  if(e.target && e.target.id==='f-start'){
    const endInput = document.getElementById('f-end');
    if(endInput && e.target.value){
      endInput.value = addMinutesToHHMM(e.target.value, getTotalDuration());
    }
  }
  if(e.target && e.target.id==='f-abono'){
    const priceInput = document.getElementById('f-price');
    const saldoInput = document.getElementById('f-saldo');
    if(priceInput && saldoInput){
      saldoInput.value = Math.max((Number(priceInput.value)||0) - (Number(e.target.value)||0), 0);
    }
  }
  if(e.target && e.target.id==='f-price'){
    const abonoInput = document.getElementById('f-abono');
    const saldoInput = document.getElementById('f-saldo');
    if(abonoInput && saldoInput){
      saldoInput.value = Math.max((Number(e.target.value)||0) - (Number(abonoInput.value)||0), 0);
    }
  }
  if(e.target && e.target.id==='f-abonoPrevio'){
    const box = document.getElementById('field-metodo-abono');
    if(box) box.style.display = e.target.checked ? 'none' : 'block';
  }
  if(e.target && e.target.id==='f-estado'){
    const box = document.getElementById('field-abono-devuelto');
    if(box) box.style.display = (e.target.value==='Cancelada'||e.target.value==='NoShow') ? 'flex' : 'none';
  }
});

// Después del listener de arriba (que ya movió la hora de término): la lista
// de especialistas depende de la clienta (retoque), la fecha y el horario.
document.addEventListener('change', e=>{
  if(e.target && ['f-client','f-date','f-start','f-end'].includes(e.target.id)) actualizarPerfilEnForm();
  // Con el cuadro "Reprogramar" abierto, cambiar el día u hora de arriba
  // también los cambia en el cuadro (es lo que se guarda).
  if(e.target && (e.target.id==='f-start' || e.target.id==='f-date')){
    const panel = document.getElementById('reprog-panel');
    if(panel && panel.style.display!=='none'){
      const destino = document.getElementById(e.target.id==='f-start' ? 'reprog-start' : 'reprog-date');
      if(destino && e.target.value) destino.value = e.target.value;
    }
  }
});

document.addEventListener('input', e=>{
  if(e.target && e.target.id==='f-client'){
    renderClientSuggestions(e.target.value);
  }
  if(e.target && (e.target.dataset.certAviso || e.target.dataset.certAvisoDe)){
    const inNombre = e.target.dataset.certAviso ? e.target : document.getElementById(e.target.dataset.certAvisoDe);
    const caja = inNombre && document.getElementById(inNombre.dataset.certAviso);
    const inDoc = inNombre && document.getElementById(inNombre.dataset.certDoc);
    if(caja) caja.innerHTML = certAvisosNombre(inNombre.value, inDoc ? inDoc.value : '').map(x=>'⚠️ ' + escapeHtml(x)).join('<br>');
  }
  if(e.target && e.target.id==='cert-search'){
    const q = normalizeName(e.target.value);
    document.querySelectorAll('#cert-lista .cert-row').forEach(row=>{
      row.style.display = (row.dataset.certSearch||'').includes(q) ? '' : 'none';
    });
    document.querySelectorAll('#cert-lista .cert-grupo').forEach(g=>{
      g.style.display = g.querySelector('.cert-row:not([style*="none"])') ? '' : 'none';
    });
  }
  if(e.target && e.target.id==='client-search'){
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.client-row').forEach(row=>{
      row.style.display = (row.dataset.clientName||'').includes(q) ? '' : 'none';
    });
  }
  if(e.target && e.target.id==='appt-search-input'){
    const results = document.getElementById('appt-search-results');
    if(results) results.innerHTML = renderApptSearchResults(e.target.value);
  }
  if(e.target && (e.target.id==='f-montoAbono1' || e.target.id==='f-montoAbono2')){
    const m1 = document.getElementById('f-montoAbono1');
    const m2 = document.getElementById('f-montoAbono2');
    const abonoInput = document.getElementById('f-abono');
    const priceInput = document.getElementById('f-price');
    const saldoInput = document.getElementById('f-saldo');
    const splitSaldoBox = document.getElementById('split-saldo');
    const saldoIsSplit = splitSaldoBox && splitSaldoBox.style.display !== 'none';
    if(abonoInput){
      abonoInput.value = (Number(m1&&m1.value)||0) + (Number(m2&&m2.value)||0);
      if(priceInput && saldoInput && !saldoIsSplit){
        saldoInput.value = Math.max((Number(priceInput.value)||0) - (Number(abonoInput.value)||0), 0);
      }
    }
  }
  if(e.target && (e.target.id==='f-montoSaldo1' || e.target.id==='f-montoSaldo2')){
    const m1 = document.getElementById('f-montoSaldo1');
    const m2 = document.getElementById('f-montoSaldo2');
    const saldoInput = document.getElementById('f-saldo');
    if(saldoInput){
      saldoInput.value = (Number(m1&&m1.value)||0) + (Number(m2&&m2.value)||0);
    }
  }
});
document.addEventListener('focusin', e=>{
  if(e.target && e.target.id==='f-client' && e.target.value){
    renderClientSuggestions(e.target.value);
  }
});
document.addEventListener('focusout', e=>{
  if(e.target && e.target.id==='f-client'){
    setTimeout(()=>{ const box=document.getElementById('client-ac'); if(box) box.style.display='none'; }, 150);
  }
});
document.addEventListener('mousedown', e=>{
  const item = e.target.closest && e.target.closest('.ac-item');
  if(!item) return;
  e.preventDefault();
  const nameInput = document.getElementById('f-client');
  const phoneInput = document.getElementById('f-phone');
  if(nameInput) nameInput.value = item.dataset.name;
  if(phoneInput && item.dataset.phone) phoneInput.value = item.dataset.phone;
  const emailInput = document.getElementById('f-email');
  if(emailInput && !emailInput.value.trim()){
    const email = lastEmailForClient(item.dataset.name);
    if(email) emailInput.value = email;
  }
  const box = document.getElementById('client-ac');
  if(box){ box.style.display='none'; box.innerHTML=''; }
  actualizarTraspasoGarantia();
  actualizarPerfilEnForm();
});

startRealtimeSync();
</script>
