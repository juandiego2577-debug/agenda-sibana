function apptsForDate(dateKey){
  return state.appointments.filter(a=>a.date===dateKey).sort((a,b)=>minutesFromMidnight(a.start)-minutesFromMidnight(b.start));
}

function dayViewHtml(){
  const dateKey = toKey(ui.currentDate);
  // Los inscritos de un curso son citas normales por dentro (para que
  // Finanzas/comisión las tomen solas), pero en la grilla del día se
  // agrupan en un solo bloque ("📚 Nombre — N inscritos") en vez de
  // mostrarse una al lado de la otra — ver blankCourseAttendee más arriba.
  const dateAppts = apptsForDate(dateKey);
  const appts = filterBySpecialist(dateAppts.filter(a=>!a.cursoId));
  const dayCourses = coursesForDate(dateKey).filter(c=>
    ui.specialistFilter==='all' || !c.specialist || normalizeName(c.specialist)===normalizeName(ui.specialistFilter)
  );
  const dayBlocks = blocksForDate(dateKey);
  const closed = isClosedWeekday(ui.currentDate);
  // "Cita fantasma" (pedido de Juan Diego): una cita que se reprogramó desde
  // este día SIGUE apareciendo aquí, en su hora de antes, pero como fantasma
  // (rayada, punteada, "🔁 Reprogramada → nuevo día"), para que se vea que
  // había una cita y que se cambió. (Primero, el 10/10, fue un aviso arriba
  // de la grilla: a él no le gustó.) Va en la columna de su especialista; no
  // cuenta en nada ni bloquea la hora. Tocarla abre la cita (en su día nuevo).
  const fantasmas = [];
  filterBySpecialist(state.appointments.filter(a=>!a.cursoId && Array.isArray(a.reprogramaciones))).forEach(a=>{
    a.reprogramaciones.forEach((r,ri)=>{
      if(!r || r.desde!==dateKey || !/^\d{2}:\d{2}$/.test(r.inicio||'')) return;
      if(a.date===dateKey && a.start===r.inicio) return; // volvió a su hora de antes: no hay nada que mostrar
      const fin = /^\d{2}:\d{2}$/.test(r.fin||'') && r.fin > r.inicio ? r.fin : addMinutesToHHMM(r.inicio, 60);
      const sig = a.reprogramaciones[ri+1];
      const ahora = sig ? {date: sig.desde, start: sig.inicio} : {date: a.date, start: a.start};
      fantasmas.push({a, r, ahora, start: r.inicio, end: fin, specialist: a.specialist});
    });
  });

  // Por defecto el grid muestra HOUR_START–HOUR_END, pero si hay una cita o un
  // bloqueo cargado a una hora fuera de ese rango (por ejemplo, por error de
  // tipeo), se amplía automáticamente para que quede visible y se pueda
  // editar, en vez de quedar cortada por el overflow:hidden del contenedor.
  let rangeStart = HOUR_START, rangeEnd = HOUR_END;
  [...appts, ...dayBlocks, ...dayCourses, ...fantasmas].forEach(item=>{
    const sH = Math.floor(minutesFromMidnight(item.start)/60);
    const eH = Math.ceil(minutesFromMidnight(item.end)/60);
    if(sH < rangeStart) rangeStart = Math.max(0, sH);
    if(eH > rangeEnd) rangeEnd = Math.min(24, eH);
  });

  const totalHours = rangeEnd - rangeStart;
  const gridHeight = totalHours * SLOT_PX;

  let timeCol = '';
  let hourLines = '';
  for(let h=rangeStart; h<=rangeEnd; h++){
    const top = (h-rangeStart)*SLOT_PX;
    timeCol += `<div class="slot" style="height:${SLOT_PX}px"><span>${pad(h)}:00</span></div>`;
    hourLines += `<div class="hourline" style="top:${top}px"></div>`;
    if(h<rangeEnd) hourLines += `<div class="hourline half" style="top:${top+SLOT_PX/2}px"></div>`;
  }
  let emptyClicks = '';
  let blockedOverlay = '';
  for(let h=rangeStart; h<rangeEnd; h++){
    const top=(h-rangeStart)*SLOT_PX;
    const blocked = closed || hourIsBlocked(h, ui.currentDate);
    if(blocked){
      blockedOverlay += `<div class="blocked" style="top:${top}px;height:${SLOT_PX}px"></div>`;
    } else if(ui.mode==='admin') {
      emptyClicks += `<div class="emptyclick" style="top:${top}px" data-act="new-appt-at" data-hour="${h}"></div>`;
    } else if(!blockCoversHour(h, ui.currentDate, true)) {
      emptyClicks += `<div class="emptyclick" style="top:${top}px" data-act="new-block-at" data-hour="${h}" title="Bloquear esta hora"></div>`;
    }
  }

  // Los bloqueos de día completo (o de varios días) no se dibujan en la
  // grilla — van como un aviso arriba (ver fullDayBanners), así no tapan todo
  // el día ni se encima uno con otro. Las citas y los bloqueos de unas horas
  // se reparten lado a lado cuando se cruzan (ej. una cita de Jeeymar a la
  // misma hora en que Salomé bloqueó), para que ninguno quede tapado.
  const partBlocks = dayBlocks.filter(b=>!b.fullDay);
  const sideCols = layoutSideBySide([...appts, ...partBlocks, ...fantasmas]);
  const apptCols = sideCols.slice(0, appts.length);
  const blockCols = sideCols.slice(appts.length, appts.length + partBlocks.length);
  const ghostCols = sideCols.slice(appts.length + partBlocks.length);
  const sidePos = ({col, cols})=> cols>1 ? `left:calc(6px + (100% - 12px) * ${col} / ${cols});right:auto;width:calc((100% - 12px) / ${cols} - 3px);` : '';
  let specialistBlocks = '';
  partBlocks.forEach((b,i)=>{
    const startMin = minutesFromMidnight(b.start) - rangeStart*60;
    const endMin = minutesFromMidnight(b.end) - rangeStart*60;
    const top = (startMin/60)*SLOT_PX;
    const height = Math.max(((endMin-startMin)/60)*SLOT_PX, 26);
    const col = specialistColor(b.specialist);
    const n = blockCols[i].cols;
    const pos = sidePos(blockCols[i]);
    const who = `🚫 ${escapeHtml(blockSpecialistLabel(b.specialist))}`;
    const isCompact = height < COMPACT_HEIGHT_PX;
    specialistBlocks += `
      <div class="appt st-Cancelada block-appt${isCompact?' compact':''}" style="top:${top}px;height:${height}px;${pos}border-left-color:${col};" data-act="edit-block" data-id="${escapeHtml(b.id)}">
        ${isCompact
          ? `<div class="t-time">${b.start}–${b.end}</div><div class="t-name-compact">${who}${b.reason?' · '+escapeHtml(b.reason):''}</div>`
          : `<div class="t-time">${b.start}–${b.end}</div>
             <div class="t-name">${who}${n>1?'':' no disponible'}</div>
             ${b.reason ? `<div class="t-service">${escapeHtml(b.reason)}</div>` : ''}`}
      </div>`;
  });
  const fullDayBanners = dayBlocks.filter(b=>b.fullDay).map(b=>`
    <div class="day-banner" style="border-left-color:${specialistColor(b.specialist)}" data-act="edit-block" data-id="${escapeHtml(b.id)}">
      <span class="db-who">🚫 ${escapeHtml(blockSpecialistLabel(b.specialist))} no disponible</span>
      <span class="db-when">${escapeHtml(blockWhenLabel(b))}${b.reason?' · '+escapeHtml(b.reason):''}</span>
    </div>`).join('');

  let ghostBlocks = '';
  fantasmas.forEach((g,gi)=>{
    const {a, r, ahora} = g;
    const startMin = minutesFromMidnight(g.start) - rangeStart*60;
    const endMin = minutesFromMidnight(g.end) - rangeStart*60;
    const top = (startMin/60)*SLOT_PX;
    const height = Math.max(((endMin-startMin)/60)*SLOT_PX, 26);
    const isCompact = height < COMPACT_HEIGHT_PX;
    const avisoDt = new Date(r.en);
    const aviso = isNaN(avisoDt) ? '' : ` · avisó el ${avisoDt.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'})}`;
    const destino = ahora.date===dateKey ? `a las ${escapeHtml(ahora.start||'')}` : `${fechaCortaConDia(ahora.date)}${/^\d{2}:\d{2}$/.test(ahora.start||'')?' a las '+ahora.start:''}`;
    // Si estaba "Cancelada" antes de reprogramar, NO se dice: no se canceló, se
    // reprogramó (12/10/2026, pedido de Juan Diego). "No llegó" sí se muestra.
    const estado = r.estadoAntes==='NoShow' ? ' (no llegó)' : '';
    const col = a.specialist ? `border-left-color:${specialistColor(a.specialist)};` : '';
    ghostBlocks += `
      <div class="appt ghost-appt${isCompact?' compact':''}" style="top:${top}px;height:${height}px;${col}${sidePos(ghostCols[gi])}" data-act="edit-appt" data-id="${escapeHtml(a.id)}" title="Reprogramada">
        ${isCompact
          ? `<div class="t-time">${g.start}–${g.end}</div><div class="t-name-compact">🔁 ${escapeHtml(a.client||'Sin nombre')} · reprogramada → ${destino}</div>`
          : `<div class="t-time">${g.start}–${g.end}<span class="ghost-tag">🔁 Reprogramada${estado}</span></div>
             <div class="t-name">${escapeHtml(a.client||'Sin nombre')}</div>
             <div class="t-service">→ ${destino}${aviso}</div>`}
      </div>`;
  });

  let apptBlocks = '';
  appts.forEach((a,ai)=>{
    const startMin = minutesFromMidnight(a.start) - rangeStart*60;
    const endMin = minutesFromMidnight(a.end) - rangeStart*60;
    const top = (startMin/60)*SLOT_PX;
    const height = Math.max(((endMin-startMin)/60)*SLOT_PX, 26);
    const stClass = 'st-' + (a.estado||'Pendiente').replace(/\s/g,'');
    const dotColor = specialistColor(a.specialist);
    const specBorder = a.specialist ? `border-left-color:${dotColor};` : '';
    // Citas cortas no alcanzan a mostrar 3 líneas apiladas (hora / nombre /
    // servicio) sin cortar el texto por abajo — en ese caso, todo va en una
    // sola línea con puntos suspensivos si no alcanza el ancho, en vez de
    // perder info. Ver COMPACT_HEIGHT_PX.
    const isCompact = height < COMPACT_HEIGHT_PX;
    // Aviso visible desde afuera (sin entrar al detalle de la cita) cuando se
    // agendó sin cobrar abono — antes solo quedaba anotado en las notas, y la
    // especialista podía no enterarse si no abría la ficha.
    const noAbono = !(Number(a.abono)>0) && a.estado!=='Cancelada' && a.estado!=='NoShow' && !isGarantiaAppt(a); // una garantía es gratis
    const noAbonoBadge = noAbono ? `<span class="no-abono-badge" title="Sin abono">${iconoSvg('pesos')}<span class="txt">Sin abono</span></span>` : '';
    const personasBadge = apptPersonas(a)>1 ? `<span class="personas-badge">👥 ${apptPersonas(a)}</span>` : '';
    // La clienta cambió de día u hora (botón "📅 Reprogramar"): se ve desde
    // afuera para que quien la atiende sepa que no es la fecha original.
    const reprogBadge = (Array.isArray(a.reprogramaciones) && a.reprogramaciones.length) ? `<span class="reprog-badge" title="Reprogramada">🔁</span>` : '';
    const firmaBadge = faltaFirmarAhora(a) ? `<span class="firma-badge" title="Falta firmar el consentimiento">✍️ Falta firmar</span>` : '';
    const nameServiceHtml = isCompact
      ? `<div class="t-name-compact">${escapeHtml(a.client||'Sin nombre')}${(a.services&&a.services.length)?' · '+escapeHtml(apptServiciosTexto(a)):''}</div>${reprogBadge}${personasBadge}${firmaBadge}${noAbonoBadge}`
      : `<div class="t-name">${escapeHtml(a.client||'Sin nombre')}${personasBadge}</div>
        <div class="t-service">${escapeHtml(apptServiciosTexto(a))}</div>`;
    apptBlocks += `
      <div class="appt ${stClass}${isCompact?' compact':''}${firmaBadge?' con-firma':''}" style="top:${top}px;height:${height}px;${specBorder}${sidePos(apptCols[ai])}" data-act="edit-appt" data-id="${escapeHtml(a.id)}">${firmaBadge?'<span class="firma-esquina" title="Falta firmar el consentimiento">✍️</span>':''}
        <div class="t-time">${a.start}<span class="fin">–${a.end}</span>${a.specialist?`<span class="spec-dot" style="background:${dotColor}"></span>`:''}${!isCompact?reprogBadge+firmaBadge+noAbonoBadge:''}</div>
        ${nameServiceHtml}
      </div>`;
  });

  let courseBlocks = '';
  dayCourses.forEach(c=>{
    const count = courseAttendees(c.id).length;
    const startMin = minutesFromMidnight(c.start) - rangeStart*60;
    const endMin = minutesFromMidnight(c.end) - rangeStart*60;
    const top = (startMin/60)*SLOT_PX;
    const height = Math.max(((endMin-startMin)/60)*SLOT_PX, 26);
    const isCompact = height < COMPACT_HEIGHT_PX;
    const label = `📚 ${escapeHtml(c.nombre||'Curso')}`;
    const sub = `${count} inscrito${count===1?'':'s'}${c.specialist?' · '+escapeHtml(c.specialist):''}`;
    courseBlocks += `
      <div class="appt curso-block${isCompact?' compact':''}" style="top:${top}px;height:${height}px;" data-act="open-curso" data-id="${escapeHtml(c.id)}">
        <div class="t-time">${c.start}–${c.end}</div>
        ${isCompact
          ? `<div class="t-name-compact">${label} · ${sub}</div>`
          : `<div class="t-name">${label}</div><div class="t-service">${sub}</div>`}
      </div>`;
  });

  return `
    ${resumenDiaHtml(dateKey, appts)}
    ${fullDayBanners ? `<div class="day-banners">${fullDayBanners}</div>` : ''}
    <div class="dayrow" style="height:${gridHeight}px">
      <div class="timecol">${timeCol}</div>
      <div class="gridcol" style="height:${gridHeight}px">
        ${hourLines}
        ${blockedOverlay}
        ${emptyClicks}
        ${specialistBlocks}
        ${ghostBlocks}
        ${apptBlocks}
        ${courseBlocks}
        ${lineaAhoraHtml(dateKey, rangeStart, rangeEnd)}
      </div>
    </div>
    ${closed ? `<div class="day-closed-msg">El salón no atiende este día.${ui.mode==='admin' ? ' Si necesitas agendar una excepción, usa "+ Nueva cita".' : ''}</div>` : (appts.length===0 && dayCourses.length===0 ? `<div class="empty-msg">Sin citas este día.${ui.mode==='admin' ? ' Haz clic en un horario para agendar.' : ' Toca un horario libre para bloquearlo si no vas a trabajar.'}</div>` : '')}
  `;
}

function weekViewHtml(){
  const start = startOfWeek(ui.currentDate);
  const today = new Date();
  let cells = '';
  for(let i=0;i<7;i++){
    const d = addDays(start,i);
    const key = toKey(d);
    const appts = filterBySpecialist(apptsForDate(key));
    const revenue = appts.reduce((s,a)=> s + apptRevenue(a), 0);
    cells += `
      <div class="weekday ${sameDay(d,today)?'today':''}" data-act="goto-day" data-date="${key}">
        <div class="wd-label">${DAY_NAMES[d.getDay()]}</div>
        <div class="wd-num">${d.getDate()}</div>
        <div class="wd-count">${appts.length} cita${appts.length===1?'':'s'}${personasSuffix(appts, true)}</div>
        ${fullDayBlocksMarkup(key, 'wd-block')}
        ${(ui.mode==='admin' && revenue>0) ? `<div class="wd-rev">${fmtCLP(revenue)}</div>` : ''}
      </div>`;
  }
  return `<div class="weekgrid">${cells}</div>`;
}

function monthViewHtml(){
  const cur = ui.currentDate;
  const year = cur.getFullYear(), month = cur.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = startOfWeek(firstOfMonth); // lunes de la semana que contiene el día 1
  const today = new Date();

  let cells = [];
  for(let i=0;i<42;i++) cells.push(addDays(gridStart, i));
  // si el mes completo cabe en 5 semanas, no mostramos una 6ta fila que sería
  // puros días del mes siguiente
  while(cells.length>35 && cells.slice(-7).every(d=>d.getMonth()!==month)){
    cells = cells.slice(0,-7);
  }

  const headerNames = DAY_NAMES.slice(1).concat(DAY_NAMES[0]); // empieza en lunes
  const headerRow = `<div class="month-headerrow">${headerNames.map(n=>`<div>${n}</div>`).join('')}</div>`;

  let rows = '';
  for(let w=0; w<cells.length/7; w++){
    let rowHtml = '';
    for(let i=0;i<7;i++){
      const d = cells[w*7+i];
      const key = toKey(d);
      const appts = filterBySpecialist(apptsForDate(key));
      const revenue = appts.reduce((s,a)=>s+apptRevenue(a),0);
      const isOther = d.getMonth()!==month;
      const shown = appts.slice(0,3);
      const extra = appts.length - shown.length;
      rowHtml += `
        <div class="month-cell ${isOther?'other-month':''} ${sameDay(d,today)?'today':''}" data-act="goto-day" data-date="${key}">
          <div class="mc-num">${d.getDate()}</div>
          ${fullDayBlocksMarkup(key, 'mc-block')}
          <div class="mc-count">${appts.length?`${appts.length} cita${appts.length===1?'':'s'}${personasSuffix(appts, true)}`:''}</div>
          ${shown.map(a=>`<div class="mc-event"><span class="dot" style="background:${specialistColor(a.specialist)}"></span>${a.start} ${escapeHtml(a.client||'')}</div>`).join('')}
          ${extra>0?`<div class="mc-more">+${extra} más</div>`:''}
          ${(ui.mode==='admin' && revenue>0) ? `<div class="mc-rev">${fmtCLP(revenue)}</div>` : ''}
        </div>`;
    }
    rows += `<div class="month-weekrow">${rowHtml}</div>`;
  }
  return `<div class="monthgrid">${headerRow}${rows}</div>`;
}

// Suma cuánto entró por cada método de pago (Efectivo, Transferencia, etc.),
// separando abonos que quedaron divididos en dos métodos. Se usa tanto en el
// resumen de arriba como en Finanzas.
function normalizePaymentMethod(m){
  // Junta variaciones como "Transferencia " (con espacio de más) o "transferencia"
  // (minúscula) con el método real, para que no aparezcan como si fueran dos
  // métodos de pago distintos en los reportes.
  const clean = (m||'').trim();
  if(!clean) return '';
  const found = PAYMENT_METHODS.find(pm=>pm.toLowerCase()===clean.toLowerCase());
  return found || clean;
}
function paymentBreakdown(appts){
  const porMetodo = {};
  const addMetodo = (m, monto)=>{ if(monto<=0) return; const k=normalizePaymentMethod(m)||'Sin especificar'; porMetodo[k]=(porMetodo[k]||0)+monto; };
  const addSplitAmount = (metodo1, totalMonto, metodo2, monto2)=>{
    const m2 = Number(monto2)||0;
    if(m2>0 && metodo2){
      const m1 = totalMonto - m2;
      if(m1>0) addMetodo(metodo1, m1);
      addMetodo(metodo2, m2);
    } else {
      addMetodo(metodo1, totalMonto);
    }
  };
  appts.forEach(a=>{
    // Si el abono ya se había pagado en una cita anterior (reagendada), no es
    // plata nueva entrando por ningún método: no se suma acá de nuevo.
    if(a.abonoPrevio) {
      if(a.estado!=='Cancelada' && a.estado!=='NoShow'){
        addSplitAmount(a.metodoSaldo, Number(a.saldo)||0, a.metodoSaldo2, a.montoSaldo2);
      }
      return;
    }
    if(a.estado==='Cancelada' || a.estado==='NoShow'){
      addSplitAmount(a.metodoAbono, Number(a.abono)||0, a.metodoAbono2, a.montoAbono2);
    } else {
      addSplitAmount(a.metodoAbono, Number(a.abono)||0, a.metodoAbono2, a.montoAbono2);
      addSplitAmount(a.metodoSaldo, Number(a.saldo)||0, a.metodoSaldo2, a.montoSaldo2);
    }
  });
  return porMetodo;
}

// Las citas que cuenta el resumen de abajo (vista y especialista elegidas).
function filtroCitasDelResumen(){
  const dateKey = toKey(ui.currentDate);
  return filterBySpecialist(
    ui.view==='day' ? apptsForDate(dateKey) :
    ui.view==='week' ? (()=>{
      const start = startOfWeek(ui.currentDate);
      let all = [];
      for(let i=0;i<7;i++) all = all.concat(apptsForDate(toKey(addDays(start,i))));
      return all;
    })() :
    (()=>{
      const year = ui.currentDate.getFullYear(), month = ui.currentDate.getMonth();
      const n = daysInMonth(year, month);
      let all = [];
      for(let day=1; day<=n; day++) all = all.concat(apptsForDate(toKey(new Date(year,month,day))));
      return all;
    })()
  );
}
function summaryHtml(){
  const dateKey = toKey(ui.currentDate);
  const appts = filtroCitasDelResumen();
  const total = appts.length;
  const personas = countPersonas(appts);
  const isAdmin = ui.mode==='admin';
  const periodo = ui.view==='day' ? 'este día' : ui.view==='week' ? 'esta semana' : 'este mes';
  if(!isAdmin){
    return `
    <footer class="summary">
      <div class="stat"><div class="lbl">Citas (${ui.view==='day'?'día':ui.view==='week'?'semana':'mes'})</div><div class="val">${total}</div></div>
      ${personasWorthShowing(appts) ? `<div class="stat"><div class="lbl">Personas atendidas</div><div class="val">${personas}</div></div>` : ''}
      ${ui.saving ? '<div class="stat"><div class="lbl">&nbsp;</div><div class="val" style="font-size:12px;color:var(--ink-soft)">Guardando…</div></div>' : ''}
    </footer>`;
  }
  const r = resumenDinero(appts);
  // ¿El período entero todavía no llega? Entonces no "entró" nada: se muestra lo esperado.
  const primerDia = ui.view==='day' ? dateKey
    : ui.view==='week' ? toKey(startOfWeek(ui.currentDate))
    : toKey(new Date(ui.currentDate.getFullYear(), ui.currentDate.getMonth(), 1));
  const futuro = primerDia > sedeNow().date;
  const pct = r.esperado ? Math.min(100, Math.round(r.entro / r.esperado * 100)) : 0;
  const metodos = Object.keys(r.porMetodo).sort((x,y)=>r.porMetodo[y]-r.porMetodo[x]);
  const estado = !total ? '' : r.falta > 0
    ? `<div class="r2-estado">⏳ <b>${r.sinCerrar.length} cita${r.sinCerrar.length===1?'':'s'} sin cerrar</b> · faltan ${fmtCLP(r.falta)} <button type="button" class="linklike" data-act="open-sin-cerrar">Ver cuáles</button></div>`
    : `<div class="r2-estado ok">✅ <b>Todo cobrado</b></div>`;
  return `
    <footer class="summary r2">
      <div class="r2-main">
        <div class="r2-lbl">${futuro ? 'Esperado ' + periodo : 'Entró ' + periodo}</div>
        <div class="r2-cifra">${fmtCLP(futuro ? r.esperado : r.entro)}${!futuro && r.falta>0 ? `<small>de ${fmtCLP(r.esperado)}</small>` : ''}</div>
        ${futuro
          ? `<div class="r2-estado">Si se hacen todas las citas${r.entro ? ' · abonos ya recibidos ' + fmtCLP(r.entro) : ''}</div>`
          : `${total ? `<div class="r2-barra" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ''}${estado}`}
      </div>
      <div class="r2-col"><div class="r2-lbl">Por método</div>${metodos.length
        ? metodos.map(m=>`<div class="r2-fila"><span>${escapeHtml(m)}</span><span>${fmtCLP(r.porMetodo[m])}</span></div>`).join('')
        : '<div class="r2-fila"><span>Todavía nada</span></div>'}</div>
      <div class="r2-col"><div class="r2-lbl">Citas</div>
        <div class="r2-fila"><span>Citas</span><span>${total}</span></div>
        ${personasWorthShowing(appts) ? `<div class="r2-fila"><span>Personas atendidas</span><span>${personas}</span></div>` : ''}
        ${ui.saving ? '<div class="r2-fila"><span>Guardando…</span></div>' : ''}
      </div>
    </footer>
  `;
}
// Dinero de un grupo de citas (resumen de abajo, solo dueños). Una cita
// cerrada (Realizada, o Cancelada/No llegó con su abono) ya entró completa
// (apptRevenue); de una que todavía no se cierra solo entró su abono (salvo
// que fuera de una cita anterior, abonoPrevio) y falta el resto. "Esperado" =
// si se hacen todas. Por método: solo lo que ya entró. Antes "Falta por cobrar"
// sumaba el saldo de TODAS las citas, también las ya cobradas, y nunca llegaba
// a $0 (Juan Diego, 21/10/2026). Solo cambia cómo se muestra.
function citaCerrada(a){ return a.estado==='Realizada' || a.estado==='Cancelada' || a.estado==='NoShow'; }
function resumenDinero(appts){
  let entro = 0, esperado = 0, falta = 0;
  const sinCerrar = [];
  appts.forEach(a=>{
    const rev = apptRevenue(a);
    esperado += rev;
    if(citaCerrada(a)){ entro += rev; return; }
    const ab = a.abonoPrevio ? 0 : (Number(a.abono)||0);
    entro += ab;
    falta += Math.max(rev - ab, 0);
    sinCerrar.push(a);
  });
  // Lo que entró, por método: de las abiertas solo cuenta el abono.
  const porMetodo = paymentBreakdown(appts.map(a=>citaCerrada(a) ? a : Object.assign({}, a, {saldo:0, montoSaldo2:0})));
  return {entro, esperado, falta, sinCerrar, porMetodo};
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Junta servicios repetidos (ej. dos personas que se hacen Microblading juntas)
// en "Microblading (MB) ×2" en vez de repetir el nombre dos veces.
function summarizeServices(names){
  if(!names || !names.length) return '';
  const counts = {}, order = [];
  names.forEach(n=>{
    if(!(n in counts)){ counts[n]=0; order.push(n); }
    counts[n]++;
  });
  return order.map(n=> counts[n]>1 ? `${n} ×${counts[n]}` : n).join(' + ');
}
// Describe un pago que puede estar dividido entre 2 métodos, ej:
// "Efectivo $30.000 + Transferencia $20.000". Si no está dividido, muestra
// solo el método normal (compatible con todas las citas antiguas).
function paymentMethodSummary(metodo1, monto1Total, metodo2, monto2){
  const m2 = Number(monto2)||0;
  if(m2>0 && metodo2){
    const m1 = monto1Total - m2;
    const parts = [];
    if(m1>0) parts.push(`${metodo1||'Sin especificar'} ${fmtCLP(m1)}`);
    parts.push(`${metodo2} ${fmtCLP(m2)}`);
    return parts.join(' + ');
  }
  return metodo1 || '';
}

// Bloqueos de cada especialista (19/10/2026, pedido de Juan Diego): con su
// propia cuenta, el bloqueo nuevo queda a SU nombre (no puede elegir a otra
// ni "Todas") y solo puede cambiar o quitar los suyos; los de las demás los
// ve, pero sin poder tocarlos. Admin (dueños) puede todo, como antes. Si el
// teléfono no sabe quién es (sin nombre), queda como antes.
function bloqueadoraFija(){
  if(ui.mode==='admin') return '';
  return staffIdentity() || '';
}
function puedeTocarBloqueo(b){
  const yo = bloqueadoraFija();
  if(!yo) return true;
  return !!b && b.specialist!==ALL_SPECIALISTS_VALUE && normalizeName(b.specialist)===normalizeName(yo);
}
// "Reloj" del bloqueo (19/10/2026, elegido por Juan Diego entre tres
// opciones): dos casillas, hora : minutos [00/15/30/45]. Antes era el reloj
// del teléfono, que en los que van con AM/PM dejaba "16" escrito como 01:00
// de la madrugada. Las horas son solo las del horario del estudio ese día
// (`horasBloqueoPara`, cambian con la fecha), y al tocar una casilla se abre
// debajo una grilla propia con los colores de la agenda (la lista del
// teléfono salía blanca). Si el bloqueo ya tenía una hora fuera de eso, se
// muestra igual para no perderla (al guardar se pide corregirla).
function horasBloqueoPara(dateKey){
  const dh = /^\d{4}-\d{2}-\d{2}$/.test(dateKey||'') ? dayHoursFor(parseKey(dateKey)) : null;
  if(!dh) return {abre: HOUR_START*60, cierra: HOUR_END*60, cerrado: true};
  return {abre: (Number(dh.open)||0)*60, cierra: (Number(dh.close)||24)*60, cerrado: false};
}
function opcionesRelojBloqueo(dateKey, esFin, parte, actual, horaElegida){
  const r = horasBloqueoPara(dateKey);
  let lista;
  if(parte==='h'){
    lista = [];
    const ini = Math.floor(r.abre/60), fin = Math.ceil(r.cierra/60) - (esFin ? 0 : 1);
    for(let h = ini; h <= fin; h++) lista.push(pad(h));
  } else {
    lista = ['00','15','30','45'].filter(m=>{
      const t = Number(horaElegida)*60 + Number(m);
      return esFin ? (t > r.abre && t <= r.cierra) : (t >= r.abre && t < r.cierra);
    });
    if(!lista.length) lista = ['00'];
  }
  if(actual && !lista.includes(actual)){ lista.push(actual); lista.sort(); }
  return lista;
}
function relojBloqueoHtml(id, valor, esFin){
  const [h0, m0] = /^\d{2}:\d{2}$/.test(valor||'') ? valor.split(':') : [esFin ? '12' : '10', '00'];
  return `<div class="reloj-bloqueo" data-reloj="${id}" data-fin="${esFin?'1':''}">
    <input type="hidden" id="${id}-h" value="${h0}"><button type="button" class="reloj-casilla" data-reloj-parte="h" aria-label="Hora">${h0}</button>
    <b>:</b>
    <input type="hidden" id="${id}-m" value="${m0}"><button type="button" class="reloj-casilla" data-reloj-parte="m" aria-label="Minutos">${m0}</button>
  </div><div class="reloj-opciones" id="${id}-op" hidden></div>`;
}
function leerRelojBloqueo(id){
  const h = (document.getElementById(id+'-h')||{}).value, m = (document.getElementById(id+'-m')||{}).value;
  return h && m ? `${h}:${m}` : '';
}
function ponerRelojBloqueo(id, hhmm){
  const [h, m] = hhmm.split(':');
  const caja = document.querySelector(`.reloj-bloqueo[data-reloj="${id}"]`);
  [['h', h], ['m', m]].forEach(([parte, v])=>{
    const inp = document.getElementById(id+'-'+parte); if(inp) inp.value = v;
    const btn = caja && caja.querySelector(`[data-reloj-parte="${parte}"]`); if(btn) btn.textContent = v;
  });
}
function cerrarRelojesBloqueo(){
  document.querySelectorAll('.reloj-opciones').forEach(p=>{ p.hidden = true; p.innerHTML = ''; });
  document.querySelectorAll('.reloj-casilla.abierta').forEach(b=>b.classList.remove('abierta'));
}
function abrirRelojBloqueo(caja, parte){
  const id = caja.dataset.reloj, esFin = !!caja.dataset.fin;
  const panel = document.getElementById(id+'-op'), btn = caja.querySelector(`[data-reloj-parte="${parte}"]`);
  const yaAbierto = btn.classList.contains('abierta');
  cerrarRelojesBloqueo();
  if(yaAbierto) return;
  const fecha = (document.getElementById('f-block-date')||{}).value;
  const actual = document.getElementById(id+'-'+parte).value;
  const lista = opcionesRelojBloqueo(fecha, esFin, parte, actual, document.getElementById(id+'-h').value);
  panel.innerHTML = `<div class="reloj-titulo">${parte==='h' ? 'Elige la hora' : 'Elige los minutos'}</div>
    <div class="reloj-grilla">${lista.map(v=>`<button type="button" class="reloj-op ${v===actual?'on':''}" data-valor="${v}">${v}</button>`).join('')}</div>`;
  panel.hidden = false; btn.classList.add('abierta');
  panel.querySelectorAll('.reloj-op').forEach(op=>op.addEventListener('click', ()=>{
    const [h, m] = leerRelojBloqueo(id).split(':');
    let nh = parte==='h' ? op.dataset.valor : h, nm = parte==='m' ? op.dataset.valor : m;
    // Si con la hora nueva esos minutos ya no caben (ej. "Hasta 20:30" con
    // cierre a las 20), se dejan en el primero que sí cabe.
    if(parte==='h'){
      const mins = opcionesRelojBloqueo(fecha, esFin, 'm', null, nh);
      if(!mins.includes(nm)) nm = mins[0];
    }
    ponerRelojBloqueo(id, nh+':'+nm);
    // "Hasta" antes que "Desde" no sirve: pasa sola a una hora después
    // (o a la hora de cierre).
    if(!esFin && document.getElementById('f-block-end-h') && leerRelojBloqueo('f-block-end') <= nh+':'+nm){
      const r = horasBloqueoPara(fecha);
      const fin = Math.min(minutesFromMidnight(nh+':'+nm) + 60, r.cierra);
      ponerRelojBloqueo('f-block-end', pad(Math.floor(fin/60))+':'+pad(fin%60));
    }
    cerrarRelojesBloqueo();
  }));
}
// Al cambiar la fecha, una hora que ese día queda fuera del horario se
// lleva a la más cercana que sí está.
function ajustarRelojesAlDia(){
  cerrarRelojesBloqueo();
  const fecha = (document.getElementById('f-block-date')||{}).value;
  document.querySelectorAll('.reloj-bloqueo').forEach(caja=>{
    const id = caja.dataset.reloj, esFin = !!caja.dataset.fin;
    const horas = opcionesRelojBloqueo(fecha, esFin, 'h', null);
    let [h, m] = leerRelojBloqueo(id).split(':');
    if(!horas.includes(h)) h = Number(h) < Number(horas[0]) ? horas[0] : horas[horas.length-1];
    const mins = opcionesRelojBloqueo(fecha, esFin, 'm', null, h);
    if(!mins.includes(m)) m = Number(h)===Number(horas[horas.length-1]) ? mins[mins.length-1] : mins[0];
    ponerRelojBloqueo(id, h+':'+m);
  });
}

// Selector "− N +" de cuántas cremas post-tratamiento compró la clienta (se
// usa igual en el formulario de Admin y en la vista de la especialista).
// Cuándo y quién marcó el pago desde la vista de la especialista — así, si
// una cita aparece sin marcar, se puede saber si de verdad nunca se marcó.
// ---------------- Correo de cuidados post-tratamiento ----------------
// El correo lo manda SOLO un programa aparte (apps-script/correo-postratamiento.gs,
// instalado en la cuenta sibana.cl), todas las noches a las 20:30 hora de
// Chile. La agenda NO sabe si un correo ya salió (el registro de envíos está
// en la Hoja de Google "Registro correos post-tratamiento"): aquí solo se
// avisa, dentro de la cita, cuando FALTA anotar el correo (para pedírselo
// antes de que la clienta se vaya). Decidido así con el usuario: no mostrar
// "enviado / no enviado" (exigiría otra versión del programa en Google) ni
// "se enviará hoy a las 20:30" (es siempre igual, no aporta nada).
const POSTCARE_DESDE = '2026-10-03'; // día en que empezó el envío: citas anteriores no muestran nada
const POSTCARE_HORA = '20:30';
// OJO: mantener igual que TRATAMIENTOS en apps-script/correo-postratamiento.gs.
const POSTCARE_TRATAMIENTOS = [
  {nombre:'cejas',  palabras:['microblading','sombreado','mixbrows']},
  {nombre:'labios', palabras:['full lips']},
  {nombre:'delineado de ojos', palabras:['delineado']},
];

function postcareTreatments(a){
  const out = [];
  (a.services||[]).forEach(svc=>{
    const n = String(svc||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    if(n.includes('retoque')) return;
    POSTCARE_TRATAMIENTOS.forEach(t=>{
      if(t.palabras.some(p=>n.includes(p)) && !out.includes(t.nombre)) out.push(t.nombre);
    });
  });
  return out;
}
// Fecha y hora de la sede (Chile para Santiago), aunque el teléfono/computador
// esté en otro país.
function sedeNow(){
  const s = new Date().toLocaleString('sv-SE',{timeZone:SEDE.zonaHoraria}); // "2026-10-03 21:05:00"
  return {date: s.slice(0,10), time: s.slice(11,16)};
}
// ¿Ya llegó la hora de esta cita? (hora de la sede). Una especialista solo
// puede marcarla como realizada desde que empieza (pedido de Juan Diego,
// 12/10/2026: con "Mi pago" se podían cerrar citas futuras para que sumaran).
function citaYaEmpezo(a){
  const n = sedeNow();
  return (a.date||'') < n.date || (a.date===n.date && (a.start||'00:00') <= n.time);
}

function postcareStatusHtml(a, style){
  if(!SEDE.correoPostratamiento) return ''; // esta sede todavía no tiene envío de correos
  if(!a || !a.id || a.cursoId || a.estado==='Cancelada' || a.estado==='NoShow') return '';
  if(a.date < POSTCARE_DESDE) return '';
  const trats = postcareTreatments(a);
  if(!trats.length) return '';
  const now = sedeNow();
  // Solo antes de que se mande (hoy antes de las 20:30, o una cita futura):
  // después ya no hay nada útil que decir aquí.
  const pendiente = a.date > now.date || (a.date === now.date && now.time < POSTCARE_HORA);
  if(!pendiente) return '';
  if(a.email) return '';
  return `<div class="hint" style="${style||''}">⚠️ Sin correo anotado: no se le enviarán los cuidados post-tratamiento. Pídele su correo para anotarlo en la cita.</div>`;
}

function pagoMarcadoHtml(d){

}

// Reprogramar (solo Admin): la clienta cambia de día u hora. Se MUEVE la misma
// cita (mismo abono, precio, especialista y notas) en vez de cancelarla y
// crear otra — así el abono nunca se cuenta dos veces ni hay que acordarse de
// marcar "abono ya pagado en una cita anterior". Cada cambio queda anotado en
// a.reprogramaciones = [{desde, inicio, fin, en}] (la fecha/hora de ANTES).
// Una cita Cancelada/No llegó se puede reprogramar si era de hoy en adelante
// o si su abono perdido no le generó comisión a nadie (desde el 05/10/2026 el
// abono perdido es 100% del negocio): así moverla nunca cambia un pago ya
// hecho. Con abono devuelto, o una vieja que sí generó comisión, se crea una
// cita nueva (con "abono ya pagado en una cita anterior" si corresponde).
// (10/10/2026: antes las canceladas de días anteriores nunca se podían
// reprogramar, y Juan Diego lo necesitaba justamente para esas.)
function puedeReprogramar(d){
  return !motivoNoReprogramar(d);
}
function motivoNoReprogramar(d){
  if(!d || !d.id || d.cursoId || d.estado==='Realizada') return 'no aplica';
  if(d.estado==='Cancelada' || d.estado==='NoShow'){
    if(d.abonoDevuelto) return 'Esta cita no se puede reprogramar porque se le devolvió el abono: crea una cita nueva para el día nuevo.';
    if(d.date < sedeNow().date && apptCommission(d) > 0) return 'Esta cita no se puede reprogramar: su abono perdido ya se contó en la comisión de esa semana (regla anterior al 05/10). Crea una cita nueva y marca "abono ya pagado en una cita anterior".';
  }
  return '';
}
function fechaCortaConDia(key){
  const dt = parseKey(key);
  return `${DAY_NAMES[dt.getDay()].toLowerCase()} ${pad(dt.getDate())}/${pad(dt.getMonth()+1)}`;
}
function reprogramacionesHtml(d, style){
  const lista = Array.isArray(d.reprogramaciones) ? d.reprogramaciones.filter(r=>r && /^\d{4}-\d{2}-\d{2}$/.test(r.desde||'')) : [];
  if(!lista.length) return '';
  const filas = lista.map(r=>{
    const dt = new Date(r.en);
    const cuando = isNaN(dt) ? '' : ` <span style="opacity:.75">(cambiada el ${dt.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'})})</span>`;

// Pasa lo elegido en el cuadro "Reprogramar" al formulario y guarda (con las
// mismas revisiones de siempre: otra cita a esa hora, box, bloqueos, horario).
function aplicarReprogramacion(){
  const d = ui.modal && ui.modal.data;
  if(!d) return;
  const nuevaFecha = document.getElementById('reprog-date').value;
  const nuevaHora = document.getElementById('reprog-start').value;
  if(!nuevaFecha || !nuevaHora){ showAlert('Elige el nuevo día y la nueva hora.'); return; }
  if(nuevaFecha===d.date && nuevaHora===d.start){ showAlert('Es el mismo día y la misma hora que ya tiene la cita. Elige otro día u otra hora.'); return; }
  const hoy = sedeNow();
  if(nuevaFecha < hoy.date){ showAlert('Ese día ya pasó. Elige un día de hoy en adelante.'); return; }
  const fEnd = document.getElementById('f-end'), fStart = document.getElementById('f-start');
  // Misma duración que tiene la cita en el formulario (por si se cambió un servicio).
  const dur = Math.max(5, minutesFromMidnight(fEnd.value||d.end) - minutesFromMidnight(fStart.value||d.start));
  if(minutesFromMidnight(nuevaHora) + dur > 23*60+59){ showAlert('Con esa hora la cita terminaría pasada la medianoche. Elige una hora más temprano.'); return; }
  document.getElementById('f-date').value = nuevaFecha;
  fStart.value = nuevaHora;
  fEnd.value = addMinutesToHHMM(nuevaHora, dur);
  const est = document.getElementById('f-estado');
  if(['Cancelada','NoShow','Confirmada'].includes(d.estado)) est.value = 'Pendiente';
  ui.modal.reprogramar = true;
  saveApptFromForm();
}

// ---- Retoque: quién hizo la sesión inicial (11/10/2026, pedido de Juan
// Diego: casi siempre el retoque lo hace la misma especialista, y antes había
// que ir a buscar la cita inicial para saber quién era) ----
// Última cita de esa clienta (antes de esta fecha, no cancelada) con un
// tratamiento que lleva retoque; si el retoque dice de qué es ("Retoque
// Delineado de Ojos"), gana la que más se parece por nombre.
function palabrasTratamiento(n){
  return normalizeName(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\([^)]*\)/g,' ')
    .split(/[^a-zñ]+/).filter(w=>w.length>=4 && w!=='retoque');
}
function sesionInicialDeRetoque(cliente, servicios, fecha, excluirId){
  const retoques = (servicios||[]).filter(x=>/retoque/i.test(x||''));
  const n = normalizeName(cliente||'');
  if(!retoques.length || !n) return null;
  const buscadas = new Set(retoques.flatMap(palabrasTratamiento));
  const cands = state.appointments.filter(a=> a.id!==excluirId && normalizeName(a.client||'')===n && a.specialist
    && !a.cursoId && a.estado!=='Cancelada' && a.estado!=='NoShow' && (!fecha || a.date <= fecha)
    && !isRetoqueAppt(a) && !isGarantiaAppt(a) && (a.services||[]).some(servicioLlevaRetoque));
  if(!cands.length) return null;
  const puntaje = a=> Math.max(0, ...(a.services||[]).map(x=>palabrasTratamiento(x).filter(w=>buscadas.has(w)).length));
  cands.sort((x,y)=> (puntaje(y)-puntaje(x)) || (y.date+(y.start||'')).localeCompare(x.date+(x.start||'')));
  return cands[0];
}
// ---- Especialista que bloqueó ese horario (11/10/2026, pedido de Juan
// Diego: salía en la lista y al guardar recién decía que estaba bloqueada) ----
// Mismo criterio que al guardar (findCoveringBlock). En la lista sale al
// final, en gris y sin poder elegirse: "Lucy 🚫 bloqueó esta hora". Si la
// cita YA era de ella (se bloqueó después), se deja elegida con el aviso.
// ---- "El abono ya se pagó en una cita anterior" (11/10/2026, pedido de
// Juan Diego: con "📅 Reprogramar" casi nunca hace falta y confundía) ----
// La casilla solo aparece si esa clienta tiene una cita Cancelada / No llegó
// con abono cobrado, no devuelto y todavía no usado en otra cita (o si esta
// cita ya la tenía marcada). Se cuentan los abonos perdidos menos las otras
// citas de ella que ya marcaron "abono previo".
function abonoPendienteDeClienta(cliente, excluirId){
  const n = nombreExacto(cliente);
  if(!n) return null;
  const suyas = state.appointments.filter(a=>a.id!==excluirId && !a.cursoId && nombreExacto(a.client)===n);
  const perdidos = suyas.filter(a=>(a.estado==='Cancelada'||a.estado==='NoShow') && (Number(a.abono)||0)>0 && !a.abonoDevuelto && !a.abonoPrevio)
    .sort((x,y)=>(y.date+(y.start||'')).localeCompare(x.date+(x.start||'')));
  const usados = suyas.filter(a=>a.abonoPrevio && a.estado!=='Cancelada' && a.estado!=='NoShow').length;
  return perdidos.length > usados ? perdidos[0] : null;
}
// 12/10/2026 (Juan Diego): la agenda no sabe si la clienta PERDIÓ el abono
// (no avisó a tiempo: cita nueva, abono nuevo, sin marcar nada) o lo tiene A
// FAVOR (avisó a tiempo: se usa "📅 Reprogramar" en esa cita). Por eso, si esa
// cita se puede reprogramar, en vez de la casilla sale un aviso con un botón
// para abrirla. La casilla queda solo para lo que no se puede reprogramar
// (abono que ya entró en una comisión, antes del 05/10) o si ya estaba marcada.
function estadoAbonoPrevio(cliente, excluirId, yaMarcada){
  const pend = abonoPendienteDeClienta(cliente, excluirId);
  if(yaMarcada) return {modo:'casilla', pend};
  if(!pend) return {modo:'nada', pend:null};
  return {modo: motivoNoReprogramar(pend) ? 'casilla' : 'aviso', pend};
}

// ⚖️ Reparto de trabajo (21/10/2026, pedido de Juan Diego: una especialista
// tenía mucho más trabajo que las otras, y Helen quiere trabajar más). Se mide
// en DINERO (precio de sus citas; decidido con él: por cantidad no es justo,
// un Full Lips no vale lo mismo que un perfilado), sin canceladas/no llegó ni
// cursos, contando también las citas ya agendadas (lo que importa al dar la
// próxima cita es cuánto trabajo tiene cada una). Ventana: los últimos
// REPARTO_DIAS días, pero nunca antes de REPARTO_DESDE (decidido: arranca de
// cero, para que Helen no tenga que "recuperar" de golpe lo de antes). Solo
// muestra (recuadro al final de Pagos y "⚖️ le falta trabajo" en la lista al
// agendar, solo dueños): no cambia el orden de las medallas ni elige sola.
// Quién entra: casilla en Más → Especialistas (s.reparto); si nunca se tocó,
// en Santiago Salomé, Lucy y Helen. Campo dentro de cada especialista: no
// exige subir APP_VERSION.
const REPARTO_DESDE = '2026-10-22';
const REPARTO_DIAS = 28;
const REPARTO_POR_DEFECTO = ['salome','lucy','helen'];
function entraEnReparto(s){
  if(!s) return false;
  if(s.reparto===true) return true;
  if(s.reparto===false) return false;
  return SEDE.id==='santiago' && REPARTO_POR_DEFECTO.includes(sinTildes(s.name));
}
function repartoDesdeKey(){
  const ini = toKey(addDays(parseKey(sedeNow().date), -(REPARTO_DIAS-1)));
  return ini > REPARTO_DESDE ? ini : REPARTO_DESDE;
}
function repartoDatos(){
  const desde = repartoDesdeKey();
  // Una fila por nombre (si hubiera dos especialistas con el mismo nombre, la
  // segunda quedaría siempre en $0); sin nombre, no entra.
  const vistos = new Set();
  const filas = state.specialists.filter(s=>{
    const k = normalizeName(s && s.name);
    if(!k || vistos.has(k) || !entraEnReparto(s)) return false;
    vistos.add(k); return true;
  }).map(s=>({name:s.name, color:s.color, monto:0, citas:0}));
  if(filas.length < 2) return null;
  const fila = nombre=> filas.find(f=>normalizeName(f.name)===normalizeName(nombre));
  state.appointments.forEach(a=>{
    if(!a.date || a.date < desde || a.cursoId) return;
    if(a.estado==='Cancelada' || a.estado==='NoShow') return;
    const f = fila(a.specialist);
    if(!f) return;
    f.monto += Number(a.price)||0; f.citas++;
  });
  const total = filas.reduce((t,f)=>t+f.monto, 0);
  filas.forEach(f=>{ f.pct = total ? Math.round(f.monto*100/total) : 0; });
  return {desde, filas, total, fila};
}
// De las que se pueden elegir en este momento, la que menos trabajo tiene
// (solo si está claramente por debajo: menos del 85% del promedio).
function leFaltaTrabajo(rep, nombres){
  if(!rep) return [];
  const cand = nombres.map(n=>rep.fila(n)).filter(Boolean);
  if(cand.length < 2) return [];
  const prom = cand.reduce((t,f)=>t+f.monto, 0) / cand.length;
  const min = Math.min(...cand.map(f=>f.monto));
  return prom > 0 && min < prom*0.85 ? cand.filter(f=>f.monto===min).map(f=>normalizeName(f.name)) : [];
}

  const rep = repartoDatos();

  const parejo = 100/rep.filas.length;
  const falta = leFaltaTrabajo(rep, rep.filas.map(f=>f.name));
  const nombresFalta = rep.filas.filter(f=>falta.includes(normalizeName(f.name))).map(f=>`<b>${escapeHtml(f.name)}</b>`);

}
function opcionesEspecialistaHtml(servicios, actual, inicial, horario){
  const aptas = state.specialists.filter(s=>noHaceDe(s.name, servicios).length===0);
  // Si nadie hace todo lo elegido junto, se muestran todas (con el aviso).
  const lista = aptas.length ? aptas : state.specialists;
  const enLista = actual && lista.some(s=>s.name===actual);
  const extra = actual && !enLista ? (()=>{
    const falta = noHaceDe(actual, servicios);
    return `<option value="${escapeHtml(actual)}" selected>${escapeHtml(actual)}${falta.length ? ` (no hace ${escapeHtml(summarizeServices(falta))})` : ''}</option>`;
  })() : '';
  const ranking = rankingParaForm(servicios);
  const filaDe = nombre=> ranking ? ranking.find(f=>normalizeName(f.esp)===normalizeName(nombre)) : null;
  // Con ranking: primero las que tienen datos, de mejor a peor; después las demás.
  const ordenada = ranking ? lista.slice().sort((x,y)=>{
    const fx = filaDe(x.name), fy = filaDe(y.name);
    const px = fx ? ranking.indexOf(fx) : 999, py = fy ? ranking.indexOf(fy) : 999;
    return px - py;
  }) : lista.slice();
  // Retoque: la que hizo la sesión inicial va primera y marcada con ⭐.
  const esInicial = nombre=> !!(inicial && normalizeName(inicial.specialist)===normalizeName(nombre));
  ordenada.sort((x,y)=> esInicial(y.name) - esInicial(x.name));
  // Las que bloquearon ese horario van al final.
  const bloqueada = nombre=> !!bloqueoDeEspecialista(nombre, horario);
  ordenada.sort((x,y)=> bloqueada(x.name) - bloqueada(y.name));
  // Solo al agendar una cita NUEVA (al editar una ya dada no hace falta).
  const nueva = ui.modal && ui.modal.type==='appt' && ui.modal.mode==='new';
  const falta = esDueno() && nueva ? leFaltaTrabajo(repartoDatos(), ordenada.filter(s=>!bloqueada(s.name)).map(s=>s.name)) : [];
  const balanza = nombre=> falta.includes(normalizeName(nombre)) ? ' · ⚖️ le falta trabajo' : '';
  return `<option value="">— Sin asignar —</option>${extra}` + ordenada.map(s=>{
    const noHaceS = aptas.length ? [] : noHaceDe(s.name, servicios);
    const f = filaDe(s.name);
    const gar = f ? ` ${f.medalla ? f.medalla+' ' : ''}${f.pct}% bien · ${f.c.n} trabajo${f.c.n===1?'':'s'}` : '';
    const ini = esInicial(s.name) ? ' ⭐' : ''; // corto a pedido de Juan Diego; el detalle va en el mensaje de abajo
    if(bloqueada(s.name)){
      return `<option value="${escapeHtml(s.name)}" ${actual===s.name?'selected':'disabled'}>${escapeHtml(s.name)}${ini} 🚫 bloqueó esta hora</option>`;
    }
    return `<option value="${escapeHtml(s.name)}" ${actual===s.name?'selected':''}>${escapeHtml(s.name)}${ini}${ini ? '' : gar}${balanza(s.name)}${noHaceS.length ? ` (no hace ${escapeHtml(summarizeServices(noHaceS))})` : ''}</option>`;
  }).join('');
}
function filtroEspecialistaHint(servicios, actual, inicial, horario){
  const b = bloqueoDeEspecialista(actual, horario);
  const bloq = b ? `🚫 <b>${escapeHtml(actual)}</b> bloqueó ${b.fullDay ? 'todo ese día' : `de ${escapeHtml(b.start)} a ${escapeHtml(b.end)}`}${b.reason ? ' ('+escapeHtml(b.reason)+')' : ''}: elige otra especialista u otra hora.` : '';
  const sinBloq = filtroEspecialistaHintSinBloqueo(servicios, actual, inicial);
  return bloq && sinBloq ? bloq + '<br>' + sinBloq : (bloq || sinBloq);
}
function filtroEspecialistaHintSinBloqueo(servicios, actual, inicial){
  const ini = inicial ? `⭐ La sesión inicial (${escapeHtml(summarizeServices((inicial.services||[]).filter(servicioLlevaRetoque)))}, ${fechaCortaConDia(inicial.date)}) la hizo <b>${escapeHtml(inicial.specialist)}</b>.` : '';
  const resto = filtroEspecialistaHintBase(servicios, actual);
  return ini && resto ? ini + '<br>' + resto : (ini || resto);
}
function filtroEspecialistaHintBase(servicios, actual){
  const sv = serviciosParaFiltro(servicios);
  const algunaConPerfil = state.specialists.some(s=>Array.isArray(s.noHace) && s.noHace.length);
  if(!sv.length || !algunaConPerfil) return '';
  const aptas = state.specialists.filter(s=>noHaceDe(s.name, servicios).length===0);
  if(!aptas.length) return `⚠️ Ninguna especialista hace todos estos tratamientos juntos.`;
  const falta = actual ? noHaceDe(actual, servicios) : [];
  if(falta.length) return `⚠️ ${escapeHtml(actual)} no hace ${escapeHtml(summarizeServices(falta))} (según Más → Especialistas).`;
  if(aptas.length < state.specialists.length) return `Solo aparecen las que hacen ${sv.length===1 ? 'este tratamiento' : 'estos tratamientos'}.`;
  return '';
}
// Se llama cada vez que cambian los tratamientos o la especialista.
function actualizarPerfilEnForm(){
  const sel = document.getElementById('f-specialist');
  if(!sel) return;
  const servicios = [];
  getServiceQuantities().forEach(({idx})=>{ const sv = state.services[idx]; if(sv) servicios.push(sv.name); });
  let actual = sel.value;
  const inicial = sesionInicialDelForm(servicios);
  // En una cita NUEVA de retoque, se elige sola la que hizo la sesión inicial
  // (si todavía no se eligió a nadie, o si la había elegido esto mismo antes).
  let autoElegida = false;
  const horario = horarioDelForm();
  if(ui.modal && ui.modal.mode==='new' && inicial && inicial.specialist!==actual && !ui.modal._especialistaTocada
     && (!actual || actual===ui.modal._retoqueAuto) && !bloqueoDeEspecialista(inicial.specialist, horario)
     && especialistaPorNombre(inicial.specialist) && !noHaceDe(inicial.specialist, servicios).length){
    actual = inicial.specialist; autoElegida = true;
    Object.defineProperty(ui.modal, '_retoqueAuto', {value: actual, enumerable:false, writable:true, configurable:true});
  }
  const nuevo = opcionesEspecialistaHtml(servicios, actual, inicial, horario);
  if(sel.innerHTML !== nuevo) sel.innerHTML = nuevo;
  sel.value = actual;
  if(autoElegida) setTimeout(ajustarDuracionGarantia, 0); // su tiempo propio, si tiene
  const hint = document.getElementById('spec-filtro-hint');
  if(hint) hint.innerHTML = filtroEspecialistaHint(servicios, actual, inicial, horario);
  actualizarAbonoPrevioEnForm(); // depende de la clienta, igual que lo del retoque
  // Lo que ella no hace queda en gris y no se puede sumar (sí quitar).
  document.querySelectorAll('[data-svc-row]').forEach(row=>{
    const sv = state.services[Number(row.dataset.svcRow)];
    if(!sv) return;
    const no = !!actual && !especialistaHace(actual, sv.name) && !esServicioGarantia(sv.name);
    row.classList.toggle('no-hace', no);
    const inc = row.querySelector('[data-svc-inc]');
    if(inc) inc.disabled = no;
    const dur = row.querySelector('.svc-picker-duration');
    if(dur){
      const txt = no ? `${escapeHtml(actual)} no lo hace` : pickerDuracionTexto(sv, actual);
      if(dur.innerHTML !== txt) dur.innerHTML = txt;
    }
  });
}

  const d = parseKey(key);
  return `${DAY_NAMES_FULL[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function coursesListModalHtml(){
  const isAdmin = ui.mode==='admin';
  const today = toKey(new Date());
  const list = (state.courses||[]).slice().sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));
  const rows = list.map(c=>{
    const count = courseAttendees(c.id).length;
    return `
      <div class="curso-row" data-act="open-curso" data-id="${escapeHtml(c.id)}">
        <div>
          <div class="cr-name">${c.date < today ? '' : '📚 '}${escapeHtml(c.nombre||'Curso')}</div>
          <div class="cr-rut">${courseDateLabel(c.date)} · ${c.start}–${c.end}${c.specialist?' · '+escapeHtml(c.specialist):''}</div>
        </div>
        <div class="cr-right">${count} inscrito${count===1?'':'s'}</div>
      </div>`;
  }).join('');
  return `
  <div class="overlay" data-act="overlay-close">
    <div class="modal" data-stop="1">
      <h2 class="serif">📚 Cursos</h2>
      <div class="hint">Clases grupales (ej. un curso de un día) — cada inscrito cuenta en Finanzas igual que una cita normal.</div>
      ${list.length===0 ? `<div class="empty-msg">Todavía no hay ningún curso creado.</div>` : `<div>${rows}</div>`}
      ${isAdmin ? `<button type="button" class="btn btn-ghost" style="margin-top:10px;" data-act="new-course">+ Nuevo curso</button>` : ''}
      <div class="modal-actions">
        <div></div>
        <div class="right"><button class="btn btn-ghost" data-act="close-modal">Cerrar</button></div>
      </div>
    </div>
  </div>`;
}

// "💆 Tratamientos" de cada especialista: casilla = lo hace; minutos = solo
// si se demora distinto de lo normal (vacío = la duración general).
function perfilEspecialistaHtml(s, i){
  const noHace = Array.isArray(s.noHace) ? s.noHace : [];
  // La garantía y la evaluación las hace cualquiera (no filtran): no se listan.
  const enPerfil = sv=>sv && sv.name && !esServicioGarantia(sv.name) && !/evaluaci[oó]n/i.test(sv.name);
  const servicios = state.services.filter(enPerfil);
  const cuantosNo = servicios.filter(sv=>noHace.includes(sv.name)).length;
  const propias = servicios.filter(sv=>duracionPropia(s.name, sv.name)).length;
  const resumen = (cuantosNo ? `hace ${servicios.length-cuantosNo} de ${servicios.length}` : 'hace todos')
    + (propias ? ` · ${propias} con su propio tiempo` : '');
  return `
    <details class="spec-perfil">
      <summary>💆 Tratamientos: <span class="hint" style="margin:0;">${resumen}</span></summary>
      <div class="hint" style="margin:6px 0 8px;">Marca lo que hace. En "Su tiempo" pon los minutos solo si se demora distinto de lo normal (vacío = lo de Servicios y tarifario).</div>
      <div class="spec-perfil-head"><span>Tratamiento</span><span>Su tiempo</span></div>
      ${state.services.map((sv,j)=>!enPerfil(sv) ? '' : `
      <div class="spec-perfil-row">
        <label><input type="checkbox" data-spec-hace="${i}:${j}" ${noHace.includes(sv.name)?'':'checked'}> <span>${escapeHtml(sv.name)}</span></label>
        <input type="number" min="5" step="5" inputmode="numeric" data-spec-dur="${i}:${j}" value="${duracionPropia(s.name, sv.name)||''}" placeholder="${Number(sv.duration)||0}" title="Minutos (normal: ${Number(sv.duration)||0})">
      </div>`).join('')}
    </details>`;
}

function scheduleModalHtml(){
  const s = state.settings;
  const hourOptions = (val)=>{
    let opts='';
    for(let h=0;h<=23;h++) opts += `<option value="${h}" ${Number(val)===h?'selected':''}>${pad(h)}:00</option>`;
    return opts;
  };
  const dayRows = DAY_NAMES.map((name, idx)=>{
    const dh = (s.hours||{})[idx];
    const closed = !dh;
    return `
      <div class="sched-day-row">
        <button type="button" class="daytoggle ${closed?'closed':''}" data-act="toggle-day-closed" data-day="${idx}">${name}</button>
        ${closed
          ? '<span class="sched-closed-label">Cerrado</span>'
          : `<select data-day-open="${idx}">${hourOptions(dh.open)}</select><span class="sched-dash">–</span><select data-day-close="${idx}">${hourOptions(dh.close)}</select>`
        }
      </div>`;
  }).join('');

  return `
  <div class="overlay" data-act="overlay-close">
    <div class="modal" data-stop="1">
      <h2 class="serif">Horario de atención</h2>
      <div class="hint">Toca el día para marcarlo abierto/cerrado. Cada día puede tener su propio horario.</div>
      <div id="sched-days">${dayRows}</div>
      <div class="row2" style="margin-top:14px">
        <div class="field"><label>Almuerzo desde</label><input type="time" id="f-lunchStart" value="${s.lunchStart||''}"></div>
        <div class="field"><label>Almuerzo hasta</label><input type="time" id="f-lunchEnd" value="${s.lunchEnd||''}"></div>
      </div>
      <div class="modal-actions">
        <div></div>
        <div class="right">
          <button class="btn btn-ghost" data-act="close-modal">Cerrar</button>
          <button class="btn btn-primary" data-act="save-schedule">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>`;
}

// ---------------- Buscador rápido de citas (por nombre o teléfono, en todas las fechas) ----------------
function apptSearchScore(query, appt){
  const q = normalizeName(query);
  if(!q) return 0;
  const n = normalizeName(appt.client||'');
  const tel = (appt.phone||'').replace(/\D/g,'');
  const qDigits = q.replace(/\D/g,'');
  if(!n && !tel) return 0;
  if(n === q) return 100;
  if(n.includes(q) || (q.length>=3 && q.includes(n))) return 50;
  if(qDigits.length>=4 && tel.includes(qDigits)) return 40;
  const qWords = q.split(/\s+/).filter(w=>w.length>=3);
  const nWords = n.split(/\s+/).filter(w=>w.length>=3);
  // A propósito "contiene" en vez de coincidencia exacta: así encuentra
  // aunque escriban un diminutivo ("Rosa" por "Rosario") o parte del nombre.
  let shared = 0;
  qWords.forEach(w=>{ if(nWords.some(nw=>nw.includes(w)||w.includes(nw))) shared++; });
  return shared>0 ? 10*shared : 0;
}

function renderApptSearchResults(query){
  const q = (query||'').trim();
  if(!q){
    return `<p class="hint" style="margin-top:10px">Escribe el nombre o teléfono de la clienta para buscar entre todas las citas guardadas (no solo las del mes actual).</p>`;
  }
  const estadoLabels = {Pendiente:'Pendiente',Confirmada:'Confirmada',Realizada:'Realizada',Cancelada:'Cancelada',NoShow:'No se presentó'};
  const scored = state.appointments
    .map(a=>({a, score: apptSearchScore(q, a)}))
    .filter(x=>x.score>0)
    .sort((x,y)=> y.score-x.score || y.a.date.localeCompare(x.a.date) || y.a.start.localeCompare(x.a.start));
  if(scored.length===0){
    return `<p class="hint" style="margin-top:10px">No se encontraron citas con ese nombre o teléfono.</p>`;
  }
  const rows = scored.slice(0,40).map(({a})=>{
    const d = parseKey(a.date);
    const dateLabel = `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
    return `
      <div class="client-row">
        <div class="client-row-main" data-goto-appt="${escapeHtml(a.id)}">
          <div>
            <div class="client-name">${escapeHtml(a.client||'(sin nombre)')}</div>
            <div class="client-meta">${dateLabel} · ${a.start} · ${escapeHtml(apptServiciosTexto(a)) || '—'} · ${estadoLabels[a.estado]||a.estado}</div>
          </div>
        </div>
      </div>`;
  }).join('');
  const moreHint = scored.length>40 ? `<p class="hint">Mostrando los primeros 40 resultados — escribe más letras para acotar la búsqueda.</p>` : '';
  return rows + moreHint;
}
