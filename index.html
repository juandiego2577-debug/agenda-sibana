// El "Lifting de Pestañas" no lleva retoque (a diferencia de micropigmentación,
// que sí) — a pedido explícito del usuario, quienes se hicieron solo eso no
// deben aparecer en Retoques pendientes.
function isLiftingPestanasAppt(a){
  return (a.services||[]).some(s=>/lifting de pesta[nñ]as/i.test(s||''));
}
// Cada cuántos días conviene volver a escribirle a alguien que quedó "en el
// aire" (no respondió, o dejó en visto) — ni tan seguido que sea molesto, ni
// tan espaciado que se pierda el impulso antes de que se cierre la ventana.
const TOUCHUP_FOLLOWUP_DAYS = 4;
function daysSince(dateKey){
  if(!dateKey) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - parseKey(dateKey)) / 86400000);
}
// Si la clienta ya tiene una cita posterior a la sesión inicial (no cancelada),
// ya no hace falta avisarle: significa que ya volvió o que ya está agendada.
// ¿Este tratamiento lleva retoque? Se marca a mano por servicio en Servicios y
// tarifario ("🔁 Lleva retoque", s.llevaRetoque; pedido de Juan Diego, oct
// 2026: antes se proponía retoque a clientas de laminado, limpieza, etc.).
// Si nunca se marcó, lleva retoque lo que es micropigmentación (los 6 que
// confirmó: microblading, sombreado, MixBrows/técnica mixta, full lips,
// delineado de ojos y delineado doble). Un servicio que ya no está en la
// lista (se renombró o se borró) se reconoce por el nombre.
function servicioLlevaRetoque(nombre){
  if(!nombre || /retoque|garant[ií]a|evaluaci[oó]n/i.test(nombre)) return false;
  const svc = (state.services||[]).find(s=>s.name===nombre);
  if(svc) return svc.llevaRetoque!=null ? !!svc.llevaRetoque : !!svc.micropigmentacion;
  return /microblading|sombreado|delineado|mixbrows|t[eé]cnica mixta|full lips/i.test(nombre);
}
function touchupCandidates(opts){
  const today = new Date(); today.setHours(0,0,0,0);
  // A diferencia de "Reseñas pendientes" (que sí se pide una sola vez), acá
  // conviene poder seguir insistiéndole a la clienta más de una vez mientras
  // todavía esté a tiempo — así que avisarle NO la saca de la lista; se queda
  // hasta que agende o hasta que pase el margen de 50 días (el retoque
  // mantiene su precio normal hasta los ~45 días, pero se deja hasta 50 como
  // margen antes de considerarlo del todo perdido).
  const minDate = addDays(today, -50);
  const maxDate = addDays(today, -30);
  const byClient = new Map();
  state.appointments.forEach(a=>{
    if(a.estado!=='Realizada' || !a.client) return;
    if(isRetoqueAppt(a)) return; // ya es un retoque, no una sesión inicial
    if(isEvaluacionAppt(a)) return; // una evaluación no es un tratamiento, no le corresponde retoque
    if(isGarantiaAppt(a)) return; // una garantía tampoco es una sesión inicial nueva
    if(a.garantiaRevision && a.garantiaRevision.es) return; // garantía vieja marcada a mano en ⭐ Garantías
    if(isLiftingPestanasAppt(a)) return; // el lifting de pestañas no lleva retoque
    if(!(a.services||[]).some(servicioLlevaRetoque)) return; // ningún tratamiento de la cita lleva retoque (laminado, limpieza, perfilado…)
    if(a.cursoId) return; // una clase de un curso no es un tratamiento individual, no le corresponde retoque
    const dt = parseKey(a.date);
    if(dt < minDate || dt > maxDate) return;
    const key = normalizeName(a.client);
    const prev = byClient.get(key);
    if(!prev || a.date > prev.date) byClient.set(key, a);
  });
  // "Agendó de verdad" no cuenta si esa cita posterior se canceló o si la
  // clienta no llegó (NoShow) — en ninguno de los dos casos se hizo
  // realmente el retoque, así que debería seguir apareciendo en la lista
  // para poder insistirle de nuevo (mismo criterio que ya usa apptRevenue
  // para tratar Cancelada y NoShow igual).
  const hasLaterAppt = a=>{
    const key = normalizeName(a.client);
    return state.appointments.some(o=>
      o.id!==a.id && normalizeName(o.client)===key &&
      o.estado!=='Cancelada' && o.estado!=='NoShow' && o.date > a.date
    );
  };
  // "🚫 Quitar" (a.retoqueQuitado = {en, por}, pedido de Juan Diego, oct
  // 2026): clientas que no se hicieron de verdad el tratamiento (datos de la
  // agenda anterior), que no quieren el retoque o a las que les quedó bien.
  // Se mira en la cita más reciente de la clienta (la que se muestra), así
  // quitarla nunca hace aparecer una cita más vieja suya en su lugar.
  return Array.from(byClient.values())
    .filter(a=>!hasLaterAppt(a) && (opts && opts.quitadas ? !!a.retoqueQuitado : !a.retoqueQuitado))
    .map(a=>({appt:a, diffDays: Math.round((today - parseKey(a.date)) / 86400000)}))
    .sort((x,y)=>x.diffDays - y.diffDays);
}

  u.reauthenticateWithCredential(cred)
    .then(()=>u.updatePassword(nueva))
    .then(()=>{ ui.modal = null; render(); showAlert('Listo, tu contraseña cambió. La próxima vez que entres en otro dispositivo, usa la nueva.'); })
    .catch(err=>{
      console.error('No se pudo cambiar la contraseña', err);
      const code = err && err.code || '';
      if(/wrong-password|invalid-credential|invalid-login/.test(code)) showAlert('La contraseña actual no es correcta.');
      else if(/weak-password/.test(code)) showAlert('Esa contraseña es muy débil. Usa una más larga.');
      else if(/too-many-requests/.test(code)) showAlert('Demasiados intentos. Espera unos minutos y vuelve a intentar.');
      else showAlert('No se pudo cambiar la contraseña (¿sin señal?). Vuelve a intentarlo.');
    });
}

// ---------------- Certificados de cursos (solo dueños, 19/10/2026) ----------------
// Pedido de Juan Diego: cada alumna de un curso recibe un certificado con un QR
// que lleva a una página pública (repo sibana-certificados, en Netlify) donde
// cualquiera comprueba que es auténtico. Se emiten desde el curso
// (📚 curso → "📜 Certificados del curso") o, para cursos que no están en la
// agenda (ej. de años anteriores), desde Más → 📜 Certificados → "+ Certificado
// sin curso en la agenda". NO se guardan en el documento de la agenda (no es un
// DOC_KEYS: no exige subir APP_VERSION ni gasta su 1 MiB), sino en colecciones
// propias que solo pueden tocar los dueños (ver firestore.rules):
// - sibana-certificados/<folio>: registro completo (RUT entero, quién lo emitió).
// - sibana-verificacion/<código>: lo poco que muestra la página pública.
// - sibana-cert-cursos/<sede>_<cursoId>: datos del curso para el certificado.
// - sibana-certificados-meta/folios-<año>: último número de folio usado.
// Un certificado nunca se borra: se ANULA (la página dice "Certificado anulado").
const CERT_COL = 'sibana-certificados';
const CERT_VERIF_COL = 'sibana-verificacion';
const CERT_CURSOS_COL = 'sibana-cert-cursos';
const CERT_META_COL = 'sibana-certificados-meta';
const CERT_VERIF_URL = 'https://sibana-certificados.netlify.app/v/';
const CERT_INSTITUCION = 'Sibana Academia PMU';
// Corregir también las fechas (curso, período, emisión) desde "✏️ Corregir". Pedido de Juan Diego (19/10/2026)
// para arreglar 2 certificados de cursos antiguos sin anularlos; ya se usó y él pidió quitarlo: apagado.
// (Es `let` para que las pruebas lo puedan prender; para volver a mostrarlo: true.)
let CERT_CORREGIR_FECHAS = false;
const CERT_FOLIO_PREFIJO = 'SIB-PMU';
const CERT_ALFABETO = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sin 0/O ni 1/I, para no confundirlos al escribirlo
const CERT_DOC_TIPOS = ['RUT', 'Pasaporte', 'DNI', 'Cédula'];

function certCodigoNuevo(){
  const bytes = new Uint32Array(8);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b=>CERT_ALFABETO[b % CERT_ALFABETO.length]).join('');
}
function certCodigoBonito(c){ return c ? c.slice(0,4) + '-' + c.slice(4) : ''; }
function certEnlace(c){ return CERT_VERIF_URL + c; }
// RUT chileno: dígito verificador (módulo 11) y formato 12.345.678-9.
function certRutLimpio(s){ return String(s||'').toUpperCase().replace(/[^0-9K]/g, ''); }
function certRutValido(s){
  const r = certRutLimpio(s);
  if(!/^[0-9]{7,8}[0-9K]$/.test(r)) return false;
  const cuerpo = r.slice(0,-1), dv = r.slice(-1);
  let suma = 0, mul = 2;
  for(let i = cuerpo.length - 1; i >= 0; i--){ suma += Number(cuerpo[i]) * mul; mul = mul === 7 ? 2 : mul + 1; }
  const res = 11 - (suma % 11);
  return dv === (res === 11 ? '0' : res === 10 ? 'K' : String(res));
}
function certRutFormato(s){
  const r = certRutLimpio(s);
  const cuerpo = r.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return cuerpo + '-' + r.slice(-1);
}
function certTipoSugerido(doc){
  if(SEDE.docIdentidad === 'RUT') return certRutValido(doc) ? 'RUT' : 'Pasaporte';
  return SEDE.docIdentidad || 'Pasaporte';
}
// Lo que se muestra en la página pública: el documento a medias.
function certDocParcial(tipo, doc){
  if(tipo === 'RUT' && certRutValido(doc)){
    const f = certRutFormato(doc);           // 18.644.062-5
    return f.replace(/\d{3}-/, 'XXX-');        // 18.644.XXX-5
  }
  const s = String(doc||'').trim();
  if(s.length <= 4) return s ? '•'.repeat(s.length) : '';
  return s.slice(0,2) + '•'.repeat(s.length - 4) + s.slice(-2);
}
// "Santiago de Chile" (como se dice allá); en otras sedes, "Ciudad, País".
function certLugarSede(){
  return SEDE.id === 'santiago' ? 'Santiago de Chile' : SEDE.nombre + (SEDE.pais ? ', ' + SEDE.pais : '');
}
// Cuándo se hizo el curso: el período escrito (cursos antiguos sin día exacto,
// ej. "julio a diciembre de 2023") o la fecha.
function certCuandoTexto(x){ return (x && x.periodo) ? x.periodo : certFechaLarga(x && x.fecha); }
function certFechaLarga(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  return m ? `${Number(m[3])} de ${MONTHS[Number(m[2])-1]} de ${m[1]}` : (iso||'');
}
// --- Revisión automática del nombre antes de emitir o corregir ---
// Un certificado lleva el nombre COMPLETO (nombres y apellidos). Lo que se
// puede revisar solo: muy pocas palabras, mayúsculas, y si la misma persona
// (mismo documento) figura en la agenda con un nombre más largo.
const CERT_PARTICULAS = new Set(['de','del','la','las','los','y','da','das','do','dos','di','van','von','der','e']);
function certPalabrasNombre(n){
  return String(n||'').trim().split(/\s+/).filter(x=>x && !CERT_PARTICULAS.has(x.toLowerCase()));
}
function certDocClave(doc){ return String(doc||'').toUpperCase().replace(/[^0-9A-Z]/g,''); }
function certNombreEnAgenda(nombre, doc){
  const d = certDocClave(doc);
  if(d.length < 5) return '';
  const propias = certPalabrasNombre(nombre).map(nombreExacto);
  let mejor = '';
  (state.appointments||[]).forEach(a=>{
    if(certDocClave(a.rut) !== d) return;
    const otro = String(a.client||'').trim().replace(/\s+/g,' ');
    const suyas = certPalabrasNombre(otro).map(nombreExacto);
    if(suyas.length > propias.length && propias.every(x=>suyas.includes(x)) && suyas.length > certPalabrasNombre(mejor).length) mejor = otro;
  });
  return mejor;
}
function certAvisosNombre(nombre, doc){
  const n = String(nombre||'').trim().replace(/\s+/g,' ');
  if(!n) return [];
  const av = [], pals = certPalabrasNombre(n);
  if(pals.length < 3) av.push(`Tiene solo ${pals.length} palabra${pals.length===1?'':'s'}: ¿falta un nombre o un apellido?`);
  if(n === n.toLowerCase() || (n === n.toUpperCase() && /\p{Lu}{2}/u.test(n))) av.push('Escríbelo con mayúscula solo al inicio de cada nombre (ej. "María José Pérez Soto").');
  else if(pals.some(x=>/^\p{Ll}/u.test(x))) av.push('Hay un nombre o apellido que empieza con minúscula.');
  const enAgenda = certNombreEnAgenda(n, doc);
  if(enAgenda) av.push(`En la agenda, con el mismo documento, figura como "${enAgenda}".`);
  return av;
}
function certAvisoHtml(id, nombre, doc){
  const av = certAvisosNombre(nombre, doc);
  return `<div class="cert-aviso" id="${escapeHtml(id)}">${av.map(x=>'⚠️ ' + escapeHtml(x)).join('<br>')}</div>`;
}
// Nombre y apellido de la instructora: si en otro curso ya se escribió completo
// (ej. "Salomé Toro"), se propone ese en vez del nombre corto de la agenda.
function certInstructoraCompleta(corto, configs){
  const primera = nombreExacto(certPalabrasNombre(corto)[0] || '');
  if(!primera) return corto || '';
  const cuenta = new Map();
  (configs||[]).forEach(x=>{
    const ins = String(x.instructora||'').trim().replace(/\s+/g,' ');
    if(certPalabrasNombre(ins).length >= 2 && nombreExacto(certPalabrasNombre(ins)[0]) === primera) cuenta.set(ins, (cuenta.get(ins)||0) + 1);
  });
  const mejor = Array.from(cuenta.entries()).sort((a,b)=>b[1]-a[1])[0];
  return mejor ? mejor[0] : (corto || '');
}

// Datos por defecto del certificado, sacados del propio curso de la agenda.
function certDatosDesdeCurso(c){
  const horas = (()=>{
    const ini = minutesFromMidnight(c.start||'0:00'), fin = minutesFromMidnight(c.end||'0:00');
    const h = (fin - ini) / 60;
    return h > 0 ? `${Number.isInteger(h) ? h : h.toFixed(1).replace('.', ',')} horas cronológicas` : '';
  })();
  // Contenidos: las líneas que empiezan con "-" en las notas del curso ("Qué aprenderás:").
  const contenidos = String(c.notas||'').split('\n').map(l=>l.trim()).filter(l=>/^[-•·*]\s*/.test(l))
    .map(l=>l.replace(/^[-•·*]\s*/, '')).filter(Boolean).join('\n');
  return {
    curso: String(c.nombre||'').replace(/^(capacitaci[oó]n|curso)( de| en)?\s+/i, '').trim() || (c.nombre||''),
    fecha: c.date, horas, modalidad: 'Presencial',
    lugar: certLugarSede(),
    instructora: c.specialist || '', contenidos,
    emitido: c.date,
  };
}
function certEstadoAlumna(certs, inscritoId){
  const suyos = certs.filter(x=>x.inscritoId===inscritoId);
  return suyos.find(x=>x.estado==='valido') || suyos.sort((a,b)=>(b.folio||'').localeCompare(a.folio||''))[0] || null;
}

function abrirCertificadosCurso(courseId){

function cargarCertificadosCurso(){
  const m = ui.modal; if(!m || m.type!=='cert-curso') return Promise.resolve();
  const courseId = m.courseId;
  return Promise.all([
    db.collection(CERT_CURSOS_COL).doc(SEDE.id + '_' + courseId).get(),
    db.collection(CERT_COL).where('cursoId', '==', courseId).get(),
  ]).then(([cfgSnap, certSnap])=>{
    if(!ui.modal || ui.modal.type!=='cert-curso' || ui.modal.courseId!==courseId) return;
    ui.modal.cfg = cfgSnap.exists ? cfgSnap.data() : null;
    ui.modal.certs = certSnap.docs.map(d=>d.data()).filter(x=>x.estado!=='reemplazado');
    if(ui.modal.cfg){ render(); return; }
    ui.modal.editando = true; // la primera vez: revisar los datos antes de emitir
    // Proponer la instructora con nombre y apellido, como se escribió en otros cursos.
    return db.collection(CERT_CURSOS_COL).get().then(todos=>{
      if(!ui.modal || ui.modal.type!=='cert-curso' || ui.modal.courseId!==courseId) return;
      ui.modal.otrosCfg = todos.docs.map(d=>d.data());
    }).catch(()=>{}).then(()=>render());
  }).catch(err=>{
    console.error('No se pudieron leer los certificados', err);
    if(!ui.modal || ui.modal.type!=='cert-curso') return;
    ui.modal.error = 'No se pudieron cargar los certificados (¿sin señal, o faltan las reglas nuevas de Firebase?).';
    render();
  });
}

// --- Datos del curso para el certificado ---
function certLeerFormDatos(){
  const v = id=>{ const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  return {
    curso: v('f-cert-curso'), fecha: v('f-cert-fecha'), horas: v('f-cert-horas'), modalidad: v('f-cert-modalidad'),
    lugar: v('f-cert-lugar'), instructora: v('f-cert-instructora'), contenidos: v('f-cert-contenidos'), emitido: v('f-cert-emitido'),
    periodo: v('f-cert-periodo').replace(/\s+/g,' '),
  };
}
function certValidarDatos(d){
  if(!d.curso) return 'Falta el nombre del curso.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.fecha)) return 'Falta la fecha del curso.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.emitido)) return 'Falta la fecha de emisión.';
  if(!d.horas) return 'Falta la duración (ej. "7 horas cronológicas").';
  if(!d.instructora) return 'Falta el nombre de la instructora, tal como va en el certificado (ej. "Salomé Toro").';
  if(certPalabrasNombre(d.instructora).length < 2) return `Escribe el nombre Y el apellido de la instructora (ej. "${d.instructora} Toro"): así va impreso en el certificado.`;
  if((d.periodo||'').length > 60) return 'El período es demasiado largo (ej. "julio a diciembre de 2023").';
  if(d.curso.length > 150 || d.horas.length > 20 || d.modalidad.length > 40 || d.lugar.length > 80 || d.instructora.length > 80) return 'Algún dato es demasiado largo.';
  return '';
}
function guardarDatosCertCurso(){
  const m = ui.modal; if(!esDueno() || !m || m.type!=='cert-curso') return;
  const d = certLeerFormDatos();
  const err = certValidarDatos(d);
  if(err){ showAlert(err); return; }
  m.ocupado = true; render();
  db.collection(CERT_CURSOS_COL).doc(SEDE.id + '_' + m.courseId).set(Object.assign({}, d, {
    sede: SEDE.id, cursoId: m.courseId, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp(),
  })).then(()=>{
    if(!ui.modal || ui.modal.type!=='cert-curso') return;
    ui.modal.cfg = d; ui.modal.editando = false; ui.modal.ocupado = false; render();
  }).catch(err2=>{
    console.error(err2);
    if(ui.modal) ui.modal.ocupado = false;
    render(); showAlert('No se pudieron guardar los datos. Revisa la señal e inténtalo de nuevo.');
  });
}

// --- Emitir (un folio nuevo + código al azar, en una sola transacción) ---
// datos: {curso, fecha, horas, modalidad, lugar, instructora, contenidos, emitido,
//         nombre, docTipo, doc, cursoId, inscritoId}
function emitirCertificado(datos){
  if(!esDueno()) return Promise.reject(new Error('Solo dueños'));
  const anio = (datos.emitido || hoySedeKey()).slice(0,4);
  const metaRef = db.collection(CERT_META_COL).doc('folios-' + anio);
  return db.runTransaction(async tx=>{
    const meta = await tx.get(metaRef);
    const n = (meta.exists ? (Number(meta.data().ultimo)||0) : 0) + 1;
    const folio = `${CERT_FOLIO_PREFIJO}-${anio}-${String(n).padStart(3,'0')}`;
    let codigo = '', libre = false;
    for(let i = 0; i < 5 && !libre; i++){
      codigo = certCodigoNuevo();
      libre = !(await tx.get(db.collection(CERT_VERIF_COL).doc(codigo))).exists;
    }
    if(!libre) throw new Error('No se pudo generar un código libre');
    const doc = datos.docTipo === 'RUT' && certRutValido(datos.doc) ? certRutFormato(datos.doc) : String(datos.doc||'').trim();
    const publico = {
      folio, nombre: datos.nombre, curso: datos.curso, fecha: datos.fecha, emitido: datos.emitido, estado: 'valido',
      doc: certDocParcial(datos.docTipo, doc), docTipo: datos.docTipo || '',
      horas: datos.horas || '', modalidad: datos.modalidad || '', lugar: datos.lugar || '',
      instructora: datos.instructora || '', institucion: CERT_INSTITUCION,
      actualizadoEn: firebase.firestore.FieldValue.serverTimestamp(),
    };
    if(datos.periodo) publico.periodo = String(datos.periodo).trim();
    const privado = Object.assign({}, publico, {
      doc, codigo, sede: SEDE.id, cursoId: datos.cursoId || '', inscritoId: datos.inscritoId || '',
      contenidos: datos.contenidos || '', emitidoEn: firebase.firestore.FieldValue.serverTimestamp(),
      emitidoPor: (CUENTA && (CUENTA.nombre || CUENTA.email)) || '',
    });
    tx.set(metaRef, {ultimo: n, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()});
    tx.set(db.collection(CERT_COL).doc(folio), privado);
    tx.set(db.collection(CERT_VERIF_COL).doc(codigo), publico);
    return {folio, codigo};
  });
}
function emitirCertAlumna(inscritoId){
  const m = ui.modal; if(!esDueno() || !m || m.type!=='cert-curso' || !m.cfg || m.ocupado) return;
  const a = state.appointments.find(x=>x.id===inscritoId);
  if(!a) return;
  ui.modal = {type:'cert-form', modo:'alumna', volverA:m.courseId, cfg:m.cfg, inscritoId,
    nombre: a.client || '', doc: a.rut || '', docTipo: certTipoSugerido(a.rut), estado: a.estado || ''};
  render();
}
function abrirCertManual(){
  if(!esDueno()) return;
  ui.modal = {type:'cert-form', modo:'manual', cfg:{curso:'', fecha:'', horas:'', modalidad:'Presencial',
    lugar: certLugarSede(), instructora:'', contenidos:'', emitido: hoySedeKey()},
    nombre:'', doc:'', docTipo: SEDE.docIdentidad === 'RUT' ? 'RUT' : (SEDE.docIdentidad || 'Pasaporte')};
  render();
}
function confirmarEmisionDesdeForm(){
  const m = ui.modal; if(!esDueno() || !m || m.type!=='cert-form' || m.ocupado) return;
  const v = id=>{ const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const cfg = m.modo === 'manual' ? certLeerFormDatos() : m.cfg;
  const nombre = v('f-certp-nombre').replace(/\s+/g, ' ');
  const docTipo = v('f-certp-doctipo');
  const doc = v('f-certp-doc');
  // guardar lo escrito por si hay que volver a mostrar el formulario
  Object.assign(m, {nombre, docTipo, doc}); if(m.modo === 'manual') m.cfg = cfg;
  const errCfg = m.modo === 'manual' ? certValidarDatos(cfg) : '';
  if(errCfg){ showAlert(errCfg); return; }
  if(nombre.length < 3){ showAlert('Escribe el nombre completo de la persona, tal como aparece en su documento.'); return; }
  if(nombre.length > 120){ showAlert('El nombre es demasiado largo.'); return; }
  if(!doc){ showAlert('Falta el número de documento.'); return; }
  if(docTipo === 'RUT' && !certRutValido(doc)){ showAlert('Ese RUT no es válido (el dígito verificador no coincide). Revísalo, o si es un pasaporte elige "Pasaporte".'); return; }
  const docMostrar = docTipo === 'RUT' ? certRutFormato(doc) : doc;
  const avisosNombre = certAvisosNombre(nombre, doc);
  // Fechas: la emisión casi siempre es hoy, y un curso antiguo sin día exacto va con "Período".
  const hoy = hoySedeKey();
  const avisoEmision = cfg.emitido < hoy
    ? `\n\n⚠️ La fecha de emisión es el ${certFechaLarga(cfg.emitido)}, no hoy. La emisión es el día en que Sibana entrega el certificado (normalmente hoy), y el folio lleva ese año (${String(cfg.emitido).slice(0,4)}).` : '';
  const viejo = m.modo === 'manual' && !cfg.periodo && cfg.fecha && (new Date(hoy) - new Date(cfg.fecha)) / 864e5 > 60;
  const avisoPeriodo = viejo ? `\n\n⚠️ El certificado va a decir "Realizado el ${certFechaLarga(cfg.fecha)}". Si no se sabe el día exacto, llena "Período" (ej. julio a septiembre de 2023).` : '';
  const aviso = (avisosNombre.length ? '\n\n⚠️ Revisa el nombre: ' + avisosNombre.join(' ') : '') + avisoEmision + avisoPeriodo
    + ((m.estado === 'Cancelada' || m.estado === 'NoShow') ? '\n\nOjo: esta persona figura como "' + (m.estado === 'NoShow' ? 'No se presentó' : 'Cancelada') + '" en el curso.' : '');
  showConfirmDialog(`¿Emitir el certificado de ${nombre} (${docTipo} ${docMostrar})?\n\nCurso: ${cfg.curso}\nRealizado: ${certCuandoTexto(cfg)}\nEmisión: ${certFechaLarga(cfg.emitido)}\nSe le asigna el siguiente folio y su código de verificación. Un certificado emitido no se borra: si algo está mal, se anula y se emite uno nuevo.${aviso}`, ()=>{
    m.ocupado = true; render();
    emitirCertificado(Object.assign({}, cfg, {nombre, docTipo, doc, cursoId: m.modo === 'alumna' ? m.volverA : '', inscritoId: m.inscritoId || ''}))
      .then(({folio, codigo})=>{
        if(m.modo === 'alumna'){ abrirCertificadosCurso(m.volverA); }
        else { abrirRegistroCertificados(); }
        showAlert(`✅ Certificado emitido.\n\nFolio: ${folio}\nCódigo: ${certCodigoBonito(codigo)}`);
      })
      .catch(err=>{
        console.error(err);
        m.ocupado = false; render();
        showAlert('No se pudo emitir el certificado (no se guardó nada). Revisa la señal e inténtalo de nuevo.');
      });
  });
}
function emitirFaltantesCurso(){
  const m = ui.modal; if(!esDueno() || !m || m.type!=='cert-curso' || !m.cfg || !m.certs || m.ocupado) return;
  const pendientes = courseAttendees(m.courseId).filter(a=>a.estado!=='Cancelada' && a.estado!=='NoShow' && !certEstadoAlumna(m.certs, a.id));
  if(!pendientes.length){ showAlert('Todas las inscritas que asistieron ya tienen certificado.'); return; }
  // Antes de emitir se revisa a cada una en una pantalla propia (nombre y documento editables).
  ui.modal = {type:'cert-revisar', courseId: m.courseId, cfg: m.cfg, ocupado:false,
    personas: pendientes.map(a=>({id:a.id, nombre:(a.client||'').trim().replace(/\s+/g,' '), doc:(a.rut||'').trim(), docTipo: certTipoSugerido(a.rut)}))};
  render();
}
function certRevisarLeer(){
  const m = ui.modal;
  m.personas.forEach((x, i)=>{
    const v = id=>{ const el = document.getElementById(id); return el ? el.value.trim() : null; };
    const n = v('f-crev-nombre-' + i), t = v('f-crev-doctipo-' + i), d = v('f-crev-doc-' + i);
    if(n != null) x.nombre = n.replace(/\s+/g,' ');
    if(t != null) x.docTipo = t;
    if(d != null) x.doc = d;
  });
}
function emitirRevisados(){
  const m = ui.modal; if(!esDueno() || !m || m.type!=='cert-revisar' || m.ocupado) return;
  certRevisarLeer();
  const errores = [], avisos = [], vistos = new Map();
  m.personas.forEach(x=>{
    const quien = x.nombre || '(sin nombre)';
    if(x.nombre.length < 3) errores.push(`${quien}: falta el nombre completo.`);
    else if(x.nombre.length > 120) errores.push(`${quien}: el nombre es demasiado largo.`);
    if(!x.doc) errores.push(`${quien}: falta el número de documento.`);
    else if(x.docTipo === 'RUT' && !certRutValido(x.doc)) errores.push(`${quien}: el RUT ${x.doc} no es válido (el dígito verificador no coincide). Si es un pasaporte, elige "Pasaporte".`);
    const clave = certDocClave(x.doc);
    if(clave && vistos.has(clave)) errores.push(`${quien} y ${vistos.get(clave)} tienen el mismo documento.`);
    else if(clave) vistos.set(clave, quien);
    certAvisosNombre(x.nombre, x.doc).forEach(a=>avisos.push(`• ${quien}: ${a}`));
  });
  if(errores.length){ render(); showAlert('Antes de emitir, corrige esto:\n\n' + errores.join('\n')); return; }
  const lista = m.personas.map(x=>`• ${x.nombre} (${x.docTipo} ${x.docTipo==='RUT' ? certRutFormato(x.doc) : x.doc})`).join('\n');
  const n = m.personas.length;
  render();
  showConfirmDialog(`Se van a emitir ${n} certificado${n===1?'':'s'}, con folios seguidos en este orden:\n\n${lista}`
    + (avisos.length ? `\n\n⚠️ La agenda encontró esto. Si está bien así, continúa; si no, toca Cancelar y corrígelo:\n${avisos.join('\n')}` : '\n\n✅ La agenda revisó los nombres y documentos y no encontró nada raro.')
    + `\n\nUn certificado emitido no se borra (si algo queda mal, se puede corregir el nombre o anularlo).`, async ()=>{
    m.ocupado = true; render();
    let hechos = 0;
    try{
      for(const x of m.personas){
        await emitirCertificado(Object.assign({}, m.cfg, {nombre: x.nombre, docTipo: x.docTipo, doc: x.doc, cursoId: m.courseId, inscritoId: x.id}));
        hechos++;
      }
      abrirCertificadosCurso(m.courseId);
      showAlert(`✅ Listo: se emitieron ${hechos} certificado${hechos===1?'':'s'}.`);
    }catch(err){
      console.error(err);
      abrirCertificadosCurso(m.courseId);
      showAlert(`Se emitieron ${hechos} de ${n}. El resto no se pudo emitir (revisa la señal) — vuelve a tocar "Emitir" para los que faltan.`);
    }
  });
}

function volverDeCorregir(){

  if(m.origen) abrirCertificadosCurso(m.origen); else abrirRegistroCertificados();

function guardarCorreccionCert(){
  const m = ui.modal; if(!esDueno() || !m || m.type!=='cert-corregir' || m.ocupado) return;
  const v = id=>{ const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const nombre = v('f-certc-nombre').replace(/\s+/g,' '), docTipo = v('f-certc-doctipo'), docEscrito = v('f-certc-doc');
  const c = m.c;
  const conFechas = CERT_CORREGIR_FECHAS && !!document.getElementById('f-certc-emitido');
  const fecha = conFechas ? v('f-certc-fecha') : (c.fecha||'');
  const periodo = conFechas ? v('f-certc-periodo').replace(/\s+/g,' ') : (c.periodo||'');
  const emitido = conFechas ? v('f-certc-emitido') : (c.emitido||'');
  Object.assign(m, {nombre, docTipo, doc: docEscrito, fecha, periodo, emitido});
  if(nombre.length < 3){ showAlert('Escribe el nombre completo de la persona, tal como aparece en su documento.'); return; }
  if(nombre.length > 120){ showAlert('El nombre es demasiado largo.'); return; }
  if(!docEscrito){ showAlert('Falta el número de documento.'); return; }
  if(docTipo === 'RUT' && !certRutValido(docEscrito)){ showAlert('Ese RUT no es válido (el dígito verificador no coincide). Revísalo, o si es un pasaporte elige "Pasaporte".'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) { showAlert('Falta la fecha del curso.'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(emitido)) { showAlert('Falta la fecha de emisión.'); return; }
  if(periodo.length > 60){ showAlert('El período es demasiado largo (ej. "julio a septiembre de 2023").'); return; }
  const doc = docTipo === 'RUT' ? certRutFormato(docEscrito) : docEscrito;
  const cambios = [
    nombre !== c.nombre ? `Nombre: "${c.nombre}" → "${nombre}"` : '',
    (doc !== c.doc || docTipo !== c.docTipo) ? `Documento: ${c.docTipo} ${c.doc} → ${docTipo} ${doc}` : '',
    fecha !== (c.fecha||'') ? `Fecha del curso: ${certFechaLarga(c.fecha)} → ${certFechaLarga(fecha)}` : '',
    periodo !== (c.periodo||'') ? `Período: ${c.periodo ? '"' + c.periodo + '"' : '(sin período)'} → ${periodo ? '"' + periodo + '"' : '(sin período)'}` : '',
    emitido !== (c.emitido||'') ? `Fecha de emisión: ${certFechaLarga(c.emitido)} → ${certFechaLarga(emitido)}` : '',
  ].filter(Boolean);
  if(!cambios.length){ showAlert('No cambiaste nada.'); return; }
  // El folio lleva el año de emisión: si el año cambia, el certificado pasa a un folio nuevo de ese año
  // (el código QR es el mismo). El folio viejo queda guardado como "reemplazado" (no se muestra).
  const anioViejo = (/^[A-Z]+-[A-Z]+-(\d{4})-/.exec(c.folio||'')||[])[1] || '';
  const cambiaFolio = emitido.slice(0,4) !== anioViejo;
  const av = certAvisosNombre(nombre, doc);
  render();
  showConfirmDialog(`¿Corregir el certificado ${c.folio}?\n\n${cambios.join('\n')}${av.length ? '\n\n⚠️ ' + av.join(' ') : ''}\n\n`
    + (cambiaFolio ? `Como cambia el año de emisión, el certificado pasa al siguiente folio de ${emitido.slice(0,4)} (el ${c.folio} deja de usarse). El código QR no cambia.`
                   : 'El folio y el código QR no cambian.')
    + ' La página de verificación muestra los datos nuevos al instante. Si ya estaba impreso, hay que imprimirlo de nuevo.', ()=>{
    m.ocupado = true; render();
    const ahora = firebase.firestore.FieldValue.serverTimestamp();
    const borrar = firebase.firestore.FieldValue.delete();
    const correccion = {en: new Date().toISOString(), por: (CUENTA && (CUENTA.nombre || CUENTA.email)) || '',
      antes: {nombre: c.nombre||'', docTipo: c.docTipo||'', doc: c.doc||'', fecha: c.fecha||'', periodo: c.periodo||'', emitido: c.emitido||'', folio: c.folio}};
    const verifRef = db.collection(CERT_VERIF_COL).doc(c.codigo), viejoRef = db.collection(CERT_COL).doc(c.folio);
    db.runTransaction(async tx=>{
      let folio = c.folio, metaRef = null, n = 0;
      if(cambiaFolio){
        metaRef = db.collection(CERT_META_COL).doc('folios-' + emitido.slice(0,4));
        const meta = await tx.get(metaRef);
        n = (meta.exists ? (Number(meta.data().ultimo)||0) : 0) + 1;
        folio = `${CERT_FOLIO_PREFIJO}-${emitido.slice(0,4)}-${String(n).padStart(3,'0')}`;
      }
      const viejo = await tx.get(viejoRef);
      if(!viejo.exists) throw new Error('No encontré el certificado');
      tx.update(verifRef, {nombre, docTipo, doc: certDocParcial(docTipo, doc), fecha, emitido, folio, periodo: periodo || borrar, actualizadoEn: ahora});
      if(!cambiaFolio){
        tx.update(viejoRef, {nombre, docTipo, doc, fecha, emitido, periodo: periodo || borrar, actualizadoEn: ahora,
          correcciones: firebase.firestore.FieldValue.arrayUnion(correccion)});
      } else {
        const datos = Object.assign({}, viejo.data(), {folio, nombre, docTipo, doc, fecha, emitido, folioAnterior: c.folio, actualizadoEn: ahora});
        if(periodo) datos.periodo = periodo; else delete datos.periodo;
        datos.correcciones = (datos.correcciones || []).concat([correccion]);
        tx.set(db.collection(CERT_COL).doc(folio), datos);
        tx.update(viejoRef, {estado: 'reemplazado', reemplazadoPor: folio, actualizadoEn: ahora});
        tx.set(metaRef, {ultimo: n, actualizadoEn: ahora});
      }
      return folio;
    }).then(folio=>{
      volverDeCorregir();
      showAlert(folio === c.folio ? `✅ Certificado ${c.folio} corregido.` : `✅ Certificado corregido. Ahora es el folio ${folio} (mismo código QR).`);
    }).catch(err=>{
      console.error(err);
      m.ocupado = false; render();
      showAlert('No se pudo corregir (no se guardó nada). Revisa la señal e inténtalo de nuevo.');
    });
  });
}

// Igual que showPrompt, pero con texto visible (no contraseña).
function certPedirTexto(message, okLabel, onSubmit){
  const existing = document.getElementById('custom-dialog');
  if(existing) existing.remove();
  const wrap = document.createElement('div');
  wrap.id = 'custom-dialog';
  wrap.className = 'confirm-overlay';
  wrap.innerHTML = `
    <div class="confirm-box">
      <p>${escapeHtml(message)}</p>
      <input type="text" id="dlg-input" class="client-search-input" maxlength="200" autocomplete="off" style="margin-bottom:14px">
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="dlg-cancel">Cancelar</button>
        <button class="btn btn-primary" id="dlg-ok">${escapeHtml(okLabel||'Aceptar')}</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  const submit = ()=>{ const val = document.getElementById('dlg-input').value; close(); onSubmit(val); };

  wrap.addEventListener('click', e=>{ if(e.target===wrap) close(); });
  setTimeout(()=>{ const inp = document.getElementById('dlg-input'); if(inp) inp.focus(); }, 50);
}

// --- PDF del certificado, armado en la propia agenda (19/10/2026, pedido de Juan Diego: no depender de Claude) ---
// Mismo diseño que los PDF hechos con la plantilla del repo sibana-certificados (copiada en certificado/):
// negro o blanco. Se arma en un iframe escondido (achica el nombre si no cabe en una línea y revisa que todo
// entre en la hoja), se "fotografía" a 300 dpi (SVG con foreignObject → canvas, con letras e imágenes
// incrustadas) y se guarda como PDF A4 horizontal con esa imagen, igual que los anteriores.
// Las firmas NO están en el repo (es público): las sube un dueño una vez y quedan en
// sibana-certificados-meta/firmas (solo dueños pueden leerlas).
const CERT_PDF_DIR = 'certificado/';
const CERT_FIRMAS_DOC = 'firmas';
const CERT_DIRECTOR = {nombre: 'Franklin José Gil Rojas', rol: 'Fundador y Director General'};
const certPdfCache = {};
function certCargarScript(src){
  return new Promise((res, rej)=>{
    if(window.qrcode) return res();
    const s = document.createElement('script'); s.src = src; s.onload = ()=>res(); s.onerror = ()=>rej(new Error('No se pudo cargar ' + src));
    document.head.appendChild(s);
  });
}
async function certTraer(ruta, tipo){
  const k = tipo + ':' + ruta;
  if(certPdfCache[k]) return certPdfCache[k];
  const r = await fetch(CERT_PDF_DIR + ruta, {cache:'no-cache'});
  if(!r.ok) throw new Error('No se pudo leer ' + ruta);
  certPdfCache[k] = tipo === 'texto' ? await r.text() : await new Promise((res, rej)=>{
    r.blob().then(b=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
  });
  return certPdfCache[k];
}
async function certFirmas(){
  const s = await db.collection(CERT_META_COL).doc(CERT_FIRMAS_DOC).get();
  return (s.exists && Array.isArray(s.data().lista)) ? s.data().lista : [];
}
function certFirmaDe(firmas, nombre){
  const f = (firmas||[]).find(x=>nombreExacto(x.nombre) === nombreExacto(nombre));
  return f && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(f.dataUrl||'') ? f.dataUrl : '';
}
function certQrSvg(texto){
  const q = window.qrcode(0, 'M'); q.addData(texto); q.make();
  const n = q.getModuleCount(); let d = '';
  for(let y = 0; y < n; y++) for(let x = 0; x < n; x++) if(q.isDark(y, x)) d += `M${x},${y}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path fill="#0d0c0a" d="${d}"/></svg>`;
}
// "del 1 de julio al 4 de octubre de 2023" → tal cual; "julio a septiembre de 2023" → "de …"; "julio de 2023" → "en …"
function certFrasePeriodo(p){ return /^(del?|desde|entre)\b/i.test(p) ? p : ((/ a /.test(p) ? 'de ' : 'en ') + p); }
function certLugarFrase(l){ return /^santiago(,? (de )?chile)?$/i.test(String(l||'').trim()) ? 'Santiago de Chile' : String(l||'').trim(); }
// Los textos del certificado, igual que tools/desde_planilla.py del repo de la plantilla.
function certTextosPdf(c){
  const lugar = certLugarFrase(c.lugar);
  const detalle = [c.modalidad ? 'Modalidad ' + String(c.modalidad).trim().toLowerCase() : '', String(c.horas||'').trim(),
    /presencial/i.test(c.modalidad||'') ? 'Formación teórica y práctica en persona' : ''].filter(Boolean);
  return {
    name: c.nombre || '', docLabel: String(c.docTipo||'').toUpperCase(), doc: c.doc || '', folio: c.folio || '',
    codigo: c.codigo || '', url: certEnlace(c.codigo), curso: c.curso || '', detalle,
    realizado: c.periodo ? `Realizado ${certFrasePeriodo(c.periodo)} en ${lugar}` : `Realizado el ${certFechaLarga(c.fecha)} en ${lugar}`,
    contenidos: String(c.contenidos||'').split('\n').map(x=>x.trim()).filter(Boolean),
    instructora: c.instructora || '', emitido: `Emitido en ${lugar}, el ${certFechaLarga(c.emitido)}`,
  };
}
async function certHtmlPdf(c, version){
  await certCargarScript(CERT_PDF_DIR + 'qrcode.js');
  const blanco = version === 'blanco';
  const [tpl, css, firmas] = await Promise.all([certTraer(blanco ? 'template_blanco.html' : 'template.html', 'texto'), certTraer('fonts/local.css', 'texto'), certFirmas()]);
  // Letras incrustadas (en una imagen SVG no se pueden cargar archivos aparte).
  let cssIn = css;
  for(const f of Array.from(new Set((css.match(/url\(([^)]+)\)/g)||[]).map(u=>u.slice(4,-1))))){
    cssIn = cssIn.split('url(' + f + ')').join('url(' + await certTraer('fonts/' + f, 'datos') + ')');
  }
  const t = certTextosPdf(c);
  const sep = '<span class="sep">◆</span>', sep2 = '<span class="sep">·</span>';
  const qr = 'data:image/svg+xml;base64,' + btoa(certQrSvg(t.url));
  const sigL = certFirmaDe(firmas, t.instructora), sigR = certFirmaDe(firmas, CERT_DIRECTOR.nombre);
  const contenidos = t.contenidos.length ? `<p class="topics"><em>CONTENIDOS</em>${t.contenidos.map(escapeHtml).join(sep2)}</p>` : '';
  let html = tpl.replaceAll('{{NAME}}', escapeHtml(t.name)).replaceAll('{{DOC_LABEL}}', escapeHtml(t.docLabel))
    .replaceAll('{{DOC}}', escapeHtml(t.doc)).replaceAll('{{FOLIO}}', escapeHtml(t.folio))
    .replaceAll('{{CURSO}}', escapeHtml(t.curso)).replaceAll('{{DETALLE}}', t.detalle.map(escapeHtml).join(sep))
    .replaceAll('{{REALIZADO}}', escapeHtml(t.realizado)).replaceAll('{{CONTENIDOS}}', contenidos)
    .replaceAll('{{INSTRUCTORA}}', escapeHtml(t.instructora)).replaceAll('{{INSTRUCTORA_ROL}}', 'Instructora del curso')
    .replaceAll('{{EMITIDO}}', escapeHtml(t.emitido))
    .replaceAll('{{SIG_LEFT}}', sigL ? `<img class="sig" src="${sigL}" alt="">` : '')
    .replaceAll('{{SIG_RIGHT}}', sigR ? `<img class="sig" src="${sigR}" alt="">` : '')
    .replaceAll('{{QR_BLOCK}}', `<div class="qr"><div class="tile"><img src="${qr}" alt=""></div><div class="cap">ESCANEA PARA<br>VERIFICAR</div><div class="code">${escapeHtml(certCodigoBonito(t.codigo))}</div></div>`)
    .replaceAll('{{DIR_NAME}}', escapeHtml(CERT_DIRECTOR.nombre)).replaceAll('{{DIR_ROLE}}', escapeHtml(CERT_DIRECTOR.rol));
  if(html.includes('{{')) throw new Error('Plantilla: falta ' + html.match(/\{\{\w+\}\}/)[0]);
  html = html.replace(/<link rel="stylesheet" href="fonts\/local\.css">/, '<style>' + cssIn + '</style>');
  for(const img of Array.from(new Set(html.match(/assets\/[\w.-]+\.png/g)||[]))){
    html = html.split(img).join(await certTraer(img, 'datos'));
  }
  return {html, faltaFirma: [!sigL ? t.instructora : '', !sigR ? CERT_DIRECTOR.nombre : ''].filter(Boolean)};
}
// Arma el certificado en un iframe escondido: ajusta el nombre y revisa que todo quepa.
function certMontar(html){
  return new Promise((res, rej)=>{
    const f = document.createElement('iframe');
    f.setAttribute('aria-hidden', 'true');
    f.style.cssText = 'position:fixed;left:-20000px;top:0;width:1123px;height:794px;border:0;visibility:hidden';
    f.onload = async ()=>{
      try{
        const d = f.contentDocument;
        await d.fonts.ready;
        await Promise.all(Array.from(d.images).map(i=>i.complete ? 0 : new Promise(r=>{ i.onload = i.onerror = r; })));
        const n = d.querySelector('.name'), max = d.querySelector('.content').clientWidth - 20;
        let fs = parseFloat(d.defaultView.getComputedStyle(n).fontSize);
        while(n.getBoundingClientRect().width > max && fs > 24){ fs -= 0.5; n.style.fontSize = fs + 'px'; }
        const c = d.querySelector('.content'); const sobra = c.scrollHeight - c.clientHeight;
        res({frame: f, doc: d, noCabe: sobra > 0});
      }catch(e){ f.remove(); rej(e); }
    };
    f.srcdoc = html;
    document.body.appendChild(f);
  });
}
// "Fotografía" del certificado a 300 dpi (3508 × 2480) → JPEG.
async function certFoto(doc){
  const W = 1123, H = 794, ESC = 3508 / 1123;
  const estilos = Array.from(doc.querySelectorAll('style')).map(s=>s.textContent).join('\n');
  const xs = new XMLSerializer();
  const pagina = xs.serializeToString(doc.querySelector('.page'));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">`
    + `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${W}px;height:${H}px"><style>${estilos.replace(/[<&]/g, ch=>ch==='<'?'&lt;':'&amp;')}</style>${pagina}</div></foreignObject></svg>`;
  // Como "data:" y no como blob: Chrome/Edge no dejan exportar el dibujo de un blob con foreignObject.
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  {
    const img = new Image();
    await new Promise((res, rej)=>{ img.onload = res; img.onerror = ()=>rej(new Error('No se pudo dibujar el certificado')); img.src = url; });
    await new Promise(r=>setTimeout(r, 150)); // margen para que se pinten las letras incrustadas
    const cv = document.createElement('canvas'); cv.width = 3508; cv.height = 2480;
    const g = cv.getContext('2d'); g.scale(ESC, ESC); g.drawImage(img, 0, 0, W, H);
    const blob = await new Promise((res, rej)=>cv.toBlob(b=>b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', 0.95));
    return new Uint8Array(await blob.arrayBuffer());
  }
}
// PDF de una página A4 horizontal con la imagen JPEG a hoja completa.
function certPdfDesdeJpeg(jpg, titulo){
  const enc = new TextEncoder(), partes = [], offs = [];
  let largo = 0;
  const add = x=>{ const b = typeof x === 'string' ? enc.encode(x) : x; partes.push(b); largo += b.length; };
  const obj = (n, s)=>{ offs[n] = largo; add(`${n} 0 obj\n${s}\nendobj\n`); };
  const tit = String(titulo).replace(/[\\()]/g, ch=>'\\' + ch).replace(/[^\x20-\x7e]/g, ch=>({'á':'a','é':'e','í':'i','ó':'o','ú':'u','ñ':'n','Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ñ':'N','ü':'u','–':'-'}[ch]||''));
  const PW = 841.89, PH = 595.28, contenido = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  add('%PDF-1.4\n'); add(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A])); // marca de archivo binario
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4] = largo; add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width 3508 /Height 2480 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); add(jpg); add('\nendstream\nendobj\n');
  obj(5, `<< /Length ${contenido.length} >>\nstream\n${contenido}\nendstream`);
  obj(6, `<< /Title (${tit}) /Author (Sibana Academia PMU) /Producer (Agenda Sibana) >>`);
  const xref = largo;
  add(`xref\n0 7\n0000000000 65535 f \n` + [1,2,3,4,5,6].map(i=>String(offs[i]).padStart(10,'0') + ' 00000 n \n').join(''));
  add(`trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(partes, {type:'application/pdf'});
}
function certNombreArchivo(c){
  // Sin tildes ni ñ: algunos navegadores cambian un nombre con tildes por "download".
  return ('Certificado_' + c.folio + '_' + String(c.nombre||'').trim().replace(/\s+/g, '_'))
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\-]/g, '') + '.pdf';
}
function certElegirVersion(c){
  const existing = document.getElementById('custom-dialog'); if(existing) existing.remove();
  const wrap = document.createElement('div'); wrap.id = 'custom-dialog'; wrap.className = 'confirm-overlay';
  wrap.innerHTML = `<div class="confirm-box"><p>${escapeHtml('📄 PDF del certificado ' + c.folio + ' de ' + c.nombre + '\n\n¿En qué versión? (el diseño es el mismo)')}</p>
    <div class="confirm-actions"><button class="btn btn-ghost" id="dlg-cancel">Cancelar</button>
    <button class="btn btn-ghost" id="dlg-blanco">⬜ Blanco</button><button class="btn btn-primary" id="dlg-negro">⬛ Negro</button></div></div>`;
  document.body.appendChild(wrap);
  const cerrar = ()=>wrap.remove();
  wrap.querySelector('#dlg-cancel').addEventListener('click', cerrar);
  wrap.addEventListener('click', e=>{ if(e.target === wrap) cerrar(); });
  wrap.querySelector('#dlg-negro').addEventListener('click', ()=>{ cerrar(); descargarPdfCertificado(c, 'negro'); });
  wrap.querySelector('#dlg-blanco').addEventListener('click', ()=>{ cerrar(); descargarPdfCertificado(c, 'blanco'); });
}
let certPdfOcupado = false;
async function descargarPdfCertificado(c, version){
  if(!esDueno() || certPdfOcupado) return;
  certPdfOcupado = true;
  showAlert('📄 Armando el PDF… (unos segundos)');
  let montado = null;
  try{
    const {html, faltaFirma} = await certHtmlPdf(c, version);
    montado = await certMontar(html);
    if(montado.noCabe) throw new Error('NO_CABE');
    let blob;
    try{ blob = certPdfDesdeJpeg(await certFoto(montado.doc), 'Certificado ' + c.folio + ' - ' + c.nombre); }
    catch(e){
      // Algunos navegadores (Safari) no dejan "fotografiar" la página: se abre para imprimir / guardar como PDF.
      console.error(e);
      const w = window.open('', '_blank');
      if(!w) throw e;
      w.document.open(); w.document.write(html.replace('</body>', '<script>window.onload=()=>setTimeout(()=>print(),400)<\/script></body>')); w.document.close();
      cerrarAvisoPdf(); showAlert('Se abrió el certificado en otra pestaña: elige "Guardar como PDF" al imprimir.'); return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = certNombreArchivo(c);
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    cerrarAvisoPdf();
    showAlert('✅ PDF descargado: ' + certNombreArchivo(c) + (faltaFirma.length ? `\n\n⚠️ Sin firma de: ${faltaFirma.join(', ')}. Súbela en Más → 📜 Certificados → ✍️ Firmas.` : ''));
  }catch(err){
    console.error(err);
    cerrarAvisoPdf();
    showAlert(err && err.message === 'NO_CABE'
      ? 'El certificado no cabe en una hoja (algún texto es demasiado largo, por ejemplo los contenidos o el nombre del curso). Acórtalo y vuelve a intentarlo.'
      : 'No se pudo armar el PDF. Revisa la señal e inténtalo de nuevo.');
  }finally{
    if(montado) montado.frame.remove();
    certPdfOcupado = false;
  }
}
function cerrarAvisoPdf(){ const d = document.getElementById('custom-dialog'); if(d) d.remove(); }

// --- Firmas para el PDF (solo dueños; quedan en Firebase, no en el código público) ---
function abrirFirmasCert(){
  if(!esDueno()) return;
  ui.modal = {type:'cert-firmas', lista:null, error:''};
  render();
  certFirmas().then(lista=>{ if(ui.modal && ui.modal.type==='cert-firmas'){ ui.modal.lista = lista; render(); } })
    .catch(e=>{ console.error(e); if(ui.modal && ui.modal.type==='cert-firmas'){ ui.modal.error = 'No se pudieron leer las firmas.'; render(); } });
}
function subirFirmaCert(){
  const m = ui.modal; if(!esDueno() || !m || m.type!=='cert-firmas' || !m.lista) return;
  const nombre = (document.getElementById('f-firma-nombre').value || '').trim().replace(/\s+/g,' ');
  const archivo = document.getElementById('f-firma-archivo').files[0];
  if(certPalabrasNombre(nombre).length < 2){ showAlert('Escribe el nombre y el apellido, tal como va en el certificado (ej. "Salomé Toro").'); return; }
  if(!archivo || archivo.type !== 'image/png'){ showAlert('Elige la imagen de la firma en formato PNG (fondo transparente).'); return; }
  if(archivo.size > 300000){ showAlert('La imagen es muy pesada (máximo 300 KB).'); return; }
  const fr = new FileReader();
  fr.onload = ()=>{
    const lista = m.lista.filter(x=>nombreExacto(x.nombre) !== nombreExacto(nombre)).concat([{nombre, dataUrl: fr.result, subidaEn: new Date().toISOString()}]);
    db.collection(CERT_META_COL).doc(CERT_FIRMAS_DOC).set({lista, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()})
      .then(()=>{ m.lista = lista; render(); showAlert('✅ Firma de ' + nombre + ' guardada.'); })
      .catch(e=>{ console.error(e); showAlert('No se pudo guardar la firma. Revisa la señal e inténtalo de nuevo.'); });
  };
  fr.readAsDataURL(archivo);
}
function quitarFirmaCert(nombre){
  const m = ui.modal; if(!esDueno() || !m || m.type!=='cert-firmas' || !m.lista) return;
  showConfirmDialog(`¿Quitar la firma de ${nombre}? Los PDF nuevos saldrán sin esa firma.`, ()=>{
    const lista = m.lista.filter(x=>x.nombre !== nombre);
    db.collection(CERT_META_COL).doc(CERT_FIRMAS_DOC).set({lista, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp()})
      .then(()=>{ m.lista = lista; render(); }).catch(e=>{ console.error(e); showAlert('No se pudo quitar. Revisa la señal.'); });
  });
}

// Más → 👥 Equipo. Lista a las personas con cuenta propia (de las dos sedes)
// y los pedidos de acceso de quienes crearon su cuenta ("Crear cuenta" en la
// entrada). Aprobar = elegir quién es en la lista de Especialistas de la sede
// que se está viendo (así su cuenta queda como "Salomé" y cuadra con sus
// citas y vales). También desactivar/reactivar y mandar el correo para
// elegir una contraseña nueva.
function abrirEquipo(){
  if(!esDueno()) return;
  ui.modal = {type:'equipo', lista:null, error:''};
  ui.menuOpen = false;
  render();
  cargarEquipo();
}
function cargarEquipo(){
  const usuarios = db.collection(USUARIOS_COLECCION).get();
  // Los pedidos no impiden ver la lista si fallan (ej. si todavía no se
  // pegaron las reglas nuevas en Firebase).
  const pedidos = db.collection(SOLICITUDES_COLECCION).get().catch(err=>{ console.error('No se pudieron leer los pedidos de acceso', err); return null; });
  return Promise.all([usuarios, pedidos]).then(([snap, ped])=>{
    if(!ui.modal || ui.modal.type!=='equipo') return;
    ui.modal.lista = snap.docs.map(d=>Object.assign({uid:d.id}, d.data()))
      .sort((a,b)=> (a.sede||'').localeCompare(b.sede||'') || (a.nombre||'').localeCompare(b.nombre||''));
    ui.modal.pedidos = ped ? ped.docs.map(d=>Object.assign({uid:d.id}, d.data())).filter(p=>!p.rechazada)
      .sort((a,b)=> ((a.creadaEn&&a.creadaEn.toMillis&&a.creadaEn.toMillis())||0) - ((b.creadaEn&&b.creadaEn.toMillis&&b.creadaEn.toMillis())||0)) : null;
    render();
  }).catch(err=>{
    console.error('No se pudo leer el equipo', err);
    if(!ui.modal || ui.modal.type!=='equipo') return;
    ui.modal.error = 'No se pudo cargar la lista (¿sin señal, o faltan las reglas nuevas de Firebase?).';
    render();
  });
}

function especialistasSinCuenta(){
  const conCuenta = new Set(((ui.modal && ui.modal.lista) || []).filter(u=>(u.sede===SEDE.id || (u.otrasSedes||[]).includes(SEDE.id)) && u.rol!=='lector').map(u=>normalizeName(u.nombre)));
  return state.specialists.filter(sp=>!conCuenta.has(normalizeName(sp.name)));

// Quién parece ser, por el nombre que escribió (ej. "Salomé Pérez" → Salomé).
function especialistaSugerida(nombreCompleto, opciones){
  const n = normalizeName(nombreCompleto);
  const primero = n.split(' ')[0];
  const exacta = opciones.find(sp=>normalizeName(sp.name)===n)
    || opciones.find(sp=>normalizeName(sp.name)===primero)
    || opciones.find(sp=>normalizeName(sp.name).split(' ')[0]===primero);
  return exacta ? exacta.name : '';
}

}

function aprobarPedido(uidPedido){
  const p = ((ui.modal && ui.modal.pedidos) || []).find(x=>x.uid===uidPedido);
  if(!p) return;
  const sel = document.getElementById('f-eq-quien-' + uidPedido);
  const nombre = sel ? sel.value : '';
  if(!nombre){ showAlert(`Elige quién es ${p.nombreCompleto} en la lista de especialistas.`); return; }
  showConfirmDialog(`¿Darle acceso a ${p.nombreCompleto} (${p.email}) como "${nombre}" en la agenda de ${SEDE.nombre}? Sus citas, vales y pagos van a quedar a nombre de ${nombre}.`, ()=>{
    const lote = db.batch();
    lote.set(db.collection(USUARIOS_COLECCION).doc(uidPedido), {
      nombre, nombreCompleto: String(p.nombreCompleto||'').slice(0, 80), email: p.email,
      sede: SEDE.id, rol: 'especialista', activo: true,
      creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
    });
    lote.delete(db.collection(SOLICITUDES_COLECCION).doc(uidPedido));
    lote.commit().then(()=>{
      showAlert(`Listo. ${nombre} ya puede entrar con su correo (${p.email}) y su contraseña.`);
      return cargarEquipo();
    }).catch(err=>{ console.error('No se pudo aprobar', err); showAlert('No se pudo aprobar (¿sin señal?). Vuelve a intentarlo.'); });
  });
}
function rechazarPedido(uidPedido){
  const p = ((ui.modal && ui.modal.pedidos) || []).find(x=>x.uid===uidPedido);
  if(!p) return;
  showConfirmDialog(`¿Rechazar el pedido de ${p.nombreCompleto} (${p.email})? No va a poder entrar a la agenda.`, ()=>{
    db.collection(SOLICITUDES_COLECCION).doc(uidPedido).update({
      rechazada: true, rechazadaEn: firebase.firestore.FieldValue.serverTimestamp(),
    }).then(cargarEquipo)
      .catch(err=>{ console.error(err); showAlert('No se pudo rechazar (¿sin señal?).'); });
  });
}
// Una especialista que también atiende en otra sede (ej. Salomé en Viña): ve
// las dos agendas y cambia entre ellas con 📍. Sus citas, vales y pago de cada
// sede van por separado, con su mismo nombre: por eso en la otra sede tiene que
// estar en la lista de Especialistas con el MISMO nombre.
function cambiarOtraSedeUsuario(uidUsuario, sedeId, agregar){
  const u = ((ui.modal && ui.modal.lista) || []).find(x=>x.uid===uidUsuario);
  if(!u || !SEDES[sedeId] || sedeId===u.sede) return;
  const otras = (u.otrasSedes||[]).filter(x=>x!==sedeId && SEDES[x]);
  if(agregar) otras.push(sedeId);
  const nombreSede = SEDES[sedeId].nombre;
  const hacer = ()=>db.collection(USUARIOS_COLECCION).doc(uidUsuario).update({
    otrasSedes: otras, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp(),
  }).then(()=>{
    if(agregar) showAlert(`Listo. ${u.nombre} ya puede ver la agenda de ${nombreSede} (con el botón 📍 arriba). Recuerda: en ${nombreSede}, Más → Especialistas, tiene que estar como "${u.nombre}", con el mismo nombre, para que sus citas y su pago cuadren.`);
    return cargarEquipo();
  }).catch(err=>{ console.error(err); showAlert('No se pudo guardar el cambio (¿sin señal, o faltan las reglas nuevas de Firebase?).'); });
  showConfirmDialog(agregar
    ? `¿${u.nombre} también trabaja en ${nombreSede}? Va a poder ver y usar la agenda de ${nombreSede} además de la de ${(SEDES[u.sede]||{}).nombre||u.sede}. Su pago de cada sede se calcula por separado.`
    : `¿Quitarle a ${u.nombre} el acceso a la agenda de ${nombreSede}? Sus citas y pagos de ${nombreSede} no se tocan.`, hacer);
}
function cambiarActivoUsuario(uidUsuario, activo){
  const u = ((ui.modal && ui.modal.lista) || []).find(x=>x.uid===uidUsuario);
  if(!u) return;
  const hacer = ()=>db.collection(USUARIOS_COLECCION).doc(uidUsuario).update({
    activo, actualizadoEn: firebase.firestore.FieldValue.serverTimestamp(),
  }).then(cargarEquipo).catch(err=>{ console.error(err); showAlert('No se pudo guardar el cambio (¿sin señal?).'); });
  if(activo) hacer();
  else showConfirmDialog(`¿Desactivar a ${u.nombre}? Deja de poder entrar a la agenda en todos sus dispositivos (sus citas, vales y pagos anteriores no se tocan). La puedes reactivar cuando quieras.`, hacer);
}
function restablecerClaveUsuario(uidUsuario){

  // Las cuentas nuevas son con el correo de ella: el enlace le llega a ella.

// clientas de meses o años atrás. A diferencia de los retoques, no hay límite superior:
// una vez que entra a la lista, se queda ahí (para siempre) hasta que se marque como avisada.
const REVIEWS_START_DATE = '2026-09-19';
function reviewCandidates(){
  const minDate = parseKey(REVIEWS_START_DATE);
  const byClient = new Map();
  state.appointments.forEach(a=>{
    if(a.estado!=='Realizada' || !a.client) return;
    if(a.reviewAvisada) return; // ya se le pidió la reseña: desaparece de la lista para siempre
    if(!isRetoqueAppt(a)) return;
    const dt = parseKey(a.date);
    if(dt < minDate) return;
    const key = normalizeName(a.client);
    const prev = byClient.get(key);
    if(!prev || a.date > prev.date) byClient.set(key, a);
  });
  return Array.from(byClient.values())
    .map(a=>({appt:a, diffDays: Math.round((new Date().setHours(0,0,0,0) - parseKey(a.date)) / 86400000)}))
    .sort((x,y)=>x.diffDays - y.diffDays);
}

// Copia completa de TODOS los datos (citas, servicios, especialistas, clientes,
// bloqueos, gastos y configuración) — es lo que guarda el respaldo automático
// diario, y lo que se descarga desde Más → Respaldos.
// Se arma a partir de DOC_KEYS (todo lo que guarda la agenda), así nunca
// falta nada: antes la lista se escribía a mano y los cursos quedaban fuera.
function fullBackupPayload(){
  const out = { respaldoDe: 'Sibana ' + SEDE.nombre, fecha: new Date().toISOString() };
  DOC_KEYS.forEach(k=>{ out[k] = state[k]; });
  return out;
}
function downloadBackupFile(payload, dateKey){
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `Sibana-${SEDE.nombre.replace(/\s+/g,'')}-respaldo-${dateKey}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

// ---------------- Respaldo automático diario ----------------
// Lo mismo que "Descargar respaldo completo", pero automático: la primera vez
// que alguien del equipo abre la agenda cada día, se guarda una copia completa
// de todos los datos en una colección aparte de Firebase (un documento por
// día). Nunca se sobrescribe la copia de un día que ya existe — así, aunque
// algo saliera mal con la agenda, las copias de los días anteriores quedan
// intactas. Se guardan los últimos AUTO_BACKUP_KEEP_DAYS días.
const AUTO_BACKUP_COLLECTION = 'sibana-agenda-respaldos';
const AUTO_BACKUP_KEEP_DAYS = 30; // un mes completo (antes 60: al usuario le parecían demasiados; con uso diario, 30 alcanzan)
// Día (YYYY-MM-DD) para el que ya se revisó el respaldo en esta pestaña. Se
// guarda el día y no un simple "ya lo hice", porque la agenda puede quedar
// abierta varios días seguidos (ej. en la laptop de Juan Diego) sin recargar.
let autoBackupCheckedDay = null;
function autoBackupSite(){ return (DOC_REF && DOC_REF.id) || 'santiago'; }
async function runDailyAutoBackupIfNeeded(){
  const today = toKey(new Date());
  if(autoBackupCheckedDay===today || !db || !ui.loaded) return;
  // Nunca se respalda una agenda vacía (sería señal de un problema, no de datos reales).
  if(!state.appointments.length) return;
  autoBackupCheckedDay = today;
  const site = autoBackupSite();
  const col = db.collection(AUTO_BACKUP_COLLECTION);
  try{
    const ref = col.doc(`${site}_${today}`);
    const snap = await ref.get();
    if(snap.exists) return;
    await ref.set({
      site, fecha: today, citas: state.appointments.length,
      creado: firebase.firestore.FieldValue.serverTimestamp(),
      data: fullBackupPayload(),
    });
    await col.doc(`${site}_indice`).set({
      fechas: firebase.firestore.FieldValue.arrayUnion(today),
    }, {merge:true});
    // Se borran TODOS los respaldos más viejos que AUTO_BACKUP_KEEP_DAYS que
    // figuren en el índice (no solo los de una ventana fija de días: así,
    // al bajar de 60 a 30 días, también se van los de 31–60 días). Lo mismo
    // con las copias "antes de restaurar".
    const corte = toKey(addDays(new Date(), -AUTO_BACKUP_KEEP_DAYS));
    const idx = await col.doc(`${site}_indice`).get();
    const viejos = ((idx.exists && idx.data().fechas) || []).filter(k=>k <= corte);
    const antesViejos = ((idx.exists && idx.data().antesDeRestaurar) || []).filter(k=>k.replace('antes-restaurar-','').slice(0,10) <= corte);
    if(viejos.length || antesViejos.length){
      const upd = {};
      if(viejos.length) upd.fechas = firebase.firestore.FieldValue.arrayRemove(...viejos);
      if(antesViejos.length) upd.antesDeRestaurar = firebase.firestore.FieldValue.arrayRemove(...antesViejos);
      await col.doc(`${site}_indice`).set(upd, {merge:true});
      viejos.concat(antesViejos).forEach(k=>col.doc(`${site}_${k}`).delete().catch(()=>{}));
    }
  }catch(e){
    console.error('No se pudo crear el respaldo automático del día', e);
  }
}
// Si la pestaña queda abierta de un día para otro, revisa cada hora si ya
// cambió el día para hacer la copia del día nuevo.
setInterval(()=>{ runDailyAutoBackupIfNeeded(); }, 60*60*1000);

// ---------------- Espacio usado (límite de Firebase) ----------------
// Firebase permite como máximo 1 MiB por documento, en cualquier plan (pagar
// no lo cambia), y toda la agenda de una sede vive en UN documento. Esto
// calcula, con la fórmula oficial de Firebase ("Storage size calculations"),
// cuánto ocupa lo que se guarda: el documento de la agenda y el respaldo del
// día (que lleva lo mismo más unos pocos datos, así que es el más grande).
// Lo calcula cada teléfono con los datos reales que ya tiene cargados.
// Comprobado contra el emulador oficial: lo que esto marca como >100% es
// justo lo que Firebase rechaza. Si se acerca al 100%, hay que mover los
// meses viejos a un archivo aparte (pendiente, ver CLAUDE.md).
const FIRESTORE_MAX_DOC_BYTES = 1048576;
const ESPACIO_AVISO = 0.8;
function utf8Bytes(str){ return new TextEncoder().encode(String(str)).length; }
function firestoreValueSize(v){
  if(v===null || v===undefined) return 1;
  if(typeof v==='boolean') return 1;
  if(typeof v==='number') return 8;
  if(typeof v==='string') return utf8Bytes(v) + 1;
  if(v instanceof Date) return 8;
  if(typeof v.toDate==='function' || (typeof v.seconds==='number' && typeof v.nanoseconds==='number')) return 8; // fecha de Firebase
  if(Array.isArray(v)) return v.reduce((acc,x)=>acc + firestoreValueSize(x), 0);
  if(typeof v==='object') return Object.keys(v).reduce((acc,k)=> v[k]===undefined ? acc : acc + utf8Bytes(k) + 1 + firestoreValueSize(v[k]), 0);
  return 0;
}
function firestoreDocSize(path, data){
  const nombre = path.split('/').reduce((acc,p)=>acc + utf8Bytes(p) + 1, 0) + 16;
  return nombre + firestoreValueSize(data) + 32;
}
// Fracción usada (0 a 1+) del límite, mirando el más grande de los dos documentos.
function espacioUsado(){
  if(!DOC_REF || !ui.loaded) return null;
  const site = autoBackupSite();
  const agenda = firestoreDocSize(`sibana-agenda/${DOC_REF.id}`, Object.assign(stateDocCopy(), {appVersion: APP_VERSION, updatedAt: new Date()}));
  const respaldo = firestoreDocSize(`${AUTO_BACKUP_COLLECTION}/${site}_2026-01-01`, {
    site, fecha: '2026-01-01', citas: state.appointments.length, creado: new Date(), data: fullBackupPayload(),
  });
  return Math.max(agenda, respaldo) / FIRESTORE_MAX_DOC_BYTES;
}
function espacioUsadoHtml(){
  const f = espacioUsado();
  if(f==null) return '';
  const pct = Math.min(999, Math.ceil(f*100));
  const alto = f >= ESPACIO_AVISO;
  return `<div class="hint" style="border:1px solid ${alto?'var(--danger)':'var(--line)'};border-radius:8px;padding:10px 12px;margin:0 0 12px;color:var(--ink);">
    💾 <b>Espacio usado: ${pct}%</b> de lo que Firebase permite para la agenda de ${escapeHtml(SEDE.nombre)}.
    ${alto ? '<br><b style="color:var(--danger);">Se está llenando:</b> pídele a Claude que archive los meses viejos antes de que llegue al 100% (al llegar, la agenda no podría guardar más).' : '<br>Al llegar al 100% la agenda no podría guardar más; antes de eso aparece un aviso.'}
  </div>`;
}
let avisoEspacioMostrado = false;
function avisoEspacioSiHaceFalta(){
  if(avisoEspacioMostrado || ui.mode!=='admin' || ui.modal || document.getElementById('custom-dialog')) return;
  const f = espacioUsado();
  if(f==null || f < ESPACIO_AVISO) return;
  avisoEspacioMostrado = true;
  showAlert(`💾 La agenda de ${SEDE.nombre} ya usa el ${Math.ceil(f*100)}% del espacio que permite Firebase. Pídele a Claude que archive los meses viejos antes de que llegue al 100% (ahí ya no podría guardar). Lo puedes ver en Más → Respaldos.`);
}
